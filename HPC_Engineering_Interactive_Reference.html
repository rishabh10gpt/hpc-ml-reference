{id:'s-6-1', part:'p6', num:'6.1', title:'Topology Overview — Fat-Tree, Dragonfly, Torus, Mesh, Leaf-Spine, Hypercube',
 dek:'Six ways to wire up thousands of nodes, each trading cost, bandwidth and path length differently.',
 tags:'topology fat tree dragonfly torus mesh clos leaf spine hypercube comparison',
 diagrams:['fattree','leafspine','dragonfly','torus','mesh','hypercube'],
 body:`
 <p>Every HPC/datacenter network topology is a different answer to the same underlying trade-off: <strong>bisection bandwidth and path length vs. switch/cable cost.</strong> A fully-connected mesh gives every node a direct link to every other node — wonderful for performance, catastrophic for cost (O(N²) links). Every practical topology below is a structured compromise on that spectrum.</p>

 <h3>Fat-tree / folded Clos</h3>
 <div class="diagram"><div class="diagram-mount" data-diagram="fattree"></div></div>
 <div class="diagram-cap">3-tier fat-tree: core, aggregation, edge, and the hosts each edge switch serves.</div>
 <p>High bisection bandwidth, flexible, but switch-heavy. This is the dominant HPC topology because — sized correctly — it can be built <strong>non-blocking</strong> (§6.2–6.3): full simultaneous bandwidth from every host to every other host, at the cost of a lot of switches and cabling. §6.3 gives the exact sizing formulas.</p>

 <h3>Leaf-spine (2-tier Clos)</h3>
 <div class="diagram"><div class="diagram-mount" data-diagram="leafspine"></div></div>
 <div class="diagram-cap">The datacenter-Ethernet workhorse: every leaf reaches every spine, so any-to-any traffic has a predictable 2-hop worst case.</div>
 <p>The most common general-purpose datacenter Ethernet structure — effectively a 2-tier fat-tree. Simpler and cheaper than a full 3-tier Clos, and adequate when the cluster is small enough that a single spine tier provides enough aggregate bandwidth. §6.4 covers its sizing formulas.</p>

 <h3>Dragonfly</h3>
 <div class="diagram"><div class="diagram-mount" data-diagram="dragonfly"></div></div>
 <div class="diagram-cap">Local groups (solid links) connected by a sparser set of global links (dashed) — low diameter at large scale for less cabling than a full fat-tree.</div>
 <p>Reduces global network diameter (hop count) and can improve scalability/cost at very large scale by grouping routers locally and connecting groups with a comparatively small number of global links. §6.6 covers its parameterization.</p>

 <h3>Torus</h3>
 <div class="diagram"><div class="diagram-mount" data-diagram="torus"></div></div>
 <div class="diagram-cap">A structured grid where the edges wrap around (dashed teal), giving every node the same number of neighbors.</div>
 <p>A structured nearest-neighbor topology — useful for stencil-like workloads (finite-difference/finite-element simulations) whose communication pattern is itself naturally grid-like, so the network topology matches the application's communication topology almost exactly. §6.5 covers its formulas.</p>

 <h3>Mesh</h3>
 <div class="diagram"><div class="diagram-mount" data-diagram="mesh"></div></div>
 <div class="diagram-cap">Same grid as the torus, without the wrap-around links — cheaper, but edge nodes face longer average paths.</div>
 <p>Regular connectivity, lower cost than a torus (fewer links, no wraparound), but longer average paths as the network scales — the edge/corner nodes are structurally disadvantaged compared to a torus's uniform connectivity.</p>

 <h3>Hypercube</h3>
 <div class="diagram"><div class="diagram-mount" data-diagram="hypercube"></div></div>
 <div class="diagram-cap">Each node's binary address differs from each of its neighbors' by exactly one bit.</div>
 <p>Low diameter relative to node count (grows only as log₂N) — a classic parallel-computing topology. The cost is a higher node degree (more links per node) and real wiring complexity at scale, which is part of why fat-tree and dragonfly designs have become more common than hypercubes for the largest modern systems.</p>

 <h4>Extended comparison table</h4>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Topology</th><th>Diameter</th><th>Bisection BW</th><th>Cost driver</th><th>Best for</th><th>Main drawback</th></tr>
   <tr><td>Fat-tree / Clos</td><td>Low, fixed by tiers</td><td>Can be full (non-blocking)</td><td>Many switches/cables</td><td>General HPC, all-to-all traffic</td><td>Expensive at very large scale</td></tr>
   <tr><td>Dragonfly</td><td>Low, a few hops</td><td>Depends on global links</td><td>Router radix + global links</td><td>Very large systems, cost-constrained</td><td>Global-link contention if under-provisioned</td></tr>
   <tr><td>Torus</td><td>O(N^(1/d))</td><td>Moderate, dimension-dependent</td><td>O(N) links — cheap</td><td>Stencil / nearest-neighbor workloads</td><td>Longer paths for non-local traffic</td></tr>
   <tr><td>Mesh</td><td>Higher than torus</td><td>Lower than torus</td><td>O(N) links, no wraparound</td><td>Cost-constrained regular workloads</td><td>Edge effects, longest average paths</td></tr>
   <tr><td>Hypercube</td><td>O(log N)</td><td>High</td><td>O(N log N) links</td><td>Systems needing very low diameter</td><td>Wiring complexity at scale</td></tr>
   <tr><td>Fully connected</td><td>1 hop</td><td>Very high</td><td>O(N²) links</td><td>Small systems only</td><td>Doesn't scale economically</td></tr>
 </table></div>
 <div class="note tip"><span class="tag">How to actually choose</span><p>Match the topology to your dominant traffic pattern, not just node count. Nearest-neighbor-dominant simulation codes are a natural fit for torus. All-to-all/collective-heavy AI training and general HPC workloads want a non-blocking or near-non-blocking fat-tree/Clos. Extremely large systems where full non-blocking fat-tree cost is prohibitive increasingly reach for dragonfly.</p></div>
 `},

{id:'s-6-2', part:'p6', num:'6.2', title:'Blocking, Oversubscription &amp; Bisection Bandwidth',
 dek:'The quantitative core of fabric design: how much of a leaf switch\'s bandwidth can actually reach the rest of the network at once.',
 tags:'blocking oversubscription bisection bandwidth non blocking downlink uplink',
 calc:'oversub',
 body:`
 <p>This is where topology choice (§6.1) turns into concrete engineering numbers. The terminology is precise and worth learning exactly — "blocking ratio" in particular is used inconsistently across vendor documents, so always state the exact definition you mean.</p>

 <h3>Oversubscription — local bandwidth imbalance</h3>
 <p><strong>Oversubscription</strong> describes the imbalance between how much bandwidth endpoints <em>could</em> inject into the network versus how much bandwidth the fabric can actually carry away. A 2:1 oversubscription ratio means that if every server on a leaf switch simultaneously tried to send at full line rate, only half of that traffic could actually reach the rest of the network — the other half would be blocked or delayed.</p>
 <p>Oversubscription is <em>local</em>: it describes a specific cut in the fabric (typically leaf-to-spine), not the global network. You can have a fabric that is 2:1 oversubscribed at the leaf-to-spine cut but perfectly non-blocking within each pod.</p>

 <h3>Blocking — when oversubscription bites</h3>
 <p><strong>Blocking</strong> is what happens when oversubscription takes effect: some traffic cannot be delivered at full rate because the uplink bandwidth is insufficient. "Blocking fraction" quantifies this — a 2:1 oversubscribed link has a blocking fraction of 0.5, meaning 50% of endpoint bandwidth is not simultaneously deliverable upstream. The term "non-blocking" (1:1 ratio) means every endpoint can inject at full rate simultaneously without any contention. In practice, truly non-blocking fabrics are rare outside of the most performance-sensitive HPC clusters because the cost of providing 1:1 uplink capacity at every tier is substantial.</p>

 <h3>Bisection bandwidth — the global worst case</h3>
 <p><strong>Bisection bandwidth</strong> is a different measurement entirely — it asks: "If I split the network into two equal halves, what's the minimum bandwidth connecting them?" This is the worst-case number for any-to-all or all-to-all traffic. A fat-tree with full non-blocking oversubscription at every tier has bisection bandwidth equal to half the aggregate endpoint bandwidth (since you can route half the endpoints' traffic one way and half the other).</p>
 <p>Bisection bandwidth matters for MPI collectives (all-reduce, all-to-all) where every rank communicates with every other rank simultaneously. A fabric can look fine on local oversubscription numbers while still having a disappointing global bisection bandwidth if the upper tiers are under-provisioned.</p>

 <h3>Bisection ratio — normalized comparison</h3>
 <p><strong>Bisection ratio</strong> normalizes bisection bandwidth against the aggregate injection capacity of the endpoints. A ratio of 1.0 means the network can deliver full bisection traffic; a ratio of 0.5 means only half of the worst-case bisection traffic can be carried. This is the single most useful number for comparing different topologies at the same scale — it tells you how well the network handles the hardest traffic pattern (uniform all-to-all).</p>

 <div class="note tip"><span class="tag">Why oversubscription exists</span><p>Most real workloads don't generate uniform all-to-all traffic. Intra-pod communication (within a leaf switch's domain) is far more common than cross-pod communication, so oversubscription trades away bandwidth for the rare worst-case in exchange for significant cost savings. A 2:1 oversubscribed fabric costs roughly half as much in uplink ports and spine capacity as a non-blocking one — a massive difference at scale. The key engineering question is: does your dominant traffic pattern stay local, or does it cross the fabric globally?</p></div>

 <h3>Reference formulas</h3>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Term</th><th>Formula / definition</th><th>Interpretation</th></tr>
   <tr><td>Downlink bandwidth</td><td class="mono">B_down = Σ endpoint-facing link bandwidth</td><td>Aggregate bandwidth toward hosts</td></tr>
   <tr><td>Uplink bandwidth</td><td class="mono">B_up = Σ fabric/uplink bandwidth</td><td>Bandwidth available toward the rest of the fabric</td></tr>
   <tr><td>Oversubscription ratio</td><td class="mono">OS = B_down / B_up</td><td>2:1 means 2 units of endpoint bandwidth compete for 1 unit of uplink</td></tr>
   <tr><td>Non-blocking condition</td><td class="mono">B_up ≥ B_down (OS = 1:1)</td><td>Every host could inject at full rate simultaneously</td></tr>
   <tr><td>Blocking fraction</td><td class="mono">1 − B_up/B_down</td><td>Fraction of endpoint bandwidth not simultaneously deliverable upstream</td></tr>
   <tr><td>Bisection bandwidth</td><td>Bandwidth of the minimum cut splitting endpoints into two equal groups</td><td>The key number for global/all-to-all traffic</td></tr>
   <tr><td>Bisection ratio</td><td class="mono">b = Bisection BW / aggregate endpoint injection BW</td><td>Normalized measure of global connectivity</td></tr>
 </table></div>
 <div class="calc-mount" data-calc="oversub"></div>
 <div class="example-box">
   <span class="tag">Worked example (from the source reference)</span>
   <p>16 servers, each with a 100 Gb/s NIC → 1.6 Tb/s aggregate downlink. If the leaf switch has only 800 Gb/s of uplink capacity toward the spine:</p>
   <p>OS = 1600 / 800 = <span class="res">2:1 oversubscribed</span> at that cut — only half of the servers' combined bandwidth can reach the rest of the fabric simultaneously.</p>
 </div>
 <p>Common blocking-ratio reference points: <strong>1:1</strong> (non-blocking, B_up = B_down), <strong>2:1</strong> (B_up = B_down/2, blocking fraction 50%), <strong>4:1</strong> (blocking fraction 75%), <strong>8:1</strong> (strongly oversubscribed). Higher oversubscription is cheaper to build but risks contention whenever traffic doesn't stay local to a leaf/pod.</p>
 <div class="note warn"><span class="tag">Bisection bandwidth ≠ oversubscription</span><p>These are related but genuinely different measurements. Oversubscription describes a specific local cut (typically leaf-to-spine); bisection bandwidth describes the worst-case global cut across the <em>entire</em> network split into two halves. A fabric can look fine on local oversubscription numbers while still having a disappointing global bisection bandwidth, depending on how the upper tiers are built — always check both for workloads with significant global/all-to-all communication.</p></div>
 `},

{id:'s-6-3', part:'p6', num:'6.3', title:'Symmetric k-ary Fat-Tree Sizing',
 dek:'Given just one number — the switch radix k — every other quantity in a classic non-blocking fat-tree follows.',
 tags:'k-ary fat tree radix pods core switches hosts sizing formula',
 calc:'kfattree',
 body:`
 <p>For the classic symmetric k-ary fat-tree construction, a single parameter — the switch radix <code>k</code> (number of ports per switch, assumed even) — determines the entire topology's size, because a non-blocking design dedicates exactly half of every switch's ports downward (toward hosts/lower tier) and half upward (toward the next tier).</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Quantity</th><th>Formula</th><th>Notes</th></tr>
   <tr><td>Ports per switch</td><td class="mono">k</td><td>Assume even k</td></tr>
   <tr><td>Downward ports</td><td class="mono">k/2</td><td>For symmetric non-blocking construction</td></tr>
   <tr><td>Upward ports</td><td class="mono">k/2</td><td>For symmetric non-blocking construction</td></tr>
   <tr><td>Servers per edge switch</td><td class="mono">k/2</td><td>If every downward port connects to a host</td></tr>
   <tr><td>Pods</td><td class="mono">k</td><td>Classic k-ary construction</td></tr>
   <tr><td>Edge switches per pod</td><td class="mono">k/2</td><td>—</td></tr>
   <tr><td>Aggregation switches per pod</td><td class="mono">k/2</td><td>—</td></tr>
   <tr><td>Core switches</td><td class="mono">k²/4</td><td>Classic 3-level k-ary fat-tree</td></tr>
   <tr><td>Maximum hosts</td><td class="mono">k³/4</td><td>Classic k-ary fat-tree</td></tr>
   <tr><td>Total switches</td><td class="mono">5k²/4</td><td>Classic 3-level construction</td></tr>
 </table></div>
 <div class="calc-mount" data-calc="kfattree"></div>
 <div class="note tip"><span class="tag">The k³/4 growth rate, intuitively</span><p>Doubling the switch radix k roughly 8× the maximum host count (k³ scaling) — which is exactly why a jump from, say, 32-port to 64-port switch silicon is such a big deal for fat-tree cluster scale, and why switch-radix improvements have historically been one of the more consequential enablers of larger non-blocking HPC fabrics.</p></div>
 <div class="note warn"><span class="tag">Real fabrics deviate from the idealized model</span><p>These relations describe the <em>classic</em> symmetric 3-tier k-ary construction. Production Clos fabrics frequently use different radix per tier, more or fewer tiers, asymmetric port splits, breakout cabling, and non-uniform endpoint counts — treat this table as the reference baseline for reasoning about scale, not a literal blueprint for every real deployment.</p></div>
 `},

{id:'s-6-4', part:'p6', num:'6.4', title:'Leaf-Spine / Clos Design Formulas',
 dek:'Sizing a 2-tier fabric to hit a target oversubscription ratio.',
 tags:'leaf spine clos design formula uplinks host bandwidth',
 calc:'leafspine',
 body:`
 <div class="formula-box">
   <span class="tag">Leaf-spine sizing</span>
   <div class="flist">
     <div class="f">Leaf host bandwidth: H = Nh × Sh</div>
     <div class="f">Leaf uplink bandwidth: U = Nu × Su</div>
     <div class="f">Leaf oversubscription: OS = H / U</div>
   </div>
 </div>
 <div class="varkey">
   <dt>Nh, Sh</dt><dd>number of hosts on a leaf, and each host's link speed</dd>
   <dt>Nu, Su</dt><dd>number of uplinks from that leaf, and each uplink's speed</dd>
 </div>
 <p>This is the same oversubscription concept from §6.2, applied directly to leaf-spine sizing math: given how many hosts you want per leaf and at what speed, and a target oversubscription ratio, you can solve directly for how many uplinks (and therefore how much spine capacity) you need.</p>
 <div class="calc-mount" data-calc="leafspine"></div>
 <div class="example-box">
   <span class="tag">Worked example (from the source reference)</span>
   <p>H = 3.2 Tb/s of host bandwidth on a leaf, U = 1.6 Tb/s of uplink bandwidth:</p>
   <p>OS = 3.2/1.6 = <span class="res">2:1</span></p>
   <p>To reach 1:1 non-blocking instead with the same host bandwidth, uplink capacity would need to double to 3.2 Tb/s — meaning roughly twice as many uplink ports (or twice the per-uplink speed) dedicated to spine-facing traffic.</p>
 </div>
 `},

{id:'s-6-5', part:'p6', num:'6.5', title:'Torus Formulas',
 dek:'How node count, degree, and worst-case hop distance fall out of a torus\'s dimensionality and per-dimension size.',
 tags:'torus formula dimension degree hop distance link count',
 calc:'torus',
 body:`
 <div class="formula-box">
   <span class="tag">d-dimensional torus, uniform size L per dimension</span>
   <div class="flist">
     <div class="f">Total nodes: N = ∏ᵢ Lᵢ</div>
     <div class="f">Node degree: 2d &nbsp;&nbsp;<small>two neighbors per dimension — one each direction</small></div>
     <div class="f">Maximum hop distance: Σᵢ ⌊Lᵢ/2⌋</div>
     <div class="f">Link count: N × d &nbsp;&nbsp;<small>each undirected edge counted once</small></div>
   </div>
 </div>
 <p>The wraparound links (§6.1's torus diagram) are exactly what makes the maximum hop distance <code>⌊L/2⌋</code> per dimension rather than <code>L−1</code> — without wraparound (that's a mesh, §6.1), the worst case would be traversing the entire row/column. With wraparound, the furthest you ever need to travel in one dimension is halfway around, in either direction.</p>
 <div class="calc-mount" data-calc="torus"></div>
 <div class="example-box">
   <span class="tag">Worked example</span>
   <p>A 3D torus with 8 nodes per dimension (8×8×8): N = 8³ = 512 nodes. Node degree = 2×3 = 6 links per node. Maximum hop distance = 3 × ⌊8/2⌋ = <span class="res">12 hops</span> worst case. Link count = 512 × 3 = 1,536 undirected links — far fewer than a fat-tree of comparable size, at the cost of that 12-hop worst-case path versus a fat-tree's small, fixed number of hops.</p>
 </div>
 `},

{id:'s-6-6', part:'p6', num:'6.6', title:'Dragonfly Quantities',
 dek:'Local groups, global links, and why the exact formulas depend on which Dragonfly variant you\'re reading about.',
 tags:'dragonfly router radix group global links parameterization',
 body:`
 <p>A Dragonfly network groups routers locally (fully or richly connected within a group) and then connects those groups together with a comparatively sparse set of global links — the structure visible in the §6.1 diagram. A common parameterization uses:</p>
 <div class="varkey">
   <dt>p</dt><dd>terminal (host-facing) ports per router</dd>
   <dt>a</dt><dd>local router-connectivity parameter (links to other routers within the same group)</dd>
   <dt>h</dt><dd>global links per router (links leaving the group entirely)</dd>
 </div>
 <div class="formula-box">
   <span class="tag">Common Dragonfly relation</span>
   <div class="f">Router radix: k = p + a + h − 1</div>
 </div>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Quantity</th><th>Common relation / concept</th><th>Interpretation</th></tr>
   <tr><td>Router radix</td><td class="mono">k = p + a + h − 1</td><td>Ports divided among terminal/local/global roles</td></tr>
   <tr><td>Group size</td><td>Depends on a, p and group construction</td><td>Routers/endpoints within a local group</td></tr>
   <tr><td>Global links</td><td class="mono">h per router</td><td>Connect groups to each other</td></tr>
   <tr><td>Group count</td><td>Depends on global-link count and routing design</td><td>Number of groups the system is partitioned into</td></tr>
   <tr><td>Bisection</td><td>Determined primarily by global links crossing a balanced group cut</td><td>Critical for global traffic</td></tr>
   <tr><td>Diameter</td><td>Low — typically a few router hops</td><td>One of Dragonfly's main advantages</td></tr>
 </table></div>
 <div class="note warn"><span class="tag">There is no single universal Dragonfly formula set</span><p>The exact Dragonfly/Dragonfly+ equations vary meaningfully with the specific generalized topology and notation a paper or vendor uses. For real design work, use the topology's formal parameter definitions from the specific source you're implementing against, rather than mixing formulas from different papers — they are not always directly interchangeable.</p></div>
 <div class="note tip"><span class="tag">Why Dragonfly scales cost-effectively</span><p>Because most connectivity stays local (cheap, short, high-radix router-to-router links within a group) and only a comparatively small number of expensive long-haul global links are needed to tie groups together, Dragonfly can reach very large system sizes with near-linear router/link scaling — a genuinely different cost curve than a full non-blocking fat-tree at the same scale.</p></div>
 `},

{id:'s-6-7', part:'p6', num:'6.7', title:'Network Cost &amp; Cable Scaling',
 dek:'How each topology\'s link count grows with system size — the number that ultimately drives fabric budget.',
 tags:'cost cable scaling links topology comparison',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Topology</th><th>Scaling intuition</th><th>Main cost driver</th></tr>
   <tr><td>Fully connected</td><td class="mono">O(N²) links</td><td>Explosive cable/port count — infeasible beyond small N</td></tr>
   <tr><td>Fat-tree / Clos</td><td>Approximately O(N log N) class scaling, construction-dependent</td><td>Many switch ports + cables</td></tr>
   <tr><td>Torus</td><td class="mono">O(N) links</td><td>Fewer links; longer paths as compensation</td></tr>
   <tr><td>Hypercube</td><td class="mono">O(N log N) links</td><td>Higher node degree drives cost</td></tr>
   <tr><td>Dragonfly</td><td>Near-linear router/link scaling with carefully chosen group parameters</td><td>Global links + router radix</td></tr>
 </table></div>
 <p>This table is the "so what" that follows from §6.1's structural comparison: <strong>link count directly drives switch port count, optics/cable spend, and often power and rack space</strong> — usually the largest line items in a fabric's total cost. A topology that looks attractive on paper for its bisection bandwidth or diameter can be economically unworkable once its link-count scaling is priced out at your target node count.</p>
 <div class="note tip"><span class="tag">Reading this table correctly</span><p>These are asymptotic scaling <em>intuitions</em>, not exact formulas you can plug numbers into directly — use §6.3 (fat-tree), §6.5 (torus), and §6.6 (dragonfly) for the precise sizing formulas once you've picked a topology family based on this table's general shape.</p></div>
 `},

{id:'s-6-8', part:'p6', num:'6.8', title:'Routing &amp; Congestion Control Terms',
 dek:'The vocabulary for how traffic actually finds its way through a fabric — and what goes wrong when it doesn\'t.',
 tags:'routing congestion ecmp pfc ecn credit flow control hotspot head of line blocking',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Term</th><th>Definition</th><th>Importance</th></tr>
   <tr><td>Minimal routing</td><td>Shortest path only</td><td>Lower hop count; can create congestion hotspots when many flows share the same shortest path</td></tr>
   <tr><td>Non-minimal routing</td><td>May deliberately use a longer path</td><td>Can distribute traffic away from a congested minimal path</td></tr>
   <tr><td>Adaptive routing</td><td>Path selected based on current network state</td><td>Avoids congested links dynamically, at some routing-decision overhead</td></tr>
   <tr><td>ECMP</td><td>Equal-Cost Multi-Path</td><td>Splits flows across multiple equal-cost paths — the standard Ethernet/IP load-spreading mechanism</td></tr>
   <tr><td>PFC</td><td>Priority Flow Control</td><td>Ethernet/RoCE loss-avoidance mechanism; can itself propagate congestion (pause storms) if misconfigured</td></tr>
   <tr><td>ECN</td><td>Explicit Congestion Notification</td><td>Signals congestion without dropping packets — generally gentler than PFC</td></tr>
   <tr><td>Credit-based flow control</td><td>Sender is constrained by receiver/router-issued credits</td><td>Common in HPC interconnect designs (e.g., InfiniBand)</td></tr>
   <tr><td>Head-of-line blocking</td><td>A blocked packet/queue prevents following traffic behind it from proceeding</td><td>Can reduce effective throughput well below link capacity</td></tr>
   <tr><td>Hotspot</td><td>Disproportionately loaded destination or link</td><td>Can dominate and degrade overall application performance</td></tr>
   <tr><td>Contention</td><td>Multiple flows competing for the same resource</td><td>A common, often underestimated, scaling limiter</td></tr>
 </table></div>
 <div class="note warn"><span class="tag">ECMP's hidden failure mode</span><p>ECMP typically hashes flows across paths based on packet header fields (source/destination address and port). With only a small number of large, long-lived flows — common in HPC collective communication — hash collisions can leave some equal-cost paths idle while others carry multiple flows, creating exactly the kind of hotspot the mechanism was meant to prevent. This is one of the most common, hardest-to-diagnose causes of "the network should have enough bandwidth but performance is inconsistent" symptoms (see the bottleneck diagnosis tool in §11.1).</p></div>
 <div class="note tip"><span class="tag">PFC's double-edged nature</span><p>Priority Flow Control keeps RDMA traffic lossless by telling a sender to pause when a receiver's buffer fills — necessary because RDMA is far less tolerant of packet loss than TCP. But pause frames can themselves cascade backward through the fabric under sustained congestion (a "PFC storm"), which is why production RoCE deployments invest heavily in tuning PFC alongside ECN rather than relying on PFC alone.</p></div>
 `},

{id:'s-6-9', part:'p6', num:'6.9', title:'Worked Example — Designing a 100 Gb/s HPC Cluster Fabric',
 dek:'Putting the whole Part together on one realistic sizing problem, straight from the source reference.',
 tags:'worked example 100gb cluster fabric design oversubscription tradeoff',
 body:`
 <p>Suppose 64 compute nodes, each with one 100 Gb/s NIC. This single worked example pulls together bandwidth math (§5.1), oversubscription (§6.2), and the cost trade-off (§6.7) into one concrete decision.</p>
 <div class="formula-box">
   <span class="tag">Step 1 — aggregate endpoint injection capacity</span>
   <div class="f">64 nodes × 100 Gb/s = 6.4 Tb/s</div>
 </div>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Target design</th><th>Required upstream capacity</th><th>Trade-off</th></tr>
   <tr><td>1:1 (non-blocking)</td><td class="mono">6.4 Tb/s</td><td>Full simultaneous injection at every node; most expensive, before redundancy/implementation overhead</td></tr>
   <tr><td>2:1 oversubscribed</td><td class="mono">6.4 / 2 = 3.2 Tb/s</td><td>Substantially cheaper; fine unless heavy global all-to-all traffic is expected</td></tr>
   <tr><td>4:1 oversubscribed</td><td class="mono">6.4 / 4 = 1.6 Tb/s</td><td>Much cheaper still; real risk of contention under heavy MPI/collective load</td></tr>
 </table></div>
 <p>The 2:1 design can be substantially cheaper to build than the 1:1 design, but workloads with global all-to-all patterns or heavy MPI collective exchange (large-scale AllReduce in distributed training, or global transposes in spectral methods) can experience real contention under it — the oversubscription ratio that "works fine" is fundamentally workload-dependent, not a fixed engineering target.</p>
 <div class="note warn"><span class="tag">The rule this example is really teaching</span><p>For distributed training or tightly-coupled simulation workloads, <strong>measure collective and MPI performance directly</strong> (§10.5's OSU/IMB benchmarks) rather than judging network adequacy solely from NIC line rate and a target oversubscription ratio on paper. A 2:1 design that looks reasonable on a spreadsheet can still bottleneck a specific collective pattern that happens to concentrate traffic exactly where the oversubscription bites hardest.</p></div>
 `}
);
</script>
<script>

{id:'s-7-1', part:'p7', num:'7.1', title:'Heat Transfer Fundamentals',
 dek:'Conduction, convection, and the electrical-circuit analogy that makes thermal resistance intuitive.',
 tags:'heat transfer conduction convection thermal resistance network',
 diagrams:['thermalckt'],
 body:`
 <p>Every cooling system in a datacenter — from a heatsink on a CPU die to a chilled-water plant — is fundamentally moving heat down a temperature gradient, and the same handful of physical relationships describe all of it.</p>
 <div class="formula-box">
   <span class="tag">Thermal resistance</span>
   <div class="flist">
     <div class="f">Conduction: R = L / (k·A)</div>
     <div class="f">Convection: R = 1 / (h·A)</div>
     <div class="f">Thermal network: ΔT = Q̇ × R_total</div>
   </div>
 </div>
 <div class="varkey">
   <dt>L</dt><dd>thickness of the conducting material</dd>
   <dt>k</dt><dd>thermal conductivity of the material (W/m·K)</dd>
   <dt>A</dt><dd>cross-sectional area heat flows through</dd>
   <dt>h</dt><dd>convective heat transfer coefficient (W/m²·K) — depends on fluid, flow rate, surface geometry</dd>
   <dt>Q̇</dt><dd>heat flow rate (power, in watts)</dd>
 </div>
 <p>The genuinely useful mental model here is the direct electrical analogy: <strong>thermal resistance behaves exactly like electrical resistance</strong>, temperature difference plays the role of voltage, and heat flow rate plays the role of current. Resistances in series (die → heatsink base → fins → air, for example) simply add, just like resistors in a series circuit.</p>
 <div class="diagram"><div class="diagram-mount" data-diagram="thermalckt"></div></div>
 <div class="diagram-cap">A simplified two-stage thermal path (conduction through the heatsink base, then convection to air) drawn as a series circuit.</div>
 <div class="example-box">
   <span class="tag">Worked example</span>
   <p>A CPU package dissipates 250 W through a heatsink with R_conduction = 0.05 K/W (base) in series with R_convection = 0.15 K/W (fins to air):</p>
   <p>R_total = 0.05 + 0.15 = 0.20 K/W</p>
   <p>ΔT = Q̇ × R_total = 250 W × 0.20 K/W = <span class="res">50°C rise</span> above ambient air temperature at the die — this is why fin design (increasing A) and airflow (increasing h) are the two levers that matter most for air cooling.</p>
 </div>
 <div class="note tip"><span class="tag">Why this section anchors the rest of Part VII</span><p>Air cooling (§7.2), liquid cooling (§7.3), and heat exchangers (§7.4) are all just different physical implementations of moving heat down a resistance chain to eventually reject it outside the building. The <code>Q̇ = ṁcpΔT</code> formula that dominates the next two sections is really just a restatement of "energy in = energy out" for a moving fluid, rather than a separate physical principle.</p></div>
 `},

{id:'s-7-2', part:'p7', num:'7.2', title:'Air Cooling',
 dek:'The formula behind every CRAC/CRAH unit and every "how much airflow do I need" question.',
 tags:'air cooling mass flow volumetric flow ach airflow crac crah',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Quantity</th><th>Formula</th></tr>
   <tr><td>Air heat removal</td><td class="mono">Q̇ = ṁ·cp·ΔT</td></tr>
   <tr><td>Mass flow</td><td class="mono">ṁ = ρ·V̇</td></tr>
   <tr><td>Volumetric flow</td><td class="mono">V̇ = ṁ/ρ</td></tr>
   <tr><td>Air changes per hour</td><td class="mono">ACH = volumetric airflow/hour ÷ room volume</td></tr>
 </table></div>
 <p>This is the same <code>Q̇ = ṁcpΔT</code> relationship from §7.1, applied specifically to air as the working fluid. Given a known IT heat load and an allowable temperature rise across the equipment (the ΔT between cold-aisle supply air and hot-aisle return air), you can solve directly for the mass — and therefore volumetric — airflow required.</p>
 <p>The interactive calculator for this exact formula (supporting both air and water as the fluid) lives in §7.1's neighbor, the general heat-removal calculator — reachable from the sensible-heat calculator embedded in this Part.</p>
 <div class="example-box">
   <span class="tag">Worked example</span>
   <p>A room needs to remove 150 kW of IT heat with a 12°C allowable rise across the equipment, using air (cp ≈ 1.006 kJ/kg·K, ρ ≈ 1.2 kg/m³ near typical datacenter conditions):</p>
   <p>ṁ = Q̇/(cp·ΔT) = 150/(1.006 × 12) ≈ 12.4 kg/s</p>
   <p>V̇ = ṁ/ρ = 12.4/1.2 ≈ 10.4 m³/s ≈ <span class="res">37,300 m³/h</span> of airflow required</p>
 </div>
 <div class="note warn"><span class="tag">Precision caveat, straight from the source reference</span><p>For rough air-cooling estimates near typical room conditions, air density and cp can be approximated as constants (as in the example above). Real engineering calculations should use site-specific pressure, humidity, and temperature — air density in particular varies meaningfully with altitude and humidity, and a datacenter at altitude or with unusual ambient conditions can see a non-trivial error from using sea-level constants unmodified.</p></div>
 `},

{id:'s-7-3', part:'p7', num:'7.3', title:'Liquid Cooling',
 dek:'Direct-to-chip, rear-door heat exchangers, and immersion — three different ways to swap air for a much better heat-carrying fluid.',
 tags:'liquid cooling direct to chip cold plate rear door immersion pump power',
 calc:'heat',
 body:`
 <p>Water carries roughly 3,300× more heat per unit volume for the same temperature rise than air (a direct consequence of water's far higher density and specific heat capacity), which is the entire reason liquid cooling exists: it lets you remove far more heat through far less volumetric flow and far smaller ductwork/piping than air ever could at the power densities modern accelerators reach.</p>
 <div class="formula-box">
   <span class="tag">Liquid cooling formulas</span>
   <div class="flist">
     <div class="f">Coolant heat removal: Q̇ = ṁ·cp·ΔT</div>
     <div class="f">Water heat capacity: cp ≈ 4.18 kJ/(kg·K) near room temperature</div>
     <div class="f">Required mass flow: ṁ = Q̇/(cp·ΔT)</div>
     <div class="f">Pump hydraulic power: P_pump ≈ ΔP·V̇ / η</div>
   </div>
 </div>
 <div class="calc-mount" data-calc="heat"></div>
 <h4>Three common architectures</h4>
 <ul>
   <li><strong>Direct-to-chip:</strong> cold plates mount directly on the highest-power components (CPUs/GPUs), carrying coolant right to the source of the heat. Highest thermal performance per component, but doesn't address heat from surrounding components (memory, VRMs, NICs) unless those get cold plates too.</li>
   <li><strong>Rear-door heat exchangers:</strong> a liquid-cooled door replaces the rack's rear panel, removing heat from server exhaust air before it enters the room — without needing to replace or modify individual servers. Simpler to retrofit, but generally less effective per watt than direct-to-chip for the very highest power components.</li>
   <li><strong>Immersion cooling:</strong> components submerge directly in a dielectric (electrically non-conductive) fluid. Single-phase immersion keeps the fluid liquid throughout; two-phase immersion lets the fluid boil at the hot surface and condense elsewhere, using the fluid's latent heat of vaporization for even higher heat-transfer effectiveness — at the cost of more complex fluid handling and maintenance procedures.</li>
 </ul>
 <p>Pressure drop (ΔP) through the cooling loop depends on pipe geometry, flow regime (laminar vs. turbulent), fittings, and fluid properties — it's what determines how much pump power is needed to push the required flow rate through the loop.</p>
 <div class="note tip"><span class="tag">Why liquid cooling has become unavoidable at the top of the market</span><p>The highest-power current-generation GPUs and CPUs individually dissipate as much heat as an entire rack did a decade ago. Air cooling doesn't disappear as a technology, but at these power densities the airflow, fan power, and rack space required to move enough air becomes impractical — which is why nearly every leading-edge AI/HPC accelerator platform now ships with, or requires, some form of liquid cooling.</p></div>
 `},

{id:'s-7-4', part:'p7', num:'7.4', title:'Heat Exchangers &amp; LMTD',
 dek:'How heat crosses from one fluid loop to another without the fluids ever mixing — and the one formula that makes the math tractable.',
 tags:'heat exchanger lmtd effectiveness log mean temperature difference',
 body:`
 <p>A heat exchanger transfers heat between two fluid streams (e.g., a facility water loop and an outside-air or refrigerant loop) without letting them physically mix. The tricky part is that the temperature difference driving the heat transfer isn't constant along the exchanger's length — it changes continuously as each fluid warms or cools. The Log Mean Temperature Difference (LMTD) is the standard way to collapse that varying gradient into one usable number.</p>
 <div class="formula-box">
   <span class="tag">Heat exchanger formulas</span>
   <div class="flist">
     <div class="f">Heat rate: Q̇ = U·A·ΔT_lm</div>
     <div class="f">LMTD: ΔT_lm = (ΔT₁ − ΔT₂) / ln(ΔT₁/ΔT₂)</div>
     <div class="f">Effectiveness: ε = Q̇_actual / Q̇_maximum</div>
     <div class="f">Maximum possible heat transfer: Q̇_max = C_min × (T_h,in − T_c,in)</div>
     <div class="f">Heat capacity rate: C = ṁ·cp</div>
   </div>
 </div>
 <div class="varkey">
   <dt>U</dt><dd>overall heat transfer coefficient (combines conduction through the exchanger wall and convection on both sides)</dd>
   <dt>A</dt><dd>heat transfer surface area</dd>
   <dt>ΔT₁, ΔT₂</dt><dd>temperature differences between the two fluids at each end of the exchanger</dd>
   <dt>C_min</dt><dd>the smaller of the two fluid streams' heat capacity rates — the stream that can't release/absorb more heat than this without violating energy conservation</dd>
 </div>
 <p><strong>Effectiveness (ε)</strong> is a genuinely useful single number for comparing exchangers: it's the fraction of the theoretical maximum possible heat transfer (if the exchanger were infinitely large) that a real, finite-size exchanger actually achieves. Higher effectiveness generally means a larger, more expensive exchanger — another cost/performance trade-off, this time in the thermal domain rather than the network domain of Part VI.</p>
 <div class="example-box">
   <span class="tag">Worked example — LMTD</span>
   <p>Hot fluid enters at 45°C and leaves at 35°C; cold fluid enters at 20°C and leaves at 28°C, in a counter-flow arrangement. ΔT₁ = 45−28 = 17°C at one end, ΔT₂ = 35−20 = 15°C at the other.</p>
   <p>ΔT_lm = (17−15)/ln(17/15) = 2/0.1252 ≈ <span class="res">16.0°C</span> — close to the simple arithmetic average here because the two end-differences are similar; LMTD diverges more from a simple average as the two ΔTs become more unequal.</p>
 </div>
 `},

{id:'s-7-5', part:'p7', num:'7.5', title:'Refrigeration &amp; Cooling Plant',
 dek:'COP, EER, and the tons-of-refrigeration unit — turning "how much cooling" into "how much electricity that costs."',
 tags:'refrigeration cop eer ton cooling plant electrical input',
 calc:'cop',
 body:`
 <div class="formula-box">
   <span class="tag">Refrigeration metrics</span>
   <div class="flist">
     <div class="f">COP (cooling) = Q̇_cooling / Ẇ_input</div>
     <div class="f">EER = cooling capacity / electrical power</div>
     <div class="f">1 Ton of Refrigeration (TR) ≈ 3.517 kW cooling</div>
     <div class="f">Electrical input: Ẇ_input = Q̇_cooling / COP</div>
   </div>
 </div>
 <p><strong>COP (Coefficient of Performance)</strong> is the single number that separates a good cooling plant from a wasteful one: it's the ratio of cooling delivered to electrical energy consumed to deliver it. Unlike a simple resistive heater (which can never exceed COP = 1, since it just converts electricity directly to heat), a refrigeration cycle <em>moves</em> heat rather than creating it, so COP values well above 1 — commonly 3 to 6+ for modern chiller plants — are normal and expected.</p>
 <div class="calc-mount" data-calc="cop"></div>
 <p><strong>EER</strong> measures the same underlying idea but is conventionally expressed with mixed units (BTU/h of cooling per watt of electrical input) rather than COP's same-units ratio — you'll see EER quoted on equipment nameplates especially for smaller/commercial-grade units, while COP is more common in engineering calculations and larger chiller-plant specifications.</p>
 <div class="example-box">
   <span class="tag">Worked example</span>
   <p>A datacenter needs to reject 800 kW of IT heat load. The chiller plant runs at COP = 5.0 (a reasonably efficient modern water-cooled chiller):</p>
   <p>Ẇ_input = 800/5.0 = <span class="res">160 kW</span> of electrical power just to run the cooling plant — on top of the 800 kW IT load itself. This 160 kW is exactly the kind of "non-IT overhead" that drives PUE above 1.0 (§8.3).</p>
 </div>
 <div class="note tip"><span class="tag">Why "free cooling" is such a big efficiency lever</span><p>When outside air or water temperature is cold enough, a facility can reject heat directly through an economizer/heat exchanger — bypassing the mechanical refrigeration cycle (the compressor) entirely for some or all of the year. Because mechanical refrigeration is the dominant electrical cost in a cooling plant, maximizing "free cooling" hours is one of the single biggest levers for improving a datacenter's annual PUE, which is why facility siting in cooler climates has become a significant strategic consideration for large-scale datacenter operators.</p></div>
 `}
);
</script>
<script>

   ===================================================================== */

{id:'s-8-1', part:'p8', num:'8.1', title:'Electrical Power Formulas',
 dek:'DC, single-phase AC, three-phase AC — the formulas behind every rack PDU, breaker, and power budget.',
 tags:'electrical power dc ac three phase power factor psu efficiency',
 calc:'power',
 body:`
 <div class="formula-box">
   <span class="tag">Power formulas</span>
   <div class="flist">
     <div class="f">DC power: P = V·I</div>
     <div class="f">Ohmic power: P = I²R = V²/R</div>
     <div class="f">Energy: E = P·t &nbsp;&nbsp;<small>kWh = kW × hours</small></div>
     <div class="f">Single-phase AC real power: P = V·I·cosφ</div>
     <div class="f">Three-phase AC real power: P = √3·V_L·I_L·cosφ</div>
     <div class="f">Apparent power: S = V·I (VA), or √3·V_L·I_L for 3-phase</div>
     <div class="f">Power factor: PF = P/S</div>
     <div class="f">PSU output/input: P_out = η·P_in &nbsp; → &nbsp; P_in = P_out/η</div>
   </div>
 </div>
 <p>Nearly every datacenter power distribution question reduces to one of these formulas. The three-phase formula (with its distinctive √3 factor) is the one worth internalizing specifically, since almost all serious datacenter power distribution — rack PDUs, facility feeds — runs on three-phase AC rather than the single-phase power more familiar from household contexts.</p>
 <div class="calc-mount" data-calc="power"></div>
 <p><strong>Power factor</strong> captures the gap between apparent power (what the utility/PDU has to be sized to deliver) and real power (what actually does useful work) — a PF below 1.0 means some current flows without doing useful work, due to the phase relationship between voltage and current in loads with reactive (inductive/capacitive) components. Modern server power supplies typically achieve PF well above 0.95 through active power-factor correction, but it's still a term worth checking on equipment specs.</p>
 <div class="note tip"><span class="tag">Sizing a circuit in the other direction</span><p>Given a known IT power draw, solve for required current: I ≈ P / (√3 × V_L × PF). But don't stop there — always check the result against continuous-load derating rules (commonly requiring load to stay at or below 80% of a breaker's rating for sustained loads) and the actual rated capacity of the rack PDU, not just the raw arithmetic result.</p></div>
 `},

{id:'s-8-2', part:'p8', num:'8.2', title:'Power Density &amp; Rack Sizing',
 dek:'From "kW per rack" to annual energy consumption — and why IT power and IT heat load are, to first order, the same number.',
 tags:'power density rack sizing kw floor annual energy heat',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Metric</th><th>Formula</th></tr>
   <tr><td>Rack power density</td><td class="mono">kW/rack</td></tr>
   <tr><td>Floor power density</td><td class="mono">kW/m²</td></tr>
   <tr><td>Energy consumption</td><td class="mono">E = P × t</td></tr>
   <tr><td>Annual energy</td><td class="mono">E_annual = P(kW) × 8,760 h/year × utilization</td></tr>
   <tr><td>Heat generated by IT</td><td>Approximately equal to electrical IT power in steady state</td></tr>
   <tr><td>Current, 3-phase</td><td class="mono">I ≈ P/(√3·V·PF)</td></tr>
 </table></div>
 <div class="note warn"><span class="tag">The single most important sentence in this section</span><p>Almost all electrical energy consumed by IT equipment ultimately becomes heat in the facility. A 100 kW IT load is, to a very close approximation, also a <strong>100 kW heat load</strong> that the cooling system (Part VII) must remove — this is exactly why IT power and cooling capacity planning are inseparable, and why Part VII and Part VIII of this reference are really two views of the same underlying energy-balance problem.</p></div>
 <p>Rack power density has been climbing sharply — many-kW-per-rack was standard a decade ago; modern AI-accelerator racks can exceed 100 kW per rack, a figure that essentially mandates liquid cooling (§7.3) since air cooling struggles well before that density.</p>
 <div class="example-box">
   <span class="tag">Worked example — annual energy from rack density</span>
   <p>A datacenter has 200 racks averaging 15 kW each, running at 85% average utilization:</p>
   <p>Total IT power = 200 × 15 = 3,000 kW</p>
   <p>E_annual = 3,000 kW × 8,760 h × 0.85 ≈ <span class="res">22,338,000 kWh/year</span> (≈22.3 GWh/year) — and, per the note above, essentially the same figure describes the annual heat load the cooling plant has to reject.</p>
 </div>
 `},

{id:'s-8-3', part:'p8', num:'8.3', title:'Datacenter Efficiency Metrics — PUE, DCiE, WUE, CUE',
 dek:'The industry-standard scorecard for how much of a facility\'s energy actually goes to computing.',
 tags:'pue dcie wue cue power usage effectiveness datacenter efficiency',
 calc:'pue',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Metric</th><th>Formula</th><th>Interpretation</th></tr>
   <tr><td><strong>PUE</strong></td><td class="mono">Total Facility Energy / IT Equipment Energy</td><td>Lower is better; ideal theoretical limit = 1.0</td></tr>
   <tr><td><strong>DCiE</strong></td><td class="mono">IT Equipment Energy / Total Facility Energy = 1/PUE</td><td>Expressed as a percentage — higher is better</td></tr>
   <tr><td>Cooling overhead</td><td>Cooling/Fan/Pump energy</td><td>The non-IT energy specifically attributable to thermal management</td></tr>
   <tr><td><strong>WUE</strong></td><td class="mono">Water consumed / IT energy</td><td>Water efficiency metric; units often L/kWh</td></tr>
   <tr><td><strong>CUE</strong></td><td class="mono">CO₂ emissions / IT energy</td><td>Carbon efficiency metric</td></tr>
 </table></div>
 <p><strong>PUE (Power Usage Effectiveness)</strong> is the industry's most-cited datacenter efficiency metric, and for good reason: it directly answers "for every watt spent on computing, how many additional watts does the facility spend supporting it?" A PUE of 1.5 means 0.5 kW of overhead (cooling, power distribution losses, lighting, etc.) for every 1 kW of IT load. State-of-the-art hyperscale facilities with aggressive free-cooling and efficient power distribution can reach PUE below 1.1; older or less-optimized facilities can sit above 2.0.</p>
 <div class="calc-mount" data-calc="pue"></div>
 <div class="note warn"><span class="tag">What PUE doesn't measure</span><p>PUE says nothing about how efficiently the IT equipment itself uses power to do useful computing — a facility can have an excellent PUE while running old, power-inefficient servers at low utilization. It's a facility-infrastructure efficiency metric, not a computing-efficiency metric; §8.4's performance-per-watt metrics fill that gap.</p></div>
 <p><strong>WUE</strong> and <strong>CUE</strong> extend the same "overhead per unit of useful IT energy" framing to water and carbon, respectively — increasingly important as datacenter water consumption (especially for evaporative cooling towers) and carbon footprint have become significant public and regulatory concerns alongside pure electrical efficiency.</p>
 `},

{id:'s-8-4', part:'p8', num:'8.4', title:'Performance per Watt &amp; Energy Metrics',
 dek:'PUE tells you about the building. This section tells you about the computing.',
 tags:'performance per watt energy delay product edp ed2p efficiency',
 body:`
 <p>Where §8.3's metrics evaluate facility overhead, this section evaluates the computing itself: how much useful work you extract per unit of energy spent, and how to weigh performance against energy when the two trade off against each other (as they very often do — higher clock speeds and larger core counts generally cost disproportionately more power for each additional unit of performance).</p>
 <div class="formula-box">
   <span class="tag">Performance-per-watt &amp; energy metrics</span>
   <div class="flist">
     <div class="f">Performance/Watt = Performance ÷ Power</div>
     <div class="f">Energy-Delay Product (EDP) = Energy × Time</div>
     <div class="f">Energy-Delay² Product (ED²P) = Energy × Time²</div>
   </div>
 </div>
 <p><strong>Performance/Watt</strong> is the most intuitive — GFLOP/s per watt, or for a full system, jobs completed per kWh — and is exactly the metric behind Green500-style rankings, which reorder the same systems that appear on raw-performance lists (like the TOP500, §10.2) by efficiency rather than absolute speed.</p>
 <p><strong>Energy-Delay Product (EDP)</strong> and its cousin <strong>ED²P</strong> exist because "minimize energy" and "minimize time" pull in opposite directions — running slower (lower voltage/frequency) often saves energy per operation but takes longer, so total energy for a fixed job doesn't necessarily improve. EDP penalizes slow-but-efficient designs by also weighting completion time; ED²P weights time even more heavily (squared), for contexts where latency matters disproportionately more than raw energy (e.g., latency-critical inference serving, where users notice slow responses far more than they notice the underlying energy bill).</p>
 <div class="example-box">
   <span class="tag">Worked example — why EDP changes the ranking</span>
   <p>Two chip configurations both need to complete the same fixed workload. Config A: 100 W, 10 s → Energy = 1,000 J. Config B (higher clock, more power): 180 W, 6 s → Energy = 1,080 J.</p>
   <p>By energy alone, A wins (1,000 J &lt; 1,080 J). But by EDP: A = 1,000 × 10 = 10,000 J·s; B = 1,080 × 6 = <span class="res">6,480 J·s</span> — B wins decisively on EDP, because it finishes so much faster that the modest energy penalty is outweighed. This is exactly the kind of ranking flip that makes choosing the right metric — not just "lower power" — matter for real procurement and system-tuning decisions.</p>
 </div>
 <div class="note tip"><span class="tag">Which metric to use when</span><p>Use raw performance/watt for facility-level capacity planning (how many jobs can this power budget support per year). Use EDP when a workload has a genuine time budget and you're comparing configurations that trade speed for power. Use ED²P specifically for latency-sensitive, interactive, or real-time workloads where slow-but-efficient is a real problem, not just an inconvenience.</p></div>
 `}
);
</script>
<script>
