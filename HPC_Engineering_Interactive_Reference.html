<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HPC Engineering Field Reference</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root{
  --navy:#0E2238;
  --navy-deep:#081726;
  --navy-line:#1B3A57;
  --paper:#F4F5EF;
  --paper-raised:#FFFFFF;
  --ink:#161A1D;
  --ink-soft:#525A60;
  --ink-faint:#828B8F;
  --thermal:#B23D17;
  --thermal-bright:#D14E22;
  --thermal-soft:#F4E1D6;
  --flow:#1B6E7F;
  --flow-bright:#238B9F;
  --flow-soft:#DCEBEC;
  --line:#DBDBD1;
  --line-strong:#C4C5B8;
  --cyan-draft:#8FE3EF;
  --amber-draft:#F0C673;
  --ok:#3C7A4E;
  --display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --sans: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  --maxw: 760px;
  --sidebar-w: 308px;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--thermal-soft); color:var(--thermal);}

a{color:var(--flow);}
button{font-family:inherit;}

/* ---------- scrollbar (subtle, technical) ---------- */
.sidebar::-webkit-scrollbar, .main::-webkit-scrollbar{width:9px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--navy-line); border-radius:0;}
.sidebar::-webkit-scrollbar-track{background:var(--navy-deep);}
.main::-webkit-scrollbar-thumb{background:var(--line-strong);}
.main::-webkit-scrollbar-track{background:var(--paper);}


/* ================= APP SHELL ================= */
.app-shell{
  display:flex;
  align-items:flex-start;
  max-width:1440px;
  margin:0 auto;
}
.sidebar{
  width:var(--sidebar-w);
  flex:0 0 auto;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  background:var(--navy-deep);
  color:#CBD9DE;
  border-right:1px solid var(--navy-line);
  z-index:20;
}
.sidebar-inner{padding:18px 16px 60px;}
.search-wrap{position:sticky; top:0; background:var(--navy-deep); padding-bottom:12px; z-index:2;}
.search-input{
  width:100%;
  background:var(--navy);
  border:1px solid var(--navy-line);
  color:#EAF3F5;
  font-family:var(--mono);
  font-size:13px;
  padding:10px 12px;
  border-radius:2px;
  outline:none;
}
.search-input::placeholder{color:#5F7986;}
.search-input:focus{border-color:var(--cyan-draft);}

.nav-home-link{
  display:block;
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.06em;
  color:#7C93A0;
  padding:10px 4px 14px;
  cursor:pointer;
  border-bottom:1px solid var(--navy-line);
  margin-bottom:10px;
}
.nav-home-link:hover{color:var(--cyan-draft);}
.nav-home-link.active{color:var(--cyan-draft);}

.nav-part{margin-bottom:2px;}
.nav-part-btn{
  width:100%;
  display:flex; align-items:center; gap:9px;
  background:none; border:none; cursor:pointer;
  padding:9px 6px;
  color:#DCE7EA;
  text-align:left;
  font-family:var(--sans);
  font-size:13.5px;
  font-weight:600;
}
.nav-part-num{
  font-family:var(--mono);
  font-size:11px;
  color:var(--navy-deep);
  background:var(--cyan-draft);
  min-width:22px; height:22px;
  display:inline-flex; align-items:center; justify-content:center;
  flex:0 0 auto;
}
.nav-part-btn:hover .nav-part-num{background:var(--amber-draft);}
.nav-part-caret{margin-left:auto; font-size:10px; color:#5F7986; transition:transform .15s;}
.nav-part.open .nav-part-caret{transform:rotate(90deg);}
.nav-topics{
  list-style:none; margin:0; padding:0 0 8px 20px;
  border-left:1px solid var(--navy-line);
  margin-left:11px;
  display:none;
}
.nav-part.open .nav-topics{display:block;}
.nav-topic{margin:0;}
.nav-topic-btn{
  width:100%;
  text-align:left;
  background:none; border:none; cursor:pointer;
  color:#94A9B1;
  font-family:var(--sans);
  font-size:13px;
  line-height:1.35;
  padding:6px 10px;
  border-left:2px solid transparent;
  margin-left:-1px;
}
.nav-topic-btn:hover{color:#EAF3F5;}
.nav-topic-btn.active{
  color:var(--cyan-draft);
  border-left-color:var(--cyan-draft);
  background:rgba(143,227,239,0.06);
  font-weight:500;
}
.nav-topic-num{font-family:var(--mono); font-size:11px; color:#5F7986; margin-right:6px;}
.nav-topic-btn.active .nav-topic-num{color:var(--cyan-draft);}
.nav-hidden{display:none !important;}

.mobile-bar{display:none;}

/* ================= MAIN CONTENT ================= */
.main{
  flex:1 1 auto;
  min-width:0;
  padding:52px 40px 120px;
}
.content-col{max-width:var(--maxw); margin:0 auto;}

.section-eyebrow{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--thermal);
  margin-bottom:10px;
  display:flex; align-items:center; gap:10px;
}
.section-eyebrow .sep{color:var(--line-strong);}
h1.section-title{
  font-family:var(--display);
  font-size:clamp(26px,3.2vw,36px);
  line-height:1.14;
  font-weight:600;
  margin:0 0 12px;
  letter-spacing:-0.01em;
}
p.section-dek{
  font-size:16.5px;
  color:var(--ink-soft);
  max-width:60ch;
  margin:0 0 30px;
  line-height:1.6;
}

.prose{font-size:15.5px; line-height:1.72;}
.prose h3{
  font-family:var(--display);
  font-size:19px;
  font-weight:600;
  margin:34px 0 12px;
  padding-top:2px;
}
.prose h4{
  font-family:var(--sans);
  font-size:14.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--ink-soft);
  margin:26px 0 10px;
}
.prose p{margin:0 0 15px;}
.prose ul, .prose ol{margin:0 0 16px; padding-left:22px;}
.prose li{margin-bottom:7px;}
.prose strong{font-weight:600; color:var(--ink);}
.prose code{
  font-family:var(--mono); font-size:0.89em;
  background:var(--thermal-soft); color:var(--thermal);
  padding:1px 5px; border-radius:2px;
}

/* ---- formula box ---- */
.formula-box{
  background:var(--navy);
  color:#EAF3F5;
  border-radius:2px;
  padding:18px 20px 16px;
  margin:18px 0 22px;
  position:relative;
  overflow-x:auto;
}
.formula-box .tag{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  color:var(--cyan-draft); text-transform:uppercase; margin-bottom:10px; display:block;
}
.formula-box .f{
  font-family:var(--mono);
  font-size:17px;
  line-height:1.8;
  white-space:nowrap;
}
.formula-box .f small{display:block; font-size:12.5px; color:#8FA6AE; white-space:normal; margin-top:6px; font-family:var(--sans);}
.formula-box .flist{display:flex; flex-direction:column; gap:6px;}

/* ---- variable key ---- */
.varkey{
  display:grid; grid-template-columns:max-content 1fr;
  gap:5px 14px; margin:14px 0 22px;
  font-size:14px;
}
.varkey dt{font-family:var(--mono); color:var(--thermal); font-weight:600;}
.varkey dd{margin:0; color:var(--ink-soft);}

/* ---- worked example ---- */
.example-box{
  border:1px solid var(--line-strong);
  border-left:3px solid var(--flow);
  background:var(--paper-raised);
  padding:16px 20px;
  margin:20px 0;
}
.example-box .tag{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  color:var(--flow); text-transform:uppercase; margin-bottom:8px; display:block; font-weight:600;
}
.example-box p{margin:0 0 10px; font-size:14.8px;}
.example-box p:last-child{margin-bottom:0;}
.example-box .res{
  font-family:var(--mono); background:var(--flow-soft); color:var(--flow);
  padding:8px 12px; display:inline-block; margin-top:4px; font-size:14.5px;
}

/* ---- note box ---- */
.note{
  padding:14px 18px; margin:20px 0; font-size:14.3px;
  border:1px dashed var(--line-strong);
  background:#FBFAF4;
  position:relative;
}
.note .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; display:block; margin-bottom:6px;}
.note.tip .tag{color:var(--flow);}
.note.warn{border-color:var(--thermal-soft); background:#FBF0EA;}
.note.warn .tag{color:var(--thermal);}
.note p{margin:0 0 8px;}
.note p:last-child{margin:0;}

/* ---- table ---- */
.tbl-wrap{overflow-x:auto; margin:18px 0 24px; border:1px solid var(--line-strong);}
table.dt{width:100%; border-collapse:collapse; font-size:13.8px; background:var(--paper-raised);}
table.dt th{
  font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  text-align:left; color:#fff; background:var(--ink); padding:9px 12px; white-space:nowrap;
}
table.dt td{padding:9px 12px; border-top:1px solid var(--line); vertical-align:top;}
table.dt tr:nth-child(even) td{background:#FAFAF5;}
table.dt td.mono, table.dt th.mono{font-family:var(--mono);}
table.dt td:first-child{font-weight:600; white-space:nowrap;}

/* ---- calculator card ---- */
.calc{
  border:1px solid var(--navy);
  margin:22px 0 26px;
  background:var(--paper-raised);
}
.calc-head{
  background:var(--navy); color:#EAF3F5;
  padding:10px 16px;
  font-family:var(--mono); font-size:11.5px; letter-spacing:.09em; text-transform:uppercase;
  display:flex; align-items:center; gap:8px;
}
.calc-head::before{content:"▸"; color:var(--cyan-draft);}
.calc-body{padding:20px;}
.calc-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:16px 22px; margin-bottom:6px;}
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:12px; font-family:var(--mono); color:var(--ink-soft); letter-spacing:.02em;}
.field input[type=number], .field select{
  font-family:var(--mono); font-size:14.5px;
  padding:8px 10px; border:1px solid var(--line-strong); border-radius:2px;
  background:var(--paper); color:var(--ink);
}
.field input[type=range]{accent-color:var(--thermal-bright); width:100%;}
.field .rangeval{font-family:var(--mono); font-size:12.5px; color:var(--thermal); font-weight:600;}
.calc-out{
  margin-top:16px; padding-top:16px; border-top:1px dashed var(--line-strong);
  display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:14px;
}
.readout{background:var(--navy); padding:12px 14px;}
.readout .rl{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#7C93A0; margin-bottom:5px;}
.readout .rv{font-family:var(--mono); font-size:20px; color:var(--cyan-draft); font-weight:600; line-height:1.15;}
.readout .ru{font-size:11px; color:#7C93A0; margin-top:2px;}
.readout.hot .rv{color:var(--amber-draft);}
.calc-verdict{
  margin-top:14px; padding:10px 14px; font-family:var(--mono); font-size:13px;
  border-left:3px solid var(--flow); background:var(--flow-soft); color:var(--flow);
}
.calc-verdict.hot{border-left-color:var(--thermal); background:var(--thermal-soft); color:var(--thermal);}

/* ---- diagram container ---- */
.diagram{
  margin:22px 0 10px; border:1px solid var(--line-strong); background:var(--paper-raised);
  padding:18px; text-align:center;
}
.diagram svg{max-width:100%; height:auto;}
.diagram-cap{
  font-family:var(--mono); font-size:12px; color:var(--ink-soft);
  text-align:center; margin:8px 0 26px;
}

/* ---- glossary ---- */
.glossary-search{
  width:100%; padding:11px 14px; font-family:var(--mono); font-size:14px;
  border:1px solid var(--line-strong); background:var(--paper-raised); margin-bottom:18px;
}
.gloss-grid{display:grid; gap:2px;}
.gloss-item{padding:12px 4px; border-bottom:1px solid var(--line);}
.gloss-term{font-family:var(--mono); font-weight:700; color:var(--thermal); font-size:14px;}
.gloss-def{color:var(--ink-soft); font-size:14px; margin-top:3px;}
.gloss-count{font-family:var(--mono); font-size:12px; color:var(--ink-faint); margin-bottom:10px;}

/* ---- bottleneck picker ---- */
.symptom-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin:18px 0;}
.symptom-btn{
  text-align:left; padding:13px 14px; border:1px solid var(--line-strong); background:var(--paper-raised);
  cursor:pointer; font-family:var(--sans); font-size:13.5px; color:var(--ink); line-height:1.4;
}
.symptom-btn:hover{border-color:var(--thermal);}
.symptom-btn.active{border-color:var(--thermal); background:var(--thermal-soft);}
.symptom-detail{display:none; margin-top:18px;}
.symptom-detail.show{display:block;}

/* ---- part overview cards (home) ---- */
.home-lede{font-size:17px; color:var(--ink-soft); max-width:64ch; margin-bottom:6px; line-height:1.65;}
.part-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; margin:32px 0;}
.part-card{
  border:1px solid var(--line-strong); background:var(--paper-raised);
  padding:18px 20px; cursor:pointer; transition:border-color .15s, transform .15s;
}
.part-card:hover{border-color:var(--thermal); transform:translateY(-2px);}
.part-card .pn{font-family:var(--mono); font-size:11px; color:var(--flow); letter-spacing:.08em; margin-bottom:8px;}
.part-card h3{font-family:var(--display); font-size:18px; margin:0 0 8px; font-weight:600;}
.part-card p{font-size:13.3px; color:var(--ink-soft); margin:0 0 10px; line-height:1.5;}
.part-card .pc{font-family:var(--mono); font-size:11.5px; color:var(--ink-faint);}

/* ---- prev/next ---- */
.pagenav{display:flex; justify-content:space-between; gap:16px; margin-top:52px; padding-top:22px; border-top:1px solid var(--line-strong);}
.pagenav a{
  flex:1; text-decoration:none; color:var(--ink);
  border:1px solid var(--line-strong); padding:14px 16px; display:block; cursor:pointer;
}
.pagenav a:hover{border-color:var(--thermal);}
.pagenav a.next{text-align:right;}
.pagenav .pl{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; color:var(--ink-faint); letter-spacing:.08em; display:block; margin-bottom:4px;}
.pagenav .pt{font-family:var(--sans); font-weight:600; font-size:14px;}

/* ---- misc ---- */
.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  padding:3px 8px; border:1px solid currentColor; margin-left:8px; vertical-align:middle;
}
.badge.interactive{color:var(--thermal);}
.badge.diagram{color:var(--flow);}
.kicker-row{display:flex; align-items:center; flex-wrap:wrap; gap:0;}

footer.app-footer{
  border-top:1px solid var(--line-strong); padding:26px 40px 60px; text-align:center;
  font-family:var(--mono); font-size:12px; color:var(--ink-faint);
}

/* ---------- responsive ---------- */
@media (max-width: 900px){
  .app-shell{display:block;}
  .sidebar{
    position:fixed; top:0; left:0; height:100vh; width:86vw; max-width:340px;
    transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 0 40px rgba(0,0,0,.35);
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(6,14,22,.55); z-index:19;}
  .sidebar-overlay.show{display:block;}
  .mobile-bar{
    display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:15;
    background:var(--paper); border-bottom:1px solid var(--line-strong); padding:12px 16px;
  }
  .mobile-bar button{
    background:var(--navy); color:#fff; border:none; padding:8px 12px; font-family:var(--mono); font-size:12px; cursor:pointer;
  }
  .mobile-bar .mb-title{font-family:var(--mono); font-size:12px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .main{padding:26px 18px 90px;}
  .calc-grid{grid-template-columns:1fr 1fr;}
  .part-grid{grid-template-columns:1fr;}
}
@media (max-width: 480px){
  .calc-grid{grid-template-columns:1fr;}
  .calc-out{grid-template-columns:1fr 1fr;}
}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

:focus-visible{outline:2px solid var(--thermal-bright); outline-offset:2px;}

/* ================= DIAGRAM KIT ================= */

/* light (content, paper bg) schematic kit */
.sch-line{stroke:#A9B0AC; stroke-width:1.3; fill:none;}
.sch-line.hot{stroke:var(--thermal); stroke-width:1.5;}
.sch-line.cold{stroke:var(--flow); stroke-width:1.5;}
.sch-line.dash{stroke-dasharray:4 3;}
.sch-node{fill:#fff; stroke:var(--navy); stroke-width:1.4;}
.sch-node.core{fill:var(--thermal-soft); stroke:var(--thermal);}
.sch-node.leaf{fill:var(--flow-soft); stroke:var(--flow);}
.sch-node.dim{fill:#F1F1EA; stroke:var(--line-strong);}
.sch-label{font-family:var(--mono); font-size:10.5px; fill:var(--ink-soft);}
.sch-label.strong{fill:var(--ink); font-weight:600;}
.sch-title{font-family:var(--mono); font-size:11px; fill:var(--ink); font-weight:600; letter-spacing:.03em;}
.sch-bar{fill:var(--flow);}
.sch-bar.hot{fill:var(--thermal);}
.sch-grid-line{stroke:#E7E7DE; stroke-width:1;}
.sch-axis{stroke:var(--ink-faint); stroke-width:1;}
.diagram.scrollx{overflow-x:auto;}
.diagram.scrollx svg{max-width:none; height:auto; display:block; margin:0 auto;}

/* ================= PRINT: full-reference output ================= */
#print-root{display:none;}
.print-btn{
  width:100%; margin-top:10px; padding:10px 12px; cursor:pointer;
  background:var(--cyan-draft); color:var(--navy-deep); border:none;
  font-family:var(--mono); font-size:12.5px; font-weight:700; letter-spacing:.02em;
}
.print-btn:hover{background:var(--amber-draft);}
.print-hint{font-family:var(--mono); font-size:11px; color:#5F7986; margin-top:6px; line-height:1.5;}

@media print{
  @page{margin:12mm;}
  html,body{background:#fff !important;}
  body{font-size:11.5pt; line-height:1.5;}
  .mobile-bar,.sidebar,.sidebar-overlay,.app-shell,footer.app-footer,.pagenav{display:none !important;}
  #print-root{display:block !important; color:#000; max-width:none;}
  #print-root a{color:#000; text-decoration:none;}
  #print-root .print-cover{margin-bottom:18px;}
  #print-root .print-cover h1{font-family:var(--display); font-size:26pt; margin:0 0 6px; line-height:1.15;}
  #print-root .print-cover .sub{color:#333; font-size:11pt; margin:0 0 12px;}
  #print-root .print-toc{columns:2; column-gap:28px; font-size:9.5pt; margin:12px 0 0;}
  #print-root .print-toc .toc-part{break-inside:avoid; margin-bottom:10px;}
  #print-root .print-toc .toc-part b{display:block; font-size:9.5pt; margin-bottom:2px;}
  #print-root .print-toc span{display:block; color:#333; line-height:1.45;}
  #print-root .print-part{page-break-before:always; border-top:3px solid #000; padding-top:14px; margin:0 0 6px;}
  #print-root .print-part:first-child{page-break-before:avoid;}
  #print-root .print-part-kicker{font-family:var(--mono); font-size:10pt; letter-spacing:.08em; color:#333;}
  #print-root .print-part-title{font-family:var(--display); font-size:20pt; margin:2px 0 4px; line-height:1.2;}
  #print-root .print-part-blurb{color:#333; font-size:10.5pt; margin:0;}
  #print-root .print-section{page-break-inside:auto; margin:0 0 22px; padding-top:10px;}
  #print-root .print-section h1.section-title{font-size:16pt;}
  #print-root .print-section .prose{font-size:10.5pt; line-height:1.55;}
  #print-root .formula-box,#print-root .example-box,#print-root .note,#print-root .calc,
  #print-root .diagram,#print-root .tbl-wrap,#print-root table.dt,#print-root .readout{page-break-inside:avoid;}
  #print-root h1,#print-root h3,#print-root h4{page-break-after:avoid;}
  /* ink-friendly overrides for dark screen components */
  #print-root .formula-box{background:#fff !important; color:#000 !important; border:1.5px solid #000;}
  #print-root .formula-box .tag,#print-root .formula-box .f,#print-root .formula-box .f small{color:#000 !important;}
  #print-root .readout{background:#F2F2F2 !important; border:1px solid #999;}

      <h3>Introduction — TIA-942-C data center infrastructure ratings</h3>
      <p><strong>ANSI/TIA-942</strong> (<em>Telecommunications Infrastructure Standard for Data Centers</em>, TIA TR-42) sets minimum requirements for data-center <strong>design and build</strong>: architecture, telecommunications/cabling, power, cooling, fire protection, physical security, safety and monitoring. Current edition <strong>TIA-942-C (2024)</strong>, incorporating the edge-data-center addendum B-1 (2022).</p>
      <div class="tbl-wrap"><table class="dt">
        <tr><th>Rating</th><th>Capacity components</th><th>Distribution paths</th><th>Outcome</th></tr>
        <tr><td><strong>Rated-1</strong> — Basic</td><td>Single</td><td>Single, non-redundant</td><td>No fault tolerance; limited physical-event protection</td></tr>
        <tr><td><strong>Rated-2</strong> — Redundant component</td><td>Redundant (N+1)</td><td>Single, non-redundant</td><td>Survives a capacity-component failure; path failure still downs IT</td></tr>

      <div class="note tip"><span class="tag">Rating applies per subsystem</span><p>A facility is rated separately for electrical, mechanical, telecommunications, and architectural/building systems — the <strong>overall rating is the lowest</strong> of the four. A Rated-4 power plant with Rated-2 cooling is a Rated-2 data center. Size HPC support systems (UPS, CRAH redundancy, dual-corded racks) against the <em>minimum</em> subsystem, not the headline.</p></div>
      <h3>Introduction — Uptime Institute Tier classification (Tier I–IV)</h3>
      <p>The <strong>Uptime Institute Tier Standard</strong> (Topology + M&amp;O) is the commercial certification most colocation SLAs cite. Tiers describe <strong>topology only</strong> — what is built — certified in three stages: <strong>TCDD</strong> (design documents), <strong>TCCF</strong> (constructed facility, demonstrated), and <strong>TCO Operational Sustainability</strong> (staffing, maintenance, operations — Gold/Silver/Bronze). A separate <strong>M&amp;O accreditation</strong> covers management and operations regardless of Tier.</p>

      <h3>Introduction — comparable ISO standards (ISO/IEC 22237, EN 50600 &amp; equivalents)</h3>
      <p>Outside North America you will more often be asked for <strong>ISO/IEC 22237</strong> (international, via JTC 1/SC 39) or <strong>EN 50600</strong> (European) instead of — or alongside — TIA-942. Seven ISO parts mirror EN 50600; grading uses <strong>Availability Classes (AC 1–4)</strong> per discipline plus <strong>Protection Classes (PC 1–4)</strong> and metering <strong>Granularity Levels (GL 1–3)</strong>.</p>

      </table></div>
      <div class="tbl-wrap"><table class="dt">
        <tr><th>Class system</th><th>What it grades</th><th>Levels</th></tr>

        <tr><td>Nature</td><td>Prescriptive minimum + ratings</td><td>Requirements per subsystem + classes</td><td>Best-practice guide (~550 pp.)</td><td>Commercial topology + M&amp;O cert.</td></tr>

        <tr><td>Best cited when</td><td>US/global build spec</td><td>EU tender / multinational policy</td><td>Design-detail reference</td><td>Colo SLA assurance</td></tr>
      </table></div>
      <div class="note warn"><span class="tag">No official crosswalk</span><p>There is no normative "Rated-3 = AC3 = Tier III" equivalence — the grades rhyme (basic → redundant → maintainable → fault-tolerant) but differ in definitions. Never write "or equivalent" without naming scheme and edition, e.g. "TIA-942-C Rated-3 Facility <em>or</em> EN 50600 AC3". TIA-942 also rates the as-designed/as-built infrastructure, not operations — pair with an operations program for staffing, MOPs/SOPs and maintenance windows.</p></div>
      <div class="note tip"><span class="tag">What this means for an HPC site</span><p>Leadership-class machines (TOP500 top 50, exascale) almost always sit in Rated-3+/Tier III+ envelopes: a 20–40 MW Linpack run (§8.2) cannot afford a maintenance shutdown mid-campaign, and concurrent maintainability of UPS trains, CRAH rows, and CDU loops is what keeps campaigns alive. When scoping a new hall, translate availability into power/cooling requirements first — dual paths and N+1 cooling (§7.2–7.4) — then certify the envelope; and demand GL3 metering so the PUE you report (§8.3) is measured, not modeled.</p></div>
    </div>
    <div class="part-grid">
      ${PARTS.map(p=>{
        const secs = SECTIONS.filter(s=>s.part===p.id);
        return `<div class="part-card" onclick="showSection('${secs[0]? secs[0].id : ''}')">
          <div class="pn">PART ${p.num} · ${String(secs.length).padStart(2,'0')} SECTIONS</div>

          <p>${p.blurb}</p>

        </div>`;
      }).join('')}

    <div class="note tip">
      <span class="tag">How this reference is organized</span>
      <p>Every section keeps the original formula intact, then adds: what the terms mean, why the formula matters in practice, a worked example with realistic numbers, and — for the ${SECTIONS.filter(s=>s.calc).length} sections marked <span class="badge interactive">interactive</span> — a calculator you can drive with your own numbers. Sections marked <span class="badge diagram">diagram</span> include an original schematic.</p>
      <p>Values pulled from vendor generations (core counts, clock speeds, link rates) are <strong>representative</strong>, as the source document notes — always confirm against the current datasheet for procurement or capacity planning.</p>
    </div>
  `;
  $('content').innerHTML = html;
  window.scrollTo(0,0);
  setActiveNav(null);
  closeMobileSidebar();
}

function showSection(id, opts){
  opts = opts || {};
  const idx = sectionIndex(id);
  if(idx === -1){ renderHome(); return; }
  const s = SECTIONS[idx];
  currentId = id;
  const part = PARTS.find(p=>p.id===s.part);
  document.title = s.num + ' ' + s.title + ' — HPC Reference';
  $('mobileTitle').textContent = s.num + ' ' + s.title;

  const prev = SECTIONS[idx-1];
  const next = SECTIONS[idx+1];

  let badges = '';
  if(s.calc) badges += '<span class="badge interactive">Interactive</span>';
  if(s.diagrams && s.diagrams.length) badges += '<span class="badge diagram">Diagram</span>';

  const html = `
    <div class="section-eyebrow kicker-row">PART ${part.num} · ${part.title}<span class="sep">&nbsp;/&nbsp;§${s.num}&nbsp;</span>${badges}</div>
    <h1 class="section-title">${s.title}</h1>
    ${s.dek ? `<p class="section-dek">${s.dek}</p>` : ''}
    <div class="prose">${s.body}</div>
    <div class="pagenav">
      ${prev ? `<a onclick="showSection('${prev.id}')"><span class="pl">← §${prev.num}</span><span class="pt">${prev.title}</span></a>` : '<span></span>'}
      ${next ? `<a class="next" onclick="showSection('${next.id}')"><span class="pl">§${next.num} →</span><span class="pt">${next.title}</span></a>` : '<span></span>'}
    </div>
  `;
  $('content').innerHTML = html;
  mountWidgets(s);
  setActiveNav(id);
  if(location.hash !== '#'+id) history.replaceState(null,'','#'+id);
  closeMobileSidebar();
}

function goHome(){
  history.replaceState(null,'','#home');
  renderHome();
}

function mountWidgets(s){
  // NOTE: scoped to #content so the static copies inside #print-root are never
  // re-mounted (their duplicate global IDs would otherwise hijack lookups).
  document.querySelectorAll('#content .calc-mount').forEach(el=>{
    const key = el.getAttribute('data-calc');
    if(CALCS[key]) { try{ CALCS[key](el); }catch(e){ console.error('calc mount failed:',key,e); el.innerHTML='<div class="calc-body">Calculator failed to load.</div>'; } }
    else { console.warn('missing calc:',key); }
  });
  document.querySelectorAll('#content .diagram-mount').forEach(el=>{
    const key = el.getAttribute('data-diagram');
    if(DIAGRAMS[key]) { try{ el.innerHTML = DIAGRAMS[key](); }catch(e){ console.error('diagram failed:',key,e); } }
    else { console.warn('missing diagram:',key); }
  });
  if(typeof mountGlossaryIfPresent === 'function'){ try{ mountGlossaryIfPresent(); }catch(e){ console.error('glossary mount failed:',e); } }
}

/* =====================================================================
   SIDEBAR NAV
   ===================================================================== */
function buildNav(){
  const tree = $('navTree');
  tree.innerHTML = PARTS.map(p=>{
    const secs = SECTIONS.filter(s=>s.part===p.id);
    return `<div class="nav-part" data-part="${p.id}">
      <button class="nav-part-btn" onclick="togglePart('${p.id}')">
        <span class="nav-part-num">${p.num}</span>
        <span>${p.title}</span>
        <span class="nav-part-caret">▸</span>
      </button>
      <ul class="nav-topics">
        ${secs.map(s=>`<li class="nav-topic" data-id="${s.id}" data-search="${(s.title+' '+(s.tags||'')+' '+s.num).toLowerCase().replace(/"/g,'')}">
          <button class="nav-topic-btn" onclick="showSection('${s.id}')" data-id="${s.id}">
            <span class="nav-topic-num">${s.num}</span>${s.title}
          </button>
        </li>`).join('')}
      </ul>
    </div>`;
  }).join('');
}
function togglePart(id, force){
  const el = document.querySelector(`.nav-part[data-part="${id}"]`);
  if(!el) return;
  if(force==='open') el.classList.add('open');
  else if(force==='close') el.classList.remove('open');
  else el.classList.toggle('open');
}
function setActiveNav(id){
  document.querySelectorAll('.nav-topic-btn').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  $('navHome').classList.toggle('active', id===null);
  if(id){
    const s = SECTIONS.find(x=>x.id===id);
    if(s) togglePart(s.part,'open');
  }
}

/* ---------------------------------------------------------------------
   Search / filter
   --------------------------------------------------------------------- */
function initSearch(){
  $('searchInput').addEventListener('input', (e)=>{
    const q = e.target.value.trim().toLowerCase();
    const topics = document.querySelectorAll('.nav-topic');
    if(!q){
      topics.forEach(t=>t.classList.remove('nav-hidden'));
      document.querySelectorAll('.nav-part').forEach(p=>p.classList.remove('nav-hidden'));
      return;
    }
    document.querySelectorAll('.nav-part').forEach(partEl=>{
      let anyVisible = false;
      partEl.querySelectorAll('.nav-topic').forEach(t=>{
        const hit = t.getAttribute('data-search').includes(q);
        t.classList.toggle('nav-hidden', !hit);
        if(hit) anyVisible = true;
      });
      partEl.classList.toggle('nav-hidden', !anyVisible);
      if(anyVisible) togglePart(partEl.getAttribute('data-part'),'open');
    });
  });
}

/* ---------------------------------------------------------------------
   Mobile sidebar
   --------------------------------------------------------------------- */
function openMobileSidebar(){ $('sidebar').classList.add('open'); $('sidebarOverlay').classList.add('show'); }
function closeMobileSidebar(){ if(window.innerWidth<=900){ $('sidebar').classList.remove('open'); $('sidebarOverlay').classList.remove('show'); } }
function initMobileNav(){
  on('mobileNavBtn','click', openMobileSidebar);
  on('sidebarOverlay','click', closeMobileSidebar);
}

/* ---------------------------------------------------------------------
   Print — full reference (all sections) via #print-root
   Why: screen shows ONE section in #content, so Ctrl+P only prints that.
   This builds a static snapshot of EVERY section for @media print.
   --------------------------------------------------------------------- */
let printBuilt = false;
let printBuilding = false;

function printUniquifyIds(html, suffix){
  return html.replace(/\sid="([^"]+)"/g, ' id="$1-' + suffix + '"');
}
function printFreezeInputs(root){
  root.querySelectorAll('input').forEach(el=>{
    if(el.type==='checkbox' || el.type==='radio'){
      if(el.checked) el.setAttribute('checked',''); else el.removeAttribute('checked');
    } else {
      el.setAttribute('value', el.value);
    }
  });
  root.querySelectorAll('select').forEach(sel=>{
    Array.from(sel.options).forEach(o=>{ if(o.selected) o.setAttribute('selected',''); else o.removeAttribute('selected'); });
  });
  root.querySelectorAll('textarea').forEach(ta=>{ ta.textContent = ta.value; });
}
function printExpandInteractive(root, s){
  root.querySelectorAll('.symptom-detail').forEach(d=>d.classList.add('show'));
  // Bottleneck picker (§12.1): static snapshot has empty detail until clicked — expand ALL causes for print.
  try{
    if(s && s.calc==='bottleneck' && typeof SYMPTOMS!=='undefined'){
      const d = root.querySelector('.symptom-detail');
      if(d) d.innerHTML = SYMPTOMS.map(x=>`<div class="example-box"><span class="tag">${x.t}</span><p><strong>${x.cause}</strong></p><p>${x.detail}</p></div>`).join('');
    }
  }catch(e){}
}

function buildPrintDocument(){
  if(printBuilding) return;
  const contentEl = $('content');
  const printRoot = $('print-root');
  if(!contentEl || !printRoot) return;
  if(typeof SECTIONS==='undefined' || !SECTIONS.length) return;
  printBuilding = true;
  try{
    const savedId = currentId;
    const savedHash = location.hash;
    const savedHtml = contentEl.innerHTML;
    const savedY = window.scrollY;
    const today = new Date().toISOString().slice(0,10);

    let out = `<div class="print-cover">`
      + `<h1>HPC Engineering Field Reference — Full Print</h1>`
      + `<p class="sub">Complete reference · ${SECTIONS.length} sections · ${PARTS.length} parts · printed ${today} · values are representative, not vendor-exact specifications.</p>`
      + `<div class="print-toc">`
      + PARTS.map(p=>{
          const secs = SECTIONS.filter(x=>x.part===p.id);
          return `<div class="toc-part"><b>Part ${p.num} — ${p.title}</b>`
            + secs.map(x=>`<span>§${x.num} ${x.title}</span>`).join('') + `</div>`;
        }).join('')
      + `</div></div>`;

    let lastPart = null;
    SECTIONS.forEach((s, idx)=>{
      const part = PARTS.find(p=>p.id===s.part);
      if(part && part.id!==lastPart){
        lastPart = part.id;
        out += `<div class="print-part"><div class="print-part-kicker">PART ${part.num}</div>`
          + `<h1 class="print-part-title">${part.title}</h1>`
          + `<p class="print-part-blurb">${part.blurb}</p></div>`;
      }
      // Render this section in the live #content sandbox so existing
      // CALCS/DIAGRAMS/glossary mount code runs unchanged (it uses global IDs,
      // so only one section can be mounted at a time — hence the loop).
      contentEl.innerHTML =
        `<div class="section-eyebrow">PART ${part.num} · ${part.title}<span class="sep">&nbsp;/&nbsp;§${s.num}</span></div>`
        + `<h1 class="section-title">${s.title}</h1>`
        + (s.dek ? `<p class="section-dek">${s.dek}</p>` : '')
        + `<div class="prose">${s.body}</div>`;
      mountWidgets(s);
      printExpandInteractive(contentEl, s);
      printFreezeInputs(contentEl);
      out += `<section class="print-section">` + printUniquifyIds(contentEl.innerHTML, 'p'+idx) + `</section>`;
    });

    printRoot.innerHTML = out;

    // Restore the interactive screen view exactly as it was.
    contentEl.innerHTML = savedHtml;
    if(savedId && sectionIndex(savedId)!==-1){ showSection(savedId); }
    else { renderHome(); }
    if(savedHash) history.replaceState(null,'',savedHash);
    window.scrollTo(0, savedY);
    printBuilt = true;
  }finally{
    printBuilding = false;
  }
}

function printFullReference(){
  try{ buildPrintDocument(); }
  catch(e){ console.error('print build failed:', e); }
  setTimeout(()=>window.print(), 60);
}

window.addEventListener('beforeprint', ()=>{ if(!printBuilt){ try{ buildPrintDocument(); }catch(e){ console.error(e); } } });

/* ---------------------------------------------------------------------
   Boot
   --------------------------------------------------------------------- */
function boot(){
  buildNav();
  initSearch();
  initMobileNav();
  window.addEventListener('hashchange', route);
  route();
  // Pre-build print snapshot when idle so Ctrl+P prints everything instantly.
  const idleBuild = ()=>{ try{ if(!printBuilt) buildPrintDocument(); }catch(e){} };
  if('requestIdleCallback' in window) requestIdleCallback(idleBuild, {timeout:8000});
  else setTimeout(idleBuild, 2500);
}
function route(){
  const h = location.hash.replace('#','');
  if(!h || h==='home'){ renderHome(); return; }
  if(sectionIndex(h) !== -1){ showSection(h,{noScroll:false}); }
  else { renderHome(); }
}
document.addEventListener('DOMContentLoaded', boot);
</script>
<script>
/* =====================================================================
   DIAGRAMS — original SVG schematics (light "content" kit unless noted)
   ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
function svgOpen(w,h,extra){ return `<svg viewBox="0 0 ${w} ${h}" ${extra||''} xmlns="${NS}">`; }

/* ---------------- FAT-TREE / CLOS (3-tier) ---------------- */
DIAGRAMS_REGISTRY_fattree = function(){
  const core=[[270,34],[410,34]];
  const agg=[[110,124],[250,124],[430,124],[570,124]];
  const edge=[[110,214],[250,214],[430,214],[570,214]];
  const servers=[]; edge.forEach(e=>{servers.push([e[0]-22,286]);servers.push([e[0]+22,286]);});
  let L='';
  core.forEach(c=>agg.forEach(a=>{L+=`<path class="sch-line" d="M${c[0]},${c[1]+11} L${a[0]},${a[1]-9}"/>`;}));
  // pods: agg[0,1] <-> edge[0,1]  |  agg[2,3] <-> edge[2,3]
  [[0,1],[2,3]].forEach(pod=>{
    pod.forEach(ai=>pod.forEach(ei=>{
      L+=`<path class="sch-line" d="M${agg[ai][0]},${agg[ai][1]+9} L${edge[ei][0]},${edge[ei][1]-9}"/>`;
    }));
  });
  edge.forEach((e,i)=>{
    L+=`<path class="sch-line" d="M${e[0]},${e[1]+9} L${servers[i*2][0]},${servers[i*2][1]-6}"/>`;
    L+=`<path class="sch-line" d="M${e[0]},${e[1]+9} L${servers[i*2+1][0]},${servers[i*2+1][1]-6}"/>`;
  });
  let N = core.map(c=>`<rect class="sch-node core" x="${c[0]-16}" y="${c[1]-11}" width="32" height="22"/>`).join('')
    + agg.map(a=>`<rect class="sch-node" x="${a[0]-14}" y="${a[1]-9}" width="28" height="18"/>`).join('')
    + edge.map(e=>`<rect class="sch-node" x="${e[0]-14}" y="${e[1]-9}" width="28" height="18"/>`).join('')
    + servers.map(s=>`<circle class="sch-node leaf" cx="${s[0]}" cy="${s[1]}" r="6"/>`).join('');
  let T = `<text class="sch-label" x="30" y="38">core /</text><text class="sch-label" x="30" y="49">spine</text>
    <text class="sch-label" x="18" y="128">aggregation</text>
    <text class="sch-label" x="36" y="218">edge / ToR</text>
    <text class="sch-label" x="10" y="290">hosts</text>
    <text class="sch-label" x="180" y="308" text-anchor="middle">pod A</text>
    <text class="sch-label" x="500" y="308" text-anchor="middle">pod B</text>`;
  return svgOpen(680,320) + L + N + T + '</svg>';
};

/* ---------------- LEAF-SPINE (2-tier Clos) ---------------- */
DIAGRAMS_REGISTRY_leafspine = function(){
  const spine=[[170,44],[340,44],[510,44]];
  const leaf=[[105,150],[275,150],[445,150],[615,150]];
  const servers=[]; leaf.forEach(l=>{servers.push([l[0]-20,224]);servers.push([l[0]+20,224]);});
  let L='';
  spine.forEach(s=>leaf.forEach(l=>{L+=`<path class="sch-line" d="M${s[0]},${s[1]+11} L${l[0]},${l[1]-9}"/>`;}));
  leaf.forEach((e,i)=>{
    L+=`<path class="sch-line" d="M${e[0]},${e[1]+9} L${servers[i*2][0]},${servers[i*2][1]-6}"/>`;
    L+=`<path class="sch-line" d="M${e[0]},${e[1]+9} L${servers[i*2+1][0]},${servers[i*2+1][1]-6}"/>`;
  });
  let N = spine.map(s=>`<rect class="sch-node core" x="${s[0]-16}" y="${s[1]-11}" width="32" height="22"/>`).join('')
    + leaf.map(l=>`<rect class="sch-node" x="${l[0]-14}" y="${l[1]-9}" width="28" height="18"/>`).join('')
    + servers.map(s=>`<circle class="sch-node leaf" cx="${s[0]}" cy="${s[1]}" r="6"/>`).join('');
  let T = `<text class="sch-label" x="20" y="30">spine</text><text class="sch-label" x="20" y="140">leaf</text><text class="sch-label" x="20" y="205">hosts</text>
  <text class="sch-label" x="590" y="30">every leaf reaches</text><text class="sch-label" x="590" y="41">every spine (ECMP)</text>`;
  return svgOpen(680,236) + L + N + T + '</svg>';
};

/* ---------------- DRAGONFLY ---------------- */
DIAGRAMS_REGISTRY_dragonfly = function(){
  function group(cx,cy,rot){
    const r=34;
    const pts=[0,120,240].map(a=>{const rad=(a+rot)*Math.PI/180; return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)];});
    return pts;
  }
  const A = group(150,90,-90), B = group(530,90,-90), C = group(340,300,-90);
  function localLinks(g){
    return `<path class="sch-line" d="M${g[0]}L${g[1]}"/><path class="sch-line" d="M${g[1]}L${g[2]}"/><path class="sch-line" d="M${g[2]}L${g[0]}"/>`
      .replace(/M(-?\d[\d.]*),(-?\d[\d.]*)L/g,'M$1,$2 L'); // no-op safe formatting
  }
  function pathBetween(p1,p2,cls){ return `<path class="sch-line ${cls||''}" d="M${p1[0]},${p1[1]} L${p2[0]},${p2[1]}"/>`; }
  let L = '';
  [A,B,C].forEach(g=>{
    L += pathBetween(g[0],g[1]); L += pathBetween(g[1],g[2]); L += pathBetween(g[2],g[0]);
  });
  // global links (dashed, cold): A1-B1, B2-C1, C2-A2
  L += pathBetween(A[1],B[1],'cold dash');
  L += pathBetween(B[2],C[1],'cold dash');
  L += pathBetween(C[2],A[2],'cold dash');
  function nodes(g,label){
    return g.map((p,i)=>`<circle class="sch-node" cx="${p[0]}" cy="${p[1]}" r="9"/><text class="sch-label" x="${p[0]}" y="${p[1]+3}" text-anchor="middle" font-size="8">${label}${i+1}</text>`).join('');
  }
  let N = nodes(A,'A') + nodes(B,'B') + nodes(C,'C');
  let T = `<text class="sch-title" x="150" y="34" text-anchor="middle">GROUP A</text>
    <text class="sch-title" x="530" y="34" text-anchor="middle">GROUP B</text>
    <text class="sch-title" x="340" y="356" text-anchor="middle">GROUP C</text>
    <text class="sch-label" x="340" y="18" text-anchor="middle">solid = local links within a group · dashed = global links between groups</text>`;
  return svgOpen(680,380) + T + L + N + '</svg>';
};

/* ---------------- TORUS (2D 4x4, wraparound) ---------------- */
DIAGRAMS_REGISTRY_torus = function(){
  const cols=4,rows=4,x0=110,y0=60,dx=150,dy=68;
  const pos=(c,r)=>[x0+c*dx, y0+r*dy];
  let L='',N='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const p=pos(c,r);
    if(c<cols-1){const p2=pos(c+1,r); L+=`<path class="sch-line" d="M${p[0]},${p[1]} L${p2[0]},${p2[1]}"/>`;}
    if(r<rows-1){const p2=pos(c,r+1); L+=`<path class="sch-line" d="M${p[0]},${p[1]} L${p2[0]},${p2[1]}"/>`;}
    N+=`<circle class="sch-node" cx="${p[0]}" cy="${p[1]}" r="8"/>`;
  }
  // wraparound (row) curves: last col -> first col, arc below
  for(let r=0;r<rows;r++){
    const pL=pos(cols-1,r), pR=pos(0,r);
    const midY = pL[1]+40;
    L+=`<path class="sch-line dash cold" d="M${pL[0]},${pL[1]} C ${pL[0]+40},${midY} ${pR[0]-40},${midY} ${pR[0]},${pR[1]}"/>`;
  }
  // wraparound (col) curves: last row -> first row, arc to the right
  for(let c=0;c<cols;c++){
    const pT=pos(c,0), pB=pos(c,rows-1);
    const midX = pT[0]+ (c===cols-1? 60:34);
    L+=`<path class="sch-line dash cold" d="M${pB[0]},${pB[1]} C ${midX+40},${pB[1]+16} ${midX+40},${pT[1]-16} ${pT[0]},${pT[1]}"/>`;
  }
  let T=`<text class="sch-label" x="340" y="24" text-anchor="middle">solid = direct neighbor link · dashed teal = wrap-around link</text>`;
  return svgOpen(680,380) + L + N + T + '</svg>';
};

/* ---------------- MESH (2D 4x4, no wraparound) ---------------- */
DIAGRAMS_REGISTRY_mesh = function(){
  const cols=4,rows=4,x0=110,y0=60,dx=150,dy=68;
  const pos=(c,r)=>[x0+c*dx, y0+r*dy];
  let L='',N='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const p=pos(c,r);
    if(c<cols-1){const p2=pos(c+1,r); L+=`<path class="sch-line" d="M${p[0]},${p[1]} L${p2[0]},${p2[1]}"/>`;}
    if(r<rows-1){const p2=pos(c,r+1); L+=`<path class="sch-line" d="M${p[0]},${p[1]} L${p2[0]},${p2[1]}"/>`;}
    const edge = (r===0||r===rows-1||c===0||c===cols-1);

/* ---------------- TIMELINES ---------------- */
function timelineRow(items, y, colorClass){
  // items: [{x,label,sub}], alternating label offset
  let s='';
  s+=`<path class="sch-line" d="M${items[0].x},${y} L${items[items.length-1].x},${y}"/>`;
  items.forEach((it,i)=>{
    const up = i%2===0;
    const ly = up? y-16 : y+26;
    s+=`<circle class="sch-node ${colorClass}" cx="${it.x}" cy="${y}" r="6"/>`;
    s+=`<line class="sch-line" x1="${it.x}" y1="${y}" x2="${it.x}" y2="${up?y-8:y+8}"/>`;
    s+=`<text class="sch-label strong" x="${it.x}" y="${ly}" text-anchor="middle" font-size="10.5">${it.label}</text>`;
    if(it.sub) s+=`<text class="sch-label" x="${it.x}" y="${ly+(up?13:13)}" text-anchor="middle" font-size="9">${it.sub}</text>`;
  });
  return s;
}

<script>

/* ---------------- 1. CPU PEAK FP64 FLOP/s ---------------- */
function mountCpuflops(el){
  el.innerHTML = `
    <div class="calc-head">Calculator — CPU peak FP64 throughput</div>
    <div class="calc-body">
      <div class="calc-grid">
        <div class="field"><label>Cores per socket</label><input type="number" id="cf_cores" value="64" min="1"></div>
        <div class="field"><label>Sockets</label><input type="number" id="cf_sockets" value="2" min="1"></div>
        <div class="field"><label>Clock (GHz, all-core)</label><input type="number" id="cf_clock" value="2.4" step="0.1" min="0.1"></div>
        <div class="field"><label>Vector width</label>
          <select id="cf_width"><option value="128">128-bit (SSE)</option><option value="256">256-bit (AVX2)</option><option value="512" selected>512-bit (AVX-512)</option></select>
        </div>
        <div class="field"><label>FMA (fused multiply-add)</label>
          <select id="cf_fma"><option value="2" selected>Yes — 2 FLOPs/element</option><option value="1">No — 1 FLOP/element</option></select>
        </div>
        <div class="field"><label>FP64 execution units / core</label><input type="number" id="cf_units" value="1" min="1"></div>
      </div>
      <div class="calc-out" id="cf_out"></div>
      <div class="calc-verdict" id="cf_note"></div>
    </div>`;
  function calc(){
    const cores = parseFloat($('cf_cores').value)||0;
    const sockets = parseFloat($('cf_sockets').value)||0;
    const clock = (parseFloat($('cf_clock').value)||0) * 1e9;
    const width = parseFloat($('cf_width').value)||512;
    const fma = parseFloat($('cf_fma').value)||2;
    const units = parseFloat($('cf_units').value)||1;
    const lanes = width/64;
    const totalCores = cores*sockets;
    const flopsPerCycle = lanes*fma*units;
    const peak = totalCores*clock*flopsPerCycle;
    $('cf_out').innerHTML = `
      <div class="readout"><div class="rl">FP64 lanes / instr.</div><div class="rv">${fmt(lanes,0)}</div><div class="ru">values per 64-bit vector op</div></div>
      <div class="readout"><div class="rl">FLOPs / core / cycle</div><div class="rv">${fmt(flopsPerCycle,0)}</div><div class="ru">lanes × FMA × units</div></div>
      <div class="readout hot"><div class="rl">Peak FP64 performance</div><div class="rv">${fmt(peak/1e12,2)}</div><div class="ru">TFLOP/s (${fmt(peak/1e9,1)} GFLOP/s) across ${fmt(totalCores,0)} cores</div></div>
    `;
    $('cf_note').innerHTML = `Rpeak ≈ ${fmt(totalCores,0)} cores × ${fmt(clock/1e9,2)} GHz × ${fmt(lanes,0)} lanes × ${fma} (FMA) × ${units} unit(s) = <strong>${fmt(peak/1e12,2)} TFLOP/s</strong>. Real sustained performance is normally lower once AVX-offset downclocking, memory stalls and non-FMA instructions are accounted for.`;
  }
  el.querySelectorAll('input,select').forEach(i=>i.addEventListener('input',calc));
  calc();
}

/* ---------------- 2. AMDAHL & GUSTAFSON ---------------- */
function mountAmdahl(el){
  el.innerHTML = `
    <div class="calc-head">Calculator — Amdahl's Law vs. Gustafson's Law</div>
    <div class="calc-body">
      <div class="calc-grid">
        <div class="field"><label>Parallel fraction f — <span class="rangeval" id="am_fval">0.90</span></label>
          <input type="range" id="am_f" min="0" max="0.999" step="0.001" value="0.90"></div>
        <div class="field"><label>Processors P — <span class="rangeval" id="am_pval">64</span></label>
          <input type="range" id="am_p" min="0" max="10" step="0.05" value="6"></div>
      </div>
      <div id="am_chart" style="margin:14px 0 4px;"></div>
      <div class="calc-out" id="am_out"></div>
      <div class="calc-verdict" id="am_note"></div>
    </div>`;
  function P(){ return Math.round(Math.pow(2, parseFloat($('am_p').value))); }
  function chart(f,curP){
    const Ps=[1,2,4,8,16,32,64,128,256,512,1024];
    const amdahl = p => 1/((1-f)+f/p);
    const gustaf = p => p - (1-f)*(p-1);
    const maxY = Math.max(amdahl(1024), gustaf(1024), 20);
    const W=660,H=220,padL=46,padB=28,padT=14,padR=14;
    const xw=W-padL-padR, yh=H-padT-padB;
    const xPos = p => padL + (Math.log2(p)/10)*xw;
    const yPos = v => padT + yh - (Math.min(v,maxY)/maxY)*yh;
    function pathFor(fn){ return Ps.map((p,i)=> (i===0?'M':'L')+xPos(p).toFixed(1)+','+yPos(fn(p)).toFixed(1)).join(' '); }
    let grid=''; [0.25,0.5,0.75,1].forEach(t=>{ const y=padT+yh-(t*yh); grid+=`<line class="sch-grid-line" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/><text class="sch-label" x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9">${fmt(t*maxY,0)}</text>`; });
    let xticks=''; [1,4,16,64,256,1024].forEach(p=>{ xticks+=`<text class="sch-label" x="${xPos(p)}" y="${H-8}" text-anchor="middle" font-size="9">${p}</text>`; });
    $('am_chart').innerHTML = svgOpen(W,H) +
      grid + xticks +
      `<path class="sch-line cold" stroke-width="2" fill="none" d="${pathFor(gustaf)}"/>`+
      `<path class="sch-line hot" stroke-width="2" fill="none" d="${pathFor(amdahl)}"/>`+
      `<circle cx="${xPos(curP)}" cy="${yPos(Math.min(amdahl(curP),maxY))}" r="4.5" fill="var(--thermal)"/>`+
      `<text class="sch-label" x="${W-160}" y="20" font-size="10"><tspan fill="var(--thermal)">■</tspan> Amdahl (fixed size)</text>`+
      `<text class="sch-label" x="${W-160}" y="34" font-size="10"><tspan fill="var(--flow)">■</tspan> Gustafson (scaled size)</text>`+
      `<text class="sch-label" x="${padL}" y="${H-1}" font-size="9">processors P (log₂ scale)</text>`+
      '</svg>';
  }
  function calc(){
    const f = parseFloat($('am_f').value);
    const p = P();
    $('am_fval').textContent = f.toFixed(3);
    $('am_pval').textContent = p;
    const sA = 1/((1-f)+f/p);
    const eA = sA/p;
    const sInf = 1/(1-f);
    const sG = p - (1-f)*(p-1);
    $('am_out').innerHTML = `
      <div class="readout"><div class="rl">Amdahl speedup S(P)</div><div class="rv">${fmt(sA,2)}×</div><div class="ru">fixed-size problem</div></div>
      <div class="readout"><div class="rl">Parallel efficiency</div><div class="rv">${fmt(eA*100,1)}%</div><div class="ru">S(P)/P</div></div>
      <div class="readout hot"><div class="rl">Amdahl ceiling S∞</div><div class="rv">${fmt(sInf,1)}×</div><div class="ru">limit as P→∞, fixed by (1−f)</div></div>
      <div class="readout"><div class="rl">Gustafson speedup</div><div class="rv">${fmt(sG,2)}×</div><div class="ru">scaled-size problem</div></div>
    `;
    $('am_note').innerHTML = f>0.98
      ? `At f = ${f.toFixed(3)}, the serial 1−f = ${(100*(1-f)).toFixed(1)}% still caps Amdahl speedup at ${fmt(sInf,1)}×, however many processors you add. Gustafson's model avoids that ceiling because it lets the problem grow with P instead of holding it fixed.`
      : `The serial fraction (1−f = ${(100*(1-f)).toFixed(1)}%) is the whole story for Amdahl's ceiling — no amount of extra hardware buys past S∞ = ${fmt(sInf,1)}×. This is why reducing serial/communication time usually beats adding processors once efficiency drops.`;
    chart(f,p);
  }
  el.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));
  calc();
}

        <div class="field"><label>Peak memory bandwidth (GB/s)</label><input type="number" id="rl_bw" value="2000" step="10" min="1"></div>
        <div class="field"><label>Kernel arithmetic intensity (FLOP/Byte)</label><input type="number" id="rl_ai" value="4" step="0.1" min="0.001"></div>
      </div>
      <div id="rl_chart" style="margin:14px 0 4px;"></div>
      <div class="calc-out" id="rl_out"></div>
      <div class="calc-verdict" id="rl_note"></div>
    </div>`;
  function calc(){
    const peak = (parseFloat($('rl_peak').value)||0)*1e12;
    const bw = (parseFloat($('rl_bw').value)||0)*1e9;
    const ai = parseFloat($('rl_ai').value)||0.001;
    const aiStar = peak/bw;
    const attain = Math.min(peak, bw*ai);
    const boundBy = ai < aiStar ? 'memory bandwidth' : 'peak compute';
    $('rl_out').innerHTML = `
      <div class="readout"><div class="rl">Machine balance AI*</div><div class="rv">${fmt(aiStar,2)}</div><div class="ru">FLOP/Byte — the crossover point</div></div>
      <div class="readout hot"><div class="rl">Attainable performance</div><div class="rv">${fmt(attain/1e12,2)}</div><div class="ru">TFLOP/s for this kernel</div></div>
      <div class="readout"><div class="rl">Headroom vs. peak</div><div class="rv">${fmt(100*attain/peak,1)}%</div><div class="ru">of theoretical compute peak</div></div>
    `;
    const cls = ai<aiStar ? 'hot':'';
    $('rl_note').className = 'calc-verdict'+(ai<aiStar?' hot':'');
    $('rl_note').innerHTML = ai<aiStar
      ? `AI (${fmt(ai,2)}) &lt; AI* (${fmt(aiStar,2)}) → this kernel is <strong>memory-bandwidth bound</strong>. Reduce bytes moved, improve locality/reuse, or use faster memory before chasing more FLOPs.`
      : `AI (${fmt(ai,2)}) ≥ AI* (${fmt(aiStar,2)}) → this kernel is <strong>compute bound</strong>. Improve vectorization, instruction mix, or occupancy — more memory bandwidth won't help much here.`;
    // log-log chart
    const W=660,H=260,padL=52,padB=30,padT=16,padR=16;
    const xw=W-padL-padR, yh=H-padT-padB;
    const xMin=0.01, xMax=1000, yMin=peak/2000, yMax=peak*3;
    const xPos = v => padL + (Math.log10(v/xMin)/Math.log10(xMax/xMin))*xw;
    const yPos = v => padT + yh - (Math.log10(Math.max(v,yMin)/yMin)/Math.log10(yMax/yMin))*yh;
    const memAI = Math.min(xMax, aiStar);
    const memPath = `M${xPos(xMin).toFixed(1)},${yPos(bw*xMin).toFixed(1)} L${xPos(memAI).toFixed(1)},${yPos(bw*memAI).toFixed(1)}`;
    const compPath = `M${xPos(memAI).toFixed(1)},${yPos(peak).toFixed(1)} L${xPos(xMax).toFixed(1)},${yPos(peak).toFixed(1)}`;
    let grid=''; for(let e=-2;e<=3;e++){ const x=xPos(Math.pow(10,e)); grid+=`<line class="sch-grid-line" x1="${x}" y1="${padT}" x2="${x}" y2="${padT+yh}"/><text class="sch-label" x="${x}" y="${H-10}" text-anchor="middle" font-size="9">${Math.pow(10,e)>=1?Math.pow(10,e):('1e'+e)}</text>`; }
    $('rl_chart').innerHTML = svgOpen(W,H) + grid +
      `<text class="sch-label" x="${padL}" y="14" font-size="9.5">TFLOP/s (log)</text>`+
      `<path class="sch-line cold" stroke-width="2" d="${memPath}"/>`+
      `<path class="sch-line hot" stroke-width="2" d="${compPath}"/>`+
      `<circle cx="${xPos(clamp(ai,xMin,xMax))}" cy="${yPos(attain)}" r="5" fill="${ai<aiStar?'var(--flow)':'var(--thermal)'}"/>`+
      `<text class="sch-label strong" x="${xPos(clamp(ai,xMin,xMax))+8}" y="${yPos(attain)-6}" font-size="10">kernel</text>`+
      `<text class="sch-label" x="${W-140}" y="30" font-size="10">AI* = ${fmt(aiStar,1)}</text>`+
      `<text class="sch-label" x="${padL}" y="${H-1}" font-size="9">arithmetic intensity, FLOP/Byte (log)</text>`+
      '</svg>';
  }
  el.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));
  calc();
}

/* ---------------- 6. ALPHA-BETA COMMUNICATION MODEL ---------------- */
function mountAB(el){
  el.innerHTML = `
    <div class="calc-head">Calculator — α–β point-to-point communication time</div>
    <div class="calc-body">
      <div class="calc-grid">
        <div class="field"><label>α — startup latency (µs)</label><input type="number" id="ab_a" value="1.5" step="0.1" min="0"></div>
        <div class="field"><label>Link bandwidth (GB/s)</label><input type="number" id="ab_bw" value="25" step="1" min="0.001"></div>
        <div class="field"><label>Message size (bytes)</label><input type="number" id="ab_n" value="1048576" step="1" min="0"></div>
        <div class="field"><label>Ranks P (for ring all-reduce)</label><input type="number" id="ab_p" value="64" step="1" min="2"></div>
      </div>
      <div class="calc-out" id="ab_out"></div>
      <div class="calc-verdict" id="ab_note"></div>
    </div>`;
  function calc(){
    const a = (parseFloat($('ab_a').value)||0)*1e-6;
    const bw = (parseFloat($('ab_bw').value)||0.001)*1e9;
    const n = parseFloat($('ab_n').value)||0;
    const p = parseFloat($('ab_p').value)||2;
    const beta = 1/bw;
    const t = a + n*beta;
    const regime = a > n*beta ? 'latency-dominated (small message)' : 'bandwidth-dominated (large message)';
    const ring = 2*(p-1)/p * n * beta + 2*(p-1)*a;
    $('ab_out').innerHTML = `
      <div class="readout"><div class="rl">β (time/byte)</div><div class="rv">${fmt(beta*1e9,3)}</div><div class="ru">ns/byte ≈ 1/bandwidth</div></div>
      <div class="readout hot"><div class="rl">Point-to-point time</div><div class="rv">${fmt(t*1e6,2)}</div><div class="ru">µs = α + n·β</div></div>
      <div class="readout"><div class="rl">Ring all-reduce (P=${fmt(p,0)})</div><div class="rv">${fmt(ring*1e6,1)}</div><div class="ru">µs, approx. model</div></div>
    `;
    $('ab_note').innerHTML = `At ${fmt(n,0)} bytes this transfer is <strong>${regime}</strong>. The crossover message size where α = n·β is n ≈ ${fmt(a/beta,0)} bytes for this link.`;
  }
  el.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));
  calc();
}

/* ---------------- 11. HEAT TRANSFER / COOLING (Q = mcΔT) ---------------- */
function mountHeat(el){
  el.innerHTML = `
    <div class="calc-head">Calculator — sensible heat removal (Q̇ = ṁ·cp·ΔT)</div>
    <div class="calc-body">
      <div class="calc-grid">

          <select id="ht_fluid"><option value="1.006" data-name="Air">Air (cp ≈ 1.006 kJ/kg·K)</option><option value="4.18" selected data-name="Water">Water (cp ≈ 4.18 kJ/kg·K)</option></select>

        <div class="field"><label>Allowed ΔT (°C / K)</label><input type="number" id="ht_dt" value="10" step="0.5" min="0.1"></div>
      </div>
      <div class="calc-out" id="ht_out"></div>
      <div class="calc-verdict" id="ht_note"></div>
    </div>`;
  function calc(){
    const cp = parseFloat($('ht_fluid').value);
    const name = $('ht_fluid').selectedOptions[0].getAttribute('data-name');
    const q = parseFloat($('ht_q').value)||0; // kW
    const dt = parseFloat($('ht_dt').value)||0.1;
    const mdot = q/(cp*dt); // kg/s  since kW = kg/s * kJ/kgK * K
    const lps = name==='Water' ? mdot : null; // approx 1 kg/L for water
    const m3h_air = name==='Air' ? (mdot/1.2)*3600 : null; // density ~1.2 kg/m3
    $('ht_out').innerHTML = `
      <div class="readout hot"><div class="rl">Required mass flow</div><div class="rv">${fmt(mdot,3)}</div><div class="ru">kg/s of ${name.toLowerCase()}</div></div>
      ${lps!==null? `<div class="readout"><div class="rl">≈ Volumetric flow</div><div class="rv">${fmt(lps,2)}</div><div class="ru">L/s (water, ρ≈1 kg/L)</div></div>`:''}
      ${m3h_air!==null? `<div class="readout"><div class="rl">≈ Volumetric flow</div><div class="rv">${fmt(m3h_air,0)}</div><div class="ru">m³/h (air, ρ≈1.2 kg/m³)</div></div>`:''}

    $('ht_note').innerHTML = `ṁ = Q̇ / (cp·ΔT) = ${fmt(q,0)} kW / (${cp} kJ/kg·K × ${fmt(dt,1)} K) = <strong>${fmt(mdot,3)} kg/s</strong>. Tighter ΔT means higher required flow for the same heat load — this is the core trade-off in air vs. liquid cooling design.`;

<script>
/* =====================================================================
   CALCULATORS — batch 4 (numerical formats, units, diagnosis)
   ===================================================================== */

/* ---- shared mini-float bit math (validated against reference values) ---- */
function encodeMiniFloat(val, expBits, fracBits, bias){
  const maxExp = (1<<expBits)-1;
  const buf=new ArrayBuffer(4); const dv=new DataView(buf);
  dv.setFloat32(0,val,false);
  const bits32 = dv.getUint32(0,false);
  const sign=(bits32>>>31)&1;
  let exp32=(bits32>>>23)&0xFF, frac32=bits32&0x7FFFFF;
  if(exp32===255){ return {sign,exp:maxExp,frac: frac32? (1<<fracBits)-1 : 0}; }
  let e = exp32 - 127 + bias;
  const shift = 23-fracBits;
  if(e>=maxExp){ return {sign,exp:maxExp-1,frac:(1<<fracBits)-1, clamped:true}; }
  if(e<=0){
    if(e < -(fracBits)) return {sign,exp:0,frac:0, zero:true};
    let f = (frac32|0x800000);
    const sh = shift + (1-e);
    let mant = f >>> sh;
    const roundBit = 1<<(sh-1);
    if(f & roundBit) mant += 1;
    return {sign,exp:0,frac:mant, subnormal:true};
  }
  let mant = frac32 >>> shift;
  const roundBit = 1<<(shift-1);
  if(frac32 & roundBit) mant += 1;
  if(mant === (1<<fracBits)){ mant=0; e+=1; if(e>=maxExp){ return {sign,exp:maxExp-1,frac:(1<<fracBits)-1, clamped:true}; } }
  return {sign,exp:e,frac:mant};
}
function decodeMiniFloat(sign,exp,frac,fracBits,bias){
  let val;
  if(exp===0){ val = frac * Math.pow(2, 1-bias-fracBits); }
  else { val = (1+frac/Math.pow(2,fracBits)) * Math.pow(2, exp-bias); }
  return sign? -val: val;
}
function bitStr(v,len){ return v.toString(2).padStart(len,'0'); }
function bitBar(sign,expBits,expStr,fracBits,fracStr){
  const cell=(ch,cls,w)=>`<div style="flex:${w||1}; text-align:center; padding:6px 0; font-family:var(--mono); font-size:13px; ${cls}">${ch}</div>`;
  let html = `<div style="display:flex; border:1px solid var(--navy); margin:12px 0;">`;
  html += cell(sign,'background:var(--thermal); color:#fff;',1);
  for(const c of expStr) html += cell(c,'background:var(--navy); color:#EAF3F5;',1);
  for(const c of fracStr) html += cell(c,'background:var(--flow-soft); color:var(--flow);',1);
  html += `</div><div style="display:flex; font-family:var(--mono); font-size:9.5px; color:var(--ink-faint);">
    <div style="flex:1; text-align:center;">S</div>
    <div style="flex:${expBits}; text-align:center;">exponent (${expBits})</div>
    <div style="flex:${fracBits}; text-align:center;">fraction (${fracBits})</div>
  </div>`;
  return html;
}

function mountBitviz(el){
  el.innerHTML = `
    <div class="calc-head">Calculator — IEEE 754 &amp; mini-float bit visualizer</div>
    <div class="calc-body">
      <div class="calc-grid">
        <div class="field"><label>Decimal value</label><input type="number" id="bv_val" value="3.14159" step="0.001"></div>
        <div class="field"><label>Format</label>
          <select id="bv_fmt">
            <option value="fp64">FP64 — 1 / 11 / 52</option>
            <option value="fp32" selected>FP32 — 1 / 8 / 23</option>
            <option value="fp16">FP16 — 1 / 5 / 10</option>
            <option value="bf16">BF16 — 1 / 8 / 7</option>
            <option value="e4m3">FP8 E4M3 — 1 / 4 / 3</option>
            <option value="e5m2">FP8 E5M2 — 1 / 5 / 2</option>
          </select>
        </div>
      </div>
      <div id="bv_bits"></div>
      <div class="calc-out" id="bv_out"></div>
      <div class="calc-verdict" id="bv_note"></div>
    </div>`;
  function calc(){
    const val = parseFloat($('bv_val').value); if(isNaN(val)) return;
    const fmtSel = $('bv_fmt').value;
    let sign, expStr, fracStr, decoded, bytes, expBits, fracBits;
    if(fmtSel==='fp64'){
      const buf=new ArrayBuffer(8), dv=new DataView(buf); dv.setFloat64(0,val,false);
      let bin=''; for(let i=0;i<8;i++) bin+=bitStr(dv.getUint8(i),8);
      sign=bin[0]; expStr=bin.slice(1,12); fracStr=bin.slice(12); decoded=val; bytes=8; expBits=11; fracBits=52;
    } else if(fmtSel==='fp32'){
      const buf=new ArrayBuffer(4), dv=new DataView(buf); dv.setFloat32(0,val,false);
      let bin=''; for(let i=0;i<4;i++) bin+=bitStr(dv.getUint8(i),8);
      sign=bin[0]; expStr=bin.slice(1,9); fracStr=bin.slice(9); decoded=dv.getFloat32(0,false); bytes=4; expBits=8; fracBits=23;
    } else if(fmtSel==='bf16'){
      const buf=new ArrayBuffer(4), dv=new DataView(buf); dv.setFloat32(0,val,false);
      const bits32 = dv.getUint32(0,false);
      const h = (bits32 + 0x8000) >>> 16;
      const bin = bitStr(h,16);
      sign=bin[0]; expStr=bin.slice(1,9); fracStr=bin.slice(9);
      const buf2=new ArrayBuffer(4), dv2=new DataView(buf2); dv2.setUint32(0,(h<<16)>>>0,false); decoded=dv2.getFloat32(0,false);
      bytes=2; expBits=8; fracBits=7;
    } else {
      const map={fp16:[5,10,15], e4m3:[4,3,7], e5m2:[5,2,15]};
      const [eb,fb,bias]=map[fmtSel];
      const r = encodeMiniFloat(val,eb,fb,bias);
      sign=r.sign; expStr=bitStr(r.exp,eb); fracStr=bitStr(r.frac,fb);
      decoded = decodeMiniFloat(r.sign,r.exp,r.frac,fb,bias);
      bytes = fmtSel==='fp16'?2:1; expBits=eb; fracBits=fb;
    }
    $('bv_bits').innerHTML = bitBar(sign,expBits,expStr,fracBits,fracStr);
    const err = decoded - val;
    const relErr = val!==0 ? Math.abs(err/val)*100 : 0;
    $('bv_out').innerHTML = `
      <div class="readout"><div class="rl">Storage size</div><div class="rv">${bytes}</div><div class="ru">byte${bytes>1?'s':''} (${bytes*8} bits)</div></div>
      <div class="readout hot"><div class="rl">Represented value</div><div class="rv">${fmt(decoded,6)}</div><div class="ru">closest value this format can store</div></div>
      <div class="readout"><div class="rl">Relative error</div><div class="rv">${fmt(relErr,4)}%</div><div class="ru">vs. your input</div></div>
    `;
    $('bv_note').innerHTML = relErr>0.01
      ? `Your input can't be represented exactly in this format — it rounds to <strong>${fmt(decoded,6)}</strong>. Fewer fraction bits (narrower formats) mean coarser rounding steps between representable values.`
      : `This value is represented exactly (or almost exactly) in this format.`;
  }
  el.querySelectorAll('input,select').forEach(i=>i.addEventListener('input',calc));
  calc();
}

/* ---------------- PRECISION MEMORY / TRAFFIC ---------------- */
function mountPrecmem(el){
  el.innerHTML = `
    <div class="calc-head">Calculator — model memory footprint &amp; traffic by precision</div>
    <div class="calc-body">
      <div class="calc-grid">
        <div class="field"><label>Parameter count</label><input type="number" id="pm_n" value="70000000000" step="1000000000" min="0"></div>
        <div class="field"><label>Bytes/param — FP32=4, FP16/BF16=2, FP8=1, INT4=0.5</label>
          <select id="pm_b">
            <option value="4">FP32 — 4 B</option>
            <option value="2" selected>FP16 / BF16 — 2 B</option>
            <option value="1">FP8 — 1 B</option>
            <option value="0.5">INT4 — 0.5 B</option>

    <div class="readout"><div class="rl">vs. FP32 baseline</div><div class="rv">${fmt(100*b/4,0)}%</div><div class="ru">of full-precision size</div></div>`;
  }
  el.querySelectorAll('input,select').forEach(i=>i.addEventListener('input',calc));
  calc();

/* ---------------- UNIT CONVERTER ---------------- */
const UNIT_GROUPS = {
  databits: {label:'Data rate', units:{'b/s':1,'Kb/s':1e3,'Mb/s':1e6,'Gb/s':1e9,'Tb/s':1e12,'B/s':8,'KB/s':8e3,'MB/s':8e6,'GB/s':8e9,'TB/s':8e12}},
  datasize: {label:'Data size (binary)', units:{'B':1,'KiB':1024,'MiB':1024**2,'GiB':1024**3,'TiB':1024**4,'PiB':1024**5}},
  power: {label:'Power', units:{'W':1,'kW':1e3,'MW':1e6}},
  flops: {label:'Compute rate', units:{'FLOP/s':1,'GFLOP/s':1e9,'TFLOP/s':1e12,'PFLOP/s':1e15,'EFLOP/s':1e18}}
};
function mountUnitconv(el){
  el.innerHTML = `
    <div class="calc-head">Calculator — HPC unit converter</div>
    <div class="calc-body">
      <div class="calc-grid">
        <div class="field"><label>Category</label>
          <select id="uc_cat">${Object.entries(UNIT_GROUPS).map(([k,g])=>`<option value="${k}">${g.label}</option>`).join('')}</select>
        </div>
        <div class="field"><label>From</label><select id="uc_from"></select></div>
        <div class="field"><label>Value</label><input type="number" id="uc_val" value="100" step="any"></div>
        <div class="field"><label>To</label><select id="uc_to"></select></div>
      </div>
      <div class="calc-out" id="uc_out"></div>
    </div>`;
  function fillUnits(){
    const catKey = $('uc_cat').value;
    const g = UNIT_GROUPS[catKey];
    const keys = Object.keys(g.units);
    const opts = keys.map(u=>`<option value="${u}">${u}</option>`).join('');
    $('uc_from').innerHTML = opts; $('uc_to').innerHTML = opts;
    let pair = catKey==='databits' ? ['Gb/s','GB/s'] : catKey==='power' ? ['kW','W'] : catKey==='flops' ? ['TFLOP/s','GFLOP/s'] : ['GiB','MiB'];
    if(keys.includes(pair[0])) $('uc_from').value = pair[0];
    if(keys.includes(pair[1])) $('uc_to').value = pair[1];
  }
  function calc(){
    const g = UNIT_GROUPS[$('uc_cat').value];
    const from=$('uc_from').value, to=$('uc_to').value, v=parseFloat($('uc_val').value)||0;
    const base = v*g.units[from];
    const out = base/g.units[to];
    $('uc_out').innerHTML = `<div class="readout hot"><div class="rl">${v} ${from} =</div><div class="rv">${fmt(out,6)}</div><div class="ru">${to}</div></div>
    <div class="readout"><div class="rl">Note</div><div class="rv" style="font-size:13px; color:var(--ink-soft); font-weight:400;">Bits vs. bytes (÷8) is the #1 source of link-speed confusion — Ethernet/InfiniBand rates are quoted in bits/s; storage/file sizes in bytes.</div></div>`;
  }
  $('uc_cat').addEventListener('input', ()=>{fillUnits(); calc();});
  el.querySelectorAll('#uc_from,#uc_to,#uc_val').forEach(()=>{});
  fillUnits();
  el.querySelectorAll('select,input').forEach(i=>i.addEventListener('input',calc));
  calc();
}

/* ---------------- BOTTLENECK SYMPTOM PICKER ---------------- */
const SYMPTOMS = [
  {t:'Low HPL/HPCG efficiency, high CPU utilization', cause:'Memory-bandwidth or vectorization bound', detail:'Check achieved vs. peak FLOP/s and STREAM Triad bandwidth. If AI of your dominant kernel is below the machine\'s roofline balance point (AI*), you\'re memory-bound — more cores rarely helps; better blocking, data layout, or a wider-memory part does.'},
  {t:'Good single-node performance, poor multi-node scaling', cause:'Network latency/bandwidth or collective overhead', detail:'Profile with OSU/IMB microbenchmarks. Compare measured all-reduce time against the α–β model. Check for oversubscription in the fabric and whether collectives are topology-aware.'},
  {t:'GPU utilization reported high, throughput still low', cause:'Low occupancy, memory-bound kernel, or PCIe/NVLink transfer bottleneck', detail:'"Utilization" often just means "a kernel was running," not that compute units were busy. Check achieved occupancy, warp efficiency, and whether host↔device transfers dominate wall time.'},
  {t:'CPU idle time high while jobs are "running"', cause:'I/O wait — storage bandwidth or IOPS bound', detail:'Run IOR/fio to isolate storage from compute. Check queue depth, metadata operations (mdtest) if many small files are involved, and whether the job is doing synchronous small I/O.'},
  {t:'Thermal throttling / clocks dropping under sustained load', cause:'Cooling capacity or airflow/liquid flow shortfall', detail:'Compare actual heat load against the room\'s or loop\'s designed ΔT and flow rate (Q̇=ṁcpΔT). Check for recirculation (air) or inadequate flow/pressure (liquid) rather than assuming the compressor plant is undersized.'},
  {t:'Random slowdowns that come and go across a job', cause:'Network congestion, noisy neighbor, or NUMA misplacement', detail:'Look for ECMP hashing collisions, PFC pause storms, or processes/memory landing on the wrong NUMA node. Congestion and jitter often show up as tail latency, not average latency.'},
  {t:'Power budget or PDU trips before compute is fully loaded', cause:'Circuit sizing/derating or power-factor issue', detail:'Re-check P = √3·V·I·PF against continuous-load derating (often 80% of breaker rating) and rack PDU capacity, not just nameplate TDP sums.'},
  {t:'Benchmark numbers look great, application performance doesn\'t follow', cause:'Benchmark doesn\'t represent your workload\'s actual bottleneck', detail:'HPL stresses dense FP64 math; most real applications are far more memory- or communication-bound. Pair HPL with HPCG and an application-representative benchmark before drawing conclusions.'}
];
function mountBottleneck(el){
  el.innerHTML = `
    <div class="calc-head">Interactive — symptom → likely cause</div>
    <div class="calc-body">
      <p style="font-size:13.5px; color:var(--ink-soft); margin:0 0 4px;">Click the symptom closest to what you're seeing.</p>

      <div class="symptom-detail" id="sym_detail"></div>
    </div>`;
  el.querySelectorAll('.symptom-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      el.querySelectorAll('.symptom-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const s = SYMPTOMS[btn.getAttribute('data-i')];
      const d = $('sym_detail');
      d.innerHTML = `<div class="example-box"><span class="tag">Likely cause</span><p><strong>${s.cause}</strong></p><p>${s.detail}</p></div>`;
      d.classList.add('show');
    });
  });
}
