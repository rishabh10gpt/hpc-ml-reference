<h3>KL Divergence</h3><div class="formula-box"><span class="tag">KL Divergence</span><div class="f">\\(\\mathrm{KL}(P\\parallel Q)=\\sum_i P(i)\\log\\frac{P(i)}{Q(i)}\\)</div><small>Measures distribution mismatch. Not symmetric: KL(P||Q) != KL(Q||P).</small></div>
<dl class="varkey"><dt>P</dt><dd>True distribution</dd><dt>Q</dt><dd>Approximate distribution</dd></dl>
<div class="example-box"><span class="tag">Worked Example</span><p>P=[0.7,0.2,0.1], Q=[0.5,0.3,0.2]</p><p class="res">KL(P||Q) = 0.085, KL(Q||P) = 0.108 (not symmetric!)</p></div>
<h3>Triplet Loss — where the formula comes from</h3>
<p>Triplet loss comes from a ranking/margin idea, not from probabilities: we want the embedding space to satisfy one inequality — <em>an anchor should be closer to its positive than to its negative by at least a margin</em>.</p>
<div class="example-box"><span class="tag">Step 1 — The desired relationship</span><p>For anchor \\(a\\), positive \\(p\\) (same class) and negative \\(n\\) (different class), we want:</p><div class="f">\\(d(a,p)+\\text{margin}\\le d(a,n)\\)</div><p>The margin is a safety gap: equal distances are not enough, the positive must win by a margin, otherwise the embedding is fragile (tiny noise flips the nearest neighbor).</p></div>
<div class="example-box"><span class="tag">Step 2 — Measure the violation</span><p>Rearrange to get the signed violation \\(d(a,p)-d(a,n)+\\text{margin}\\). A negative value means the condition holds (no penalty); a positive value means the margin is violated:</p><div class="f">\\(\\text{violation}=d(a,p)-d(a,n)+\\text{margin}\\)</div></div>
<div class="example-box"><span class="tag">Step 3 — Hinge (max(0, ·))</span><p>Wrap in \\(\\max(0,\\cdot)\\) so only violating triplets contribute a gradient — satisfied triplets are ignored:</p><div class="f">\\(\\mathcal{L}=\\max\\!\\left(0,\\,d(a,p)-d(a,n)+\\text{margin}\\right)\\)</div><p>This is the same hinge idea used in SVMs, applied to distances. Minimizing it pulls anchor-positive pairs together and pushes anchor-negative pairs apart — but <em>only</em> as needed.</p></div>
<div class="note tip"><span class="tag">Significance — why mining matters</span><p>The \\(\\max(0,\\cdot)\\) means easy triplets give zero gradient. Only <em>hard</em> or <em>semi-hard</em> negatives (where the violation is positive) train the model — so triplet loss is only as good as your negative mining. Without mining, most batches contribute nothing.</p></div>
<h3>Triplet Loss</h3><div class="formula-box"><span class="tag">Triplet Loss</span><div class="f">\\(\\mathcal{L}=\\max(0,\\,d(a,p)-d(a,n)+\\text{margin})\\)</div><small>Pushes anchor closer to positive, farther from negative.</small></div>
<dl class="varkey"><dt>a</dt><dd>Anchor</dd><dt>p</dt><dd>Positive (same class)</dd><dt>n</dt><dd>Negative (different class)</dd><dt>margin</dt><dd>Safety gap</dd></dl>
<div class="example-box"><span class="tag">Worked Example</span><p>d(a,p)=0.3, d(a,n)=0.8, margin=0.2</p><p class="res">Loss = max(0, 0.3-0.8+0.2) = 0 (satisfied!)</p></div>
<h3>InfoNCE / NT-Xent — where the formula comes from</h3>
<p>InfoNCE reuses an idea you already know: <strong>softmax classification</strong>. The trick is that the "classes" are the samples in the batch. The model must pick which of \\(K-1\\) negatives is actually the positive match for the anchor — and the loss is the negative log-likelihood of choosing correctly.</p>
<div class="example-box"><span class="tag">Step 1 — Turn retrieval into classification</span><p>For anchor \\(z_i\\), the score of candidate \\(z_k\\) is \\(\\mathrm{sim}(z_i,z_k)/\\tau\\) (cosine similarity, scaled by temperature \\(\\tau\\)). Higher score = more similar. The probability that \\(z_j\\) is the true positive is a softmax over all \\(K\\) candidates:</p><div class="f">\\(P(j\\mid i)=\\frac{\\exp(\\mathrm{sim}(z_i,z_j)/\\tau)}{\\sum_{k=1}^{K}\\exp(\\mathrm{sim}(z_i,z_k)/\\tau)}\\)</div></div>
<div class="example-box"><span class="tag">Step 2 — Negative log-likelihood (again!)</span><p>We want the true positive \\(z_j\\) to win. Take the negative log-likelihood of choosing it — the same \\(-\\log p\\) idea from BCE, applied to a \\(K\\)-way softmax:</p><div class="f">\\(\\mathcal{L}=-\\log P(j\\mid i)=-\\log\\frac{\\exp(\\mathrm{sim}(z_i,z_j)/\\tau)}{\\sum_k\\exp(\\mathrm{sim}(z_i,z_k)/\\tau)}\\)</div><p>The formula falls straight out of \\(-\\log\\text{softmax}\\) — no new machinery, just a classification task where the labels are "this sample is the positive."</p></div>
<div class="example-box"><span class="tag">Step 3 — Why the denominator matters</span><p>The sum over \\(k\\) makes every other sample in the batch a negative. The loss is minimized when \\(\\mathrm{sim}(z_i,z_j)\\) is large <em>and</em> all \\(\\mathrm{sim}(z_i,z_k)\\) for \\(k\\ne j\\) are small — i.e., the positive stands out against the whole batch. More negatives → a harder, richer contrastive problem.</p></div>
<div class="note tip"><span class="tag">Significance</span><p>InfoNCE is a bounded, normalized objective: \\(\\mathcal{L}\\) is always \\(\\ge 0\\), so the optimization is well-posed (unlike a raw similarity which could grow forever). It also connects to mutual information: minimizing InfoNCE maximizes a lower bound on \\(I(z_i;z_j)\\) — which is exactly why it excels at self-supervised representation learning. The temperature \\(\\tau\\) sharpens or softens the distribution: small \\(\\tau\\) = hard emphasis on the hardest negatives.</p></div>
<h3>InfoNCE / NT-Xent</h3><div class="formula-box"><span class="tag">InfoNCE</span><div class="f">\\(\\mathcal{L}=-\\log\\frac{\\exp(\\mathrm{sim}(z_i,z_j)/\\tau)}{\\sum_k\\exp(\\mathrm{sim}(z_i,z_k)/\\tau)}\\)</div><small>Makes positive pair more similar than all negatives in the batch.</small></div>
<dl class="varkey"><dt>z_i</dt><dd>Anchor embedding</dd><dt>z_j</dt><dd>Positive embedding</dd><dt>t (tau)</dt><dd>Temperature parameter</dd></dl>
<div class="note tip"><span class="tag">When to use which</span><p><strong>KL:</strong> Knowledge distillation. <strong>Triplet/Contrastive:</strong> Face verification, image retrieval. <strong>InfoNCE:</strong> Self-supervised pretraining (SimCLR, MoCo).</p></div>
<h3>Where each loss shines — use cases</h3>
<div class="example-box"><span class="tag">KL Divergence — use cases</span>
<p><strong>Knowledge distillation:</strong> minimize \\(\\mathrm{KL}(\\text{student} \\parallel \\text{teacher})\\) so the small model mimics the teacher's soft probabilities (temperature-scaled logits).</p>
<p><strong>VAEs and variational inference:</strong> the ELBO objective is built directly from a KL term \\(\\mathrm{KL}(q \\parallel p)\\).</p>
<p><strong>Distribution matching / uncertainty:</strong> comparing predicted distributions to priors in generative modeling.</p>
<p><strong>Direction matters:</strong> forward KL \\(\\mathrm{KL}(P\\parallel Q)\\) is mode-covering (weights by P); reverse KL is mode-seeking. Pick based on whether you care about covering all modes or a sharp peak.</p></div>
<div class="example-box"><span class="tag">Triplet Loss — use cases</span>
<p><strong>Face verification / recognition (FaceNet):</strong> learn an embedding where same-person distances are smaller than different-person distances.</p>
<p><strong>Person re-identification, product retrieval:</strong> build a metric space over identities or items for nearest-neighbor search.</p>
<p><strong>Strength and weakness:</strong> very effective, but depends on <em>negative mining</em> — a batch of easy triplets trains nothing; hard-negative mining is critical.</p></div>
<div class="example-box"><span class="tag">InfoNCE / Contrastive — use cases</span>
<p><strong>Self-supervised pretraining:</strong> SimCLR, MoCo, BYOL, CLIP learn representations from unlabeled data by pulling augmented views of the same sample together and pushing others apart.</p>
<p><strong>Text and image embeddings:</strong> contrastive objectives produce strong retrieval-grade embeddings for RAG and search.</p>
<p><strong>Scales with batch size:</strong> more negatives in the batch means a better denominator; use large batches or a memory bank (MoCo) when memory is tight.</p></div>
<h3>Triplet vs InfoNCE — side-by-side</h3>
<div class="tbl-wrap"><table class="dt">
<thead><tr><th>Property</th><th>Triplet Loss</th><th>InfoNCE / NT-Xent</th></tr></thead>
<tbody>
<tr><td>Negatives per update</td><td>1 (chosen by mining)</td><td>\\(K-1\\) (whole batch or memory bank)</td></tr>
<tr><td>Negative mining needed</td><td>Yes — critical</td><td>No — batch provides them</td></tr>
<tr><td>Batch-size sensitivity</td><td>Low</td><td>High (bigger batch = better)</td></tr>
<tr><td>Typical use</td><td>Face / re-ID / similarity search</td><td>Self-supervised pretraining, CLIP-style models</td></tr>
<tr><td>Control knob</td><td>margin (absolute distance)</td><td>temperature \\(\\tau\\) (in logits)</td></tr>
</tbody></table></div>
<div class="note tip"><span class="tag">Which to pick</span><p><strong>KL:</strong> distribution matching / distillation. <strong>Triplet:</strong> small-label embedding tasks where you can mine good negatives. <strong>InfoNCE:</strong> large-scale self-supervised learning, or whenever you want the batch to supply the negatives — it is the modern default for retrieval-era models (CLIP, sentence encoders).</p></div>`,calc:'klDivCalc',diagrams:[]});
SECTIONS.push({id:'p5-0',part:'p5',num:'7.1',title:'NLP — BLEU score',dek:'Translation quality via n-gram overlap',tags:'bleu translation nlp rouge meteor chrf',body:`<p>BLEU is a translation metric based on n-gram overlap between candidate and reference sentences.</p>
<div class="formula-box"><span class="tag">BLEU score</span><div class="f">\\(\\mathrm{BLEU}=\\mathrm{BP}\\cdot\\exp\\!\\Big(\\sum_n w_n\\log p_n\\Big)\\)</div><small>Geometric mean of modified n-gram precisions, penalized for being too short.</small></div>
<dl class="varkey"><dt>p_n</dt><dd>Modified n-gram precision</dd><dt>w_n</dt><dd>Weight (typically 1/N)</dd><dt>N</dt><dd>Max n-gram order (BLEU-4 uses N=4)</dd><dt>BP</dt><dd>Brevity penalty</dd></dl>
<h3>Why "modified" precision</h3>
<div class="example-box"><span class="tag">Clipping stops gaming</span><p>Naive precision counts every candidate n-gram that appears <em>anywhere</em> in the reference. Candidate "the the the the" against reference "the cat sat on the mat" would score 4/4 = 1.0 — perfect, absurdly. Modified precision <strong>clips</strong> each n-gram's count at its maximum count in any single reference: "the" appears once in the reference, so the candidate gets credit for 1, not 4 → 1/4 = 0.25. Formally:</p><div class="f">\\(p_n=\\frac{\\sum_{\\text{cand}}\\sum_{\\text{n-gram}}\\min(\\text{count},\\text{max-ref-count})}{\\sum_{\\text{cand}}\\sum_{\\text{n-gram}}\\text{count}}\\)</div></div>
<div class="example-box"><span class="tag">Why a geometric mean</span><p>BLEU multiplies the precisions (in log space: a weighted sum) instead of averaging them. An arithmetic mean would let a great unigram score hide a zero 4-gram score; the geometric mean forces <em>every</em> order to be decent — if any \\(p_n=0\\), the whole score collapses to 0. In practice implementations add smoothing so one missing 4-gram does not zero out an otherwise good sentence.</p></div>
<h3>Brevity Penalty</h3><div class="formula-box"><span class="tag">Brevity Penalty</span><div class="f">\\(\\mathrm{BP}=\\begin{cases}1 & c>r\\\\ \\exp(1-r/c) & c\\le r\\end{cases}\\)</div><small>Penalizes translations that are too short.</small></div>
<dl class="varkey"><dt>c</dt><dd>Candidate length</dd><dt>r</dt><dd>Reference length</dd></dl>
<div class="example-box"><span class="tag">Worked Example — BLEU-4</span><p>Candidate: "The cat sat on the mat" (6 words). Reference: "The cat is on the mat" (6 words).</p><p>Unigram: 5/6=0.833. Bigram: 3/5=0.600. Trigram: 2/4=0.500. 4-gram: 1/3=0.333.</p><p>Geometric mean: (0.833*0.600*0.500*0.333)^(1/4) = 0.527</p><p class="res">BLEU-4 = 52.7%</p></div>
<div class="example-box"><span class="tag">Reading the score</span><p>BLEU is usually reported on a 0–100 scale. Rough corpus-level guidance for translation:</p><ul><li>Below 10 — nearly useless output</li><li>10–19 — hard to get the gist</li><li>20–29 — the gist is clear, but with errors</li><li>30–40 — good, understandable translations</li><li>40–50 — high quality</li><li>Above 50 — very good, often near human-agreement levels</li></ul><p>Always compare on the <em>same test set with the same tokenization</em> — BLEU numbers are not comparable across datasets or tokenizers. Report corpus BLEU over the whole test set, not averaged sentence BLEU, which is unstable on short sentences.</p></div>
<div class="tbl-wrap"><table class="dt">
<thead><tr><th>Metric</th><th>Core idea</th><th>When to prefer it</th></tr></thead>
<tbody>
<tr><td>BLEU</td><td>Precision of word n-grams + brevity penalty</td><td>Machine translation; fast standard benchmark</td></tr>
<tr><td>ROUGE</td><td>Recall of n-grams (how much of the reference was covered)</td><td>Summarization — missing content is the main sin</td></tr>
<tr><td>chrF</td><td>Character n-gram F-score</td><td>Morphologically rich languages, noisy text</td></tr>
<tr><td>METEOR</td><td>Unigram matching with stemming and synonyms</td><td>When valid paraphrases should not be punished</td></tr>
<tr><td>COMET / BLEURT</td><td>Neural models trained on human judgments</td><td>Closest to human ratings; slower, needs models</td></tr>
</tbody></table></div>
<div class="note warn"><span class="tag">Limitations</span><p>BLEU measures surface overlap, not meaning: a perfect paraphrase with different words scores badly, while a fluent-looking but wrong translation can score well. It barely rewards word order beyond n-gram windows, punishes valid variation (mitigate with <em>multiple</em> references), and correlates weakly with human judgment at the single-sentence level. Use it for tracking progress and comparing systems on the same benchmark — use human or neural evaluation (COMET, BLEURT) for final quality claims.</p></div>`,calc:'bleuCalc',diagrams:[]});
SECTIONS.push({id:'p5-1',part:'p5',num:'7.2',title:'NLP — Perplexity',dek:'Language model evaluation via surprise',tags:'perplexity language model nlp cross entropy evaluation',body:`<p>Perplexity measures how "surprised" the model is by new text.</p>
<div class="formula-box"><span class="tag">Perplexity</span><div class="f">\\(\\mathrm{PPL}=\\exp\\!\\left[-\\frac{1}{N}\\sum_i \\log P(x_i\\mid x_{&lt;i})\\right]\\)</div><small>Exponentiated average negative log-likelihood per token.</small></div>
<div class="formula-box"><span class="tag">Equivalent form</span><div class="f">\\(\\mathrm{PPL}=\\exp(\\mathrm{CE})\\)</div></div>
<dl class="varkey"><dt>Lower is better</dt><dd>Model assigns higher probability to actual tokens</dd>
<dt>PPL = 1</dt><dd>Perfect model</dd><dt>PPL = V</dt><dd>Uniform distribution (no information)</dd></dl>
<div class="example-box"><span class="tag">Worked example — token by token</span><p>Model predicts 4 tokens with probabilities 0.8, 0.5, 0.9, 0.4. Negative log-likelihoods (natural log): 0.223, 0.693, 0.105, 0.916. Average (cross-entropy): \\((0.223+0.693+0.105+0.916)/4=0.484\\). Perplexity: \\(\\exp(0.484)\\approx 1.62\\) — the model is as uncertain as choosing among about 1.6 words. Note how the single 0.4 prediction dominates the average: perplexity punishes confident mistakes hard, because \\(-\\log p\\) explodes as \\(p\\to 0\\).</p></div>
<div class="example-box"><span class="tag">Where it comes from</span><p>Perplexity is just cross-entropy (§6.2) exponentiated: training minimizes average negative log-likelihood, and \\(\\mathrm{PPL}=\\exp(\\mathrm{CE})\\) turns those abstract nats into an effective vocabulary size. Because of the exponential, every 1.0 drop in cross-entropy divides perplexity by \\(e\\approx 2.72\\) — small CE wins look dramatic in PPL space.</p></div>
<div class="example-box"><span class="tag">Train vs test perplexity</span><p>Track both. Falling train PPL with rising test PPL is classic overfitting — the model memorizes training text instead of learning the language. Like any loss, compare perplexities only on the <em>same</em> test set.</p></div>
<div class="example-box"><span class="tag">Worked Example</span><p>CE = 2.0: Perplexity = e^2 = 7.39 (on average uncertain among ~7.4 words)</p><p class="res">CE = 1.5: Perplexity = e^1.5 = 4.48 (better)</p></div>
<div class="note tip"><span class="tag">Interpreting perplexity</span><p>A perplexity of 20 means the model is as uncertain as choosing uniformly from 20 words — think of it as the effective branching factor at each step. Modern LLMs achieve roughly 5–15 on news text.</p></div>
<div class="note warn"><span class="tag">Caveats</span><p>Perplexity is tokenizer-dependent: a model with a larger vocabulary or different tokenization gets a different PPL on the same text, so <em>never compare perplexities across tokenizers</em> — use bits per byte for fair cross-model comparison. It measures only next-token prediction, not truthfulness, reasoning, or usefulness: a lower-PPL model can still hallucinate fluently. Domain matters too — PPL on code vs poetry vs news is not comparable. Use it to track training and to compare same-tokenizer models; evaluate capabilities with downstream tasks.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p5-2',part:'p5',num:'7.3',title:'Beyond BLEU — ROUGE, METEOR, chrF, BERTScore',dek:'Recall-side, alignment, character, and embedding metrics for generated text',tags:'rouge meteor chrf bertscore summarization generation evaluation nlp',body:`<p>BLEU (§7.1) is precision-heavy: it punishes extra words, barely notices missing ones. Summarization, where <em>coverage</em> is the point, needs the mirror image — and modern practice adds alignment, character-level, and embedding views. No single one correlates with human judgment everywhere; leaderboards report several.</p>
<h3>ROUGE — the recall-side family (summarization default)</h3><div class="formula-box"><span class="tag">ROUGE-N (recall form)</span><div class="f">\\(\\mathrm{ROUGE\\text{-}N}=\\frac{\\sum \\text{matching n-grams}}{\\sum \\text{n-grams in reference}}\\)</div><small>What fraction of the <em>reference's</em> n-grams appear in the candidate. ROUGE-1 (unigrams: content words), ROUGE-2 (bigrams: fluency/phrasing). ROUGE-L replaces n-gram counting with longest-common-subsequence length — rewards in-order coverage without exact n-gram matches.</small></div>
<div class="example-box"><span class="tag">Worked example — BLEU vs ROUGE disagree</span><p>Reference: "the cat sat on the mat" (6 unigrams). Candidate A: "the cat sat" — BLEU ≈ 1.0 (everything it says is correct) but ROUGE-1 = 3/6 = 0.50 (half the content missing). Candidate B: "the cat sat on the mat and the dog barked loudly" — ROUGE-1 = 6/6 = 1.0 but BLEU collapses (5 spurious words).</p><p class="res">A: BLEU 1.0 / ROUGE 0.50 (too short) · B: BLEU ~0.4 / ROUGE 1.0 (too long) — length and coverage need both sides</p></div>
<h3>METEOR, chrF, BERTScore — the other three lenses</h3><dl class="varkey"><dt>METEOR</dt><dd>Unigram alignment with stemming and synonym matching (WordNet), then \\(F_{\\mathrm{mean}}=\\frac{10PR}{R+9P}\\) — recall weighted 9× over precision — times a fragmentation penalty for word-order breaks. Correlates with humans better than BLEU at sentence level, especially with paraphrase.</dd><dt>chrF</dt><dd>Character n-gram F-score (usually up to 6-grams) plus word unigrams/bigrams. Tokenizer-independent — the standard for morphologically rich languages (Turkish, Finnish, Arabic) where word-level BLEU misfires on affixes.</dd><dt>BERTScore</dt><dd>Cosine similarity of contextual embeddings (§3.1) with greedy alignment: \\(R\\) = mean over reference tokens of max similarity, \\(P\\) symmetrically, \\(F_1\\) combined. Rewards paraphrase ("car" ≈ "automobile") that every string metric marks wrong — at the cost of a model dependency and weaker interpretability.</dd></dl>
<div class="note tip"><span class="tag">Which to report</span><p><strong>Translation:</strong> BLEU + chrF (morphology safety). <strong>Summarization:</strong> ROUGE-1/2/L. <strong>Paraphrase-heavy or open-ended generation:</strong> add BERTScore. <strong>Any claim under ~1 point</strong> on any of these is noise — average seeds and spot-check with humans (§9.3 in Part IX).</p></div>
<div class="note warn"><span class="tag">Gaming surface</span><p>ROUGE rewards copying reference phrasing (extractive systems look better than they read); BERTScore rewards fluent paraphrase even when facts drift. For factuality-critical output (medical, legal summaries), add an entailment/factuality check — overlap metrics cannot see hallucinations phrased in reference words.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p8-0',part:'p8',num:'8.1',title:'What is Remote Sensing?',dek:'Introduction to satellite and aerial image acquisition',tags:'remote sensing satellite aerial overview introduction',body:`<p>Remote sensing is the acquisition of information about the Earth's surface without direct contact. Sensors on satellites, aircraft, or drones capture electromagnetic radiation reflected or emitted from the surface.</p>
<h3>How Remote Sensing Works</h3>
<div class="note tip"><span class="tag">Fundamental principle</span>
<p>Every surface reflects, absorbs, and emits electromagnetic radiation differently. A green leaf reflects NIR strongly, asphalt absorbs most wavelengths, and water reflects blue-green. By measuring these spectral signatures, we can identify materials and detect changes.</p></div>
<h3>Electromagnetic Spectrum for Remote Sensing</h3>
<div class="note tip"><span class="tag">Spectral overview</span><p>Remote sensing uses specific portions of the electromagnetic spectrum. Each band interacts differently with Earth's surface materials — this is the basis for identifying land cover, vegetation health, water bodies, and urban areas from satellite data.</p></div>
<div class="tbl-wrap"><table class="dt">
<thead><tr><th>Band</th><th>Wavelength</th><th>Penetration</th><th>Key Interactions</th><th>Primary Applications</th></tr></thead>
<tbody>
<tr><td style="background:#ff4444;color:white;font-weight:600">Visible Red</td><td>0.62 – 0.75 µm</td><td>Atmosphere (clear)</td><td>Chlorophyll absorption, soil reflectance</td><td>Vegetation health, true-color imagery</td></tr>
<tr><td style="background:#44aa44;color:white;font-weight:600">Near-Infrared (NIR)</td><td>0.75 – 1.3 µm</td><td>Atmosphere (clear)</td><td>Strong vegetation reflectance, water absorption</td><td>NDVI, vegetation mapping, water detection</td></tr>
<tr><td style="background:#cc8800;font-weight:600">Short-Wave IR (SWIR)</td><td>1.3 – 3.0 µm</td><td>Atmosphere (windows)</td><td>Moisture content, mineral composition</td><td>Cloud/snow distinction, fire mapping, geology</td></tr>
<tr><td style="background:#cc0000;color:white;font-weight:600">Thermal IR</td><td>8 – 14 µm</td><td>Atmosphere (window)</td><td>Emitted heat, surface temperature</td><td>Fire detection, urban heat islands, soil moisture</td></tr>
<tr><td style="background:#6666ff;color:white;font-weight:600">Microwave (SAR)</td><td>1 mm – 1 m</td><td>Clouds, rain, vegetation</td><td>Surface roughness, dielectric constant</td><td>All-weather imaging, InSAR, ship detection</td></tr>
<tr><td style="background:#8844cc;color:white;font-weight:600">Radar (X/C/L-band)</td><td>0.75 cm – 25 cm</td><td>Vegetation canopy, dry soil</td><td>Volume scattering, double-bounce</td><td>Biomass estimation, flood mapping, archaeology</td></tr>
</tbody></table></div>
<div class="example-box"><span class="tag">Visualizing the spectrum</span><p>From short to long wavelength: UV → <span style="color:red;font-weight:700">Visible (R)</span> → <span style="color:#44aa44;font-weight:700">NIR</span> → <span style="color:#cc8800;font-weight:700">SWIR</span> → <span style="color:#cc0000;font-weight:700">Thermal</span> → <span style="color:#6666ff;font-weight:700">Microwave</span>. Energy decreases with wavelength (UV = high energy, Microwave = low energy). Shorter wavelengths = higher resolution but less penetration. Longer wavelengths = lower resolution but penetrate clouds, vegetation, and dry soil.</p></div>
<h3>Band-by-Band Explanation</h3>
<div class="formula-box"><span class="tag">Visible (RGB) — 0.4 – 0.7 µm</span><div class="f">Wavelength: 0.4 (blue) – 0.7 (red) micrometers</div><small>What cameras and human eyes see. Blue (0.45 µm) penetrates water. Green (0.55 µm) reflects healthy vegetation. Red (0.65 µm) is absorbed by chlorophyll. Used for true-color composites and visual interpretation. Limitation: blocked by clouds and haze.</small></div>
<div class="formula-box"><span class="tag">Near-Infrared (NIR) — 0.75 – 1.3 µm</span><div class="f">Wavelength: 0.75 – 1.3 micrometers</div><small>The most important band for vegetation. Healthy leaves reflect 30–50% of NIR (spongy mesophyll scattering). Water absorbs almost all NIR. This contrast makes NDVI possible: vegetation = bright, water = dark. Also used for shoreline mapping and biomass estimation.</small></div>
<div class="formula-box"><span class="tag">Short-Wave Infrared (SWIR) — 1.3 – 3.0 µm</span><div class="f">Wavelength: 1.3 – 3.0 micrometers</div><small>Sensitive to moisture content and mineral composition. Water absorption bands at 1.4 µm and 1.9 µm split SWIR into two atmospheric windows (SWIR1: 1.5–1.7 µm, SWIR2: 2.1–2.3 µm). Distinguishes clouds (bright in SWIR) from snow (dark). Detects burning and freshly burned areas.</small></div>
<div class="formula-box"><span class="tag">Thermal Infrared — 8 – 14 µm</span><div class="f">Wavelength: 8 – 14 micrometers</div><small>Measures emitted heat, not reflected sunlight. Every object above absolute zero emits thermal radiation. Detects: wildfires (hot spots), urban heat islands (cities warmer than surroundings), soil moisture (wet soil = cooler), volcanic activity. Resolution: typically 60–100m (coarser than optical).</small></div>
<div class="formula-box"><span class="tag">Microwave (SAR) — 1 mm – 1 m</span><div class="f">Wavelength: 1 mm – 1 meter</div><small>Penetrates clouds, rain, fog, and darkness. Works day and night. Longer wavelengths penetrate deeper: X-band (3 cm) → surface only, C-band (5 cm) → vegetation canopy, L-band (23 cm) → through canopy to ground, P-band (70 cm) → deep soil penetration. See §8.2 for SAR physics.</small></div>
<div class="note tip"><span class="tag">Band selection guide</span><p><strong>Vegetation health:</strong> NIR + Red (NDVI). <strong>Water detection:</strong> NIR (absorbed) + Green. <strong>Cloud/snow discrimination:</strong> SWIR. <strong>Fire detection:</strong> Thermal IR. <strong>All-weather imaging:</strong> Microwave. <strong>Urban mapping:</strong> SWIR + NIR + Visible. <strong>Geology/minerals:</strong> SWIR (SWIR2 for clay, carbonate).</p></div>
<h3>Satellite Platforms</h3>
<div class="tbl-wrap"><table class="dt">
<thead><tr><th>Satellite</th><th>Resolution</th><th>Revisit</th><th>Bands</th><th>Use Case</th></tr></thead>
<tbody>
<tr><td>Landsat 8/9</td><td>30m (multispectral), 15m (pan)</td><td>16 days</td><td>RGB, NIR, SWIR, Thermal</td><td>Land cover, deforestation, agriculture</td></tr>
<tr><td>Sentinel-2</td><td>10m (RGB, NIR), 20m, 60m</td><td>5 days</td><td>RGB, NIR, Red Edge, SWIR</td><td>Crop mapping, vegetation monitoring</td></tr>
<tr><td>Sentinel-1 (SAR)</td><td>5m x 20m</td><td>6-12 days</td><td>C-band SAR (VV, VH)</td><td>Change detection, ship detection, ice monitoring</td></tr>
<tr><td>WorldView-3</td><td>0.31m (pan), 1.24m (MS)</td><td>1-3 days</td><td>RGB, NIR, SWIR, CIR</td><td>Building detection, precision agriculture</td></tr>
<tr><td>PlanetScope</td><td>3m</td><td>Daily</td><td>RGB, NIR</td><td>Daily monitoring, change detection</td></tr>
</tbody></table></div>
<h3>Key Spectral Indices</h3>
<div class="formula-box"><span class="tag">NDVI — Normalized Difference Vegetation Index</span><div class="f">\\(\\mathrm{NDVI}=\\frac{\\mathrm{NIR}-\\mathrm{Red}}{\\mathrm{NIR}+\\mathrm{Red}}\\)</div><small>Range: -1 to 1. Healthy vegetation: 0.3-0.9. Bare soil: ~0. Water: negative. Most widely used remote sensing index.</small></div>
<div class="formula-box"><span class="tag">NDWI — Normalized Difference Water Index</span><div class="f">\\(\\mathrm{NDWI}=\\frac{\\mathrm{Green}-\\mathrm{NIR}}{\\mathrm{Green}+\\mathrm{NIR}}\\)</div><small>Positive values indicate water bodies. Used for flood mapping and water detection.</small></div>
<div class="formula-box"><span class="tag">NDBI — Normalized Difference Built-up Index</span><div class="f">\\(\\mathrm{NDBI}=\\frac{\\mathrm{SWIR}-\\mathrm{NIR}}{\\mathrm{SWIR}+\\mathrm{NIR}}\\)</div><small>Highlights urban/built-up areas. Positive values = buildings and impervious surfaces.</small></div>
<div class="example-box"><span class="tag">Worked Example — NDVI Calculation</span>
<p>Sentinel-2 pixel: Red=0.08, NIR=0.35</p>
<p class="res">NDVI = (0.35 - 0.08) / (0.35 + 0.08) = 0.27 / 0.43 = 0.63</p>
<p>NDVI=0.63 indicates healthy green vegetation (likely cropland or forest canopy).</p></div>
<div class="note warn"><span class="tag">Atmospheric effects</span><p>Clouds, haze, and aerosols corrupt optical imagery. This is why SAR is valuable — it penetrates clouds. For optical data, atmospheric correction (e.g., Sen2Cor for Sentinel-2) is essential before ML.</p></div>
<h3>Active vs Passive Sensing</h3>
<div class="note tip"><span class="tag">Fundamental distinction</span><p><strong>Passive sensors</strong> (optical) measure naturally occurring radiation — reflected sunlight or emitted thermal energy. They depend on illumination (sunlight) and clear skies. <strong>Active sensors</strong> (SAR, LiDAR, altimeters) emit their own energy and measure the return. They work day/night and through clouds.</p></div>
<h3>Atmospheric Windows</h3>
<div class="example-box"><span class="tag">Why specific wavelengths?</span><p>The atmosphere absorbs most electromagnetic radiation. Only certain wavelength bands pass through — these are "atmospheric windows." Remote sensing sensors are designed to operate within these windows: visible (0.4–0.7 µm), NIR (0.7–1.3 µm), SWIR (1.3–2.5 µm), thermal IR (8–14 µm), and microwave (1 mm–1 m). Outside these windows, the atmosphere is opaque.</p></div>
<h3>Resolution Tradeoffs</h3>
<div class="note warn"><span class="tag">The resolution trilemma</span><p>You cannot have high spatial, spectral, and temporal resolution simultaneously — improving one degrades another. Landsat has 30m spatial but 16-day revisit. PlanetScope has daily revisit but only 3m. WorldView has 0.31m but narrow swath. Choose based on your application: frequent monitoring (PlanetScope) vs detailed mapping (WorldView) vs spectral analysis (Sentinel-2).</p></div>
<h3>Satellite Orbits</h3>
<div class="note tip"><span class="tag">Why orbit matters</span><p>The orbit determines: (1) How much of Earth the satellite sees, (2) How often it revisits the same spot, (3) What time of day it images, (4) How long the satellite lasts. The choice of orbit is the single most important design decision for a remote sensing mission.</p></div>
<div class="tbl-wrap"><table class="dt">
<thead><tr><th>Orbit Type</th><th>Altitude</th><th>Revisit</th><th>Key Property</th><th>Examples</th></tr></thead>
<tbody>
<tr><td><strong>LEO — Sun-Synchronous (SSO)</strong></td><td>400–900 km</td><td>1–16 days</td><td>Same local solar time each pass → consistent shadows and illumination</td><td>Landsat 8/9, Sentinel-2, WorldView, PlanetScope</td></tr>
<tr><td><strong>LEO — Non-SSO</strong></td><td>200–600 km</td><td>Variable</td><td>Inclined orbit, varying local time → inconsistent lighting</td><td>ISS (varies), some CubeSats</td></tr>
<tr><td><strong>MEO — Medium Earth Orbit</strong></td><td>2,000–35,786 km</td><td>Hours to days</td><td>Higher altitude = wider swath but lower resolution. GPS constellation altitude.</td><td>GPS (navigation), GLONASS, Galileo</td></tr>
<tr><td><strong>GEO — Geostationary</strong></td><td>35,786 km</td><td>Continuous (same spot)</td><td>Fixed relative to Earth's surface → persistent monitoring of one hemisphere</td><td>GOES (weather), Meteosat, Himawari</td></tr>
<tr><td><strong>HEO — Highly Elliptical</strong></td><td>~500–40,000 km</td><td>Varies (dwell at apogee)</td><td>Spends most time over high latitudes → covers polar regions GEO cannot</td><td>Molniya, Tundra</td></tr>
</tbody></table></div>
<div class="example-box"><span class="tag">SSO — Why Sun-Synchronous?</span><p>Sun-synchronous orbits precess at the same rate Earth orbits the Sun (~1°/day). This means the satellite always crosses a given latitude at the <strong>same local solar time</strong> (e.g., 10:30 AM). Consequence: shadows and illumination are consistent across dates — critical for change detection and multi-temporal analysis. Landsat always images at ~10:00 AM local time. This is by design, not coincidence.</p></div>
<div class="example-box"><span class="tag">GEO — The Weather Workhorse</span><p>A geostationary satellite orbits at exactly Earth's rotation rate (24-hour period) directly above the equator. It appears stationary in the sky → continuous coverage of one hemisphere. GOES-East/West provide real-time weather monitoring of the Americas. Time resolution: images every 5–15 minutes. Spatial resolution: ~1km (coarse, but you see the whole continent). Tradeoff: cannot see polar regions, and resolution is too low for land surface mapping.</p></div>
<div class="note tip"><span class="tag">LEO vs GEO for ML</span><p><strong>LEO (SSO)</strong> is the workhorse for ML: high spatial resolution (1–30m), global coverage, consistent illumination. <strong>GEO</strong> is used for: weather forecasting (continuous monitoring), wildfire tracking (real-time), and atmospheric science. GEO rarely feeds ML directly due to coarse resolution, but its high temporal frequency enables early warning systems.</p></div>
<h3>Global Navigation Satellite Systems (GNSS)</h3>
<div class="note tip"><span class="tag">How GPS-like systems work</span><p>Every navigation satellite continuously broadcasts its position and precise time. A receiver measures how long the signal took to arrive → distance = speed × time. With 4+ satellites, the receiver solves for its 3D position (x, y, z) and its clock error simultaneously. This is <strong>trilateration</strong> — the 3D equivalent of drawing circles from known points.</p></div>
<div class="formula-box"><span class="tag">Pseudorange Equation</span><div class="f">\\(\\rho_i=\\sqrt{(x_i-x)^2+(y_i-y)^2+(z_i-z)^2}+c\\,\\delta t\\)</div><small>ρ_i = measured pseudorange to satellite i, (x_i, y_i, z_i) = satellite position (from broadcast), (x, y, z) = receiver position (unknown), c = speed of light, δt = receiver clock bias (unknown). Four unknowns → need 4 satellites minimum.</small></div>
<div class="formula-box"><span class="tag">Linearized Solution</span><div class="f">\\(\\Delta\\rho=H\\,\\Delta x+\\epsilon\\)</div><small>Linearize around initial guess. H = geometry matrix (satellite directions), Δx = [Δx, Δy, Δz, cδt]^T. Solve via least squares: Δx = (H^T H)^{-1} H^T Δρ. Iterate until convergence.</small></div>
<div class="example-box"><span class="tag">GPS Positioning Worked Example</span>
<p>Receiver measures pseudoranges to 4 satellites. Satellite positions (from ephemeris): S1=(20,200,21,500 km), S2=(-12,300,18,200 km), S3=(8,100,-22,400 km), S4=(15,600,19,800 km).</p>
<p class="res">Pseudoranges: ρ₁=20,250 km, ρ₂=22,350 km, ρ₃=25,100 km, ρ₄=21,800 km.</p>
<p class="res">Solve 4 equations with 4 unknowns (x, y, z, cδt) → Position: (34.05°N, 118.25°W, 0 km) = Los Angeles. Clock bias: +2.3 μs (receiver clock is fast).</p>
<p>Accuracy: ~3–5m (standard GPS), ~1–2m (differential GPS), ~1–10 cm (RTK with carrier phase).</p></div>
<h3>GNSS Constellations Compared</h3>
<div class="tbl-wrap"><table class="dt">
<thead><tr><th>System</th><th>Country</th><th>Altitude</th><th>Satellites</th><th>Frequencies</th><th>Key Feature</th></tr></thead>
<tbody>
<tr><td><strong>GPS</strong></td><td>USA</td><td>20,200 km</td><td>31 (operational)</td><td>L1 (1575 MHz), L2, L5</td><td>Original, most widely used, ~3m accuracy</td></tr>
<tr><td><strong>GLONASS</strong></td><td>Russia</td><td>19,100 km</td><td>24</td><td>L1, L2 (FDMA + CDMA)</td><td>Higher latitude coverage, ~5m accuracy</td></tr>
<tr><td><strong>Galileo</strong></td><td>EU</td><td>23,222 km</td><td>28 (planned 30)</td><td>E1, E5, E6</td><td>Civilian-controlled, highest accuracy (~1m), Search & Rescue</td></tr>
<tr><td><strong>BeiDou</strong></td><td>China</td><td>21,150 km (MEO) + GEO + IGSO</td><td>45 (35 MEO + 10 GEO/IGSO)</td><td>B1, B2, B3</td><td>Hybrid constellation, Asia-Pacific optimized, ~5m accuracy</td></tr>
<tr><td><strong>NavIC (IRNSS)</strong></td><td>India</td><td>36,000 km (GEO) + 2 MEO</td><td>7 (4 GEO + 3 MEO)</td><td>L5, S1</td><td>India + 1500 km surrounding region, ~10m accuracy</td></tr>
<tr><td><strong>QZSS (Michibiki)</strong></td><td>Japan</td><td>32,000–40,000 km (HEO)</td><td>4</td><td>L1, L2, L5</td><td>Japan + Asia-Oceania, GPS augmentation, ~1m accuracy</td></tr>
</tbody></table></div>
<div class="example-box"><span class="tag">Why multiple constellations?</span>
<p>Using GPS + GLONASS + Galileo simultaneously gives 80+ satellites visible. Benefits: (1) Better geometry (lower DOP), (2) Improved availability in urban canyons, (3) Faster convergence for PPP, (4) Redundancy if one system is jammed. Modern receivers track all constellations — your phone uses GPS + GLONASS + Galileo + BeiDou simultaneously.</p></div>
<div class="note tip"><span class="tag">GPS Math Interview Q&A</span><p><strong>Q: Why do you need 4 satellites instead of 3 for 3D position?</strong><br/>Three satellites give 3 distance equations → 3 unknowns (x, y, z). But the receiver clock is not perfectly synchronized with satellite atomic clocks. The 4th satellite solves for clock bias (cδt) as the 4th unknown. Without it, position errors would be ~300 meters (light-travel time error × c).</p><p><strong>Q: What is DOP (Dilution of Precision)?</strong><br/>DOP quantifies how satellite geometry affects position accuracy. Low DOP (good geometry) = satellites spread across sky → accurate fix. High DOP (poor geometry) = satellites clustered → poor fix. DOP = sqrt(trace((H^T H)^{-1})). GDOP < 3 is excellent, > 6 is poor.</p><p><strong>Q: What is the difference between pseudorange and carrier phase?</strong><br/>Pseudorange: measures code delay → ~3–5m accuracy, no ambiguity. Carrier phase: measures phase of carrier wave → ~1–2cm accuracy, but has integer ambiguity (how many full cycles?). RTK resolves ambiguity in real-time using base station.</p><p><strong>Q: How does RTK achieve cm-level accuracy?</strong><br/>A fixed base station at known coordinates computes its own pseudoranges → difference between known and measured = atmospheric/clock errors. This correction is broadcast to roving receivers in real-time. The double-differencing eliminates most errors, leaving carrier-phase ambiguity as the only unknown to resolve.</p><p><strong>Q: What is PPP (Precise Point Positioning)?</strong><br/>Single-receiver positioning using precise satellite orbits and clock products (from IGS). No base station needed. Convergence: 10–30 minutes to reach cm-level. Applications: offshore surveying, autonomous vehicles, precision agriculture where base stations are impractical.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p8-1',part:'p8',num:'8.2',title:'How SAR Works',dek:'Synthetic aperture radar physics and image formation',tags:'SAR synthetic aperture radar physics microwave imaging',body:`<p>SAR (Synthetic Aperture Radar) is an active microwave imaging system. Unlike optical sensors that passively record reflected sunlight, SAR transmits its own microwave pulses and records the backscattered echoes.</p>
<h3>SAR Imaging Principle</h3>
<div class="note tip"><span class="tag">Core concept</span>
<p>A small antenna on a moving platform (satellite or aircraft) sends microwave pulses sideways toward the ground. The reflected echoes are recorded with both amplitude (strength) and phase (timing). As the platform moves, it synthesizes a very long virtual antenna from many pulse positions — hence "synthetic aperture."</p></div>
<div class="formula-box"><span class="tag">Azimuth Resolution</span><div class="f">\\(\\delta_{\\mathrm{az}}=\\frac{L_{\\mathrm{ant}}}{2}\\)</div><small>Surprisingly, azimuth (along-track) resolution is half the physical antenna length, independent of range. Longer synthetic aperture = finer resolution.</small></div>
<div class="formula-box"><span class="tag">Range Resolution</span><div class="f">\\(\\delta_r=\\frac{c}{2B}\\)</div><small>c = speed of light, bandwidth = transmitted pulse bandwidth. Wider bandwidth = finer range resolution.</small></div>
<h3>SAR Image Properties</h3>
<div class="formula-box"><span class="tag">Amplitude (Intensity)</span><div class="f">\\(I=|S|^2\\ \\text{(complex value)}\\)</div><small>Represents backscatter strength. Rough surfaces = bright, smooth surfaces = dark (specular reflection away from sensor).</small></div>
<div class="formula-box"><span class="tag">Phase</span><div class="f">\\(\\phi=\\arctan\\frac{\\mathrm{Im}(S)}{\\mathrm{Re}(S)}\\)</div><small>Measures the round-trip distance to sub-wavelength precision. Used for interferometry (InSAR) to measure ground deformation.</small></div>
<h3>Speckle Noise</h3>
<div class="note warn"><span class="tag">The defining SAR challenge</span>
<p>Speckle is multiplicative noise that gives SAR images their characteristic grainy appearance. It arises from coherent interference of scattered waves within a resolution cell. Speckle is NOT additive noise — it scales with signal strength.</p></div>
<div class="formula-box"><span class="tag">Speckle Model</span><div class="f">\\(I_{\\mathrm{obs}}=I_{\\mathrm{true}}\\cdot n\\)</div><small>n is a multiplicative noise term with exponential distribution (for single-look). Reduces with averaging (multilooking).</small></div>
<div class="formula-box"><span class="tag">Multilooking</span><div class="f">\\(\\mathrm{ENL}=L_a\\,L_r\\)</div><small>Equivalent Number of Looks. Averaging L independent looks reduces speckle variance by factor L. Tradeoff: resolution degrades.</small></div>
<h3>SAR Polarization</h3>
<div class="tbl-wrap"><table class="dt">
<thead><tr><th>Polarization</th><th>Description</th><th>Best For</th></tr></thead>
<tbody>
<tr><td>VV</td><td>Vertical transmit, Vertical receive</td><td>Ocean waves, surface roughness</td></tr>
<tr><td>VH</td><td>Vertical transmit, Horizontal receive</td><td>Vegetation volume scattering</td></tr>
<tr><td>HH</td><td>Horizontal transmit, Horizontal receive</td><td>Flood mapping, double-bounce</td></tr>
<tr><td>HV</td><td>Horizontal transmit, Vertical receive</td><td>Biomass, forest structure</td></tr>
</tbody></table></div>
<h3>Why SAR for ML?</h3>
<div class="note tip"><span class="tag">SAR advantages</span>
<p><strong>Cloud-penetrating:</strong> Works in tropical regions with persistent cloud cover.</p>
<p><strong>Day/night:</strong> Active illumination — no sunlight needed.</p>
<p><strong>Temporal consistency:</strong> Same illumination geometry enables reliable time series.</p>
<p><strong>Sensitivity to structure:</strong> Backscatter depends on surface roughness, moisture, and geometry — not just color.</p></div>
<div class="formula-box"><span class="tag">Backscatter Coefficient (sigma-0)</span><div class="f">\\(\\sigma^0=\\frac{\\mathrm{DN}^2 A}{\\sin\\theta}\\)</div><small>Calibrated radar cross-section per unit area. DN = digital number, A = pixel area, theta = incidence angle. Required for radiometric comparison across images.</small></div>
<div class="example-box"><span class="tag">SAR Image Interpretation</span>
<p><strong>Bright pixels:</strong> Rough surfaces (urban, rocks), double-bounce (building walls), corner reflectors.</p>
<p><strong>Dark pixels:</strong> Smooth surfaces (water, roads, runways) — specular reflection away from sensor.</p>
<p><strong>Medium gray:</strong> Vegetation, bare soil — diffuse scattering.</p>
<p class="res">Water detection in SAR: dark = water, bright = ships/oil spills on water</p></div>
<h3>SAR Imaging Modes</h3>
<div class="note tip"><span class="tag">Stripmap vs Spotlight vs ScanSAR</span><p><strong>Stripmap:</strong> Antenna points sideways, continuous strip as satellite moves. Standard mode. Sentinel-1 uses this. Resolution ~5m×20m.</p><p><strong>Spotlight:</strong> Antenna steers to illuminate same area longer. Higher azimuth resolution (~1m) but smaller area.</p><p><strong>ScanSAR:</strong> Antenna sweeps across multiple sub-swaths. Wide coverage (~400km) but coarser resolution (~50m). Used for ocean monitoring.</p></div>
<h3>Interferometric SAR (InSAR)</h3>
<div class="formula-box"><span class="tag">Phase Difference</span><div class="f">\\(\\Delta\\phi=\\frac{4\\pi B_{\\perp}}{\\lambda R\\sin\\theta}\\)</div><small>Phase difference between two SAR images measures ground deformation. B_perp = perpendicular baseline, lambda = wavelength, R = range, theta = incidence angle. Sensitivity: millimeter-scale deformation from orbit.</small></div>
<div class="example-box"><span class="tag">InSAR — Measuring Earthquakes</span><p>Two SAR images acquired before and after an earthquake. The phase difference reveals ground displacement. An interferogram shows fringes — each fringe represents \\(\\lambda/2\\) (≈2.8 cm for C-band) of line-of-sight motion. This mapped the 2014 Napa earthquake with mm precision.</p></div>
<div class="note tip"><span class="tag">SAR Interview Q&A</span><p><strong>Q: Why is SAR side-looking?</strong><br/>A downward-looking SAR would have range ambiguity — targets at same range but different azimuth positions would be indistinguishable. Side-looking geometry ensures each ground point has a unique range, enabling 2D imaging.</p><p><strong>Q: What is the Doppler effect in SAR?</strong><br/>As the satellite approaches a target, the echo frequency shifts up; as it moves away, it shifts down. This Doppler history enables azimuth compression — the key to achieving fine azimuth resolution from a small physical antenna.</p><p><strong>Q: Why does SAR use microwave wavelengths instead of visible light?</strong><br/>Microwaves penetrate clouds, rain, and vegetation canopy. They work day and night (active illumination). The tradeoff: longer wavelengths mean coarser resolution for the same antenna size — hence the need for synthetic aperture.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p8-2',part:'p8',num:'8.3',title:'Remote Sensing Metrics',dek:'ML evaluation for satellite and aerial imagery',tags:'remote sensing satellite aerial imagery metrics',body:`<p>Remote sensing applies ML to satellite, aerial, and drone imagery. The metrics are familiar, but the context introduces unique challenges.</p>
<h3>Key Challenges in Remote Sensing</h3>
<div class="note warn"><span class="tag">Domain-specific challenges</span>
<p><strong>Class imbalance:</strong> Background pixels vastly outnumber objects of interest (buildings, ships, vehicles).</p>
<p><strong>Scale variation:</strong> Objects range from 10m ships to 100m buildings in the same image.</p>
<p><strong>Spectral bands:</strong> Satellite images have more than RGB (NIR, SWIR, thermal).</p>
<p><strong>Temporal changes:</strong> Multi-date imagery requires change detection metrics.</p></div>
<h3>Standard Metrics Applied to Remote Sensing</h3>
<div class="formula-box"><span class="tag">Overall Accuracy (OA)</span><div class="f">\\(\\mathrm{OA}=\\frac{\\sum\\text{correct}}{\\text{total}}\\)</div><small>Same as standard accuracy. Misleading when classes are imbalanced.</small></div>
<div class="formula-box"><span class="tag">Average Accuracy (AA)</span><div class="f">\\(\\mathrm{AA}=\\frac{1}{C}\\sum_{c=1}^{C}\\mathrm{Acc}_c\\)</div><small>Mean of per-class accuracies. Treats all classes equally regardless of size.</small></div>
<div class="formula-box"><span class="tag">Kappa Coefficient</span><div class="f">\\(\\kappa=\\frac{p_o-p_e}{1-p_e}\\)</div><small>Corrects for chance agreement. p_o = observed accuracy, p_e = expected accuracy by chance.</small></div>
<dl class="varkey"><dt>Kappa = 1</dt><dd>Perfect agreement</dd><dt>Kappa = 0</dt><dd>Same as random</dd><dt>Kappa < 0</dt><dd>Worse than random</dd></dl>
<div class="example-box"><span class="tag">Worked Example — Land Cover Classification</span>
<p>A 5-class land cover map (water, forest, urban, agriculture, bare soil). 10,000 pixels total.</p>
<p>Confusion: Water=950/1000, Forest=1800/2000, Urban=600/1500, Agri=2400/3000, Bare=250/2500</p>
<p class="res">OA = (950+1800+600+2400+250)/10000 = 60%</p>
<p class="res">AA = (0.95+0.90+0.40+0.80+0.10)/5 = 63%</p>
<p>Urban and Bare Soil have poor per-class accuracy. Kappa would reveal this.</p></div>
<div class="note tip"><span class="tag">When to use Kappa</span><p>Use Kappa when comparing classifiers on the same imbalanced dataset. It removes the "luck" factor from overall accuracy.</p></div>
<h3>Confusion Matrix for Remote Sensing</h3>
<div class="example-box"><span class="tag">5-Class Land Cover Confusion Matrix</span>
<p>Rows = actual, Columns = predicted. Diagonal = correct. Off-diagonal = errors.</p>
<div class="f">\\[\\begin{bmatrix}950&20&15&10&5\\\\ 30&1800&50&80&40\\\\ 100&80&600&400&320\\\\ 20&60&150&2400&370\\\\ 10&30&50&260&2650\\end{bmatrix}\\]</div>
<p class="res">Urban class: 600/1500 = 40% recall. Many urban pixels misclassified as agriculture (400) — confusion between peri-urban and cropland.</p></div>
<h3>Handling Class Imbalance</h3>
<div class="note tip"><span class="tag">Remote sensing is inherently imbalanced</span><p>Background (water, forest) dominates. Buildings might be 0.1% of pixels. Strategies: (1) Oversample minority classes, (2) Class-weighted loss, (3) Focal loss for segmentation, (4) Patch-based training with balanced sampling, (5) Report per-class metrics alongside OA.</p></div>
<h3>Spatial Cross-Validation</h3>
<div class="note warn"><span class="tag">Spatial autocorrelation breaks standard CV</span><p>Neighboring pixels are highly correlated. Standard random split leaks information → inflated accuracy. Use <strong>spatial block CV</strong>: divide the study area into blocks, train on some blocks, test on others. This ensures test pixels are spatially independent from training pixels.</p></div>
<div class="note tip"><span class="tag">Remote Sensing Interview Q&A</span><p><strong>Q: What is Producer's Accuracy vs User's Accuracy?</strong><br/>Producer's Accuracy = Recall = how many of actual class c were correctly classified. User's Accuracy = Precision = of pixels labeled c, how many truly are c. Low Producer's = omission errors (missed). Low User's = commission errors (false alarms).</p><p><strong>Q: Why is Overall Accuracy misleading in remote sensing?</strong><br/>Classes are severely imbalanced. If water is 40% of pixels, a water-only classifier gets 40% OA while doing nothing useful. Use Kappa, per-class metrics, or mIoU instead.</p><p><strong>Q: What is the difference between OA, AA, and Kappa?</strong><br/>OA = total correct / total pixels (biased toward majority class). AA = mean of per-class accuracies (treats all classes equally). Kappa = agreement beyond chance (removes "lucky" correctness from imbalanced data).</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p8-3',part:'p8',num:'8.4',title:'Change Detection',dek:'Measuring differences between multi-temporal satellite images',tags:'change detection temporal satellite difference',body:`<p>Change detection compares two images of the same area taken at different times to identify what changed.</p>
<h3>Change Detection Metrics</h3>
<div class="formula-box"><span class="tag">Change Detection Accuracy</span><div class="f">\\(\\mathrm{OA}=\\frac{TP+TN}{TP+TN+FP+FN}\\)</div><small>TP = correctly detected change, TN = correctly detected no-change. Standard accuracy applied to binary change map.</small></div>
<div class="formula-box"><span class="tag">F1 for Change Detection</span><div class="f">\\(F_1=\\frac{2\\,\\mathrm{Precision}\\cdot\\mathrm{Recall}}{\\mathrm{Precision}+\\mathrm{Recall}}\\)</div><small>Precision = TP/(TP+FP), Recall = TP/(TP+FN). Change is usually the minority class.</small></div>
<div class="formula-box"><span class="tag">False Alarm Rate (FAR)</span><div class="f">\\(\\mathrm{FAR}=\\frac{FP}{FP+TN}\\)</div><small>Proportion of no-change pixels incorrectly flagged as change. Critical in operational monitoring.</small></div>
<div class="formula-box"><span class="tag">Miss Detection Rate (MDR)</span><div class="f">\\(\\mathrm{MDR}=\\frac{FN}{FN+TP}\\)</div><small>Proportion of actual changes that were missed. Inverse of Recall.</small></div>
<h3>Image Difference Metrics</h3>
<div class="formula-box"><span class="tag">Mean Absolute Difference (MAD)</span><div class="f">\\(\\mathrm{MAD}=\\frac{1}{N}\\sum_i|I_1(i)-I_2(i)|\\)</div><small>Average pixel-wise absolute difference between two images. Simple but sensitive to noise.</small></div>
<div class="formula-box"><span class="tag">Structural Similarity (SSIM)</span><div class="f">\\(\\mathrm{SSIM}=\\frac{(2\\mu_1\\mu_2+C_1)(2\\sigma_{12}+C_2)}{(\\mu_1^2+\\mu_2^2+C_1)(\\sigma_1^2+\\sigma_2^2+C_2)}\\)</div><small>Measures perceptual similarity. SSIM = 1 means identical. Use for quality assessment of change maps.</small></div>
<div class="example-box"><span class="tag">Worked Example — Deforestation Alert</span>
<p>Before image: 10,000 pixels (8,000 forest, 2,000 non-forest). After image: deforestation occurred in 500 pixels.</p>
<p>Model detects 480 of 500 changed pixels, but flags 120 no-change pixels as change.</p>
<p class="res">TP=480, FN=20, FP=120, TN=9,380</p>
<p class="res">Precision = 480/600 = 80%, Recall = 480/500 = 96%</p>
<p class="res">F1 = 2*0.80*0.96/(0.80+0.96) = 87.3%</p>
<p class="res">FAR = 120/9,500 = 1.26% (low false alarms)</p></div>
<div class="note warn"><span class="tag">Imbalance in change detection</span><p>Changes are rare (often <5% of pixels). Accuracy is meaningless — a "no-change" classifier gets 95%+. Use F1, Precision, Recall, and FAR.</p></div>
<h3>Change Detection Methods</h3>
<div class="note tip"><span class="tag">Method taxonomy</span><p><strong>Pixel-based:</strong> Compare corresponding pixels directly (difference, ratio, log-ratio). Simple but noisy. <strong>Feature-based:</strong> Extract features (spectral, textural) from each image, then compare feature spaces. More robust. <strong>Object-based:</strong> Segment images into objects first, then compare object properties. Handles noise better. <strong>Deep learning:</strong> Siamese networks, change transformers — learn to detect changes from labeled pairs.</p></div>
<div class="example-box"><span class="tag">Post-Classification Comparison</span>
<p>Classify each image independently, then compare class maps pixel-by-pixel. A pixel that was "forest" in time 1 and "urban" in time 2 = deforestation.</p>
<p class="res">Advantage: Gives a matrix showing what changed to what (forest→urban, agriculture→water, etc.). Disadvantage: Errors compound — both classifications must be accurate.</p></div>
<div class="formula-box"><span class="tag">Image Regression</span><div class="f">\\(I_2=\\alpha I_1+\\beta+\\epsilon\\)</div><small>Model the relationship between two dates. Changes are pixels with large residual epsilon. Handles radiometric differences between dates.</small></div>
<div class="note tip"><span class="tag">Change Detection Interview Q&A</span><p><strong>Q: Why is False Alarm Rate critical in operational monitoring?</strong><br/>A deforestation alert system with 10% FAR sends rangers to investigate 10 false alarms for every true change. This wastes resources and erodes trust. Operational systems typically require FAR < 1%.</p><p><strong>Q: What is radiometric normalization and why is it needed?</strong><br/>Different acquisition dates have different sun angles, atmospheric conditions, and sensor calibration. Without normalization, brightness differences appear as "changes" that are actually just different lighting. Methods: histogram matching, pseudo-invariant features, relative radiometric correction.</p><p><strong>Q: How do you evaluate a change detection algorithm?</strong><br/>Report: (1) F1/Recall/Precision on the change class, (2) False Alarm Rate on the no-change class, (3) per-class change accuracy if multiple change types exist, (4) spatial quality (are detected changes contiguous or fragmented?).</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p8-4',part:'p8',num:'8.5',title:'SAR-Specific Metrics',dek:'Evaluating models on synthetic aperture radar data',tags:'SAR synthetic aperture radar speckle coherence polarimetric',body:`<p>SAR (Synthetic Aperture Radar) produces images using microwave backscatter. The physics creates unique evaluation challenges.</p>
<h3>SAR Image Characteristics</h3>
<div class="note tip"><span class="tag">Why SAR is different</span>
<p><strong>Speckle noise:</strong> Multiplicative noise from coherent imaging. Looks like grainy texture.</p>
<p><strong>All-weather:</strong> Works through clouds, rain, day/night.</p>
<p><strong>Coherence:</strong> Phase information enables interferometry (InSAR).</p>
<p><strong>Polarimetry:</strong> Multiple polarizations (HH, HV, VH, VV) provide material info.</p></div>
<h3>SAR-Specific Evaluation Metrics</h3>
<div class="formula-box"><span class="tag">Equivalent Number of Looks (ENL)</span><div class="f">\\(\\mathrm{ENL}=\\frac{\\mu^2}{\\sigma^2}\\)</div><small>Measures speckle reduction quality. Higher ENL = less speckle. Used to evaluate despeckling filters.</small></div>
<div class="formula-box"><span class="tag">Speckle Suppression Index (SSI)</span><div class="f">\\(\\mathrm{SSI}=\\frac{\\sigma_{\\mathrm{fil}}}{\\sigma_{\\mathrm{orig}}}\\)</div><small>Ratio of standard deviations. SSI < 1 means speckle was reduced.</small></div>
<div class="formula-box"><span class="tag">Edge Preservation Index (EPI)</span><div class="f">\\(\\mathrm{EPI}=\\frac{\\sum|\\text{filtered}|}{\\sum|\\text{original}|}\\)</div><small>Measures how well edges are preserved after filtering. EPI close to 1 = good.</small></div>
<div class="formula-box"><span class="tag">Coherence (InSAR)</span><div class="f">\\(\\gamma=\\frac{|E[SS^*]|}{\\sqrt{E[|S|^2]\\,E[|S^*|^2]}}\\)</div><small>Complex correlation between two SAR images. gamma=1 = perfect coherence. Used for ground deformation monitoring.</small></div>
<div class="formula-box"><span class="tag">Pauli Decomposition</span><div class="f">\\(S=aP_1+bP_2+cP_3\\)</div><small>Decomposes polarimetric SAR into surface (a), double-bounce (b), and volume (c) scattering. Used for classification features.</small></div>
<h3>SAR Change Detection Metrics</h3>
<div class="formula-box"><span class="tag">Log-Ratio Change Detector</span><div class="f">\\(D=\\left|\\log\\frac{I_1}{I_2}\\right|\\)</div><small>Ratio-based difference for SAR. Multiplicative noise becomes additive in log domain.</small></div>
<div class="formula-box"><span class="tag">Amplitude Change Detection</span><div class="f">\\(D=\\frac{|A_1-A_2|}{A_1+A_2}\\)</div><small>Normalized amplitude difference. Bounded [0,1]. Used for ship/building detection.</small></div>
<div class="example-box"><span class="tag">Worked Example — Ship Detection in SAR</span>
<p>SAR image: 1000x1000 pixels. Ocean background with 5 ships. Ships occupy 0.2% of pixels.</p>
<p>Model detects 4 ships, misses 1, and flags 50 ocean patches as ships.</p>
<p class="res">TP=4, FN=1, FP=50, TN=999,949</p>
<p class="res">Recall = 4/5 = 80% (found 4 of 5 ships)</p>
<p class="res">Precision = 4/54 = 7.4% (many false alarms)</p>
<p class="res">F1 = 2*0.074*0.80/(0.074+0.80) = 13.6%</p>
<p>Ship detection needs very high recall (missed ships are costly) but FAR must be operationally acceptable.</p></div>
<div class="note warn"><span class="tag">SAR-specific pitfalls</span>
<p><strong>Speckle inflates error:</strong> Pixel-wise metrics are noisy. Use region-based evaluation.</p>
<p><strong>Calibration matters:</strong> Absolute radiometric calibration needed for multi-temporal comparison.</p>
<p><strong>Incidence angle:</strong> Same surface looks different at different angles.</p></div>
<h3>Coherence Estimation</h3>
<div class="example-box"><span class="tag">Coherence Window</span>
<p>Coherence is estimated over a local window (typically 5×5 to 15×15 pixels). Larger windows → better coherence estimate but spatial blurring.</p>
<p class="res">Typical coherence values: Urban = 0.7–0.9 (stable structures), Vegetation = 0.2–0.4 (volume scattering, temporal decorrelation), Water = 0.1–0.3 (moving surface), Glacier = 0.3–0.6 (depends on melt state).</p></div>
<h3>Polarimetric Decomposition</h3>
<div class="note tip"><span class="tag">Physical interpretation</span><p>Polarimetric SAR (PolSAR) measures full scattering matrix. Decompositions separate scattering into physical mechanisms: <strong>Surface scattering</strong> (smooth surfaces, water), <strong>Double-bounce</strong> (building walls + ground), <strong>Volume scattering</strong> (vegetation canopy). These become features for ML classification.</p></div>
<div class="formula-box"><span class="tag">Cloude-Pottier Decomposition</span><div class="f">\\(H=\\sum_{i=1}^{3}-p_i\\log_3 p_i\\quad\\bar{\\alpha}=\\sum_{i=1}^{3}p_i\\alpha_i\\)</div><small>Entropy H measures scattering randomness (0 = deterministic, 1 = random). Alpha angle indicates dominant scattering mechanism (0° = surface, 45° = volume, 90° = double-bounce). Used for unsupervised classification.</small></div>
<div class="note tip"><span class="tag">SAR Metrics Interview Q&A</span><p><strong>Q: What is speckle and how does it affect ML?</strong><br/>Speckle is multiplicative noise from coherent interference of scattered waves within a resolution cell. It gives SAR images a grainy texture. For ML: it inflates pixel-wise errors, reduces classification accuracy, and requires either despeckling preprocessing or speckle-robust architectures (e.g., RNN-based despeckling).</p><p><strong>Q: What is ENL and how do you compute it?</strong><br/>Equivalent Number of Looks measures speckle reduction quality. ENL = mean² / variance over a homogeneous area. Single-look SAR: ENL ≈ 1 (maximum speckle). Multi-look with 5 looks: ENL ≈ 5. Despeckled images: ENL > 20 indicates strong speckle reduction.</p><p><strong>Q: When would you use Pauli decomposition vs Cloude-Pottier?</strong><br/>Pauli: deterministic, gives 3 components (surface, double-bounce, volume) — good for targeted analysis. Cloude-Pottier: statistical, gives entropy and alpha — good for unsupervised classification of complex scenes. Use Pauli when you know the scattering mechanism; use Cloude-Pottier when exploring unknown areas.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p8-5',part:'p8',num:'8.6',title:'Satellite Object Detection',dek:'mAP variants for aerial and satellite object detection',tags:'satellite object detection aerial mAP tiny objects',body:`<p>Object detection in satellite imagery differs from natural images. Objects are tiny, dense, and rotated.</p>
<h3>Challenges Unique to Satellite Detection</h3>
<div class="note tip"><span class="tag">Satellite-specific issues</span>
<p><strong>Tiny objects:</strong> Cars are 10-30 pixels. Ships are 50-200 pixels.</p>
<p><strong>Dense scenes:</strong> Parking lots, ports, urban areas have hundreds of objects.</p>
<p><strong>Rotation:</strong> Objects can be at any orientation (not axis-aligned).</p>
<p><strong>Multi-scale:</strong> Same image has cars and buildings (10x size difference).</p></div>
<h3>Satellite Detection Metrics</h3>
<div class="formula-box"><span class="tag">DOTA mAP</span><div class="f">\\(\\mathrm{mAP}=\\frac{1}{C}\\sum_{c=1}^{C}\\mathrm{AP}_c\\) with IoU threshold on rotated boxes</div><small>DOTA benchmark uses rotated bounding boxes. Standard COCO mAP doesn't handle rotation.</small></div>
<div class="formula-box"><span class="tag">DIOR-R mAP</span><div class="f">mAP with horizontal boxes at IoU=0.5 and 0.7</div><small>DIOR-R is another aerial detection benchmark. Reports at two IoU thresholds.</small></div>
<div class="formula-box"><span class="tag">Recall@K</span><div class="f">\\(\\mathrm{Recall}@K=\\frac{\\text{TP in top }K}{\\text{total GT}}\\)</div><small>How many objects are found in the top K predictions. Important when false positives can be filtered later.</small></div>
<div class="formula-box"><span class="tag">Small Object AP (sAP)</span><div class="f">AP computed only on objects with area < threshold</div><small>Reports performance separately for small (<32px), medium, and large objects.</small></div>
<h3>IoU for Rotated Boxes</h3>
<div class="formula-box"><span class="tag">Rotated IoU</span><div class="f">\\(\\mathrm{IoU}_{\\mathrm{rot}}=\\frac{|R_{\\mathrm{pred}}\\cap R_{\\mathrm{GT}}|}{|R_{\\mathrm{pred}}\\cup R_{\\mathrm{GT}}|}\\)</div><small>Standard IoU on oriented (rotated) rectangles. More accurate for elongated objects like ships and planes.</small></div>
<div class="example-box"><span class="tag">Worked Example — Ship Detection (DOTA)</span>
<p>Benchmark: 1,411 images, 15 categories. Ships are category "ship".</p>
<p>Model detects: 800 ships, IoU threshold 0.5.</p>
<p>Ground truth: 1,000 ships. Correct detections (IoU>=0.5): 700.</p>
<p class="res">Recall = 700/1000 = 70%</p>
<p class="res">Precision = 700/800 = 87.5%</p>
<p class="res">F1 = 2*0.875*0.70/(0.875+0.70) = 77.8%</p>
<p>sAP (ships < 32px) = 45%, lAP (ships > 96px) = 92%. Tiny ships are harder.</p></div>
<div class="note tip"><span class="tag">Choosing the right IoU threshold</span><p>For tiny objects, IoU=0.5 is harsh. A 20x20 ship shifted by 5 pixels drops IoU from 1.0 to 0.31. Use IoU=0.25 for small objects, or report multiple thresholds.</p></div>
<h3>DOTA Benchmark Details</h3>
<div class="note tip"><span class="tag">DOTA dataset</span><p><strong>DOTA-v1.0:</strong> 2,806 images, 15 categories (plane, ship, storage tank, baseball diamond, tennis court, basketball court, ground track field, harbor, bridge, large vehicle, small vehicle, helicopter, roundabout, soccer ball field, swimming pool). Images from multiple sensors (GF-2, Sentinel-2, Google Earth). <strong>DOTA-v1.5:</strong> Added 100m+ height aircraft and improved annotations. <strong>DOTA-v2.0:</strong> Added 18 categories including container crane.</p></div>
<h3>Rotated vs Horizontal Boxes</h3>
<div class="example-box"><span class="tag">Why rotation matters</span><p>A ship at 45° angle: horizontal bounding box covers 40% background, IoU with ground truth = 0.35. Rotated box: IoU = 0.95. The rotated representation is far more accurate for elongated objects (ships, planes, vehicles at angles). DOTA mAP uses rotated IoU.</p></div>
<div class="formula-box"><span class="tag">Rotated Box Representation</span><div class="f">\\((x_c, y_c, w, h, \\theta)\\)</div><small>Center coordinates, width, height, and rotation angle. Some detectors use 5 parameters (corner points). NMS for rotated boxes must compute rotated IoU, which is more expensive than axis-aligned IoU.</small></div>
<h3>Tiny Object Detection Strategies</h3>
<div class="note tip"><span class="tag">Handling tiny objects</span><p><strong>Tiled inference:</strong> Split large satellite images into overlapping patches (e.g., 1024×1024), detect on each, merge results. <strong>Feature pyramid:</strong> Use FPN to detect small objects at high-resolution layers. <strong>Super-resolution:</strong> Upscale before detection (GANs, diffusion). <strong>Context enhancement:</strong> Add surrounding context to help identify small objects.</p></div>
<div class="note tip"><span class="tag">Satellite Detection Interview Q&A</span><p><strong>Q: Why is NMS harder for rotated detection?</strong><br/>Standard NMS uses axis-aligned IoU. For rotated boxes, IoU computation requires polygon intersection (more expensive). Rotated NMS must handle overlapping rotated rectangles that may overlap in non-obvious ways. Some methods use standard NMS on axis-aligned approximations as a fast pre-filter.</p><p><strong>Q: What is the difference between DOTA and COCO for satellite detection?</strong><br/>DOTA uses rotated bounding boxes; COCO uses axis-aligned. DOTA categories are aerial-specific (planes, ships, bridges). DOTA images are much larger (1000-4000px) with tiny objects. Standard COCO mAP doesn't handle rotation, so DOTA requires specialized evaluation code.</p><p><strong>Q: How do you handle dense scenes with hundreds of objects?</strong><br/>Use: (1) Anchor-free detectors (FCOS, CenterNet) to avoid anchor explosion, (2) Non-local attention to capture long-range dependencies, (3) Tiled inference with careful overlap handling to avoid splitting objects at patch boundaries, (4) Confident NMS with per-class thresholds.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p8-6',part:'p8',num:'8.7',title:'Remote Sensing Segmentation',dek:'Land cover, building footprint, and crop mapping metrics',tags:'remote sensing segmentation land cover building footprint crop',body:`<p>Pixel-level classification in satellite imagery includes land cover mapping, building footprint extraction, and crop type classification.</p>
<h3>Land Cover Classification</h3>
<div class="formula-box"><span class="tag">Overall Accuracy (OA)</span><div class="f">\\(\\mathrm{OA}=\\frac{\\sum_i TP_i}{\\text{total}}\\)</div><small>Standard pixel accuracy. Misleading when classes are imbalanced (e.g., water vs urban).</small></div>
<div class="formula-box"><span class="tag">Mean IoU (mIoU)</span><div class="f">\\(\\mathrm{mIoU}=\\frac{1}{C}\\sum_{c=1}^{C}\\mathrm{IoU}_c\\)</div><small>Average IoU across all C land cover classes. The standard segmentation metric.</small></div>
<div class="formula-box"><span class="tag">Frequency-Weighted IoU (FWIoU)</span><div class="f">\\(\\mathrm{FWIoU}=\\sum_i P_i\\,\\mathrm{IoU}_i\\)</div><small>Weights IoU by class frequency. Larger classes contribute more.</small></div>
<h3>Building Footprint Segmentation</h3>
<div class="formula-box"><span class="tag">Building IoU</span><div class="f">\\(\\mathrm{IoU}=\\frac{|B_{\\mathrm{pred}}\\cap B_{\\mathrm{GT}}|}{|B_{\\mathrm{pred}}\\cup B_{\\mathrm{GT}}|}\\)</div><small>IoU specifically for the building class. Often reported separately from background IoU.</small></div>
<div class="formula-box"><span class="tag">Boundary F1 (BF1)</span><div class="f">\\(\\mathrm{BF1}=F_1\\big|_{\\text{boundary}}\\)</div><small>Measures how accurately building boundaries are delineated. Critical for cadastral mapping.</small></div>
<div class="formula-box"><span class="tag">Detection Rate</span><div class="f">\\(\\mathrm{DR}=\\frac{\\text{detected}}{\\text{GT buildings}}\\)</div><small>Proportion of buildings found. A building is "detected" if IoU > threshold.</small></div>
<h3>Crop Type Classification</h3>
<div class="formula-box"><span class="tag">Crop F1 (macro)</span><div class="f">\\(F_{1,\\mathrm{macro}}=\\frac{1}{C}\\sum_{c=1}^{C}F_{1,c}\\)</div><small>F1 averaged over crop types. Treats rare crops equally to common ones.</small></div>
<div class="formula-box"><span class="tag">Producer's Accuracy</span><div class="f">\\(\\mathrm{PA}_c=\\frac{TP_c}{TP_c+FN_c}=\\mathrm{Recall}_c\\)</div><small>How many of class c were correctly classified. Same as recall per class.</small></div>
<div class="formula-box"><span class="tag">User's Accuracy</span><div class="f">\\(\\mathrm{UA}_c=\\frac{TP_c}{TP_c+FP_c}=\\mathrm{Precision}_c\\)</div><small>Of pixels labeled c, how many truly are c. Same as precision per class.</small></div>
<div class="example-box"><span class="tag">Worked Example — Crop Mapping</span>
<p>5 crop types: Wheat(40%), Corn(30%), Soy(15%), Rice(10%), Other(5%).</p>
<p>Per-class F1: Wheat=0.92, Corn=0.88, Soy=0.75, Rice=0.60, Other=0.45.</p>
<p class="res">F1_macro = (0.92+0.88+0.75+0.60+0.45)/5 = 0.72</p>
<p class="res">F1_weighted = 0.40*0.92+0.30*0.88+0.15*0.75+0.10*0.60+0.05*0.45 = 0.85</p>
<p>Macro F1 reveals that rare crops (Rice, Other) perform poorly, while weighted F1 hides this.</p></div>
<div class="note tip"><span class="tag">Multi-temporal features</span><p>Satellite time series (e.g., Sentinel-2 every 5 days) dramatically improve crop classification. Use temporal features (NDVI curves) and evaluate with the same metrics.</p></div>
<div class="note warn"><span class="tag">Spatial autocorrelation</span><p>Neighboring pixels are not independent. Standard cross-validation overestimates accuracy. Use spatial block cross-validation instead.</p></div>
<h3>Building Footprint Extraction</h3>
<div class="example-box"><span class="tag">Building Segmentation Workflow</span>
<p>1. Acquire high-resolution imagery (WorldView, 0.3m). 2. Preprocess: orthorectify, atmospheric correction. 3. Train U-Net/DeepLab on labeled building footprints. 4. Post-process: morphological operations to clean boundaries, remove small fragments (<5m²). 5. Evaluate: IoU, BF1, detection rate.</p>
<p class="res">Challenge: shadows from tall buildings obscure adjacent buildings. Multi-angle imagery or shadow detection preprocessing helps.</p></div>
<div class="formula-box"><span class="tag">Boundary F1 Detail</span><div class="f">\\(\\mathrm{BF1}=\\frac{2\\cdot P_b\\cdot R_b}{P_b+R_b}\\)</div><small>P_b = boundary precision (predicted boundary pixels near true boundary), R_b = boundary recall (true boundary pixels near predicted boundary). Use a tolerance distance (e.g., 2 pixels) for matching.</small></div>
<h3>Crop Type Classification with Temporal Features</h3>
<div class="example-box"><span class="tag">Temporal NDVI Profiles</span>
<p>Different crops have distinct phenological cycles. Wheat: green-up in March, peak NDVI in April, harvest in June. Corn: green-up in May, peak in August, harvest in October. These temporal signatures enable crop discrimination that single-date imagery cannot achieve.</p>
<p class="res">Sentinel-2 every 5 days gives ~70 cloud-free observations per year — enough to capture phenological curves for ML classification.</p></div>
<div class="note tip"><span class="tag">Remote Sensing Segmentation Interview Q&A</span><p><strong>Q: What is mIoU and why is it the standard segmentation metric?</strong><br/>mIoU = mean Intersection over Union across all classes. It measures overlap between predicted and ground truth segmentation masks. It's robust to class imbalance (unlike pixel accuracy) and directly measures the spatial quality of predictions. Range: [0, 1], higher is better.</p><p><strong>Q: How do you handle class imbalance in land cover segmentation?</strong><br/>Strategies: (1) Dice loss or Focal loss instead of cross-entropy, (2) Class-weighted sampling during training, (3) Oversample rare classes (urban, water), (4) Report per-class IoU alongside mIoU, (5) Use Frequency-Weighted IoU for overall performance.</p><p><strong>Q: Why is boundary accuracy important for building footprints?</strong><br/>Building footprints are used for cadastral mapping (legal boundaries), urban planning, and population estimation. A building with 85% IoU but jagged boundaries is unusable for legal purposes. Boundary F1 measures how precisely the edges are delineated — critical for downstream applications.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p10-0',part:'p10',num:'9.1',title:'Clustering Evaluation',dek:'Silhouette, ARI, NMI — scoring partitions without labels (or with a few)',tags:'clustering silhouette ARI NMI unsupervised evaluation kmeans',body:`<p>Clustering has no ground-truth predictions to count — the algorithm invents the groups. Evaluation therefore splits two ways: <strong>internal</strong> measures (cohesion vs separation, no labels needed) for selecting \\(k\\) and comparing runs, and <strong>external</strong> measures (agreement with a reference partition) for benchmarking.</p>
<h3>Silhouette — the internal workhorse</h3><div class="formula-box"><span class="tag">Silhouette coefficient</span><div class="f">\\(s(i)=\\frac{b(i)-a(i)}{\\max(a(i),b(i))},\\qquad \\bar{s}=\\frac{1}{N}\\sum_i s(i)\\)</div><small>For point \\(i\\): \\(a(i)\\) = mean distance to its own cluster, \\(b(i)\\) = mean distance to the nearest <em>other</em> cluster. Range [−1, 1]: near 1 = tight and separated, near 0 = on a boundary, negative = probably misassigned. Average \\(\\bar{s}\\) over \\(k\\) to pick cluster count — the elbow/peak, not any absolute cutoff.</small></div>
<h3>ARI and NMI — external agreement, chance-corrected</h3><div class="formula-box"><span class="tag">Adjusted Rand Index</span><div class="f">\\(\\mathrm{ARI}=\\frac{\\mathrm{RI}-\\mathbb{E}[\\mathrm{RI}]}{\\max(\\mathrm{RI})-\\mathbb{E}[\\mathrm{RI}]}\\)</div><small>RI = fraction of point <em>pairs</em> on which two partitions agree (together or apart). The adjustment subtracts expected chance agreement: 1.0 = identical, ≈0 = random-level. Punishes lucky agreement on many small clusters.</small></div>
<div class="formula-box"><span class="tag">Normalized Mutual Information</span><div class="f">\\(\\mathrm{NMI}(U,V)=\\frac{2\\,I(U;V)}{H(U)+H(V)}\\)</div><small>Shared information between partitions over their mean entropy (§3.9, §6.3 language). Same scale story: 1 = identical, 0 = independent. Prefers balanced clusters slightly less punitively than ARI — report both when cluster sizes vary.</small></div>
<div class="example-box"><span class="tag">Worked example — reading silhouette output</span><p>K-means on customer data, \\(k=3\\): \\(\\bar{s}=0.62\\) with per-cluster means [0.71, 0.68, 0.31]. The headline looks healthy, but cluster 3 sits near 0.3 — a ragged boundary or two merged groups. Trying \\(k=4\\) gives \\(\\bar{s}=0.58\\) overall with means [0.70, 0.69, 0.61, 0.59]: lower headline, no weak cluster.</p><p class="res">Prefer k=4 — the minimum per-cluster silhouette beats the headline average for actionability</p></div>
<div class="note warn"><span class="tag">Geometry assumptions bite</span><p>Silhouette uses distances, so it inherits their pathologies: unscaled features, curved manifolds, and density-varying clusters (DBSCAN territory) all mislead it. Standardize features, and distrust any internal index on non-convex structure — visualize (t-SNE/UMAP thumbnails, §3.6 PCA first) before believing a scalar.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p10-1',part:'p10',num:'9.2',title:'Generative Image Metrics',dek:'IS, FID, LPIPS — scoring GANs and diffusion models without per-pixel truth',tags:'generative FID inception score LPIPS GAN diffusion evaluation',body:`<p>Generative models produce <em>new</em> images — there is no reference pixel to compare against. Evaluation therefore measures <strong>distributions</strong> (does the generated set look like the real set?) and <strong>perceptual similarity</strong> (do two images look alike to a human?), both through deep feature spaces rather than pixels.</p>
<h3>Inception Score — quality and diversity from a classifier</h3><div class="formula-box"><span class="tag">Inception Score</span><div class="f">\\(\\mathrm{IS}=\\exp\\left(\\mathbb{E}_x\\big[\\mathrm{KL}(p(y|x)\\,\\|\\,p(y))\\big]\\right)\\)</div><small>Good generations are confidently classifiable (sharp \\(p(y|x)\\)) and collectively diverse (flat marginal \\(p(y)\\)). Higher is better; the exponentiation turns nats into a "number of recognizable modes". Blind to the <em>training</em> distribution — a model generating sharp dogs on a cats dataset scores well.</small></div>
