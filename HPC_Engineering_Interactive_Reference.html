{id:'s-1-1', part:'p1', num:'1.1', title:'FLOPs, Peak Performance &amp; Execution Time',
 dek:'The vocabulary every other formula in this reference builds on: how "how fast" gets defined and measured.',
 tags:'flops peak performance work time gflop tflop pflop',
 body:`
 <p>Before anything else, HPC engineering needs a shared vocabulary for "how much work" and "how fast." Almost every other formula in this reference is a variation on <strong>work divided by time</strong>.</p>
 <h3>The core quantities</h3>
 <div class="varkey">
   <dt>FLOP</dt><dd>a single floating-point operation — one add, multiply, etc.</dd>
   <dt>FLOP/s</dt><dd>floating-point operations per second — the standard HPC throughput unit</dd>
   <dt>Performance</dt><dd>Work ÷ time, in whatever unit fits the workload (FLOPs/s, cells/s, iterations/s)</dd>
   <dt>Peak FLOP/s</dt><dd>the theoretical ceiling if every execution unit did useful work on every cycle, forever</dd>
 </div>
 <div class="formula-box">
   <span class="tag">Core relations</span>
   <div class="flist">
     <div class="f">Peak FLOP/s = Cores × Clock × FLOPs/cycle</div>
     <div class="f">Peak GPU FLOP/s = FP units × Clock × Operations/cycle</div>
     <div class="f">Execution time T = Work / Performance</div>
   </div>
 </div>
 <p>"Peak" is deliberately an upper bound, not a promise. It assumes every functional unit is fed data every single cycle with no stalls, no branch mispredictions, and no waiting on memory — a condition real code essentially never sustains for long. That gap between peak and achieved performance is most of what the rest of this reference is about diagnosing.</p>
 <h4>Unit prefixes you'll see everywhere</h4>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Unit</th><th class="mono">Value</th><th>Meaning</th></tr>
   <tr><td class="mono">GFLOP/s</td><td class="mono">10⁹ FLOP/s</td><td>billion floating-point ops/second</td></tr>
   <tr><td class="mono">TFLOP/s</td><td class="mono">10¹² FLOP/s</td><td>trillion — typical single modern GPU/CPU-socket scale</td></tr>
   <tr><td class="mono">PFLOP/s</td><td class="mono">10¹⁵ FLOP/s</td><td>quadrillion — typical large HPC cluster scale</td></tr>
   <tr><td class="mono">EFLOP/s</td><td class="mono">10¹⁸ FLOP/s</td><td>quintillion — the "exascale" class of system</td></tr>
 </table></div>
 <div class="example-box">
   <span class="tag">Worked example</span>
   <p>A dual-socket server has 2 sockets × 64 cores, each core running at 2.4 GHz with a 512-bit FMA unit (8 FP64 lanes × 2 FLOPs/cycle for the fused multiply-add = 16 FLOPs/cycle/core).</p>
   <p>Peak FLOP/s = 128 cores × 2.4×10⁹ Hz × 16 FLOPs/cycle = <span class="res">4.92 TFLOP/s</span></p>
   <p>The full interactive version of this calculation — with adjustable core count, clock, vector width and FMA — lives in §2.3.</p>
 </div>
 <div class="note tip"><span class="tag">Why this matters</span><p>Every efficiency number you'll ever compute (HPL efficiency, roofline headroom, GPU utilization) is a ratio against one of these peak numbers. Get the peak calculation wrong and every downstream percentage is wrong too.</p></div>
 `},

{id:'s-1-2', part:'p1', num:'1.2', title:'Speedup, Efficiency &amp; Arithmetic Intensity',
 dek:'How to quantify whether parallelizing actually helped, and how to describe a kernel\'s appetite for memory traffic.',
 tags:'speedup efficiency arithmetic intensity operational intensity strong weak scaling',
 body:`
 <div class="formula-box">
   <span class="tag">Definitions</span>
   <div class="flist">
     <div class="f">Speedup&nbsp;&nbsp;S = T_serial / T_parallel</div>
     <div class="f">Parallel efficiency&nbsp;&nbsp;E = S / P</div>
     <div class="f">Arithmetic intensity&nbsp;&nbsp;AI = FLOPs / Bytes moved</div>
   </div>
 </div>
 <p><strong>Speedup</strong> compares one number: how much faster the parallel version is than running the same work on a single core/GPU. <strong>Efficiency</strong> normalizes that by how many workers you used — a speedup of 8× on 8 workers is perfect efficiency (100%); a speedup of 8× on 64 workers is only 12.5% efficient, meaning most of the added hardware bought little.</p>
 <p><strong>Arithmetic intensity</strong> (AI) is arguably the single most important number in performance engineering: it's the ratio of computational work to the memory traffic required to do that work. High-AI kernels (dense matrix multiply) can be compute-bound; low-AI kernels (vector addition, sparse operations) are almost always memory-bound. AI is the x-axis of the Roofline Model (§1.5) — everything there builds on this number.</p>
 <h4>Strong scaling vs. weak scaling</h4>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Model</th><th>What's fixed</th><th>What it tells you</th></tr>
   <tr><td>Strong scaling</td><td>Total problem size</td><td>How runtime shrinks as you add workers to the <em>same</em> job</td></tr>
   <tr><td>Weak scaling</td><td>Work per worker</td><td>How runtime behaves as the problem grows proportionally with worker count</td></tr>
 </table></div>
 <p>These aren't interchangeable questions. A code can strong-scale poorly (communication overhead dominates once each worker's slice gets small) while weak-scaling well (each worker always has enough work to hide that overhead). §1.4 covers both in depth, including the Karp-Flatt metric for diagnosing which kind of overhead is limiting you.</p>
 <div class="example-box">
   <span class="tag">Worked example — arithmetic intensity</span>
   <p>A STREAM Triad kernel (<code>a[i] = b[i] + q*c[i]</code>) does 2 FLOPs (one multiply, one add) per element while touching 3 doubles (read b, read c, write a) = 24 bytes.</p>
   <p>AI = 2 FLOPs / 24 bytes = <span class="res">0.083 FLOP/Byte</span> — extremely low. This is why STREAM is a pure memory-bandwidth benchmark (§10.4), not a compute benchmark.</p>
 </div>
 `},

{id:'s-1-3', part:'p1', num:'1.3', title:"Amdahl's Law &amp; Gustafson's Law",
 dek:'Two different, often-confused answers to "how much does parallelism actually buy me?"',
 tags:'amdahl gustafson scaling law parallel fraction karp flatt speedup ceiling',
 calc:'amdahl',
 body:`
 <p>These are the two foundational scaling laws in parallel computing, and they answer subtly different questions. Confusing them is one of the most common mistakes in capacity planning.</p>
 <h3>Amdahl's Law — fixed problem size</h3>
 <p>Amdahl asks: <em>if I keep the problem the same size and add more workers, how much faster does it go?</em> Let <code>f</code> be the fraction of the work that parallelizes perfectly (so <code>1−f</code> is stuck running serially, however many processors you have).</p>
 <div class="formula-box">
   <span class="tag">Amdahl's Law</span>
   <div class="flist">
     <div class="f">S(P) = 1 / [(1−f) + f/P]</div>
     <div class="f">S∞ = 1 / (1−f) &nbsp;&nbsp;<small>the ceiling as P → ∞</small></div>
     <div class="f">E(P) = S(P) / P</div>
   </div>
 </div>
 <p>The uncomfortable implication: <strong>the serial fraction sets a hard ceiling on speedup, no matter how much hardware you throw at it.</strong> At f = 0.95 (95% parallel, which sounds excellent), S∞ = 1/0.05 = 20× — and you're already at 90% of that ceiling with just 180 processors. Beyond that, more hardware is close to wasted.</p>
 <h3>Gustafson's Law — scaled problem size</h3>
 <p>Gustafson pushes back on Amdahl's framing: in practice, when you get a bigger machine, you usually don't run the <em>same</em> problem faster — you run a <em>bigger</em> problem in the same time (finer mesh, more timesteps, larger dataset). Let <code>α</code> be the serial fraction of the scaled workload.</p>
 <div class="formula-box">
   <span class="tag">Gustafson's Law</span>
   <div class="f">S(P) = P − α(P − 1)</div>
 </div>
 <p>Because the problem grows with P, there's no fixed ceiling — speedup can keep climbing roughly linearly, constrained only by how α itself behaves at scale (which usually isn't perfectly constant either, since communication overhead tends to grow with worker count).</p>
 <h3>Karp-Flatt metric — diagnosing overhead from measurements</h3>
 <div class="formula-box">
   <span class="tag">Karp–Flatt experimentally-determined serial fraction</span>
   <div class="f">e = (1/S − 1/P) / (1 − 1/P)</div>
 </div>
 <p>Unlike f in Amdahl's Law (a property of the algorithm), <code>e</code> is <em>measured</em> from actual runtimes at different P. If <code>e</code> stays flat as P increases, overhead is a constant fraction (consistent with Amdahl). If <code>e</code> grows with P, something scales worse than fixed serial work — usually communication or synchronization overhead — and adding processors will help even less than Amdahl alone predicts.</p>
 <div class="calc-mount" data-calc="amdahl"></div>
 <div class="note warn"><span class="tag">Rule of thumb</span><p>If adding CPUs/GPUs stops reducing runtime, don't just add more — identify whether the limiter is serial work, memory bandwidth, communication, synchronization, I/O, or power/thermal throttling. Amdahl tells you a ceiling exists; it doesn't tell you why you hit it.</p></div>
 `},

{id:'s-1-4', part:'p1', num:'1.4', title:'Strong vs. Weak Scaling in Practice',
 dek:'Turning the strong/weak scaling concepts from §1.2 into something you actually measure and report.',
 tags:'strong weak scaling overhead efficiency scaling curve',
 body:`
 <p>In practice, scaling studies are run and reported as curves, not single numbers. Understanding what "good" looks like for each type prevents drawing the wrong conclusion from a scaling plot.</p>
 <h4>Strong scaling study</h4>
 <ul>
   <li>Fix the total problem size. Run on 1, 2, 4, 8, 16… workers.</li>
   <li>Plot speedup S(P) = T(1)/T(P) against P. Ideal is the diagonal line S(P)=P.</li>
   <li>Real curves bend below the diagonal and often plateau or worsen — Amdahl's Law plus real communication overhead in action.</li>
 </ul>
 <h4>Weak scaling study</h4>
 <ul>
   <li>Fix the work <em>per worker</em>. Grow the total problem proportionally with P.</li>
   <li>Plot runtime T(P) — ideal is a flat horizontal line (same time regardless of P, because everyone always has the same amount of work).</li>
   <li>Runtime creeping upward with P reveals overhead that scales with worker count (e.g., global reductions, growing communication neighborhoods).</li>
 </ul>
 <div class="formula-box">
   <span class="tag">Scaling overhead</span>
   <div class="f">T_overhead = T_parallel − T_ideal</div>
   <div class="f small">Everything beyond the perfectly-divided-work time: communication, synchronization, load imbalance, redundant work.</div>
 </div>
 <div class="example-box">
   <span class="tag">Worked example</span>
   <p>A CFD solver runs in 100 s on 1 node. On 16 nodes it runs in 8 s.</p>
   <p>S(16) = 100/8 = 12.5×, E(16) = 12.5/16 = <span class="res">78% parallel efficiency</span></p>
   <p>Using Karp-Flatt: e = (1/12.5 − 1/16)/(1 − 1/16) = (0.080 − 0.0625)/0.9375 ≈ <span class="res">1.9% experimentally-determined overhead fraction</span> — small but real, worth watching as P grows further.</p>
 </div>
 <div class="note tip"><span class="tag">Practical tip</span><p>Report both kinds of scaling when you can. Strong scaling tells procurement/ops "how many nodes should this specific job request." Weak scaling tells you whether the algorithm and its communication pattern will hold up as the whole system — and the problems people want to run on it — keep growing.</p></div>
 `},

{id:'s-1-5', part:'p1', num:'1.5', title:'The Roofline Model',
 dek:'A single chart that tells you, before you profile anything, whether a kernel is capped by compute or by memory bandwidth.',
 tags:'roofline model memory bound compute bound arithmetic intensity machine balance',
 calc:'roofline',
 body:`
 <p>The Roofline Model, introduced by Williams, Waterman and Patterson, plots achievable performance against arithmetic intensity (§1.2) on log-log axes. It answers one of the most consequential questions in performance engineering in a single glance: <strong>is this kernel limited by how fast the chip can compute, or by how fast data can reach it?</strong></p>
 <div class="formula-box">
   <span class="tag">The two ceilings</span>
   <div class="flist">
     <div class="f">Memory-bound ceiling: Performance ≤ Memory Bandwidth × AI</div>
     <div class="f">Compute-bound ceiling: Performance ≤ Peak Compute</div>
     <div class="f">Roofline: P ≤ min(Peak FLOP/s, BW × AI)</div>
     <div class="f">Machine balance: AI* = Peak FLOP/s / Peak Memory BW</div>
   </div>
 </div>
 <p>Picture a log-log chart: a diagonal line (the memory roofline, slope = bandwidth) rising up to meet a horizontal line (the compute roofline, at the peak FLOP/s). The diagonal-to-flat transition happens exactly at AI* — the <strong>machine balance point</strong>, a property of the hardware, not the kernel.</p>
 <ul>
   <li>If a kernel's AI is <strong>left of AI*</strong> (lower), it sits under the diagonal — <strong>memory-bandwidth bound</strong>. More FLOPs/s of hardware capability won't help; you need fewer bytes moved, better cache reuse, or faster memory.</li>
   <li>If AI is <strong>right of AI*</strong> (higher), it sits under the flat ceiling — <strong>compute bound</strong>. More bandwidth won't help; you need better vectorization, occupancy, or instruction throughput.</li>
 </ul>
 <div class="calc-mount" data-calc="roofline"></div>
 <div class="example-box">
   <span class="tag">Worked example</span>
   <p>A GPU has 40 TFLOP/s FP64 peak and 2 TB/s memory bandwidth. Machine balance AI* = 40×10¹²/2×10¹² = <span class="res">20 FLOP/Byte</span>.</p>
   <p>A sparse matrix-vector kernel typically runs around AI ≈ 0.25–2 FLOP/Byte — deep in memory-bound territory on this chip. A dense matrix-multiply kernel can reach AI well above 20 for large enough tile sizes, putting it in compute-bound territory on the same hardware.</p>
 </div>
 <div class="note tip"><span class="tag">Optimization strategy that follows directly from the model</span><p><strong>Memory-bound:</strong> reduce bytes moved (better data types, compression, blocking/tiling for reuse), improve locality, or move to hardware with more bandwidth (e.g., HBM). <strong>Compute-bound:</strong> improve vectorization, instruction mix, occupancy, or use lower-precision math units — more memory bandwidth buys nothing here.</p></div>
 `}
);
</script>

{id:'s-2-1', part:'p2', num:'2.1', title:'CPU Architecture Evolution (2008–2025)',
 dek:'Server CPU performance stopped coming mainly from clock speed around 2008. Here\'s where it has come from since.',
 tags:'cpu architecture nehalem sapphire rapids epyc zen intel amd evolution timeline',
 diagrams:['cputimeline'],
 body:`
 <p>The single most important thing to internalize about modern server CPUs: performance growth is <strong>not</strong> primarily a clock-speed story anymore. Since roughly 2008, gains have come from more cores, wider SIMD/vector units, larger and faster memory systems, chiplet/tile packaging, integrated accelerators, and better performance-per-watt — often while clock speeds stayed flat or even dropped.</p>
 <div class="diagram scrollx"><div class="diagram-mount" data-diagram="cputimeline"></div></div>
 <div class="diagram-cap">Intel and AMD server CPU generations, 2008–2025. Scroll horizontally on narrow screens.</div>
 <h3>Intel Xeon lineage</h3>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Era / Family</th><th>Period</th><th>Major HPC significance</th></tr>
   <tr><td>Nehalem / Westmere</td><td class="mono">2008–2011</td><td>Integrated memory controller, multi-core x86, QPI — the transition that ended the front-side-bus era</td></tr>
   <tr><td>Sandy Bridge / Ivy Bridge</td><td class="mono">2011–2013</td><td>AVX introduced (256-bit); FMA arrives later with Haswell</td></tr>
   <tr><td>Haswell / Broadwell</td><td class="mono">2013–2016</td><td>AVX2 + FMA; ring-based multi-core scaling</td></tr>
   <tr><td>Skylake-SP</td><td class="mono">2017</td><td>AVX-512, mesh interconnect (replacing the ring), UPI, non-inclusive LLC</td></tr>
   <tr><td>Cascade Lake</td><td class="mono">2019</td><td>AVX-512 refinements, VNNI for AI inference</td></tr>
   <tr><td>Ice Lake-SP / Cooper Lake</td><td class="mono">2020–2021</td><td>10nm server cores; BF16 support enters the ecosystem</td></tr>
   <tr><td>Sapphire Rapids</td><td class="mono">2023</td><td>Tile/MCM design, DDR5, PCIe 5, CXL, AMX matrix-math extension</td></tr>
   <tr><td>Emerald Rapids</td><td class="mono">2023</td><td>Refined Sapphire Rapids platform; cache/performance tuning</td></tr>
   <tr><td>Xeon 6 — Granite Rapids</td><td class="mono">2024+</td><td>P-core Xeon 6; continued tile/MCM approach, AMX</td></tr>
   <tr><td>Xeon 6 — Sierra Forest</td><td class="mono">2024+</td><td>E-core / dense-core design focused squarely on performance-per-watt</td></tr>
 </table></div>
 <h3>AMD EPYC lineage</h3>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Era / Family</th><th>Period</th><th>Major HPC significance</th></tr>
   <tr><td>Naples (Zen)</td><td class="mono">2017</td><td>AMD's server return; the chiplet direction begins</td></tr>
   <tr><td>Rome (Zen 2)</td><td class="mono">2019</td><td>Chiplets mature; up to 64 cores; PCIe 4</td></tr>
   <tr><td>Milan (Zen 3)</td><td class="mono">2021</td><td>Unified L3 per compute die (CCD); strong HPC-per-core efficiency</td></tr>
   <tr><td>Genoa (Zen 4)</td><td class="mono">2022–23</td><td>Up to 96 cores; DDR5; PCIe 5; AVX-512</td></tr>
   <tr><td>Bergamo (Zen 4c)</td><td class="mono">2023</td><td>Dense-core design; up to 128 cores, throughput over per-core peak</td></tr>
   <tr><td>Turin (Zen 5)</td><td class="mono">2024+</td><td>Up to 192 cores; DDR5-6400; full 512-bit AVX-512 data path</td></tr>
 </table></div>
 <p>A third lineage worth tracking: <strong>ARM Neoverse / Grace-class systems</strong> (2020s) — efficient Arm server cores with high memory bandwidth and increasingly tight heterogeneous accelerator integration (e.g., NVIDIA Grace paired with Hopper/Blackwell GPUs over high-bandwidth chip-to-chip links).</p>
 <div class="note tip"><span class="tag">Reading the table correctly</span><p>The throughline across every row: more cores, wider vectors, faster/wider memory, tighter accelerator integration, and better power efficiency. Any two consecutive generations differ in degree, not usually in kind — the real question worth asking of any two generations isn't "which is newer" but "what actually changed": more cores, wider vectors, a faster memory system, or better efficiency at the same performance.</p></div>
 `},

{id:'s-2-2', part:'p2', num:'2.2', title:'CPU SIMD / Vector ISA Evolution',
 dek:'Single Instruction, Multiple Data: how one instruction does 2, 4, 8 or 16 pieces of math at once.',
 tags:'simd vector avx avx2 avx512 sse sve arm isa',
 body:`
 <p>SIMD (Single Instruction, Multiple Data) lets one instruction operate on several values packed into a wide register simultaneously — the primary mechanism by which CPU FLOPs/cycle has grown even as core counts and clocks plateaued.</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>ISA</th><th>Vector width</th><th>Key HPC feature</th></tr>
   <tr><td class="mono">SSE</td><td class="mono">128-bit</td><td>Early x86 SIMD — 2 FP64 values per register</td></tr>
   <tr><td class="mono">AVX</td><td class="mono">256-bit</td><td>Wider vector operations — 4 FP64 values per register</td></tr>
   <tr><td class="mono">AVX2</td><td class="mono">256-bit</td><td>Integer SIMD improvements + FMA on supporting CPUs</td></tr>
   <tr><td class="mono">AVX-512</td><td class="mono">512-bit</td><td>8 FP64 values per register, masking, more registers — the current HPC workhorse</td></tr>
   <tr><td class="mono">SVE</td><td class="mono">Scalable</td><td>ARM vector ISA — implementation-defined vector length, write-once code that scales</td></tr>
   <tr><td class="mono">SVE2</td><td class="mono">Scalable</td><td>Extended scalable-vector operations, broader instruction set</td></tr>
 </table></div>
 <p>SVE's "scalable" design is a genuinely different philosophy from AVX's fixed widths: the same compiled instruction runs correctly whether the underlying hardware implements a 128-bit or 2048-bit vector unit, with the hardware reporting its width at runtime. AVX-512, by contrast, hard-codes 512 bits into the instruction encoding itself.</p>
 <div class="note warn"><span class="tag">The catch — vectorization isn't automatic</span><p>Wider SIMD only increases FLOPs/cycle if the compiler (or hand-written intrinsics) can actually pack the operation into vector form, <em>and</em> the memory subsystem can feed the wider units fast enough to keep them busy. Branchy, pointer-chasing, or memory-bound code often can't use anywhere near the theoretical vector width — see the Roofline Model (§1.5) for why memory bandwidth caps this regardless of vector width.</p></div>
 <div class="example-box">
   <span class="tag">Worked example</span>
   <p>A single 512-bit FP64 FMA (fused multiply-add) instruction operates on 8 FP64 values (512/64) and each FMA counts as 2 FLOPs (one multiply + one add fused into a single rounding step).</p>
   <p>FLOPs per instruction = 8 × 2 = <span class="res">16 FLOPs</span> — versus just 2 FLOPs for a scalar (non-vector) FMA. That 8× multiplier is exactly the "FP64 lanes" term in the peak-FLOPs formula in §2.3.</p>
 </div>
 `},

{id:'s-2-3', part:'p2', num:'2.3', title:'Calculating CPU Peak FP64 Performance',
 dek:'Turning core count, clock speed and vector width into a single peak-throughput number — the calculation behind every "peak TFLOP/s" spec sheet line.',
 tags:'peak flops calculator fp64 fma vector lanes cores clock',
 calc:'cpuflops',
 body:`
 <div class="formula-box">
   <span class="tag">Simplified peak estimate</span>
   <div class="f">Peak FP64 FLOP/s ≈ Cores × Clock(Hz) × FP64 lanes × FLOPs/lane/cycle × FP units</div>
 </div>
 <div class="varkey">
   <dt>Cores</dt><dd>total physical cores across all sockets</dd>
   <dt>Clock</dt><dd>sustained <em>all-core</em> frequency, not the single-core boost clock (they can differ substantially under AVX-512 loads — see the note below)</dd>
   <dt>FP64 lanes</dt><dd>vector width ÷ 64 — e.g. a 512-bit register holds 8 FP64 lanes</dd>
   <dt>FLOPs/lane/cycle</dt><dd>2 for a fused multiply-add (FMA); 1 for a plain multiply or add</dd>
   <dt>FP units</dt><dd>how many independent FP/vector execution ports the core can issue to per cycle (commonly 1–2 on modern server cores)</dd>
 </div>
 <div class="calc-mount" data-calc="cpuflops"></div>
 <div class="note warn">
   <span class="tag">Why "peak" and "sustained" diverge</span>
   <p>Wide-vector instructions like AVX-512 draw enough power that many CPUs automatically reduce their clock speed while executing them — sometimes called "AVX offset" or "AVX-512 downclocking." A chip's headline peak-FLOPs figure typically assumes the AVX-512 clock, not the higher non-vector boost clock, but real mixed workloads that alternate between vector and scalar code can see effective clocks — and therefore effective peak — swing between the two.</p>
 </div>
 <div class="example-box">
   <span class="tag">Worked example</span>
   <p>A CPU with 56 cores at an all-core AVX-512 clock of 2.0 GHz, one 512-bit FMA-capable FP unit per core:</p>
   <p>Peak = 56 × 2.0×10⁹ × 8 lanes × 2 (FMA) × 1 unit = <span class="res">1.79 TFLOP/s per socket</span></p>
   <p>Double it for a 2-socket server: ≈ 3.58 TFLOP/s per node. This is the Rpeak figure you'd compare an HPL Rmax result against in §10.2's efficiency calculation.</p>
 </div>
 `},

{id:'s-2-4', part:'p2', num:'2.4', title:'CPU Memory Hierarchy',
 dek:'Registers, caches, DRAM, HBM, NUMA — the further data has to travel, the more it costs, and by how much.',
 tags:'memory hierarchy cache l1 l2 l3 dram hbm numa amat latency bandwidth',
 diagrams:['memhierarchy'],
 calc:'amat',
 body:`
 <p>Every level of the memory hierarchy trades capacity for speed. The CPU's job — and the compiler's, and yours — is to keep the data that's about to be used as close to the execution units as possible, because the cost of a miss compounds fast.</p>
 <div class="diagram"><div class="diagram-mount" data-diagram="memhierarchy"></div></div>
 <div class="diagram-cap">Figures are typical orders of magnitude, not a specific chip's datasheet — they vary meaningfully by microarchitecture.</div>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Level</th><th>Typical property</th><th>HPC implication</th></tr>
   <tr><td>Registers</td><td>Fastest, tiny</td><td>Compiler scheduling / register pressure directly affects performance</td></tr>
   <tr><td>L1 cache</td><td>Very low latency</td><td>Critical for tight inner loops</td></tr>
   <tr><td>L2 cache</td><td>Larger, slightly slower</td><td>Useful for holding a loop's whole working set</td></tr>
   <tr><td>L3 / LLC</td><td>Large, shared</td><td>Reduces DRAM traffic; shared across cores means contention matters</td></tr>
   <tr><td>DRAM</td><td>Large, much slower</td><td>Often <em>the</em> bandwidth bottleneck for real HPC codes</td></tr>
   <tr><td>HBM</td><td>Very high bandwidth</td><td>Sits alongside DRAM (not strictly below it); the go-to for bandwidth-bound kernels</td></tr>
   <tr><td>NUMA remote memory</td><td>Higher latency</td><td>Process/thread and memory <em>placement</em> (affinity) matters enormously</td></tr>
  </table></div>

  <h4>Typical cache sizes (modern x86-64 desktop/server)</h4>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>Level</th><th>Typical size per core</th><th>Latency (cycles)</th><th>Line size</th><th>Notes</th></tr>
    <tr><td>L1D (data)</td><td class="mono">32 – 64 KB</td><td class="mono">~4 – 5</td><td class="mono">64 B</td><td>Split into L1 instruction and L1 data caches (Harvard at L1)</td></tr>
    <tr><td>L1I (instruction)</td><td class="mono">32 – 64 KB</td><td class="mono">~4 – 5</td><td class="mono">64 B</td><td>Sometimes unified with L1D on simpler cores</td></tr>
    <tr><td>L2</td><td class="mono">256 KB – 1 MB</td><td class="mono">~12 – 14</td><td class="mono">64 B</td><td>Private per core on modern designs</td></tr>
    <tr><td>L3 / LLC</td><td class="mono">8 – 64+ MB</td><td class="mono">~30 – 50</td><td class="mono">64 B</td><td>Shared across all cores in a socket; often inclusive or non-inclusive</td></tr>
    <tr><td>DRAM</td><td class="mono">16 – 512+ GB</td><td class="mono">~100 – 300+</td><td>N/A</td><td>Accessed in cache-line-sized bursts</td></tr>
  </table></div>
  <p>These are representative figures for recent Intel/AMD x86 designs. ARM server cores (e.g., Graviton, Ampere Altra) and GPUs follow different sizing trade-offs — GPU shared memory / L1 is tiny but extremely wide, while GPU L2 can be several MB per SM cluster.</p>

  <h4>Associative memory &amp; cache organization</h4>
  <p>The fundamental question a cache must answer on every access: <em>given this memory address, where (if anywhere) is its data stored?</em> There are three strategies, each trading lookup speed and hardware cost against conflict-miss behavior.</p>

  <div class="tbl-wrap"><table class="dt">
    <tr><th>Organization</th><th>How it works</th><th>Pros</th><th>Cons</th></tr>
    <tr><td><strong>Direct-mapped</strong></td><td>Each address maps to exactly one cache line (index = address mod number-of-lines)</td><td>Simplest hardware; single comparator; fastest hit latency</td><td>Two addresses mapping to the same line thrash each other even if the cache is mostly empty</td></tr>
    <tr><td><strong>N-way set associative</strong></td><td>Each address maps to a <em>set</em> of N possible lines; all N are checked in parallel</td><td>Greatly reduces conflict misses; moderate hardware cost</td><td>N comparators needed; slightly higher hit latency than direct-mapped</td></tr>
    <tr><td><strong>Fully associative</strong></td><td>An address can reside in <em>any</em> cache line; every line is compared on access</td><td>Zero conflict misses (optimal placement)</td><td>Enormous comparator cost; only practical for very small structures (TLBs, victim caches)</td></tr>
  </table></div>

  <p><strong>What "associative memory" means:</strong> In a direct-mapped cache, each memory address has one fixed slot it <em>must</em> occupy — like a library where every book has a single assigned shelf. An <strong>associative memory</strong> (or set-associative cache) is one where a given address can live in any of N slots within its set — like a shelf section where you can put the book anywhere in a row of N cubbies. When you need to find the book, you check all N cubbies simultaneously (in hardware, using N parallel comparators). If any cubby holds a tag matching your address, it's a hit.</p>

  <div class="example-box">
    <span class="tag">Worked example — N-way set associativity in practice</span>
    <p>Consider a 32 KB L1 data cache with 64-byte cache lines:</p>
    <ul>
      <li>Total lines = 32 KB / 64 B = 512 lines</li>
      <li><strong>Direct-mapped (1-way):</strong> 512 sets, 1 line per set. Each address maps to exactly one of 512 sets.</li>
      <li><strong>4-way set associative:</strong> 128 sets, 4 lines per set. Each address maps to one of 128 sets, but can occupy any of 4 lines within that set.</li>
      <li><strong>8-way set associative:</strong> 64 sets, 8 lines per set. Even fewer sets, but 8 possible locations per set — fewer conflict misses.</li>
      <li><strong>Fully associative:</strong> 1 set of 512 lines. Any address can go anywhere. Impractical at this size — you'd need 512 parallel tag comparators on every access.</li>
    </ul>
    <p>Modern x86 L1 caches are typically <strong>8-way set associative</strong>, L2 caches are <strong>4-way to 8-way</strong>, and L3 caches are often <strong>8-way to 16-way</strong> associative — each level increasing associativity as the cache grows, balancing conflict-miss reduction against the hardware cost of extra comparators.</p>
  </div>

  <div class="note tip">
    <span class="tag">Why associativity matters for HPC</span>
    <p>Workloads with regular, strided access patterns (matrix multiplication, stencil codes) can suffer severe conflict misses in direct-mapped or low-associativity caches when two hot arrays happen to map to the same set. Increasing associativity eliminates this class of pathological conflict misses — one reason compilers pad loop nests or shift array base addresses. Tools like <code>perf stat</code> (reporting <code>LLC-load-misses</code>) or Intel VTune can reveal whether conflict misses are a significant fraction of your total miss rate.</p>
  </div>

  <h4>The metrics that quantify it</h4>
 <div class="formula-box">
   <span class="tag">Cache &amp; memory metrics</span>
   <div class="flist">
     <div class="f">Hit rate = Hits / (Hits + Misses)</div>
     <div class="f">Miss rate = Misses / (Hits + Misses) = 1 − Hit rate</div>
     <div class="f">AMAT = Hit time + Miss rate × Miss penalty</div>
     <div class="f">Theoretical DDR BW = Channels × Transfers/s × Bus width (bytes/transfer)</div>
   </div>
 </div>
 <p><strong>AMAT</strong> (Average Memory Access Time) is the single number that captures the net cost of the whole hierarchy for a given access pattern — it's what the CPU "feels" on average per memory reference, blending fast hits and expensive misses by how often each happens.</p>
 <div class="calc-mount" data-calc="amat"></div>
 <div class="example-box">
   <span class="tag">Worked example — NUMA cost</span>
   <p>A dual-socket server has local DRAM at ~90 ns and cross-socket (remote NUMA) access at ~140 ns — roughly 50% higher latency just from crossing the socket interconnect. A poorly-placed thread that constantly touches the other socket's memory pays that tax on every miss that reaches DRAM, which is exactly why NUMA-aware pinning (<code>numactl</code>, first-touch allocation policy) is a standard first step in HPC performance tuning.</p>
  </div>
  `},

{ id:'s-2-5', part:'p2', num:'2.5', title:'CPU Pipelining, Branch Prediction &amp; Out-of-Order Execution',
  dek:'How a modern CPU core actually executes instructions — the pipeline, the hazards, and the tricks that keep it fed.',
  tags:'pipeline branch prediction btb reorder buffer speculation hazard forwarding superscalar out-of-order instruction-level parallelism',
  body:`
  <p>A modern CPU core doesn't execute one instruction to completion before starting the next — that would waste most of the silicon on every cycle. Instead, it overlaps the execution of many instructions simultaneously, like an assembly line. Understanding how this works is essential for understanding why certain code patterns are fast and others are not.</p>

  <h4>The classic 5-stage RISC pipeline</h4>
  <p>The simplest useful pipeline splits instruction execution into five stages, each handled by dedicated hardware. At any given cycle, up to five different instructions can be "in flight" — each in a different stage:</p>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>Stage</th><th>Abbreviation</th><th>What happens</th></tr>
    <tr><td class="mono">Instruction Fetch</td><td>IF</td><td>Read the next instruction from the I-cache at the program counter (PC) address</td></tr>
    <tr><td class="mono">Instruction Decode</td><td>ID</td><td>Decode the opcode, read source registers from the register file</td></tr>
    <tr><td class="mono">Execute / Address</td><td>EX</td><td>Run the ALU (add, compare, etc.) or compute a memory address for loads/stores</td></tr>
    <tr><td class="mono">Memory Access</td><td>MEM</td><td>Load from or store to data cache if this instruction touches memory</td></tr>
    <tr><td class="mono">Write-back</td><td>WB</td><td>Write the result back to the destination register</td></tr>
  </table></div>
  <p>In an ideal world, one instruction completes every cycle (CPI = 1) because five instructions are always in different stages. Real code is messier — instructions depend on each other, branches change the PC, and memory isn't always in cache.</p>

  <h4>Modern pipeline depths — deeper than you think</h4>
  <p>The 5-stage model is pedagogically clean but nothing like what modern x86/ARM cores actually use. Deep pipelines exist to keep clock frequencies high: each stage does less work per cycle, so the critical-path delay is shorter and the clock can tick faster. The trade-off is that mispredictions and exceptions flush more work.</p>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>Core</th><th>Approximate pipeline depth</th><th>Why so deep?</th></tr>
    <tr><td>ARM Cortex-A53 (in-order)</td><td class="mono">~8 stages</td><td>Simple, low-power; short pipeline keeps energy per instruction low</td></tr>
    <tr><td>ARM Cortex-A77 / A78</td><td class="mono">~11–13 stages</td><td>Balance between frequency and misprediction penalty</td></tr>
    <tr><td>AMD Zen 1–4</td><td class="mono">~19 stages (integer), ~22 stages (FP)</td><td>Long pipeline for high clock speeds (4–5+ GHz); separate FP pipeline with more stages for complex operations</td></tr>
    <tr><td>Intel Skylake / Ice Lake</td><td class="mono">~14–16 stages (integer)</td><td>Moderate depth; Intel prioritized IPC over raw frequency in this era</td></tr>
    <tr><td>Intel Golden Cove (Alder Lake P-core)</td><td class="mono">~16–20 stages</td><td>Deeper to support higher clocks (5+ GHz boost) while maintaining wide issue</td></tr>
    <tr><td>Intel Pentium 4 (NetBurst, historical)</td><td class="mono">~20–31 stages</td><td>The extreme case — designed for 10 GHz target; never got there; misprediction penalty was devastating</td></tr>
  </table></div>
  <p><strong>The misprediction cost scales with pipeline depth.</strong> If a 20-stage pipeline mispredicts, 20 instructions of speculative work must be flushed — that's 20 cycles of wasted work. This is why deeper pipelines demand better branch predictors: a 95% accurate predictor on a 20-stage pipeline costs ~1 cycle of penalty per instruction on average (20 × 0.05 / 1), while the same predictor on a 5-stage pipeline costs only ~0.25 cycles. The Pentium 4's deep pipeline + mediocre branch prediction was a cautionary tale — it's partly why Intel pivoted back to shorter, wider cores with Core 2.</p>
  <p>Modern cores also use <strong>pipeline interleaving</strong> — multiple instructions from different threads or different parts of the same thread can occupy different stages of the same pipeline simultaneously, and some cores (especially ARM big.LITTLE designs) have physically separate pipelines for different execution domains (integer vs. FP vs. SIMD).</p>

  <h4>Pipeline hazards — the three things that break the ideal</h4>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>Hazard type</th><th>What causes it</th><th>Example</th><th>How the hardware fixes it</th></tr>
    <tr><td><strong>Data hazard</strong></td><td>Instruction B needs a result that instruction A hasn't written yet</td><td class="mono"><code>ADD R1, R2, R3</code><br><code>SUB R4, R1, R5</code> — needs R1</td><td><strong>Data forwarding</strong> (bypassing): wire the ALU output directly to the next instruction's input, skipping the register file write/read round-trip. Eliminates most data hazards at zero stall cost.</td></tr>
    <tr><td><strong>Load-use hazard</strong></td><td>A load instruction's data isn't available when a dependent instruction needs it</td><td class="mono"><code>LW R1, 0(R2)</code><br><code>ADD R4, R1, R5</code> — needs R1 from memory</td><td><strong>Load-use stall</strong> (typically 1 cycle): the data cache read takes a full cycle longer than an ALU result. Even with forwarding, there's an unavoidable bubble. Compilers schedule independent instructions between load and use to hide this.</td></tr>
    <tr><td><strong>Control hazard</strong></td><td>A branch changes the PC; the pipeline doesn't know which instructions to fetch next</td><td class="mono"><code>BEQ R1, R2, target</code><br>Pipeline already fetched the next 2–4 instructions speculatively</td><td><strong>Branch prediction</strong> (see below): guess the branch direction and fetch speculatively. If wrong, flush the pipeline and restart from the correct target.</td></tr>
  </table></div>

  <h4>Branch prediction — guessing the future to stay fed</h4>
  <p>Branches (conditional jumps, function calls, loops) are the single biggest threat to pipeline throughput. A modern core fetches 4–6 instructions per cycle — if it has to stall for 15–20 cycles every time it hits a branch (waiting for the branch to resolve in the EX or MEM stage), performance collapses. The solution: <strong>guess which way the branch will go and keep fetching speculatively.</strong></p>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>Predictor type</th><th>How it works</th><th>Accuracy</th><th>Used in</th></tr>
    <tr><td><strong>Static prediction</strong></td><td>Always predict "backward branches taken (loops), forward branches not-taken"</td><td class="mono">~60–65%</td><td>Simple in-order cores; fallback when dynamic predictor has no history</td></tr>
    <tr><td><strong>1-bit predictor</strong></td><td>Record the last outcome of each branch; predict the same way next time</td><td class="mono">~75–80%</td><td>Too inaccurate for modern cores; fails on loops that iterate N times (predicts wrong on every first and last iteration)</td></tr>
    <tr><td><strong>2-bit saturating counter</strong></td><td>Each branch has a 2-bit counter: "strongly taken / weakly taken / weakly not-taken / strongly not-taken." Must mispredict twice to change prediction.</td><td class="mono">~85–90%</td><td>Classic design; much better on loops — a loop that runs 10 times only mispredicts on the last iteration</td></tr>
    <tr><td><strong>Tournament / hybrid predictor</strong></td><td>Two predictors (e.g., one biased, one pattern-based) with a chooser that selects which one to trust per branch</td><td class="mono">~92–95%</td><td>Pentium M → Core → Skylake and beyond</td></tr>
    <tr><td><strong>Perceptron predictor</strong></td><td>Uses a small neural network (weighted sum of recent branch outcomes) to predict; learns complex patterns</td><td class="mono">~95–97%</td><td>AMD Zen, some ARM designs</td></tr>
    <tr><td><strong>TAGE (TAgged GEometric history)</strong></td><td>Multiple tables indexed by geometrically increasing history lengths; tags to avoid aliasing; the gold standard</td><td class="mono">~96–99%</td><td>Intel Skylake+, AMD Zen 2+, modern high-performance cores</td></tr>
  </table></div>
  <p>Modern cores also maintain a <strong>Branch Target Buffer (BTB)</strong> — a cache that maps branch instruction addresses to their predicted target addresses. Without a BTB, even a correctly predicted "taken" branch would stall the pipeline while the target address is computed. The BTB lets the front-end redirect the fetch unit in the same cycle the branch is decoded.</p>
  <div class="example-box">
    <span class="tag">Worked example — why branch prediction accuracy matters so much</span>
    <p>A core with a 15-stage pipeline and 4-wide fetch:</p>
    <ul>
      <li>If branch prediction is 95% accurate: on a branch-heavy loop with 1 branch per 5 instructions, ~1 in 20 branches mispredicts. Each misprediction flushes ~15 cycles of work. Cost: ~15 × (1/20) × (1/5) = 0.15 cycles per instruction on average — noticeable but tolerable.</li>
      <li>If accuracy drops to 85% (e.g., unpredictable data-dependent branches): cost jumps to ~15 × (0.15) × (1/5) = 0.45 cycles per instruction — a 3× penalty that can halve effective throughput.</li>
      <li>This is why HPC code avoids data-dependent branches in hot loops: <code>if (data[i] > threshold)</code> in a tight loop is the worst case for branch predictors, because the outcome depends on input data the predictor hasn't seen before.</li>
    </ul>
    <p><strong>Compiler hints:</strong> Modern compilers offer <code>__builtin_expect()</code> (GCC/Clang) or <code>[[likely]]</code> / <code>[[unlikely]]</code> (C++20) to annotate branch probability. These don't change correctness — they just tell the compiler which code path to optimize for (instruction layout, alignment) and give the hardware predictor a starting bias.</p>
  </div>

  <h4>Out-of-order execution — the real engine inside modern cores</h4>
  <p>The classic in-order pipeline described above is the mental model, but it's not what modern x86/ARM cores actually do. In an in-order pipeline, if one instruction stalls (e.g., cache miss), <em>every subsequent instruction stalls too</em>, even if it has nothing to do with the stalled one. Out-of-order (OoO) execution eliminates this waste:</p>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>Component</th><th>Role</th></tr>
    <tr><td><strong>Reorder Buffer (ROB)</strong></td><td>Tracks all in-flight instructions in program order. Results are <em>committed</em> (made architecturally visible) in order, even though they execute out of order. This ensures precise exceptions — if an instruction faults, all earlier instructions have completed and all later ones haven't.</td></tr>
    <tr><td><strong>Reservation Stations (RS) / Issue Queue</strong></td><td>Holds decoded instructions waiting for their operands. When an operand becomes available (via forwarding from the ALU or completion of a load), the instruction "wakes up" and can issue to an execution unit — even if older instructions are still waiting.</td></tr>
    <tr><td><strong>Physical Register File (PRF)</strong></td><td>A large pool of physical registers (far more than the architectural register set). The rename stage maps each architectural register to a free physical register, eliminating false dependencies (WAR and WAW hazards) that would otherwise serialize independent instructions.</td></tr>
    <tr><td><strong>Load/Store Queue (LSQ)</strong></td><td>Tracks all in-flight memory operations. Loads can execute speculatively (before all prior stores are resolved) but must be checked for ordering violations at commit. Stores are held until they are guaranteed to be non-speculative.</td></tr>
    <tr><td><strong>Branch Execution Unit</strong></td><td>Resolves branch conditions and updates the predictor. When a misprediction is detected, the ROB is flushed from the point of the wrong branch — all younger instructions are squashed.</td></tr>
  </table></div>
  <p>The key insight: <strong>in an OoO core, the CPU finds and executes independent instructions from the dynamic instruction stream, not the static program order.</strong> If instruction 5 is waiting on a cache miss but instructions 6, 7, 8, 9 are independent, they execute immediately. The ROB ensures that when instruction 5 finally resolves, everything commits in the correct program order.</p>

  <h4>Superscalar — how many instructions per cycle?</h4>
  <p>"Superscalar" means the core can issue multiple instructions per cycle. The <em>issue width</em> is the maximum number of instructions that can start execution in a single cycle:</p>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>Core</th><th>Issue width</th><th>ROB size</th><th>Physical registers</th><th>Load/store queues</th></tr>
    <tr><td>Intel Skylake / Ice Lake</td><td class="mono">6-wide</td><td class="mono">224 entries</td><td class="mono">~280 int + ~332 FP</td><td class="mono">72 load + 56 store</td></tr>
    <tr><td>Intel Golden Cove (Alder Lake P-core)</td><td class="mono">6-wide</td><td class="mono">512 entries</td><td class="mono">~280 int + ~332 FP</td><td class="mono">128 load + 72 store</td></tr>
    <tr><td>AMD Zen 4</td><td class="mono">6-wide</td><td class="mono">320 entries</td><td class="mono">~224 int + ~192 FP</td><td class="mono">72 load + 64 store</td></tr>
    <tr><td>ARM Cortex-X3</td><td class="mono">8-wide</td><td class="mono">320 entries</td><td class="mono">~384 int + ~384 FP/SIMD</td><td class="mono">64 load + 48 store</td></tr>
  </table></div>
  <p>A wider issue width means the core can find more independent instructions per cycle — but only if the instruction stream actually has enough ILP (Instruction-Level Parallelism) to fill those slots. This is why HPC compilers spend enormous effort on instruction scheduling, loop unrolling, and dependency-breaking transformations: they're manufacturing ILP to feed the beast.</p>

  <h4>Cache coherency &amp; invalidation — keeping multi-core caches consistent</h4>
  <p>Every core has its own private L1/L2 caches. When core A writes to a memory address that core B also has cached, B's copy is now stale. Without hardware intervention, B would keep reading old data — a silent, catastrophic correctness bug. <strong>Cache coherency</strong> is the hardware protocol that prevents this, and <strong>invalidation</strong> is the mechanism by which stale copies are evicted.</p>

  <h4>How coherency works: snooping vs. directory-based</h4>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>Protocol family</th><th>How it works</th><th>Scalability</th><th>Used in</th></tr>
    <tr><td><strong>Snooping (bus-based)</strong></td><td>Every cache controller <em>snoops</em> (monitors) a shared bus for write transactions. When core A writes to address X, all other cores see the bus transaction and invalidate their local copy of X.</td><td>Works well up to ~8–16 cores; bus bandwidth becomes the bottleneck as core count grows</td><td>Older multi-core designs; small SMP systems; Intel's early dual/quad-core</td></tr>
    <tr><td><strong>Directory-based</strong></td><td>A central directory (often distributed across memory controllers) tracks which cores cache which cache lines. On a write, the directory sends targeted invalidations only to cores that actually have a copy — no broadcast needed.</td><td>Scales to hundreds of cores; O(1) invalidation messages per write (point-to-point, not broadcast)</td><td>AMD Zen (Infinity Fabric), Intel Mesh (Skylake-SP+), most modern server CPUs</td></tr>
  </table></div>

  <h4>MESI — the protocol that makes it all work</h4>
  <p>Most x86 caches implement a variant of the <strong>MESI protocol</strong> (Modified, Exclusive, Shared, Invalid). Each cache line is in one of four states:</p>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>State</th><th>Meaning</th><th>Who can read/write?</th><th>What happens on a local write?</th></tr>
    <tr><td class="mono"><strong>M</strong>odified</td><td>This cache has the <em>only</em> valid copy; it's been written to (dirty)</td><td>Only this core</td><td>Already in M — no action needed</td></tr>
    <tr><td class="mono"><strong>E</strong>xclusive</td><td>This cache has the <em>only</em> valid copy; it's clean (matches memory)</td><td>Only this core</td><td>Transition to M; no invalidation needed (no other copies exist)</td></tr>
    <tr><td class="mono"><strong>S</strong>hared</td><td>Multiple caches may have this line; all copies are clean</td><td>All cores with a copy</td><td>Must <strong>invalidate</strong> all other copies first (send invalidation messages); then transition to M</td></tr>
    <tr><td class="mono"><strong>I</strong>nvalid</td><td>This cache line is stale or absent</td><td>Nobody — this core must fetch a fresh copy</td><td>Fetch from memory or another cache; transition to E or S</td></tr>
  </table></div>
  <p>The critical performance implication: <strong>writing to a Shared cache line is expensive</strong> because it triggers invalidation messages to every other core that has a copy. This is why <em>false sharing</em> — where two cores write to different variables that happen to live on the same cache line — is such a devastating performance bug: the cores aren't actually sharing data, but the coherency protocol doesn't know that, so every write invalidates the other core's copy, causing a ping-pong of cache line transfers across the interconnect.</p>

  <div class="example-box">
    <span class="tag">Worked example — false sharing in practice</span>
    <p>Two threads each increment their own counter 100 million times:</p>
    <ul>
      <li><strong>Without false sharing:</strong> Counters on separate cache lines. Each core writes to its private cache line in M state. No invalidations. Time: ~0.2 s.</li>
      <li><strong>With false sharing:</strong> Both counters on the same 64-byte cache line. Every write by core A invalidates core B's copy (and vice versa). The cache line bounces between cores at ~200+ cycles per transfer. Time: ~3–5 s — a 15–25× slowdown from what is logically independent work.</li>
      <li><strong>Fix:</strong> Pad the struct so each counter sits on its own cache line (<code>__attribute__((aligned(64)))</code> or pad to 64 bytes).</li>
    </ul>
    <p><code>perf c2c</code> (cache-to-cache) is the tool that diagnoses false sharing — it shows which cache lines are experiencing the most cross-core transfers.</p>
  </div>

  <h4>Cache line invalidation in detail</h4>
  <p>Invalidation isn't free — it costs latency and interconnect bandwidth:</p>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>Operation</th><th>What happens at the hardware level</th><th>Latency</th></tr>
    <tr><td><strong>Self-invalidation</strong></td><td>Core marks its own cache line as Invalid (I state). Fast — just a local metadata update.</td><td class="mono">~1 cycle</td></tr>
    <tr><td><strong>Remote invalidation (snooping)</strong></td><td>Core A sends a bus message; core B receives it, invalidates its copy, sends ack. Round-trip latency includes bus propagation.</td><td class="mono">~20–40 cycles (same socket)</td></tr>
    <tr><td><strong>Remote invalidation (directory)</strong></td><td>Core A sends request to directory; directory identifies owners and forwards invalidation; target cores invalidate and ack. Two hops minimum.</td><td class="mono">~40–100 cycles (cross-socket)</td></tr>
  </table></div>
  <p>The invalidation delay is a hidden tax on every write to a contended cache line. It doesn't show up as a "cache miss" in simple counters — the data might still be present in L1, but the coherency protocol serializes access through the interconnect. This is why interconnect bandwidth (Infinity Fabric, UPI, Mesh) is a first-order concern for multi-threaded HPC codes, not just cache size.</p>

  <div class="note tip">
    <span class="tag">Why this matters for HPC performance</span>
    <p>The pipeline and OoO machinery explain several HPC performance rules of thumb:</p>
    <ul>
      <li><strong>Avoid data-dependent branches in hot loops</strong> — they defeat branch prediction and cause pipeline flushes that waste 15–20+ cycles each.</li>
      <li><strong>Minimize load-use latency</strong> — schedule independent work between a load and its consumer to hide the ~4–5 cycle L1 miss penalty.</li>
      <li><strong>Loop unrolling helps</strong> — it exposes more independent instructions per cycle for the OoO scheduler to find, and reduces branch density.</li>
      <li><strong>Prefetching matters</strong> — if the CPU can't predict a memory access pattern, the OoO engine can't hide the DRAM latency no matter how wide the issue width is.</li>
    </ul>
  </div>
  `}

);
</script>

{id:'s-3-1', part:'p3', num:'3.1', title:'NVIDIA GPU Architecture Evolution',
 dek:'From the first CUDA-capable GPU to Blackwell — the generational shifts that turned graphics chips into the dominant HPC/AI accelerator.',
 tags:'gpu architecture nvidia tesla fermi kepler pascal volta hopper blackwell evolution',
 diagrams:['gputimeline'],
 body:`
 <p>NVIDIA's data-center GPU line has moved through roughly one major architecture every 1.5–2 years, and each generation has tended to add a capability that reshaped what kind of workload the chip was best at — not just "more of the same, faster."</p>
 <div class="diagram scrollx"><div class="diagram-mount" data-diagram="gputimeline"></div></div>
 <div class="diagram-cap">NVIDIA data-center GPU architecture generations. Scroll horizontally on narrow screens.</div>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Architecture</th><th>Year</th><th>Major HPC/compute milestone</th></tr>
   <tr><td>Tesla</td><td class="mono">2006</td><td>CUDA-era programmable GPU compute begins</td></tr>
   <tr><td>Fermi</td><td class="mono">2010</td><td>Unified cache hierarchy; meaningfully stronger general-purpose compute</td></tr>
   <tr><td>Kepler</td><td class="mono">2012</td><td>SMX design; improved energy efficiency</td></tr>
   <tr><td>Maxwell</td><td class="mono">2014</td><td>Power-efficient SM redesign</td></tr>
   <tr><td>Pascal</td><td class="mono">2016</td><td>GP100: HBM2 and NVLink — the first genuinely HPC-tuned data-center GPU platform</td></tr>
   <tr><td>Volta</td><td class="mono">2017</td><td>Tensor Cores introduced; independent integer datapath — the AI/HPC pivot point</td></tr>
   <tr><td>Turing</td><td class="mono">2018</td><td>Tensor Cores refined; RT hardware added (mainly graphics-focused)</td></tr>
   <tr><td>Ampere</td><td class="mono">2020</td><td>Strong FP32 throughput; further Tensor Core advances; A100, HBM2e, NVLink</td></tr>
   <tr><td>Hopper</td><td class="mono">2022</td><td>H100: FP8 Tensor Cores, TMA (Tensor Memory Accelerator), thread-block clusters</td></tr>
   <tr><td>Blackwell</td><td class="mono">2024+</td><td>B100/B200-class accelerated computing; newer Tensor Core formats, NVLink 5-class scaling</td></tr>
 </table></div>
 <p>The two inflection points worth remembering: <strong>Pascal (2016)</strong> is when NVIDIA GPUs became purpose-built HPC accelerators (HBM2 + NVLink), and <strong>Volta (2017)</strong> is when Tensor Cores made low-precision matrix math a first-class hardware citizen — the foundation everything AI-accelerator-related in Part IV builds on.</p>
  <div class="note tip"><span class="tag">Why this matters for procurement</span><p>A GPU's headline TFLOPS number depends enormously on which precision you're citing (§3.3, §4). Comparing an older architecture's FP64 peak to a newer architecture's FP8 Tensor Core peak is comparing two different kinds of arithmetic entirely — see §4.11 for the rule that keeps this comparison honest.</p></div>

  <h4>NVLink — GPU-to-GPU interconnect</h4>
  <p>PCIe became the bottleneck for multi-GPU workloads long before compute did. NVLink is NVIDIA's point-to-point high-bandwidth link that lets GPUs talk to each other (and to the CPU on Grace-class platforms) at rates PCIe cannot match. Each generation of NVLink has shipped alongside a GPU architecture generation, and the bandwidth has scaled roughly in step with GPU compute growth.</p>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>NVLink gen</th><th>Debuted with</th><th>Per-link BW (bidirectional)</th><th>GPU-to-GPU BW (8 links, typical)</th><th>Notes</th></tr>
    <tr><td class="mono">NVLink 1.0</td><td>Pascal (P100, 2016)</td><td class="mono">20 GB/s</td><td class="mono">~160 GB/s</td><td>First NVLink; 4 links per GPU, peer-to-peer only</td></tr>
    <tr><td class="mono">NVLink 2.0</td><td>Volta (V100, 2017)</td><td class="mono">25 GB/s</td><td class="mono">~200 GB/s</td><td>6 links per GPU; NVSwitch introduced for full-mesh</td></tr>
    <tr><td class="mono">NVLink 3.0</td><td>Ampere (A100, 2020)</td><td class="mono">25 GB/s</td><td class="mono">~200 GB/s</td><td>12 links per GPU; 3rd-gen NVSwitch for DGX A100</td></tr>
    <tr><td class="mono">NVLink 4.0</td><td>Hopper (H100, 2022)</td><td class="mono">25 GB/s</td><td class="mono">~900 GB/s</td><td>18 links per GPU; 4th-gen NVSwitch; a big jump in total bisection</td></tr>
    <tr><td class="mono">NVLink 5.0</td><td>Blackwell (B200, 2024)</td><td class="mono">50 GB/s</td><td class="mono">~1.8 TB/s</td><td>Doubled per-link BW; up to 18 links; 5th-gen NVSwitch for GB-class scale-out</td></tr>
  </table></div>
  <p>For tightly-coupled multi-GPU training (tensor parallelism, pipeline parallelism), NVLink bandwidth is often the binding constraint — it determines how fast gradients and activations flow between GPUs during each forward/backward pass. The jump from NVLink 3→4 and 4→5 reflects NVIDIA's recognition that as models grow beyond a single GPU, interconnect scales as fast as compute.</p>

  <h4>NVSwitch — full-mesh fabric inside the node</h4>
  <p>NVLink alone gives each GPU direct links to a few neighbours. <strong>NVSwitch</strong> is a dedicated switching ASIC that turns those point-to-point links into a fully-connected crossbar — every GPU can reach every other GPU at full NVLink bandwidth simultaneously, without contention through a shared link.</p>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>NVSwitch gen</th><th>Shipped with</th><th>Topology</th><th>Key change</th></tr>
    <tr><td class="mono">1st gen (2018)</td><td>DGX-2 / HGX-2 (Volta)</td><td>16-GPU full mesh via NVSwitch</td><td>First time 16 GPUs could communicate as a single logical accelerator</td></tr>
    <tr><td class="mono">3rd gen (2020)</td><td>DGX A100 (Ampere)</td><td>8-GPU full mesh via NVSwitch</td><td>Integrated into baseboard; fewer external cables</td></tr>
    <tr><td class="mono">4th gen (2022)</td><td>DGX H100 (Hopper)</td><td>8-GPU full mesh, 4th-gen NVSwitch</td><td>900 GB/s per GPU aggregate; supports NVLink 4.0</td></tr>
    <tr><td class="mono">5th gen (2024)</td><td>DGX B200 / GB200 (Blackwell)</td><td>Multi-node NVLink domain</td><td>Enables NVLink-to-NVLink switching across server boundaries for larger NVLink fabrics</td></tr>
  </table></div>
  <p>NVSwitch is what turns a multi-GPU server from "8 GPUs that can occasionally talk" into "8 GPUs that behave almost like one GPU with 8× the memory and compute." For workloads like large-language-model training that need to shatter a single model across GPUs (tensor parallelism), NVSwitch removes the interconnect as a scaling bottleneck within the node.</p>

  <h4>GDDR vs HBM — GPU memory types</h4>
  <p>GPUs need far more memory bandwidth than CPUs. Two fundamentally different DRAM packaging strategies deliver it:</p>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>Memory</th><th>How it works</th><th>Typical bandwidth</th><th>Typical capacity</th><th>Trade-off</th></tr>
    <tr><td><strong>GDDR</strong> (GDDR5/5X/6/6X)</td><td>Discrete DRAM chips on the GPU board, each with a narrow bus; high clock speeds compensate</td><td class="mono">~500 – 1000 GB/s (GDDR6X)</td><td class="mono">12 – 48 GB</td><td>Cheaper per GB; adequate for gaming / inference; limited by board-level power and pin count</td></tr>
    <tr><td><strong>HBM</strong> (HBM2 / HBM2e / HBM3 / HBM3e)</td><td>DRAM dies stacked vertically and connected via wide silicon interposer to the GPU die; massive parallel bus</td><td class="mono">~1 – 6+ TB/s (HBM3e)</td><td class="mono">24 – 192 GB</td><td>5–10× the bandwidth of GDDR; much higher cost per GB; lower capacity per package; dominates HPC/AI</td></tr>
  </table></div>
  <p>The shift from GDDR to HBM in NVIDIA's data-center line happened at <strong>Pascal (2016)</strong> — the P100 was the first NVIDIA data-center GPU with HBM2. Every flagship data-center GPU since (V100, A100, H100, B200) has used HBM, because AI training workloads are overwhelmingly memory-bandwidth-bound: the arithmetic intensity of matrix multiplications is low enough that the GPU spends most of its time fetching data, not computing. GDDR persists in GeForce / RTX-class products where cost per GB matters more than raw bandwidth per watt.</p>

  <h4>SXM — NVIDIA's high-density GPU form factor</h4>
  <p>You'll encounter two GPU "shapes" in data-center procurement: <strong>PCIe</strong> (the standard add-in card that slides into a PCIe slot, same concept as a consumer graphics card but larger) and <strong>SXM</strong> (a custom socketed module designed for maximum bandwidth and density). SXM is not a protocol or a bus — it's a <em>mechanical and electrical form factor</em> that removes the constraints of the PCIe slot and edge connector, enabling wider power delivery, direct NVLink/NVSwitch connectivity, and tighter thermal solutions.</p>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>Attribute</th><th>PCIe form factor</th><th>SXM form factor</th></tr>
    <tr><td><strong>Physical interface</strong></td><td>Standard PCIe edge connector + slot on motherboard</td><td>Custom socket on a baseboard; GPU module latches down like a CPU</td></tr>
    <tr><td><strong>Power limit</strong></td><td class="mono">~300 – 400 W per GPU (PCIe slot + auxiliary power)</td><td class="mono">~400 – 1000+ W per GPU (direct power delivery via baseboard)</td></tr>
    <tr><td><strong>NVLink connectivity</strong></td><td>Via NVLink bridge (2 GPUs, limited links) or not available</td><td>Full NVLink + NVSwitch on the baseboard — every GPU in the node fully connected</td></tr>
    <tr><td><strong>Memory</strong></td><td>GDDR or HBM (depends on GPU model)</td><td>HBM only — SXM modules are exclusively used with data-center HBM GPUs</td></tr>
    <tr><td><strong>Cooling</strong></td><td>Air-cooled (heatsink + fans in chassis)</td><td>Often liquid-cooled at scale (higher power density); some air-cooled designs exist</td></tr>
    <tr><td><strong>Density</strong></td><td>1 GPU per PCIe slot; typically 4–8 GPUs per server</td><td>8 GPUs per baseboard (DGX/HGX); can be liquid-cooled racks at higher density</td></tr>
    <tr><td><strong>Examples</strong></td><td>A100 PCIe, L40S, H100 PCIe</td><td>A100 SXM, H100 SXM, H200 SXM, B200 SXM</td></tr>
  </table></div>
  <p>The key insight: <strong>SXM exists because PCIe's power and bandwidth limits became the bottleneck for flagship GPUs.</strong> A PCIe slot delivers ~75 W from the slot itself (plus auxiliary connectors), which is far too little for a 700 W H100. More critically, PCIe Gen5 x16 gives ~64 GB/s bidirectional — a fraction of what HBM3 and NVLink 4 need. SXM bypasses both constraints: the baseboard delivers power directly, and NVLink connects GPU-to-GPU through NVSwitch without going through the PCIe bus at all.</p>
  <div class="note tip">
    <span class="tag">When to care about SXM vs PCIe</span>
    <p>If you're buying a single GPU for inference or light fine-tuning, the PCIe variant is usually sufficient and cheaper. If you're building a multi-GPU training cluster (4–8+ GPUs), SXM is effectively mandatory — without it you lose NVSwitch, full NVLink mesh, and the power headroom the flagship GPU needs to sustain peak clock speeds. The "SXM tax" is real (custom baseboards, often liquid cooling infrastructure), but it's the price of unlocking the GPU's full interconnect bandwidth.</p>
  </div>

  <h4>GPUDirect — moving data without bouncing through CPU memory</h4>
  <p>By default, data moving between a GPU and the outside world (network, disk, other GPUs) passes through CPU (host) memory — an extra copy that wastes bandwidth and adds latency. <strong>GPUDirect</strong> is NVIDIA's family of technologies that eliminate this detour:</p>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>GPUDirect variant</th><th>What it does</th><th>Introduced</th><th>Typical use case</th></tr>
    <tr><td><strong>GPUDirect Peer-to-Peer (P2P)</strong></td><td>GPU↔GPU transfers directly over NVLink or PCIe without touching host memory</td><td class="mono">2012 (Kepler)</td><td>Multi-GPU training; tensor parallelism gradient exchange</td></tr>
    <tr><td><strong>GPUDirect RDMA</strong></td><td>NIC writes directly into GPU memory over InfiniBand / RoCE, bypassing CPU and host DRAM entirely</td><td class="mono">2014 (Maxwell /Tesla K40 era)</td><td>Distributed training across nodes; MPI point-to-point to GPU buffers</td></tr>
    <tr><td><strong>GPUDirect Storage</strong></td><td>NVMe drives read/write directly to GPU memory, skipping the CPU→host-DRAM bounce</td><td class="mono">2020 (Ampere era)</td><td>Data loading for training; scientific visualization; file-heavy simulation post-processing</td></tr>
    <tr><td><strong>GPUDirect Video</strong></td><td>Capture cards stream video frames directly into GPU memory for decode/encode</td><td class="mono">2013 (early)</td><td>Video transcoding, broadcast, live streaming pipelines</td></tr>
  </table></div>
  <p>The unifying principle: <strong>minimise copies through CPU memory.</strong> Every bounce through host DRAM costs bandwidth ( PCIe x16 Gen5 ≈ 64 GB/s bidirectional) and adds latency. For distributed multi-node training, GPUDirect RDMA is essential — without it, the network stack's effective bandwidth to the GPU is bottlenecked by the CPU↔device PCIe link twice (once for the NIC → host-DRAM hop, once for host-DRAM → GPU hop). With GPUDirect RDMA, the NIC talks directly to GPU memory, and the full network bandwidth becomes available to the kernel.</p>
  <div class="note tip">
    <span class="tag">GPUDirect + NVLink = the full picture</span>
    <p>Within a node, NVLink + NVSwitch handle GPU↔GPU traffic. Across nodes, GPUDirect RDMA handles GPU↔NIC traffic. Together they create a data path from any GPU's memory to any other GPU's memory (even on a remote node) without ever touching CPU memory — this is the foundation of modern multi-node AI training clusters. Without both, you get PCIe bottlenecks that waste a large fraction of expensive GPU cycles waiting for data.</p>
  </div>
  `},

{id:'s-3-2', part:'p3', num:'3.2', title:'NVIDIA GPU Execution Hierarchy',
 dek:'GPU → GPC → TPC → SM → Warp → Thread: the nested structure behind every CUDA kernel launch.',
 tags:'gpu hierarchy gpc tpc sm warp thread occupancy cuda execution',
 diagrams:['gpuhierarchy'],
 calc:'gpuocc',
 body:`
 <p>A GPU isn't one big processor — it's a deeply nested hierarchy of smaller, mostly-independent execution units. Understanding this hierarchy is the prerequisite for understanding GPU occupancy, warp efficiency, and why some kernels use "100% GPU utilization" while achieving a small fraction of peak performance.</p>
 <div class="diagram"><div class="diagram-mount" data-diagram="gpuhierarchy"></div></div>
  <div class="diagram-cap">One branch expanded fully; siblings shaded to indicate the pattern repeats across the whole chip.</div>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>Level</th><th>Concept</th></tr>
    <tr><td class="mono">GPU</td><td>The complete accelerator</td></tr>
    <tr><td class="mono">GPC</td><td>Graphics Processing Cluster — a large partition of the chip</td></tr>
    <tr><td class="mono">TPC</td><td>Texture/Processing Cluster — a grouping within a GPC (graphics GPUs only)</td></tr>
    <tr><td class="mono">SM</td><td>Streaming Multiprocessor — the main CUDA execution unit; effectively "a core"</td></tr>
    <tr><td class="mono">Warp</td><td>32 CUDA threads executed together as one scheduling group</td></tr>
    <tr><td class="mono">Thread</td><td>An individual CUDA program instance with its own registers</td></tr>
  </table></div>

  <h4>How the hierarchy actually varies across GPUs</h4>
  <p>The diagram above shows the <em>full</em> GPU hierarchy including GPC and TPC levels — this is accurate for <strong>graphics-oriented GPUs</strong> (GeForce, RTX) where TPCs group SMs with texture units. But <strong>compute-focused data-center GPUs</strong> like the A100 and H100 simplify this: the TPC layer is largely removed, and GPCs map more directly to groups of SMs. Here's what the actual hierarchy looks like on representative hardware:</p>
  <div class="tbl-wrap"><table class="dt">
    <tr><th>Level</th><th>GeForce RTX 4090 (Ada Lovelace)</th><th>A100 (Ampere)</th><th>H100 (Hopper)</th></tr>
    <tr><td class="mono">GPC</td><td>12 GPCs</td><td>8 GPCs (but less meaningful — GPCs are functional partitions, not the grouping unit)</td><td>8 GPCs (similar to A100)</td></tr>
    <tr><td class="mono">TPC</td><td>6 TPCs per GPC</td><td><strong>No TPC layer</strong> — SMs sit directly under GPC</td><td><strong>No TPC layer</strong></td></tr>
    <tr><td class="mono">SM</td><td>128 SMs total</td><td>108 SMs total</td><td>132 SMs total</td></tr>
    <tr><td class="mono">SM sub-partitions</td><td>4 sub-cores per SM (each with its own warp schedulers)</td><td>4 sub-partitions per SM</td><td>4 sub-partitions per SM</td></tr>
    <tr><td class="mono">Warp</td><td colspan="3">32 threads — universal across all NVIDIA GPUs, always</td></tr>
    <tr><td class="mono">Registers per SM</td><td>65536</td><td>65536</td><td>65536</td></tr>
    <tr><td class="mono">Max warps per SM</td><td>48 (12 warp schedulers × 4)</td><td>64</td><td>64</td></tr>
  </table></div>
  <p>The bottom line for HPC/AI programmers: <strong>GPC and TPC are mostly invisible to CUDA code.</strong> You never address them directly — you launch grids of thread blocks, and the hardware maps blocks to SMs. The levels that matter for performance tuning are SM → Warp → Thread, because occupancy (§3.2) and warp efficiency are SM-level concepts. The GPC/TPC/GPU hierarchy is what the silicon physical design team worries about, not what you worry about in a kernel.</p>
  <p>Threads aren't scheduled individually — the hardware always moves a full warp of 32 threads through the pipeline in lockstep. If a branch inside a warp causes some threads to take one path and others another (<em>warp divergence</em>), the hardware executes both paths serially for that warp, masking off the inactive threads each time — silently costing throughput without any error or warning.</p>
 <h4>The metrics that matter</h4>
 <div class="formula-box">
   <span class="tag">GPU execution metrics</span>
   <div class="flist">
     <div class="f">Occupancy = Active warps / Maximum resident warps</div>
     <div class="f">Warp efficiency = Active lanes / 32</div>
     <div class="f">GPU utilization = time doing useful work / available time (tool-defined)</div>
   </div>
 </div>
 <div class="calc-mount" data-calc="gpuocc"></div>
 <div class="note warn"><span class="tag">The "100% utilization" trap</span><p>Most monitoring tools report GPU utilization as "was any kernel running on this GPU during this time window," not "were the compute units actually busy doing useful work." A kernel that's badly memory-bound, has low occupancy, or suffers heavy warp divergence can show 100% utilization while running at a small fraction of peak FLOP/s. Always cross-check utilization against occupancy, achieved bandwidth, or the roofline model (§1.5) before concluding a GPU is "fully used."</p></div>
 `},

{id:'s-3-3', part:'p3', num:'3.3', title:'Tensor / Matrix Compute &amp; Precision Use Cases',
 dek:'Why a GPU\'s advertised TOPS/TFLOPS can look wildly different depending on which number you\'re quoting.',
 tags:'tensor core matrix compute tops precision fp64 fp32 tf32 bf16 fp16 fp8 int8',
 body:`
 <p>Modern accelerators pack specialized matrix/tensor engines alongside their general-purpose FP32/FP64 units. These engines can advertise TOPS/TFLOPS figures dramatically higher than conventional FP64 throughput — not because the chip got magically faster, but because they're doing lower-precision arithmetic and specialized matrix operations that pack far more math per transistor and per watt.</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Precision</th><th>Typical use</th></tr>
   <tr><td class="mono">FP64</td><td>Traditional scientific HPC — most classical simulation codes</td></tr>
   <tr><td class="mono">FP32</td><td>Single-precision simulation, graphics, general ML</td></tr>
   <tr><td class="mono">TF32</td><td>NVIDIA tensor-math format that accelerates many FP32-labeled ML workloads transparently</td></tr>
   <tr><td class="mono">BF16</td><td>AI training/inference; keeps FP32's wide exponent range with less precision</td></tr>
   <tr><td class="mono">FP16</td><td>AI training/inference; more precision than BF16 but a much smaller range</td></tr>
   <tr><td class="mono">FP8</td><td>Modern large-scale AI training/inference workloads</td></tr>
   <tr><td class="mono">INT8 / INT4</td><td>Inference and quantized AI deployment</td></tr>
 </table></div>
 <p>This table is a preview — Part IV goes through every one of these formats bit-by-bit, with a live visualizer. The takeaway for now: <strong>a GPU spec sheet's headline number is only meaningful next to the precision it was measured at.</strong> A vendor slide showing "20× the AI performance" of a previous generation is very often comparing an FP8 Tensor Core number to an older FP16 or FP32 number, not a like-for-like comparison.</p>
 <div class="example-box">
   <span class="tag">Worked example — why the numbers diverge so much</span>
   <p>A representative modern data-center GPU might quote roughly:</p>
   <ul>
     <li>FP64 (non-tensor): tens of TFLOP/s</li>
     <li>FP32/TF32 (tensor-accelerated): several hundred TFLOP/s</li>
     <li>FP8 (tensor, with sparsity): several thousand TFLOP/s</li>
   </ul>
   <p>That's not one number growing — it's <strong>three different arithmetic modes</strong> on the same silicon, each trading numerical range/precision for raw throughput. Picking the wrong one to compare against your workload's actual precision requirement will badly mislead a procurement decision.</p>
 </div>
 <div class="note tip"><span class="tag">How to use this table</span><p>Identify what precision your actual workload needs (a CFD solver validated at FP64 cannot silently switch to FP8) <em>before</em> looking at spec sheets — then compare only the matching row across candidate hardware. §4.11 formalizes this into an explicit rule.</p></div>
 `},

{id:'s-3-4', part:'p3', num:'3.4', title:'CPU vs. GPU vs. Specialized Accelerator — When to Use What',
 dek:'The workload-characteristic decision table that should come before any hardware procurement conversation.',
 tags:'cpu gpu accelerator decision workload comparison branch parallel sparse',
 body:`
 <p>Neither "GPUs are always faster" nor "CPUs are always more flexible" survives contact with real workloads. The right question is which processing model matches your workload's actual computational shape.</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Workload characteristic</th><th>CPU</th><th>GPU</th><th>Specialized accelerator</th></tr>
   <tr><td>Branch-heavy code</td><td>Excellent</td><td>Usually weaker</td><td>Depends on design</td></tr>
   <tr><td>Massive data parallelism</td><td>Good</td><td>Excellent</td><td>Excellent</td></tr>
   <tr><td>Sparse / irregular algorithms</td><td>Often strong</td><td>Can be difficult</td><td>Depends on design</td></tr>
   <tr><td>FP64 scientific precision</td><td>Excellent</td><td>Excellent on HPC-class parts</td><td>Depends on design</td></tr>
   <tr><td>Low-precision AI math</td><td>Adequate</td><td>Excellent (Tensor Cores)</td><td>Often excellent (purpose-built)</td></tr>
   <tr><td>Latency-sensitive serial logic</td><td>Excellent</td><td>Poor</td><td>Depends on design</td></tr>
   <tr><td>Programming flexibility</td><td>Highest</td><td>High (mature CUDA/HIP ecosystem)</td><td>Often narrower, workload-specific</td></tr>
 </table></div>
 <p>The underlying reason CPUs and GPUs diverge this way is architectural, not incidental: a CPU core spends much of its transistor budget on branch prediction, out-of-order execution, and large caches to make a single instruction stream run fast even with irregular control flow. A GPU spends its budget on thousands of simple execution lanes and hides latency by keeping many warps in flight — brilliant when the same operation applies to millions of data elements, poor when every element wants to take a different branch.</p>
 <div class="note tip"><span class="tag">A practical decision heuristic</span><p>Ask two questions: <strong>(1)</strong> Does the same operation apply, largely unconditionally, across a large, regular dataset? That favors GPU/accelerator. <strong>(2)</strong> Does the algorithm's control flow depend heavily on the data itself (sparse graph traversal, branch-heavy decision logic)? That favors CPU, or a workload-specific accelerator designed around that irregularity. Most real HPC applications are a mix — which is exactly why heterogeneous CPU+GPU nodes are now the default, not the exception, in new HPC procurements.</p></div>
 `}
);
</script>
