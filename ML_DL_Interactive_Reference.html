<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML/DL Metrics &amp; Losses — Interactive Reference</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}]});"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root {
  --navy: #0E2238;
  --navy-deep: #081726;
  --navy-line: #1B3A57;
  --paper: #F4F5EF;
  --paper-raised: #FFFFFF;
  --ink: #161A1D;
  --ink-soft: #525A60;
  --ink-faint: #828B8F;
  --thermal: #B23D17;
  --thermal-bright: #D14E22;
  --thermal-soft: #F4E1D6;
  --flow: #1B6E7F;
  --flow-bright: #238B9F;
  --flow-soft: #DCEBEC;
  --line: #DBDBD1;
  --line-strong: #C4C5B8;
  --cyan-draft: #8FE3EF;
  --amber-draft: #F0C673;
  --ok: #3C7A4E;
  --display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --sans: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  --maxw: 760px;
  --sidebar-w: 308px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--thermal-soft); color: var(--thermal); }

a { color: var(--flow); }
button { font-family: inherit; }

/* scrollbar */
.sidebar::-webkit-scrollbar, .main::-webkit-scrollbar { width: 9px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--navy-line); border-radius: 0; }
.sidebar::-webkit-scrollbar-track { background: var(--navy-deep); }
.main::-webkit-scrollbar-thumb { background: var(--line-strong); }
.main::-webkit-scrollbar-track { background: var(--paper); }

/* ================= APP SHELL ================= */
.app-shell {
  display: flex;
  align-items: flex-start;
  max-width: 1440px;
  margin: 0 auto;
}
.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 auto;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  background: var(--navy-deep);
  color: #CBD9DE;
  border-right: 1px solid var(--navy-line);
  z-index: 20;
}
.sidebar-inner { padding: 18px 16px 60px; }
.search-wrap { position: sticky; top: 0; background: var(--navy-deep); padding-bottom: 12px; z-index: 2; }
.search-input {
  width: 100%;
  background: var(--navy);
  border: 1px solid var(--navy-line);
  color: #EAF3F5;
  font-family: var(--mono);
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 2px;
  outline: none;
}
.search-input::placeholder { color: #5F7986; }
.search-input:focus { border-color: var(--cyan-draft); }

.nav-home-link {
  display: block;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .06em;
  color: #7C93A0;
  padding: 10px 4px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--navy-line);
  margin-bottom: 10px;
}
.nav-home-link:hover { color: var(--cyan-draft); }
.nav-home-link.active { color: var(--cyan-draft); }

.nav-part { margin-bottom: 2px; }
.nav-part-btn {
  width: 100%;
  display: flex; align-items: center; gap: 9px;
  background: none; border: none; cursor: pointer;
  padding: 9px 6px;
  color: #DCE7EA;
  text-align: left;
  font-family: var(--sans);
  font-size: 13.5px;
  font-weight: 600;
}
.nav-part-num {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--navy-deep);
  background: var(--cyan-draft);
  min-width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  flex: 0 0 auto;
}
.nav-part-btn:hover .nav-part-num { background: var(--amber-draft); }
.nav-part-caret { margin-left: auto; font-size: 10px; color: #5F7986; transition: transform .15s; }
.nav-part.open .nav-part-caret { transform: rotate(90deg); }
.nav-topics {
  list-style: none; margin: 0; padding: 0 0 8px 20px;
  border-left: 1px solid var(--navy-line);
  margin-left: 11px;
  display: none;
}
.nav-part.open .nav-topics { display: block; }
.nav-topic { margin: 0; }
.nav-topic-btn {
  width: 100%;
  text-align: left;
  background: none; border: none; cursor: pointer;
  color: #94A9B1;
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.35;
  padding: 6px 10px;
  border-left: 2px solid transparent;
  margin-left: -1px;
}
.nav-topic-btn:hover { color: #EAF3F5; }
.nav-topic-btn.active {
  color: var(--cyan-draft);
  border-left-color: var(--cyan-draft);
  background: rgba(143,227,239,0.06);
  font-weight: 500;
}
.nav-topic-num { font-family: var(--mono); font-size: 11px; color: #5F7986; margin-right: 6px; }
.nav-topic-btn.active .nav-topic-num { color: var(--cyan-draft); }
.nav-hidden { display: none !important; }

.mobile-bar { display: none; }

/* ================= MAIN CONTENT ================= */
.main {
  flex: 1 1 auto;
  min-width: 0;
  padding: 52px 40px 120px;
}
.content-col { max-width: var(--maxw); margin: 0 auto; }

.section-eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--thermal);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px;
}
.section-eyebrow .sep { color: var(--line-strong); }
h1.section-title {
  font-family: var(--display);
  font-size: clamp(26px, 3.2vw, 36px);
  line-height: 1.14;
  font-weight: 600;
  margin: 0 0 12px;
  letter-spacing: -0.01em;
}
p.section-dek {
  font-size: 16.5px;
  color: var(--ink-soft);
  max-width: 60ch;
  margin: 0 0 30px;
  line-height: 1.6;
}

.prose { font-size: 15.5px; line-height: 1.72; }
.prose h3 {
  font-family: var(--display);
  font-size: 19px;
  font-weight: 600;
  margin: 34px 0 12px;
  padding-top: 2px;
}
.prose h4 {
  font-family: var(--sans);
  font-size: 14.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--ink-soft);
  margin: 26px 0 10px;
}
.prose p { margin: 0 0 15px; }
.prose ul, .prose ol { margin: 0 0 16px; padding-left: 22px; }
.prose li { margin-bottom: 7px; }
.prose strong { font-weight: 600; color: var(--ink); }
.prose code {
  font-family: var(--mono); font-size: 0.89em;
  background: var(--thermal-soft); color: var(--thermal);
  padding: 1px 5px; border-radius: 2px;
}

/* formula box */
.formula-box {
  background: var(--navy);
  color: #EAF3F5;
  border-radius: 2px;
  padding: 18px 20px 16px;
  margin: 18px 0 22px;
  position: relative;
  overflow-x: auto;
}
.formula-box .tag {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
  color: var(--cyan-draft); text-transform: uppercase; margin-bottom: 10px; display: block;
}
.formula-box .f {
  font-family: var(--mono);
  font-size: 17px;
  line-height: 1.8;
  white-space: nowrap;
}
.formula-box .f small { display: block; font-size: 12.5px; color: #8FA6AE; white-space: normal; margin-top: 6px; font-family: var(--sans); }
.formula-box .flist { display: flex; flex-direction: column; gap: 6px; }

/* variable key */
.varkey {
  display: grid; grid-template-columns: max-content 1fr;
  gap: 5px 14px; margin: 14px 0 22px;
  font-size: 14px;
}
.varkey dt { font-family: var(--mono); color: var(--thermal); font-weight: 600; }
.varkey dd { margin: 0; color: var(--ink-soft); }

/* worked example */
.example-box {
  border: 1px solid var(--line-strong);
  border-left: 3px solid var(--flow);
  background: var(--paper-raised);
  padding: 16px 20px;
  margin: 20px 0;
}
.example-box .tag {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
  color: var(--flow); text-transform: uppercase; margin-bottom: 8px; display: block; font-weight: 600;
}
.example-box p { margin: 0 0 10px; font-size: 14.8px; }
.example-box p:last-child { margin-bottom: 0; }
.example-box .res {
  font-family: var(--mono); background: var(--flow-soft); color: var(--flow);
  padding: 8px 12px; display: inline-block; margin-top: 4px; font-size: 14.5px;
}

/* note box */
.note {
  padding: 14px 18px; margin: 20px 0; font-size: 14.3px;
  border: 1px dashed var(--line-strong);
  background: #FBFAF4;
  position: relative;
}
.note .tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 6px; }
.note.tip .tag { color: var(--flow); }
.note.warn { border-color: var(--thermal-soft); background: #FBF0EA; }
.note.warn .tag { color: var(--thermal); }
.note p { margin: 0 0 8px; }
.note p:last-child { margin: 0; }

/* table */
.tbl-wrap { overflow-x: auto; margin: 18px 0 24px; border: 1px solid var(--line-strong); }
table.dt { width: 100%; border-collapse: collapse; font-size: 13.8px; background: var(--paper-raised); }
table.dt th {
  font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  text-align: left; color: #fff; background: var(--ink); padding: 9px 12px; white-space: nowrap;
}
table.dt td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
table.dt tr:nth-child(even) td { background: #FAFAF5; }
table.dt td.mono, table.dt th.mono { font-family: var(--mono); }
table.dt td:first-child { font-weight: 600; white-space: nowrap; }

/* calculator card */
.calc {
  border: 1px solid var(--navy);
  margin: 22px 0 26px;
  background: var(--paper-raised);
}
.calc-head {
  background: var(--navy); color: #EAF3F5;
  padding: 10px 16px;
  font-family: var(--mono); font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}
.calc-head::before { content: "▸"; color: var(--cyan-draft); }
.calc-body { padding: 20px; }
.calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px 22px; margin-bottom: 6px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-family: var(--mono); color: var(--ink-soft); letter-spacing: .02em; }
.field input[type=number], .field select, .field input[type=text] {
  font-family: var(--mono); font-size: 14.5px;
  padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 2px;
  background: var(--paper); color: var(--ink);
}
.field input[type=range] { accent-color: var(--thermal-bright); width: 100%; }
.field .rangeval { font-family: var(--mono); font-size: 12.5px; color: var(--thermal); font-weight: 600; }
.calc-out {
  margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line-strong);
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px;
}
.readout { background: var(--navy); padding: 12px 14px; }
.readout .rl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: #7C93A0; margin-bottom: 5px; }
.readout .rv { font-family: var(--mono); font-size: 20px; color: var(--cyan-draft); font-weight: 600; line-height: 1.15; }
.readout .ru { font-size: 11px; color: #7C93A0; margin-top: 2px; }
.readout.hot .rv { color: var(--amber-draft); }
.calc-verdict {
  margin-top: 14px; padding: 10px 14px; font-family: var(--mono); font-size: 13px;
  border-left: 3px solid var(--flow); background: var(--flow-soft); color: var(--flow);
}
.calc-verdict.hot { border-left-color: var(--thermal); background: var(--thermal-soft); color: var(--thermal); }

/* diagram container */
.diagram {
  margin: 22px 0 10px; border: 1px solid var(--line-strong); background: var(--paper-raised);
  padding: 18px; text-align: center;
}
.diagram svg { max-width: 100%; height: auto; }
.diagram-cap {
  font-family: var(--mono); font-size: 12px; color: var(--ink-soft);
  text-align: center; margin: 8px 0 26px;
}

/* part overview cards (home) */
.home-lede { font-size: 17px; color: var(--ink-soft); max-width: 64ch; margin-bottom: 6px; line-height: 1.65; }
.part-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin: 32px 0; }
.part-card {
  border: 1px solid var(--line-strong); background: var(--paper-raised);
  padding: 18px 20px; cursor: pointer; transition: border-color .15s, transform .15s;
}
.part-card:hover { border-color: var(--thermal); transform: translateY(-2px); }
.part-card .pn { font-family: var(--mono); font-size: 11px; color: var(--flow); letter-spacing: .08em; margin-bottom: 8px; }
.part-card h3 { font-family: var(--display); font-size: 18px; margin: 0 0 8px; font-weight: 600; }
.part-card p { font-size: 13.3px; color: var(--ink-soft); margin: 0 0 10px; line-height: 1.5; }
.part-card .pc { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); }

/* prev/next */
.pagenav { display: flex; justify-content: space-between; gap: 16px; margin-top: 52px; padding-top: 22px; border-top: 1px solid var(--line-strong); }
.pagenav a {
  flex: 1; text-decoration: none; color: var(--ink);
  border: 1px solid var(--line-strong); padding: 14px 16px; display: block; cursor: pointer;
}
.pagenav a:hover { border-color: var(--thermal); }
.pagenav a.next { text-align: right; }
.pagenav .pl { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; color: var(--ink-faint); letter-spacing: .08em; display: block; margin-bottom: 4px; }
.pagenav .pt { font-family: var(--sans); font-weight: 600; font-size: 14px; }

/* misc */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 8px; border: 1px solid currentColor; margin-left: 8px; vertical-align: middle;
}
.badge.interactive { color: var(--thermal); }
.badge.diagram { color: var(--flow); }
.kicker-row { display: flex; align-items: center; flex-wrap: wrap; gap: 0; }

footer.app-footer {
  border-top: 1px solid var(--line-strong); padding: 26px 40px 60px; text-align: center;
  font-family: var(--mono); font-size: 12px; color: var(--ink-faint);
}

/* diagram SVG kit */
.sch-line { stroke: #A9B0AC; stroke-width: 1.3; fill: none; }
.sch-line.hot { stroke: var(--thermal); stroke-width: 1.5; }
.sch-line.cold { stroke: var(--flow); stroke-width: 1.5; }
.sch-line.dash { stroke-dasharray: 4 3; }
.sch-node { fill: #fff; stroke: var(--navy); stroke-width: 1.4; }
.sch-node.core { fill: var(--thermal-soft); stroke: var(--thermal); }
.sch-node.leaf { fill: var(--flow-soft); stroke: var(--flow); }
.sch-node.dim { fill: #F1F1EA; stroke: var(--line-strong); }
.sch-label { font-family: var(--mono); font-size: 10.5px; fill: var(--ink-soft); }
.sch-label.strong { fill: var(--ink); font-weight: 600; }
.sch-title { font-family: var(--mono); font-size: 11px; fill: var(--ink); font-weight: 600; letter-spacing: .03em; }
.sch-bar { fill: var(--flow); }
.sch-bar.hot { fill: var(--thermal); }
.sch-grid-line { stroke: #E7E7DE; stroke-width: 1; }
.sch-axis { stroke: var(--ink-faint); stroke-width: 1; }

/* responsive */
@media (max-width: 900px) {
  .app-shell { display: block; }
  .sidebar {
    position: fixed; top: 0; left: 0; height: 100vh; width: 86vw; max-width: 340px;
    transform: translateX(-100%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0,0,0,.35);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(6,14,22,.55); z-index: 19; }
  .sidebar-overlay.show { display: block; }
  .mobile-bar {
    display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 15;
    background: var(--paper); border-bottom: 1px solid var(--line-strong); padding: 12px 16px;
  }
  .mobile-bar button {
    background: var(--navy); color: #fff; border: none; padding: 8px 12px; font-family: var(--mono); font-size: 12px; cursor: pointer;
  }
  .mobile-bar .mb-title { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main { padding: 26px 18px 90px; }
  .calc-grid { grid-template-columns: 1fr 1fr; }
  .part-grid { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .calc-grid { grid-template-columns: 1fr; }
  .calc-out { grid-template-columns: 1fr 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

:focus-visible { outline: 2px solid var(--thermal-bright); outline-offset: 2px; }

/* ================= PRINT: full-reference output ================= */
#print-root { display: none; }
.print-btn {
  width: 100%; margin-top: 10px; padding: 10px 12px; cursor: pointer;
  background: var(--cyan-draft); color: var(--navy-deep); border: none;
  font-family: var(--mono); font-size: 12.5px; font-weight: 700; letter-spacing: .02em;
}
.print-btn:hover { background: var(--amber-draft); }
.print-hint { font-family: var(--mono); font-size: 11px; color: #5F7986; margin-top: 6px; line-height: 1.5; }

@media print {
  @page { margin: 12mm; }
  html, body { background: #fff !important; }
  body { font-size: 11.5pt; line-height: 1.5; }
  .mobile-bar, .sidebar, .sidebar-overlay, .app-shell, footer.app-footer, .pagenav { display: none !important; }
  #print-root { display: block !important; color: #000; max-width: none; }
  #print-root a { color: #000; text-decoration: none; }
  #print-root .print-cover { margin-bottom: 18px; }
  #print-root .print-cover h1 { font-family: var(--display); font-size: 26pt; margin: 0 0 6px; line-height: 1.15; }
  #print-root .print-cover .sub { color: #333; font-size: 11pt; margin: 0 0 12px; }
  #print-root .print-toc { columns: 2; column-gap: 28px; font-size: 9.5pt; margin: 12px 0 0; }
  #print-root .print-toc .toc-part { break-inside: avoid; margin-bottom: 10px; }
  #print-root .print-toc .toc-part b { display: block; font-size: 9.5pt; margin-bottom: 2px; }
  #print-root .print-toc span { display: block; color: #333; line-height: 1.45; }
  #print-root .print-part { page-break-before: always; border-top: 3px solid #000; padding-top: 14px; margin: 0 0 6px; }
  #print-root .print-part:first-child { page-break-before: avoid; }
  #print-root .print-part-kicker { font-family: var(--mono); font-size: 10pt; letter-spacing: .08em; color: #333; }
  #print-root .print-part-title { font-family: var(--display); font-size: 20pt; margin: 2px 0 4px; line-height: 1.2; }
  #print-root .print-part-blurb { color: #333; font-size: 10.5pt; margin: 0; }
  #print-root .print-section { page-break-inside: auto; margin: 0 0 22px; padding-top: 10px; }
  #print-root .print-section h1.section-title { font-size: 16pt; }
  #print-root .print-section .prose { font-size: 10.5pt; line-height: 1.55; }
  #print-root .formula-box, #print-root .example-box, #print-root .note, #print-root .calc,
  #print-root .diagram, #print-root .tbl-wrap, #print-root table.dt, #print-root .readout { page-break-inside: avoid; }
  #print-root h1, #print-root h3, #print-root h4 { page-break-after: avoid; }
  /* ink-friendly overrides for dark screen components */
  #print-root .formula-box { background: #fff !important; color: #000 !important; border: 1.5px solid #000; }
  #print-root .formula-box .tag, #print-root .formula-box .f, #print-root .formula-box .f small { color: #000 !important; }
  #print-root .readout { background: #F2F2F2 !important; border: 1px solid #999; }
  #print-root .readout .rv, #print-root .readout .rl, #print-root .readout .ru { color: #000 !important; }
  #print-root .calc { border: 1px solid #999; }
  #print-root .calc-head { background: #EDEDED !important; color: #000 !important; border-bottom: 1px solid #999; }
  #print-root .calc-verdict { background: #F2F2F2 !important; color: #000 !important; border-left-color: #000 !important; }
  #print-root table.dt th { background: #EDEDED !important; color: #000 !important; border: 1px solid #999; }

SECTIONS.push({id:'p0-0',part:'p0',num:'1.1',title:'How to read these notes',dek:'Mental models for ML/DL evaluation',tags:'how to read',body:`<p>If you are new to ML/DL, keep this mental model in mind:</p>
<ul><li><strong>A metric</strong> tells you how good a model is — it is the reporting tool.</li>
<li><strong>A loss</strong> tells the model what to improve during training — it is the optimization target.</li>
<li>Some metrics are better for <strong>balanced data</strong>.</li>
<li>Some metrics are better when <strong>classes are imbalanced</strong>.</li>
<li>Some losses are better for <strong>classification</strong>, some for <strong>regression</strong>, and some for <strong>segmentation</strong>.</li></ul>
<p>The same prediction can look "good" under one metric and "bad" under another. That is normal. The key is to use the right tool for the task.</p>
<div class="note tip"><span class="tag">Key insight</span><p>A loss is not always a good reporting metric (e.g., cross-entropy is hard to interpret). A metric is not always a good training loss (e.g., accuracy is not differentiable). This is why we often train with one objective and evaluate with another.</p></div>
<div class="note tip"><span class="tag">Decision framework</span><p>Before choosing a metric, answer: (1) What task am I solving? (2) What kind of mistakes are expensive? (3) Is the data balanced? (4) Do I care about ranking, overlap, or exact values?</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p1-0',part:'p1',num:'2.1',title:'Confusion matrix terms',dek:'The four building blocks of all classification metrics',tags:'confusion matrix',body:`<p>Many classification metrics are built from four counts. Think of a medical test as the canonical example:</p>
<div class="formula-box"><span class="tag">True Positive (TP)</span><div class="f">Person has disease, test says positive</div><small>The model correctly identified a positive case. This is what we want to maximize.</small></div>
<div class="formula-box"><span class="tag">True Negative (TN)</span><div class="f">Person does NOT have disease, test says negative</div><small>The model correctly identified a negative case. Also desirable.</small></div>
<div class="formula-box"><span class="tag">False Positive (FP) — Type I Error</span><div class="f">Person does NOT have disease, test says positive</div><small>A "false alarm." The model raised an alarm when there was no danger. In spam filtering, this means a legitimate email goes to spam.</small></div>
<div class="formula-box"><span class="tag">False Negative (FN) — Type II Error</span><div class="f">Person HAS disease, test says negative</div><small>A "missed detection." The model failed to detect something real. In medical screening, this means a sick person is told they are healthy.</small></div>
<h3>Why these four numbers matter</h3><p>Every metric — accuracy, precision, recall, F1, MCC — is a different way of combining these four counts to answer a specific question about model performance.</p>
<dl class="varkey"><dt>TP</dt><dd>Correct positive prediction — the model found something real</dd>
<dt>TN</dt><dd>Correct negative prediction — the model correctly rejected a negative case</dd>
<dt>FP</dt><dd>False alarm — the model predicted positive when it should have been negative</dd>
<dt>FN</dt><dd>Missed detection — the model predicted negative when it should have been positive</dd></dl>
<div class="note tip"><span class="tag">Why this matters</span><p>When someone says "our model has 95% precision," they mean: of everything the model predicted as positive, 95% were actually positive. The remaining 5% were false positives — false alarms that waste resources or erode trust. Understanding the confusion matrix is prerequisite to everything else.</p></div>
<div class="diagram-mount" data-diagram="confusionMatrix"></div>`,calc:'confusionMatrixCalc',diagrams:['confusionMatrix']});
SECTIONS.push({id:'p1-1',part:'p1',num:'2.2',title:'Key relationships to remember',dek:'Formulas that connect related metrics',tags:'relationships formulas',body:`<p>These formulas help you move between related metrics. Memorize these — they appear everywhere.</p>
<h3>Accuracy</h3><div class="formula-box"><span class="tag">Accuracy</span><div class="f">\\(\\mathrm{Accuracy}=\\frac{TP+TN}{TP+TN+FP+FN}\\)</div><small>Fraction of all predictions that are correct.</small></div>
<h3>Precision</h3><div class="formula-box"><span class="tag">Precision</span><div class="f">\\(\\mathrm{Precision}=\\frac{TP}{TP+FP}\\)</div><small>Of everything the model predicted as positive, how many are actually positive?</small></div>
<h3>Recall (TPR)</h3><div class="formula-box"><span class="tag">Recall</span><div class="f">\\(\\mathrm{Recall}=\\frac{TP}{TP+FN}\\) = TPR</div><small>Of all actual positives, how many did the model find?</small></div>
<h3>F1 Score</h3><div class="formula-box"><span class="tag">F1</span><div class="f">\\(F_1=\\frac{2PR}{P+R}\\)</div><small>Harmonic mean of precision and recall. Punishes models that do well on one but poorly on the other.</small></div>
<h3>IoU / Jaccard</h3><div class="formula-box"><span class="tag">IoU</span><div class="f">\\(\\mathrm{IoU}=\\frac{TP}{TP+FP+FN}\\)</div><small>Measures overlap between predicted positives and true positives.</small></div>
<h3>Dice coefficient</h3><div class="formula-box"><span class="tag">Dice</span><div class="f">\\(\\mathrm{Dice}=\\frac{2TP}{2TP+FP+FN}\\)</div><small>Similar to IoU but emphasizes the intersection more.</small></div>
<h3>Dice-IoU relationship</h3><div class="formula-box"><span class="tag">Converting between Dice and IoU</span><div class="f">\\(\\mathrm{Dice}=\\frac{2\\,\\mathrm{IoU}}{1+\\mathrm{IoU}}\\)</div><div class="f">\\(\\mathrm{IoU}=\\frac{\\mathrm{Dice}}{2-\\mathrm{Dice}}\\)</div><small>These metrics are mathematically linked, so they often move together.</small></div>
<h3>RMSE-MSE</h3><div class="formula-box"><span class="tag">RMSE</span><div class="f">\\(\\mathrm{RMSE}=\\sqrt{\\mathrm{MSE}}\\)</div><small>Root mean squared error — same units as the target variable.</small></div>
<h3>Perplexity-Cross Entropy</h3><div class="formula-box"><span class="tag">Perplexity</span><div class="f">\\(\\mathrm{PPL}=e^{\\mathrm{CE}}\\)</div><small>Lower perplexity means the model is less surprised by the text.</small></div>
<div class="example-box"><span class="tag">Worked Example — Dice to IoU</span><p>If Dice = 0.8:</p><p>IoU = 0.8 / (2 - 0.8) = 0.8 / 1.2 = <strong>0.667</strong></p><p class="res">Dice = 0.800 → IoU ≈ 0.667</p></div>
<div class="note tip"><span class="tag">Practical note</span><p>IoU is always ≤ Dice for the same prediction. In medical imaging, Dice is more commonly reported; in autonomous driving, IoU dominates.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p9-0',part:'p9',num:'3.1',title:'Linear Algebra Basics',dek:'Vectors, matrices, dot products, norms, and cosine similarity',tags:'linear algebra vector matrix dot product norm cosine',body:`<p>Every ML pipeline — data as rows, features as columns, models as functions — is built on linear algebra. A dataset \\(X\\) is a matrix: \\(N\\) rows (samples) times \\(d\\) columns (features). This section builds the vocabulary you need for everything that follows.</p>
<h3>Vectors</h3><div class="formula-box"><span class="tag">Vector</span><div class="f">\\(\\mathbf{x}=\\begin{bmatrix}x_1\\\\ x_2\\\\ \\vdots\\\\ x_d\\end{bmatrix}\\in\\mathbb{R}^d\\)</div><small>A column of numbers — one row of your dataset is a vector in \\(d\\)-dimensional space.</small></div>
<div class="example-box"><span class="tag">Geometric view</span><p>Think of a vector as an <strong>arrow</strong>: a direction and a length. In 2D, \\(\\mathbf{x}=[3,4]^T\\) is the arrow from the origin to the point (3,4) — length 5.</p></div>
<h3>Matrices</h3><div class="formula-box"><span class="tag">Matrix</span><div class="f">\\(A=\\begin{bmatrix}a_{11}&a_{12}&\\cdots&a_{1d}\\\\ a_{21}&a_{22}&\\cdots&a_{2d}\\\\ \\vdots&\\vdots&\\ddots&\\vdots\\\\ a_{n1}&a_{n2}&\\cdots&a_{nd}\\end{bmatrix}\\in\\mathbb{R}^{n\\times d}\\)</div><small>A grid of numbers with \\(n\\) rows and \\(d\\) columns. \\(A_{ij}\\) is the entry in row \\(i\\), column \\(j\\).</small></div>
<h3>Key operations</h3>
<div class="example-box"><span class="tag">Matrix-vector product</span><p>Multiplying a matrix by a vector mixes the columns. Row \\(i\\) of the result is the dot product of row \\(i\\) of \\(A\\) with \\(\\mathbf{x}\\):</p><div class="f">\\((A\\mathbf{x})_i=\\sum_{j=1}^{d}A_{ij}\\,x_j\\)</div><p>This is <strong>the</strong> fundamental operation of ML: every linear layer, every rotation, every projection is a matrix-vector product. A neural network layer \\(\\mathbf{z}=W\\mathbf{x}+\\mathbf{b}\\) is exactly this plus a bias vector.</p></div>
<div class="example-box"><span class="tag">Matrix-matrix product</span><p>\\(C=AB\\) means "apply B, then apply A". Entry \\((i,j)\\) is the dot product of row \\(i\\) of \\(A\\) with column \\(j\\) of \\(B\\):</p><div class="f">\\(C_{ij}=\\sum_{k}A_{ik}B_{kj}\\)</div></div>
<div class="example-box"><span class="tag">Transpose</span><p>Swap rows and columns: \\((A^T)_{ij}=A_{ji}\\). If \\(A\\in\\mathbb{R}^{n\\times d}\\), then \\(A^T\\in\\mathbb{R}^{d\\times n}\\). The product \\(X^TX\\) (rows become columns) appears constantly — it is the raw material of covariance (see §3.3) and PCA (see §3.6).</p></div>
<div class="example-box"><span class="tag">Identity matrix</span><p>\\(I\\) has 1s on the diagonal, 0s elsewhere: \\(AI=IA=A\\). It is the "do nothing" matrix — the multiplicative identity, equivalent to 1 for scalars.</p></div>
<h3>Dot product and cosine similarity</h3>
<div class="formula-box"><span class="tag">Dot product</span><div class="f">\\(\\mathbf{u}\\cdot\\mathbf{v}=\\sum_{i}u_i v_i=\\Vert\\mathbf{u}\\Vert\\,\\Vert\\mathbf{v}\\Vert\\cos\\theta\\)</div><small>Two formulas, one quantity: element-wise sum, and geometry (lengths times the cosine of the angle between them).</small></div>
<div class="example-box"><span class="tag">Cosine similarity — the embedding metric</span><p>Normalize away the lengths to get a pure angle measure, used everywhere in retrieval and metric learning (§6.3):</p><div class="f">\\(\\mathrm{cos\\,sim}(\\mathbf{u},\\mathbf{v})=\\frac{\\mathbf{u}\\cdot\\mathbf{v}}{\\Vert\\mathbf{u}\\Vert\\Vert\\mathbf{v}\\Vert}\\in[-1,1]\\)</div><p>Cosine \\(=1\\): same direction. \\(=0\\): perpendicular. \\(=-1\\): opposite. Sentence embeddings, image embeddings, and CLIP (see §8.x) are all compared this way.</p></div>
<h3>Norms — measuring magnitude</h3>
<div class="example-box"><span class="tag">L2 norm (Euclidean)</span><div class="f">\\(\\Vert\\mathbf{x}\\Vert_2=\\sqrt{\\sum_{i}x_i^2}\\)</div><p>Straight-line length. Squares large entries, so it is dominated by big components.</p></div>
<div class="example-box"><span class="tag">L1 norm (Manhattan)</span><div class="f">\\(\\Vert\\mathbf{x}\\Vert_1=\\sum_{i}|x_i|\\)</div><p>Sum of absolute values. Does not square, so large entries do not dominate. L1 vs L2 as <em>regularizers</em> (Lasso vs Ridge) differ precisely for this reason — L1 drives weights to exactly zero.</p></div>
<div class="example-box"><span class="tag">Frobenius norm (matrices)</span><div class="f">\\(\\Vert A\\Vert_F=\\sqrt{\\sum_{i,j}A_{ij}^2}\\)</div><p>The "L2 norm of the entries". Used to measure how close two matrices are, e.g., matrix reconstruction error in PCA/SVD (see §3.6).</p></div>
<div class="note tip"><span class="tag">Why this matters before PCA</span><p>PCA (§3.6) will find <em>directions of maximum variance</em>. Variance needs a notion of "spread along a direction" — that is exactly the norm and the dot product. Everything below builds toward that single goal.</p></div>
<div class="note tip"><span class="tag">Math Interview Q&A</span><p><strong>Q: What is a vector space?</strong><br/>A set closed under addition and scalar multiplication satisfying 8 axioms (associativity, commutativity, identity, inverses, distributivity). Examples: \\(\\mathbb{R}^n\\), function spaces, polynomial spaces.</p><p><strong>Q: What does linear independence mean?</strong><br/>No vector in the set can be written as a linear combination of the others. Formally: \\(c_1\\mathbf{v}_1+\\cdots+c_n\\mathbf{v}_n=\\mathbf{0}\\) implies all \\(c_i=0\\).</p><p><strong>Q: What is a basis?</strong><br/>A linearly independent spanning set. Every vector has a unique representation in terms of the basis. Dimension = number of vectors in any basis.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p9-1',part:'p9',num:'3.2',title:'Rank, Determinant, Singularity & Inverse',dek:'When matrices can be inverted — and why singular matrices matter',tags:'rank determinant singular inverse linear system',body:`<p>These four ideas are the same fact viewed from four angles. A matrix is <strong>singular</strong> (non-invertible) exactly when its <strong>rank</strong> is deficient, exactly when its <strong>determinant</strong> is zero, exactly when it collapses information. Understanding this cluster unlocks everything about linear systems in ML.</p>
<h3>Rank</h3><div class="formula-box"><span class="tag">Rank</span><div class="f">\\(\\mathrm{rank}(A)=\\text{number of linearly independent rows (or columns)}\\)</div><small>How many dimensions of information the matrix actually contains.</small></div>
<div class="example-box"><span class="tag">Maximal vs deficient rank</span><p>An \\(n\\times d\\) matrix has rank at most \\(\\min(n,d)\\). If it reaches that bound it is <strong>full rank</strong>; otherwise <strong>rank-deficient</strong> — some rows/columns are linear combinations of others and carry no new information.</p><p class="res">Example: \\[\\begin{bmatrix}1&2\\\\ 2&4\\end{bmatrix}\\] has rank 1 — row 2 is 2× row 1. It contains only one dimension of information.</p></div>
<div class="example-box"><span class="tag">Rank of a vector — and of a set of vectors</span><p>Yes, rank applies to vectors too — a vector is just an \\(n\\times 1\\) (or \\(1\\times n\\)) matrix. A single non-zero vector always has rank 1 (one independent direction); the zero vector has rank 0:</p><div class="f">\\(\\mathbf{v}\\ne\\mathbf{0}\\implies\\mathrm{rank}(\\mathbf{v})=1,\\qquad \\mathrm{rank}(\\mathbf{0})=0\\)</div><p>The interesting question is the rank of a <em>set</em> of vectors: stack them as rows of a matrix — rank = dimension of their span = number of linearly independent vectors among them. Rows [1,2] and [2,4] give rank 1 (dependent); rows [1,0] and [0,1] give rank 2.</p></div>
<h3>How to calculate rank</h3>
<div class="example-box"><span class="tag">Method 1 — row reduction (by hand)</span><p>Do Gaussian elimination to row-echelon form. Rank = number of non-zero rows (pivots). Row operations — swap two rows, scale a row, add a multiple of one row to another — never change the rank.</p><p>Example — rank of \\(A=\\begin{bmatrix}1&2&3\\\\ 4&5&6\\\\ 7&8&9\\end{bmatrix}\\):</p><p>\\(R_2\\to R_2-4R_1\\), \\(R_3\\to R_3-7R_1\\) gives \\(\\begin{bmatrix}1&2&3\\\\ 0&-3&-6\\\\ 0&-6&-12\\end{bmatrix}\\). Then \\(R_3\\to R_3-2R_2\\) gives \\(\\begin{bmatrix}1&2&3\\\\ 0&-3&-6\\\\ 0&0&0\\end{bmatrix}\\).</p><p class="res">Two non-zero rows → rank 2. Row 3 was 2×row 2 − row 1 all along — it carried no new information.</p></div>
<div class="example-box"><span class="tag">Method 2 — SVD (how software does it)</span><p>Nobody row-reduces in floating point at scale — elimination amplifies rounding error. Libraries compute the SVD and count singular values above a small tolerance \\(\\varepsilon\\):</p><div class="f">\\(\\mathrm{rank}(A)=\\#\\{\\sigma_i : \\sigma_i &gt; \\varepsilon\\}\\)</div><p>This is exactly what <code>numpy.linalg.matrix_rank</code> does. A third characterization, useful in proofs: rank = size of the largest square submatrix with non-zero determinant (largest non-zero <em>minor</em>) — correct but combinatorially expensive, so never used computationally.</p></div>
<h3>Determinant</h3><div class="formula-box"><span class="tag">Determinant (2×2)</span><div class="f">\\(\\det\\!\\begin{bmatrix}a&b\\\\ c&d\\end{bmatrix}=ad-bc\\)</div><small>A scalar that measures the "volume scaling factor" of the matrix as a transformation.</small></div>
<div class="example-box"><span class="tag">Geometric meaning</span><p>Applying a matrix to a shape scales its area by \\(|\\det A|\\). If \\(\\det A=0\\), the matrix flattens the shape into a lower dimension — area becomes zero. That flattening is exactly what "singular" means.</p></div>
<div class="example-box"><span class="tag">Computing determinants beyond 2×2</span><p>Three tools cover everything:</p><ul><li><strong>Triangular matrices:</strong> determinant = product of the diagonal, \\(\\det U=u_{11}u_{22}\\cdots u_{nn}\\). This is why LU decomposition computes determinants almost for free.</li><li><strong>Cofactor (Laplace) expansion:</strong> pick a row \\(i\\), \\(\\det A=\\sum_j (-1)^{i+j}a_{ij}M_{ij}\\) with \\(M_{ij}\\) the minor (determinant after deleting row \\(i\\), column \\(j\\)). Exact but \\(O(n!)\\).</li><li><strong>Sarrus rule (3×3 only):</strong> \\(\\det\\!\\begin{bmatrix}a&b&c\\\\ d&e&f\\\\ g&h&i\\end{bmatrix}=aei+bfg+cdh-ceg-bdi-afh\\).</li></ul><p class="res">Example: \\(\\det\\!\\begin{bmatrix}1&2&3\\\\ 0&1&4\\\\ 5&6&0\\end{bmatrix}=1(1\\cdot0-4\\cdot6)-2(0\\cdot0-4\\cdot5)+3(0\\cdot6-1\\cdot5)=-24+40-15=1\\). Non-zero → invertible.</p></div>
<h3>Singularity and the inverse</h3>
<div class="formula-box"><span class="tag">Inverse</span><div class="f">\\(A^{-1}A=AA^{-1}=I\\)</div><small>The matrix that undoes \\(A\\). Only square, full-rank matrices have an inverse.</small></div>
<div class="example-box"><span class="tag">Singular = no inverse</span><p>These are equivalent for a square matrix \\(A\\):</p><ul><li>\\(\\det A=0\\)</li><li>\\(\\mathrm{rank}(A)&lt;n\\) (not full rank)</li><li>\\(A^{-1}\\) does not exist</li><li>\\(A\\mathbf{x}=\\mathbf{0}\\) has a non-zero solution (columns are dependent)</li><li>\\(A\\) maps some non-zero vector to zero — information is destroyed</li></ul></div>
<div class="note warn"><span class="tag">Terminology trap: singular matrix ≠ singular values</span><p>These sound alike but are different ideas. A <strong>singular matrix</strong> is a property: square, \\(\\det A=0\\), no inverse. <strong>Singular values</strong> \\(\\sigma_1\\ge\\cdots\\ge 0\\) are numbers from the SVD (§3.5), defined as \\(\\sigma_i=\\sqrt{\\lambda_i(A^TA)}\\) — and <em>every</em> matrix has them, even invertible ones.</p><p>The link: a square matrix is singular exactly when its smallest singular value is zero (\\(\\sigma_{\\min}=0\\)). Rank of \\(A\\) = number of non-zero singular values.</p></div>
<div class="example-box"><span class="tag">Testing singularity in practice</span><p>Never test \\(\\det A==0\\) in floating point: determinants under/overflow and scale with matrix size — a diagonal 100×100 matrix of 0.5s has det ≈ \\(10^{-30}\\) yet is perfectly invertible — so "small determinant" is meaningless. Instead:</p><ul><li><strong>Rank check:</strong> \\(\\mathrm{rank}(A)&lt;n\\) → singular (use the rank methods above).</li><li><strong>Smallest singular value:</strong> \\(\\sigma_{\\min}\\approx 0\\) → singular or numerically so.</li><li><strong>Condition number:</strong> \\(\\kappa=\\sigma_{\\max}/\\sigma_{\\min}\\); \\(\\kappa\\gtrsim 10^{12}\\) in double precision means effectively singular — solutions will be garbage.</li></ul><p>In code: <code>numpy.linalg.matrix_rank</code> and <code>numpy.linalg.cond</code>, not the raw determinant.</p></div>
<div class="example-box"><span class="tag">Why it matters for ML</span><p>Solving \\(A\\mathbf{x}=\\mathbf{b}\\) — the heart of least squares, ridge regression, and normal equations — needs \\(A\\) to be invertible (or nearly so). If \\(A\\) is singular or ill-conditioned (det very small), tiny changes in \\(\\mathbf{b}\\) cause huge changes in \\(\\mathbf{x}\\): the solution is unstable. This is why ridge adds \\(\\lambda I\\) to \\(X^TX\\) — it nudges the matrix away from singularity.</p></div>
<div class="example-box"><span class="tag">2×2 inverse formula</span><div class="f">\\(\\begin{bmatrix}a&b\\\\ c&d\\end{bmatrix}^{-1}=\\frac{1}{ad-bc}\\begin{bmatrix}d&-b\\\\ -c&a\\end{bmatrix}\\)</div><p>Division by \\(ad-bc=\\det A\\) — if the determinant is zero, the formula blows up, which is another way of seeing singularity.</p></div>
<div class="example-box"><span class="tag">Computing the inverse — Gauss–Jordan</span><p>Augment with the identity and row-reduce until the left half is \\(I\\): \\([A\\mid I]\\to[I\\mid A^{-1}]\\). On \\(A=\\begin{bmatrix}2&1\\\\ 1&1\\end{bmatrix}\\): \\(R_1\\gets R_1-R_2\\) gives left \\(\\begin{bmatrix}1&0\\\\ 1&1\\end{bmatrix}\\); then \\(R_2\\gets R_2-R_1\\) gives left \\(I\\) and right \\(\\begin{bmatrix}1&-1\\\\ -1&2\\end{bmatrix}=A^{-1}\\). Matches the 2×2 formula since \\(\\det A=1\\).</p><p class="res">Practical rule: almost never form \\(A^{-1}\\) explicitly — \\(O(n^3)\\) with worse stability than solving directly. Need \\(A^{-1}\\mathbf{b}\\)? Call a solver (<code>numpy.linalg.solve</code>, QR/Cholesky) instead.</p></div>
<h3>Pseudo-inverse — when the matrix is not square</h3>
<div class="formula-box"><span class="tag">Moore-Penrose pseudo-inverse</span><div class="f">\\(A^{+}=(A^TA)^{-1}A^T\\)</div><small>For tall/rectangular matrices where a true inverse cannot exist.</small></div>
<div class="example-box"><span class="tag">Use case</span><p>Over-determined least squares: when you have more equations than unknowns, the best you can do is the solution that minimizes \\(\\Vert A\\mathbf{x}-\\mathbf{b}\\Vert_2\\) — that solution is \\(\\mathbf{x}=A^{+}\\mathbf{b}\\). This is exactly what <code>numpy.linalg.pinv</code> computes, and it is the closed-form solution linear regression converges to.</p></div>
<div class="note tip"><span class="tag">Connecting thread</span><p>Rank deficient → singular → determinant 0 → no inverse → information collapsed. The SVD (§3.5) is the tool that lets you <em>see</em> the rank and even compute a pseudo-inverse gracefully when a matrix is nearly singular.</p></div>
<div class="note tip"><span class="tag">Math Interview Q&A</span><p><strong>Q: What is the rank-nullity theorem?</strong><br/>\\(\\mathrm{rank}(A)+\\mathrm{nullity}(A)=n\\) (columns). Dimension of column space + dimension of null space = total columns.</p><p><strong>Q: How do you check singularity without computing the determinant?</strong><br/>Check if \\(\\mathrm{rank}&lt;n\\), or smallest singular value \\(\\approx 0\\), or condition number \\(\\kappa\\) very large. Never test \\(\\det A==0\\) in floating point — determinants under/overflow and scale with matrix size.</p><p><strong>Q: What is the geometric meaning of the determinant?</strong><br/>The signed volume scaling factor of the linear transformation. \\(|\\det A|\\) = how much the transformation stretches volumes. \\(\\det A=0\\) = the transformation collapses space into a lower dimension.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p9-2',part:'p9',num:'3.3',title:'Covariance & Correlation',dek:'Measuring how features move together — the matrix that PCA rotates',tags:'covariance correlation variance covariance matrix',body:`<p>Covariance is the bridge between raw data and PCA. It summarizes, in one matrix, how every pair of features varies together. PCA (next sections) finds the directions in which that variation is largest.</p>
<h3>Variance — spread of one feature</h3>
<div class="formula-box"><span class="tag">Sample variance</span><div class="f">\\(\\mathrm{Var}(x)=\\frac{1}{N}\\sum_{i=1}^{N}(x_i-\\bar{x})^2\\)</div><small>Average squared deviation from the mean. Large if values are spread out.</small></div>
<h3>Covariance — joint spread of two features</h3>
<div class="formula-box"><span class="tag">Covariance</span><div class="f">\\(\\mathrm{Cov}(x,y)=\\frac{1}{N}\\sum_{i=1}^{N}(x_i-\\bar{x})(y_i-\\bar{y})\\)</div><small>Positive: both tend to be above their means together. Negative: one goes up as the other goes down. Zero: no linear relationship.</small></div>
<div class="example-box"><span class="tag">Intuition</span><p>Split each point into "how far above/below its mean". Multiply the two deviations and average. If tall-and-heavy students consistently co-occur, the product is mostly positive → positive covariance. Height vs running speed would be negative.</p></div>
<h3>The covariance matrix</h3>
<div class="formula-box"><span class="tag">Covariance matrix (d features)</span><div class="f">\\(\\Sigma=\\frac{1}{N}X_c^T X_c,\\quad \\Sigma_{jk}=\\mathrm{Cov}(x_j,x_k)\\)</div><small>Where \\(X_c\\) is the data matrix with each column mean-centered. Diagonal = per-feature variance; off-diagonal = pairwise covariance.</small></div>
<div class="example-box"><span class="tag">Structure of Σ</span><p>For features \\(x_1,\\ldots,x_d\\), the covariance matrix is symmetric (\\(\\Sigma_{jk}=\\Sigma_{kj}\\)) and positive semi-definite:</p><div class="f">\\(\\Sigma=\\begin{bmatrix}\\mathrm{Var}(x_1)&\\mathrm{Cov}(x_1,x_2)&\\cdots\\\\ \\mathrm{Cov}(x_2,x_1)&\\mathrm{Var}(x_2)&\\cdots\\\\ \\vdots&\\vdots&\\ddots\\end{bmatrix}\\)</div><p class="res">Example: \\(\\Sigma=\\begin{bmatrix}4&2\\\\ 2&1\\end{bmatrix}\\) means \\(x_1\\) has variance 4, \\(x_2\\) has variance 1, and the two are positively correlated.</p></div>
<h3>Correlation — covariance made scale-free</h3>
<div class="formula-box"><span class="tag">Pearson correlation</span><div class="f">\\(\\rho_{xy}=\\frac{\\mathrm{Cov}(x,y)}{\\sigma_x\\sigma_y}\\in[-1,1]\\)</div><small>Covariance divided by the product of standard deviations. Unitless, so comparable across features of different scales.</small></div>
<div class="example-box"><span class="tag">Why standardize before PCA</span><p>Covariance is scale-sensitive: a feature measured in meters vs millimeters will dwarf everything else even if it is not more informative. Standardizing (z-scores: \\((x-\\bar{x})/\\sigma\\)) makes \\(\\Sigma\\) equal the correlation matrix, so every feature competes equally — the standard preprocessing step before PCA.</p></div>
<div class="note tip"><span class="tag">Why there will almost always be redundancy</span><p>Real features are rarely independent — that is the entire premise of PCA. If \\(\\Sigma\\) were perfectly diagonal (all covariances zero), each feature already carried unique information and PCA would find nothing to compress. Redundant off-diagonal structure is what PCA exploits.</p></div>
<div class="note tip"><span class="tag">Math Interview Q&A</span><p><strong>Q: Why is the covariance matrix always positive semi-definite?</strong><br/>For any vector \\(\\mathbf{v}\\): \\(\\mathbf{v}^T\\Sigma\\mathbf{v}=\\mathrm{Var}(\\mathbf{v}^TX)\\ge 0\\). Variance is always non-negative — this is the definition of positive semi-definiteness.</p><p><strong>Q: What is the difference between covariance and correlation?</strong><br/>Covariance measures joint variability (scale-dependent, units = product of original units). Correlation normalizes by standard deviations: \\(\\rho=\\mathrm{Cov}/(\\sigma_x\\sigma_y)\\in[-1,1]\\), making it scale-free and comparable across features.</p><p><strong>Q: Can two variables be correlated but have zero covariance?</strong><br/>No — correlation is just normalized covariance. But two variables can have zero correlation (no <em>linear</em> relationship) while having a strong non-linear relationship (e.g., \\(y=x^2\\) on symmetric data).</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p9-3',part:'p9',num:'3.4',title:'Eigenvalues & Eigenvectors',dek:'The directions a matrix keeps fixed — the machinery behind PCA',tags:'eigenvalue eigenvector eigendecomposition characteristic equation',body:`<p>An eigenvector is a direction that a matrix does not rotate — it only stretches (or shrinks) along that line. Eigenvalues tell you how much. When the matrix is a covariance matrix, eigenvectors are the directions of maximum variance, and that is PCA.</p>
<h3>Definition</h3>
<div class="formula-box"><span class="tag">Eigen-equation</span><div class="f">\\(A\\mathbf{v}=\\lambda\\mathbf{v},\\quad \\mathbf{v}\\ne\\mathbf{0}\\)</div><small>\\(\\mathbf{v}\\) is an eigenvector, \\(\\lambda\\) its eigenvalue. The matrix acts on \\(\\mathbf{v}\\) as pure scaling.</small></div>
<div class="example-box"><span class="tag">Geometric meaning</span><p>Apply \\(A\\) to an eigenvector and the arrow keeps pointing the same way — only its length changes by \\(\\lambda\\). Non-eigenvectors get rotated and mixed:</p><ul><li>\\(\\lambda&gt;1\\): stretched</li><li>\\(0&lt;\\lambda&lt;1\\): shrunk</li><li>\\(\\lambda=0\\): collapsed to zero (this is exactly the singular/non-invertible case from §3.2)</li><li>\\(\\lambda&lt;0\\): flipped and scaled</li></ul></div>
<h3>How to find them</h3>
<div class="formula-box"><span class="tag">Characteristic equation</span><div class="f">\\(\\det(A-\\lambda I)=0\\)</div><small>Eigenvalues are the roots of this polynomial in \\(\\lambda\\). Then solve \\((A-\\lambda I)\\mathbf{v}=\\mathbf{0}\\) for each eigenvector.</small></div>
<div class="example-box"><span class="tag">2×2 worked example</span><p>Take \\(A=\\begin{bmatrix}2&1\\\\ 1&2\\end{bmatrix}\\). Then \\(\\det(A-\\lambda I)=(2-\\lambda)^2-1=0\\), giving \\(\\lambda=3\\) and \\(\\lambda=1\\).</p><p class="res">λ₂=3: \\(\\mathbf{v}=[1,1]^T\\). λ₁=1: \\(\\mathbf{v}=[1,-1]^T\\). The two eigenvectors are perpendicular — guaranteed because \\(A\\) is symmetric.</p></div>
<h3>Eigendecomposition</h3>
<div class="formula-box"><span class="tag">Spectral decomposition</span><div class="f">\\(A=V\\Lambda V^{-1},\\quad \\Lambda=\\mathrm{diag}(\\lambda_1,\\ldots,\\lambda_n)\\)</div><small>Columns of \\(V\\) are eigenvectors; \\(\\Lambda\\) holds eigenvalues on the diagonal. Reading right-to-left: project onto eigenvectors, scale each by its eigenvalue, put back.</small></div>
<div class="example-box"><span class="tag">Symmetric matrices are special</span><p>If \\(A=A^T\\) (true for all covariance matrices §3.3):</p><ul><li>All eigenvalues are real (no imaginary parts)</li><li>Eigenvectors are orthonormal: \\(V^TV=I\\), so \\(V^{-1}=V^T\\)</li><li>Decomposition simplifies to \\(A=V\\Lambda V^T\\)</li></ul><p>This orthogonality is why PCA directions are always perpendicular <em>axes</em>, not skewed lines.</p></div>
<div class="example-box"><span class="tag">Positive eigenvalues → positive definiteness</span><p>A symmetric matrix with all \\(\\lambda&gt;0\\) is <strong>positive definite</strong> (all \\(\\ge 0\\): positive semi-definite). Covariance matrices are always positive semi-definite — a necessary sanity check, and the condition that makes Cholesky factorization (§3.5) applicable.</p></div>
<h3>Why eigenvalues are the backbone of ML math</h3>
<div class="example-box"><span class="tag">Everywhere you meet them</span><p><strong>PCA (§3.6):</strong> eigenvectors of the covariance matrix = principal components; eigenvalues = variance along each. <strong>Markov chains / PageRank:</strong> stationary distribution is the eigenvector of the transition matrix with \\(\\lambda=1\\). <strong>Spectral clustering:</strong> eigenvectors of the graph Laplacian. <strong>Power iteration:</strong> repeatedly multiply by \\(A\\) and normalize — the vector converges to the dominant eigenvector, the basis of how <code>numpy.linalg.eig</code> and recommendation systems find the top component. <strong>Conditioning of linear systems (§3.2):</strong> ratio of largest to smallest eigenvalue = condition number; huge ratio means numerically unstable.</p></div>
<div class="note tip"><span class="tag">The one-liner that unlocks PCA</span><p>For a symmetric matrix, <em>the largest eigenvalue corresponds to the direction of maximum stretch — the direction of maximum variance of the data whose covariance is that matrix</em>. Finding eigenvectors of the covariance = finding the principal axes. That is section 3.6 in one sentence.</p></div>
<div class="note tip"><span class="tag">Math Interview Q&A</span><p><strong>Q: What does a zero eigenvalue mean?</strong><br/>The matrix is singular — it collapses information along that eigenvector's direction. The rank equals the number of non-zero eigenvalues.</p><p><strong>Q: Can a non-symmetric matrix have complex eigenvalues?</strong><br/>Yes. Example: rotation matrix \\(\\begin{bmatrix}0&-1\\\\1&0\\end{bmatrix}\\) has eigenvalues \\(\\pm i\\). Real eigenvalues are guaranteed only for symmetric matrices.</p><p><strong>Q: What is the relationship between eigenvalues and the determinant/trace?</strong><br/>\\(\\det A=\\prod\\lambda_i\\) (product of eigenvalues), \\(\\mathrm{tr}(A)=\\sum\\lambda_i\\) (sum of eigenvalues). These hold for any square matrix.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p9-4',part:'p9',num:'3.5',title:'Matrix Factorization',dek:'LU, QR, Cholesky, eigendecomposition, and SVD — what each is for and how expensive',tags:'matrix factorization lu qr cholesky eigendecomposition svd',body:`<p>Factorizing a matrix means rewriting it as a product of simpler, more structured matrices. Every serious numerical algorithm in ML — solving linear systems, least squares, PCA, recommendation systems — is a factorization. This section gives you the map: which one, when, and at what cost.</p>
<h3>The factorizations</h3>
<div class="example-box"><span class="tag">LU — Gaussian elimination, made structural</span><div class="f">\\(A=LU\\)</div><p>Lower-triangular \\(L\\) times Upper-triangular \\(U\\). Once \\(LU\\) is known, solving \\(A\\mathbf{x}=\\mathbf{b}\\) becomes two cheap triangular solves (forward then backward substitution). This is what <code>numpy.linalg.solve</code> does under the hood. Complexity \\(O(n^3)\\).</p></div>
<div class="example-box"><span class="tag">LU worked example — full walkthrough</span><p>Factor \\(A=\\begin{bmatrix}2&1\\\\ 4&3\\end{bmatrix}\\) and solve \\(A\\mathbf{x}=[5,11]^T\\).</p><p><strong>Step 1 — factor \\(A=LU\\).</strong> Eliminate \\(4\\) below the pivot \\(2\\): \\(R_2\\to R_2-2R_1\\). Multiplier is \\(2\\):</p><div class="f">\\[\\begin{bmatrix}2&1\\\\ 4&3\\end{bmatrix}=\\begin{bmatrix}1&0\\\\ \\boxed{2}&1\\end{bmatrix}\\begin{bmatrix}2&1\\\\ 0&\\boxed{1}\\end{bmatrix}\\]</div><p><strong>Step 2 — forward substitution (solve \\(L\\mathbf{y}=\\mathbf{b}\\)).</strong> Write the system out explicitly:</p><div class="f">\\[\\underbrace{1\\cdot y_1=5}_{\\text{row 1}}\\qquad\\underbrace{2\\cdot y_1+1\\cdot y_2=11}_{\\text{row 2}}\\]</div><p>Because \\(L\\) is lower-triangular, row 1 involves only \\(y_1\\) — solve it first: \\(y_1=5\\). Substitute into row 2: \\(2(5)+y_2=11\\), so \\(y_2=1\\). <em>You always go top-to-bottom because each equation introduces exactly one new unknown.</em></p><p><strong>Step 3 — backward substitution (solve \\(U\\mathbf{x}=\\mathbf{y}\\)).</strong> Write the system out explicitly:</p><div class="f">\\[\\underbrace{2\\cdot x_1+1\\cdot x_2=5}_{\\text{row 1}}\\qquad\\underbrace{1\\cdot x_2=1}_{\\text{row 2}}\\]</div><p>Because \\(U\\) is upper-triangular, row 2 (the bottom) involves only \\(x_2\\) — solve it first: \\(x_2=1\\). Substitute into row 1: \\(2x_1+1=5\\), so \\(x_1=2\\). <em>You always go bottom-to-top because the last equation has the fewest unknowns.</em></p><p class="res">\\(\\mathbf{x}=[2,1]^T\\). Check: \\(2(2)+1(1)=5\\), \\(4(2)+3(1)=11\\). Zero pivot on the diagonal? Swap rows first — partial pivoting (\\(PA=LU\\)), what <code>scipy.linalg.lu</code> returns.</p></div>
<div class="example-box"><span class="tag">Cholesky — the covariance workhorse</span><div class="f">\\(A=LL^T\\)</div><p>For symmetric positive definite matrices only — which covariance matrices always are (§3.3). About <strong>half the cost of LU</strong> (\\(\\tfrac{1}{3}n^3\\) vs \\(\\tfrac{2}{3}n^3\\), both \\(O(n^3)\\)), and numerically very stable. Used for Gaussian-process covariance solves, Kalman filters, and sampling multivariate normals.</p></div>
<div class="example-box"><span class="tag">QR — the stable least-squares solver</span><div class="f">\\(A=QR\\)</div><p>Orthogonal \\(Q\\) times upper-triangular \\(R\\). Solving least squares via QR is numerically far more stable than forming \\(A^TA\\) and inverting it (§3.2). Complexity \\(O(n^3)\\).</p></div>
<div class="example-box"><span class="tag">Eigendecomposition — symmetric/ square only</span><div class="f">\\(A=V\\Lambda V^T\\)</div><p>From §3.4. Needs \\(A\\) to be symmetric (or at least diagonalizable) and square. Gives eigenvalues (variance) and eigenvectors (directions) directly. Complexity \\(O(n^3)\\).</p></div>
<div class="example-box"><span class="tag">SVD — works on ANY matrix</span><div class="f">\\(A=U\\Sigma V^T\\)</div><p><strong>Singular Value Decomposition.</strong> \\(U\\) and \\(V\\) are orthogonal matrices, \\(\\Sigma\\) is diagonal with non-negative <strong>singular values</strong> \\(\\sigma_1\\ge\\sigma_2\\ge\\cdots\\ge 0\\). It exists for every matrix — square or rectangular, singular or not. This is the most general and most robust factorization.</p><ul><li>Rank of \\(A\\) = number of non-zero singular values</li><li>Condition number = \\(\\sigma_{\\max}/\\sigma_{\\min}\\) (large = ill-conditioned, §3.2)</li><li>For symmetric positive semi-definite \\(A\\): singular values = eigenvalues, and \\(U=V\\)</li></ul><p>Complexity \\(O(mn^2)\\) for an \\(m\\times n\\) matrix (usually \\(O(n^3)\\) for square).</p></div>
<div class="note tip"><span class="tag">SVD vs eigendecomposition — which one when</span><p>Eigen asks "which directions stay fixed" (\\(A\\mathbf{v}=\\lambda\\mathbf{v}\\)); SVD asks "which input/output direction pairs stretch the most" (\\(A\\mathbf{v}_i=\\sigma_i\\mathbf{u}_i\\)). Eigen needs a square diagonalizable \\(A\\) and its \\(\\lambda\\) can be negative or complex; SVD works on any \\(m\\times n\\) matrix with real non-negative \\(\\sigma\\) and orthogonal \\(U,V\\).</p><p>They coincide for symmetric positive semi-definite matrices such as covariances: \\(\\sigma_i=\\lambda_i\\) and \\(U=V\\). Rule: square symmetric → eigen is fine and cheaper; rectangular, rank-deficient, or stability-critical → SVD. Production PCA uses SVD of the data matrix directly (§3.6).</p></div>
<h3>Complexity comparison <span class="badge interactive">Interactive</span></h3>
<div class="tbl-wrap"><table class="dt">
<thead><tr><th>Factorization</th><th>Requires</th><th>Complexity (n×n)</th><th>Typical use in ML</th></tr></thead>
<tbody>
<tr><td>LU</td><td>Square, non-singular</td><td>\\(\\tfrac{2}{3}n^3\\)</td><td>Solving \\(Ax=b\\), dense linear systems</td></tr>
<tr><td>Cholesky</td><td>Symmetric positive definite</td><td>\\(\\tfrac{1}{3}n^3\\) (half of LU)</td><td>Covariance solves, GPs, sampling</td></tr>
<tr><td>QR</td><td>Any \\(m\\times n\\)</td><td>\\(O(n^3)\\)</td><td>Stable least squares (most reliable)</td></tr>
<tr><td>Eigendecomposition</td><td>Square, diagonalizable</td><td>\\(O(n^3)\\)</td><td>PCA via covariance, spectral methods</td></tr>
<tr><td>SVD</td><td>Any matrix</td><td>\\(O(mn^2)\\)</td><td>PCA via data matrix, low-rank approximation, recommender systems, pseudo-inverse</td></tr>
</tbody></table></div>
<div class="note tip"><span class="tag">Choosing</span><p>Symmetric positive definite → <strong>Cholesky</strong> (cheapest). General square system → <strong>LU</strong>. Least squares / stability matters → <strong>QR</strong>. Need variance structure → <strong>eigendecomposition</strong>. Anything else, rectangular, or near-singular → <strong>SVD</strong>. When in doubt in practice, SVD is the safest tool — <code>numpy.linalg.svd</code> is the Swiss army knife.</p></div>
<div class="example-box"><span class="tag">Why recommender systems love SVD</span><p>The user×item matrix is huge, sparse, and full of missing entries. SVD gives the best rank-\\(k\\) approximation \\(A\\approx U_k\\Sigma_k V_k^T\\) in Frobenius norm (§3.1) — the mathematical justification for latent-factor models (matrix factorization for collaborative filtering). The same low-rank idea powers PCA compression: keep the largest \\(k\\) singular values and discard the rest.</p></div>
<div class="note tip"><span class="tag">Math Interview Q&A</span><p><strong>Q: Why is SVD preferred over eigendecomposition in practice?</strong><br/>SVD works on any matrix (not just square/diagonalizable), always produces real non-negative singular values sorted in descending order, and is numerically more stable — no need to form \\(A^TA\\).</p><p><strong>Q: What is the connection between SVD and rank?</strong><br/>rank = number of non-zero singular values. The best rank-\\(k\\) approximation keeps the top \\(k\\) singular values and sets the rest to zero (Eckart–Young theorem).</p><p><strong>Q: What is a pseudo-inverse and when do you use it?</strong><br/>\\(A^+=(A^TA)^{-1}A^T\\) for overdetermined systems (more equations than unknowns). It gives the least-squares solution \\(\\mathbf{x}=A^+\\mathbf{b}\\) that minimizes \\(\\Vert A\\mathbf{x}-\\mathbf{b}\\Vert_2\\). Computed via SVD, not by forming \\(A^TA\\).</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p9-5',part:'p9',num:'3.6',title:'Principal Component Analysis (PCA)',dek:'Putting it all together: covariance → eigenvalues → projection',tags:'pca principal component analysis dimension reduction variance explained svd',body:`<p>You have data in \\(d\\) dimensions but most of the variation lives in far fewer. PCA finds the orthogonal axes (principal components) along which variance is largest, then projects the data onto the top \\(k\\) of them — keeping the signal, dropping the noise.</p><p><strong>The geometric picture:</strong> imagine a cloud of points stretched along one diagonal direction and thin in the perpendicular direction. PCA rotates the coordinate system so the first axis aligns with the long direction (maximum variance) and the second with the short direction. You can then drop the short axis with minimal information loss.</p>
<h3>The PCA recipe</h3>
<div class="example-box"><span class="tag">Step 1 — Standardize</span><p>Center each feature (subtract mean) and scale to unit variance (z-scores), so a feature measured in millimeters does not dominate one measured in meters:</p><div class="f">\\(z_{ij}=\\frac{x_{ij}-\\bar{x}_j}{\\sigma_j}\\)</div><p>Without this step the largest-variance feature silently dominates PC1 — even if it is the least predictive (§3.3).</p></div>
<div class="example-box"><span class="tag">Step 2 — Covariance matrix</span><p>Compute the \\(d\\times d\\) covariance matrix of the standardized data:</p><div class="f">\\(\\Sigma=\\frac{1}{N}Z^TZ\\)</div><p>Diagonal entries are per-feature variances; off-diagonal entries measure how each pair co-varies. Redundant off-diagonal structure is exactly what PCA exploits — if \\(\\Sigma\\) were already diagonal, PCA would find nothing to compress.</p></div>
<div class="example-box"><span class="tag">Step 3 — Eigendecompose \\(\\Sigma\\)</span><p>Find eigenvalues \\(\\lambda_1\\ge\\lambda_2\\ge\\cdots\\ge\\lambda_d\\ge 0\\) and orthonormal eigenvectors \\(\\mathbf{v}_1,\\ldots,\\mathbf{v}_d\\) (§3.4):</p><div class="f">\\(\\Sigma\\mathbf{v}_j=\\lambda_j\\mathbf{v}_j\\)</div><p>Each eigenvector \\(\\mathbf{v}_j\\) is a principal component axis; the corresponding eigenvalue \\(\\lambda_j\\) is the variance of the data along that axis. Larger eigenvalue = more information captured.</p></div>
<div class="example-box"><span class="tag">Step 4 — Project onto the top \\(k\\) components</span><p>Keep the \\(k\\) eigenvectors with the largest eigenvalues and project:</p><div class="f">\\(Y=ZV_k\\quad (N\\times k)\\)</div><p>Each row of \\(Y\\) is a sample's new coordinates in the \\(k\\)-dimensional PCA space — the "PCA features". The removed dimensions carried only noise or redundancy.</p></div>
<h3>Worked example — 2D → 1D</h3>
<div class="example-box"><span class="tag">Small dataset</span><p>Four points already standardized: \\((1,1),\\;(2,2),\\;(3,3),\\;(4,4)\\). Perfectly correlated — all along the line \\(y=x\\).</p></div>
<div class="example-box"><span class="tag">Step A — covariance matrix</span><p>\\(\\Sigma=\\begin{bmatrix}1.25&1.25\\\\ 1.25&1.25\\end{bmatrix}\\). Off-diagonals are large: features are redundant.</p></div>
<div class="example-box"><span class="tag">Step B — eigendecompose</span><p>Eigenvalues: \\(\\lambda_1=2.5,\\;\\lambda_2=0\\). Eigenvectors: \\(\\mathbf{v}_1=\\tfrac{1}{\\sqrt{2}}[1,1]^T,\\;\\mathbf{v}_2=\\tfrac{1}{\\sqrt{2}}[-1,1]^T\\).</p><p class="res">PC1 variance = 2.5 (100%). PC2 variance = 0. All information is along PC1.</p></div>
<div class="example-box"><span class="tag">Step C — project</span><p>Project each point onto \\(\\mathbf{v}_1\\): \\(y_i=z_i\\cdot\\mathbf{v}_1\\).</p><div class="f">\\[Y=\\begin{bmatrix}1&1\\\\ 2&2\\\\ 3&3\\\\ 4&4\\end{bmatrix}\\cdot\\tfrac{1}{\\sqrt{2}}\\begin{bmatrix}1\\\\ 1\\end{bmatrix}=\\tfrac{1}{\\sqrt{2}}\\begin{bmatrix}2\\\\ 4\\\\ 6\\\\ 8\\end{bmatrix}\\approx\\begin{bmatrix}1.41\\\\ 2.83\\\\ 4.24\\\\ 5.66\\end{bmatrix}\\]</div><p>Two correlated features collapsed to one axis with zero information loss.</p></div>
<h3>Variance explained</h3>
<div class="formula-box"><span class="tag">Explained variance ratio</span><div class="f">\\(\\text{ratio}_j=\\frac{\\lambda_j}{\\sum_{i=1}^{d}\\lambda_i}\\)</div><small>The fraction of total variance captured by component \\(j\\).</small></div>
<div class="example-box"><span class="tag">How many components to keep?</span><p>Choose \\(k\\) so cumulative explained variance reaches a target (typically 90–95%). Example eigenvalues \\([3,1,0.5]\\):</p><div class="f">\\[\\text{PC1}=\\frac{3}{4.5}=66.7\\%,\\quad\\text{PC1+PC2}=\\frac{4}{4.5}=88.9\\%,\\quad\\text{all}=100\\%\\]</div><p>The <strong>scree plot</strong> (eigenvalues on a bar chart in descending order) shows an "elbow" where values flatten — that marks the natural cutoff.</p></div>
<div class="example-box"><span class="tag">PCA via SVD — how production code does it</span><p>Instead of forming \\(\\Sigma\\) and eigendecomposing it, <code>sklearn.decomposition.PCA</code> computes the SVD of \\(Z\\) directly (§3.5):</p><div class="f">\\(Z=U\\Sigma V^T\\implies \\text{components}=V,\\quad \\text{variances}=\\frac{\\sigma_j^2}{N-1}\\)</div><p>SVD is more stable than forming \\(Z^TZ\\) (avoids squaring small singular values into oblivion).</p></div>
<div class="note tip"><span class="tag">What PCA is good for</span><p><strong>Visualization</strong> (2D/3D scatter), <strong>denoising/compression</strong> (drop low-variance components), <strong>decorrelating features</strong> (components are uncorrelated), and as a <strong>preprocessing step</strong> before models that assume independent inputs. PCA is <em>linear</em> — for curved manifold structure, use t-SNE or UMAP instead.</p></div>
<div class="note warn"><span class="tag">Standardization is not optional</span><p>Run PCA on unstandardized data and the largest-variance feature (e.g., pixels 0–255 vs a ratio 0–1) silently dominates PC1 — even when it is the least predictive. Always standardize first.</p></div>
<div class="note tip"><span class="tag">Math Interview Q&A</span><p><strong>Q: When would you NOT use PCA?</strong><br/>When features have non-linear relationships (use kernel PCA or t-SNE), when interpretability matters (PCs are linear combinations of all features), or when the data has no redundant structure to exploit.</p><p><strong>Q: What is the difference between PCA and SVD?</strong><br/>PCA is the application (find directions of maximum variance). SVD is the algorithm (compute it efficiently). PCA eigendecomposes the covariance matrix \\(\\Sigma\\); SVD of the data matrix \\(Z\\) gives the same result more stably without forming \\(Z^TZ\\).</p><p><strong>Q: How do you interpret a principal component?</strong><br/>Each PC is a weighted linear combination of the original features. The weights (loadings) tell you which features contribute most. A PC with large weights on height and weight might represent "body size" — but this requires human interpretation, which is a limitation of PCA.</p></div>`,calc:'pcaCalc',diagrams:[]});
SECTIONS.push({id:'p9-6',part:'p9',num:'3.7',title:'Convolution (1D, 2D, 3D)',dek:'The mathematical operation behind CNNs, signal filtering, and image processing',tags:'convolution 1d 2d 3d cross-correlation kernel CNN signal processing',body:`<p>Convolution is a mathematical operation that combines two functions to produce a third. It answers: "how does one function modify the shape of another?" In ML it appears everywhere — CNNs apply learned kernels to images, signal processing filters noise, and the convolution theorem links it to Fourier transforms.</p>
<h3>Definition</h3>
<div class="formula-box"><span class="tag">Continuous convolution</span><div class="f">\\((f*g)(t)=\\int_{-\\infty}^{\\infty}f(\\tau)\\,g(t-\\tau)\\,d\\tau\\)</div><small>Flip \\(g\\), slide it across \\(f\\), integrate the product at each position. The output at time \\(t\\) is the weighted sum of \\(f\\) using the flipped \\(g\\) as a window.</small></div>
<div class="formula-box"><span class="tag">Discrete convolution (1D)</span><div class="f">\\((f*g)[n]=\\sum_{k}f[k]\\,g[n-k]\\)</div><small>Same idea, discrete signals. \\(g\\) is called the <strong>kernel</strong> or filter. In CNNs, \\(g\\) is learned from data.</small></div>
<h3>1D convolution — worked example</h3>
<div class="example-box"><span class="tag">Signal filtering</span><p>Signal \\(f=[1,3,2,4]\\), kernel \\(g=[1,0,1]\\) (a simple edge detector). Flip \\(g\\) → \\([1,0,1]\\) (symmetric, so same). Slide and compute:</p><div class="f">\\[(f*g)[0]=1\\cdot1=1\\qquad(f*g)[1]=3\\cdot1+1\\cdot1=4\\qquad(f*g)[2]=2\\cdot1+3\\cdot1=5\\qquad(f*g)[3]=4\\cdot1+2\\cdot1=6\\]</div><p class="res">Output: \\([1,4,5,6]\\). The kernel sums pairs of adjacent values — it smooths the signal.</p></div>
<h3>2D convolution — images</h3>
<div class="formula-box"><span class="tag">2D discrete convolution</span><div class="f">\\((f*g)[m,n]=\\sum_k\\sum_l f[k,l]\\,g[m-k,n-l]\\)</div><small>Slide a 2D kernel across a 2D signal (image). In CNNs, the kernel is typically 3×3 or 5×5 and learned via backpropagation.</small></div>
<div class="example-box"><span class="tag">Image edge detection</span><p>3×3 image \\(f\\) and a horizontal edge kernel \\(g\\):</p><div class="f">\\[f=\\begin{bmatrix}1&2&3\\\\ 4&5&6\\\\ 7&8&9\\end{bmatrix}\\quad g=\\begin{bmatrix}-1&-1&-1\\\\ 0&0&0\\\\ 1&1&1\\end{bmatrix}\\]</div><p>The kernel detects horizontal edges: large output where top and bottom rows differ. Output at center: \\((-1-2-3+7+8+9)=18\\).</p></div>
<h3>3D convolution — volumes</h3>
<div class="formula-box"><span class="tag">3D discrete convolution</span><div class="f">\\((f*g)[m,n,p]=\\sum_k\\sum_l\\sum_q f[k,l,q]\\,g[m-k,n-l,p-q]\\)</div><small>Extends to volumetric data: video (2D + time), medical volumes (CT/MRI slices), point clouds with features.</small></div>
<div class="note tip"><span class="tag">Convolution vs cross-correlation</span><p>Strictly, convolution flips the kernel; cross-correlation does not. CNNs actually implement <strong>cross-correlation</strong> (no flip), but everyone calls it "convolution" because the learned kernel does not care about the flip convention — the network learns the flipped version anyway.</p></div>
<div class="note warn"><span class="tag">Padding and stride</span><p><strong>Valid padding:</strong> output is smaller than input (no border pixels visited). <strong>Same padding:</strong> pad with zeros so output = input size. <strong>Stride s:</strong> move the kernel \\(s\\) steps at a time, reducing output size by factor \\(s\\). These choices control the spatial resolution of the output feature map.</p></div>
<div class="note tip"><span class="tag">Math Interview Q&A</span><p><strong>Q: What is the difference between convolution and multiplication?</strong><br/>Multiplication is pointwise: \\((f\\cdot g)[n]=f[n]\\cdot g[n]\\). Convolution is a sliding dot product: it mixes values across positions. Convolution in the time domain equals multiplication in the frequency domain (convolution theorem).</p><p><strong>Q: Why do CNNs use convolution instead of fully connected layers?</strong><br/>Convolution shares weights across spatial positions (parameter efficiency), preserves spatial structure (translation equivariance), and reduces the number of parameters from \\(O(n^2)\\) to \\(O(k)\\) where \\(k\\) is kernel size.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p9-7',part:'p9',num:'3.8',title:'Fourier Transform & Signal Processing',dek:'Moving between time/space and frequency domains',tags:'fourier transform DFT FFT frequency domain signal processing convolution theorem',body:`<p>The Fourier transform decomposes a signal into its constituent frequencies. It answers: "which frequencies are present, and how much of each?" This is foundational in signal processing, image compression (JPEG), and understanding convolution.</p>
<h3>The idea</h3>
<div class="example-box"><span class="tag">Time domain vs frequency domain</span><p>A sound wave is a signal in time — amplitude at each moment. The Fourier transform re-expresses it as a sum of sinusoids at different frequencies. The result is a <strong>spectrum</strong>: which frequencies are present and how strong each is. Both representations contain the same information — just different views.</p></div>
<h3>Discrete Fourier Transform (DFT)</h3>
<div class="formula-box"><span class="tag">DFT</span><div class="f">\\(X[k]=\\sum_{n=0}^{N-1}x[n]\\,e^{-i2\\pi kn/N}\\)</div><small>For a signal \\(x[0],\\ldots,x[N-1]\\), the DFT produces \\(N\\) complex coefficients \\(X[0],\\ldots,X[N-1]\\). \\(|X[k]|\\) is the magnitude of frequency \\(k\\); \\(\\arg(X[k])\\) is its phase.</small></div>
<div class="formula-box"><span class="tag">Inverse DFT</span><div class="f">\\(x[n]=\\frac{1}{N}\\sum_{k=0}^{N-1}X[k]\\,e^{i2\\pi kn/N}\\)</div><small>Recover the original signal from its spectrum. The transform is invertible — no information is lost.</small></div>
<div class="example-box"><span class="tag">Worked example — DFT of a simple signal</span><p>Signal \\(x=[1,0,1,0]\\) (N=4). At frequency k=0: \\(X[0]=1+0+1+0=2\\) (DC component). At k=1: \\(X[1]=1+0\\cdot e^{-i\\pi/2}+1\\cdot e^{-i\\pi}+0\\cdot e^{-i3\\pi/2}=1+0-1+0=0\\). At k=2: \\(X[2]=1+0+1\\cdot e^{-i2\\pi}+0=2\\). At k=3: \\(X[3]=0\\).</p><p class="res">Spectrum: \\(|X|=[2,0,2,0]\\). The signal has energy at DC (k=0) and the Nyquist frequency (k=2), zero elsewhere — it alternates every sample.</p></div>
<h3>Fast Fourier Transform (FFT) — how \\(O(N^2)\\) becomes \\(O(N\\log N)\\)</h3><p>Naive DFT evaluates \\(N\\) outputs × \\(N\\) terms each. The Cooley–Tukey FFT (1965; Gauss had it by 1805) notices the sum splits into <strong>even and odd indices</strong>, each a half-size DFT — then recurses. One \\(O(N^2)\\) problem becomes two \\(O((N/2)^2)\\) problems plus \\(O(N)\\) combining work, down to trivial \\(N=1\\) transforms.</p>
<div class="formula-box"><span class="tag">Radix-2 decimation-in-time step</span><div class="f">\\(X[k]=E[k]+W_N^k\\,O[k],\\qquad X[k{+}N/2]=E[k]-W_N^k\\,O[k],\\qquad W_N=e^{-i2\\pi/N}\\)</div><small>\\(E, O\\) = DFTs of the even/odd subsequences; \\(W_N^k\\) are the twiddle factors. Each level does \\(N\\) combine operations across \\(\\log_2 N\\) levels — hence \\(O(N\\log N)\\). Base case: the DFT of a single value is itself.</small></div>
<div class="tbl-wrap"><table class="dt">
<tr><th>Operation (size \\(N\\))</th><th>Naive</th><th>FFT-based</th><th>Notes</th></tr>
<tr><td>1D DFT / IDFT</td><td class="mono">O(N²)</td><td class="mono">O(N log N)</td><td>Radix-2 needs power-of-2 \\(N\\); Bluestein handles the rest</td></tr>
<tr><td>2D DFT (\\(N\\)×\\(N\\) image)</td><td class="mono">O(N⁴)</td><td class="mono">O(N² log N)</td><td>Row FFTs then column FFTs (separability)</td></tr>
<tr><td>Linear convolution (signal \\(N\\), kernel \\(M\\))</td><td class="mono">O(N·M)</td><td class="mono">O(N log N)</td><td>2 forward + 1 inverse FFT + pointwise multiply</td></tr>
<tr><td>Real-valued input (rFFT)</td><td class="mono">—</td><td class="mono">≈ half of complex FFT</td><td>Packs \\(N\\) reals into an \\(N/2\\) complex FFT; spectra are conjugate-symmetric</td></tr>
</table></div>
<div class="example-box"><span class="tag">Worked example — what the complexity gap buys</span><p>Audio frame \\(N=4096\\): naive ≈ 16.8M complex operations vs FFT ≈ \\(4096×12 ≈ 49k\\) — about <strong>340× fewer</strong>. At \\(N=2^{20}≈10^6\\): naive ≈ \\(10^{12}\\) (≈ hours on a CPU core) vs FFT ≈ \\(20×10^6\\) (≈ tens of milliseconds in FFTW/cuFFT).</p><p class="res">N=4096: ~340× speedup · N≈10⁶: hours → milliseconds — this gap is why spectral methods exist at all</p></div>
<h3>FFT convolution — cost model and crossover</h3><p>By the convolution theorem (§ above), convolving via FFT costs roughly <strong>three transforms plus one pointwise multiply</strong>. That overhead only pays off past a crossover size:</p>
<dl class="varkey"><dt>1D, kernel &gt; ~32–64 taps</dt><dd>FFT wins (long FIR filters, room acoustics, seismics)</dd><dt>2D, large kernels / large images</dt><dd>FFT wins (deblurring, satellite/SAR matched filtering §8.x)</dd><dt>Small kernels (3×3, 5×5 CNNs)</dt><dd>Direct (im2col/GEMM) or Winograd wins — transform overhead dominates</dd><dt>Zero-padding</dt><dd>Pad to \\(N+M-1\\) (then to a fast size) or circular wrap-around corrupts edges; padding cost is part of the budget</dd></dl>
<div class="note warn"><span class="tag">Three FFT footguns</span><p><strong>Normalization:</strong> libraries split the \\(1/N\\) differently (all on the inverse vs \\(1/\\sqrt{N}\\) symmetric) — round-trip your data before trusting magnitudes. <strong>Periodicity:</strong> the DFT treats the signal as circular; non-integer cycle counts leak energy across bins — window (Hann/Hamming) first for spectral analysis. <strong>Power-of-two bias:</strong> prime sizes fall back to slow paths — pad to \\(2^k\\) (or 7-smooth sizes for FFTW) in performance-critical loops.</p></div>
<div class="note tip"><span class="tag">Math Interview Q&A — FFT round</span><p><strong>Q: Why exactly is the FFT \\(O(N\\log N)\\)?</strong><br/>Recurrence \\(T(N)=2T(N/2)+O(N)\\): two half-size DFTs plus linear combining work per level, over \\(\\log_2 N\\) levels. Same recurrence as mergesort, same answer.</p><p><strong>Q: When is FFT convolution <em>slower</em> than direct?</strong><br/>Small kernels (3×3 CNNs), tiny inputs where \\(N\\log N\\) setup exceeds \\(N·M\\), or strided/dilated access patterns that break contiguous transforms. Profile at your sizes — the table gives asymptotics, the crossover is empirical.</p></div>
<h3>Key properties</h3>
<div class="formula-box"><span class="tag">Parseval's theorem (energy conservation)</span><div class="f">\\(\\sum_n|x[n]|^2=\\frac{1}{N}\\sum_k|X[k]|^2\\)</div><small>Total energy in time domain = total energy in frequency domain. The transform preserves energy.</small></div>
<div class="formula-box"><span class="tag">Convolution theorem</span><div class="f">\\(\\mathcal{F}(f*g)=\\mathcal{F}(f)\\cdot\\mathcal{F}(g)\\)</div><small>Convolution in time/space = pointwise multiplication in frequency. This is why FFT-based convolution is \\(O(N\\log N)\\) instead of \\(O(N^2)\\) — compute FFTs of both, multiply, inverse FFT.</small></div>
