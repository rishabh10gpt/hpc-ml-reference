SECTIONS.push(

{id:'s-9-1', part:'p9', num:'9.1', title:'Storage &amp; I/O Fundamentals',
 dek:'IOPS vs. bandwidth, sequential vs. random, and why the bottleneck is so rarely where you first look.',
 tags:'storage io iops bandwidth latency queue depth raid sequential random',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Metric</th><th>Formula / concept</th></tr>
   <tr><td>IOPS</td><td class="mono">I/O operations / second</td></tr>
   <tr><td>I/O bandwidth</td><td class="mono">Bytes transferred / second</td></tr>
   <tr><td>I/O latency</td><td class="mono">Time per I/O operation</td></tr>
   <tr><td>Queue depth</td><td>Outstanding I/O requests in flight at once</td></tr>
   <tr><td>Sequential throughput</td><td>Large contiguous transfers; often bandwidth-limited</td></tr>
   <tr><td>Random I/O</td><td>Small non-contiguous accesses; often latency/IOPS-limited</td></tr>
   <tr><td>RAID usable capacity</td><td>Depends on RAID level and disk count</td></tr>
   <tr><td>Storage throughput</td><td>Can be limited by disks, SSDs, filesystem, network, PCIe, or metadata servers</td></tr>
 </table></div>

 <h3>RAID — Redundant Array of Independent Disks</h3>
 <p>RAID combines multiple physical disks into one logical unit for <strong>performance</strong>, <strong>redundancy</strong>, or both. HPC storage servers use RAID to protect against disk failure and to boost aggregate throughput. The key question for each RAID level is: how many disks' worth of capacity and performance do you get, and what happens when a disk dies?</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>RAID Level</th><th>Min. Disks</th><th>Usable Capacity</th><th>Redundancy</th><th>Write Performance</th><th>Read Performance</th><th>Best For</th></tr>
   <tr><td class="mono">RAID 0</td><td>2</td><td>N × disk_size</td><td>None (stripe only)</td><td>N× single disk</td><td>N× single disk</td><td>Temp scratch, non-critical data</td></tr>
   <tr><td class="mono">RAID 1</td><td>2</td><td>N/2 × disk_size</td><td>Full mirror</td><td>1× single disk</td><td>N× single disk</td><td>Boot drives, small critical data</td></tr>
   <tr><td class="mono">RAID 5</td><td>3</td><td>(N-1) × disk_size</td><td>1 parity disk (distributed)</td><td>~N/2× (parity overhead)</td><td>(N-1)× single disk</td><td>General-purpose, read-heavy workloads</td></tr>
   <tr><td class="mono">RAID 6</td><td>4</td><td>(N-2) × disk_size</td><td>2 parity disks (distributed)</td><td>~N/3× (dual parity)</td><td>(N-2)× single disk</td><td>Large arrays, high-reliability</td></tr>
   <tr><td class="mono">RAID 10</td><td>4</td><td>N/2 × disk_size</td><td>Mirror + stripe</td><td>N/2× single disk</td><td>N× single disk</td><td>Write-heavy, databases</td></tr>
   <tr><td class="mono">RAID 50</td><td>6</td><td>(N - num_RAID5_groups) × disk_size</td><td>1 parity per RAID5 group</td><td>Better than RAID5</td><td>Better than RAID5</td><td>Large HPC storage (DDN, NetApp)</td></tr>
   <tr><td class="mono">RAID 60</td><td>8</td><td>(N - 2×num_RAID6_groups) × disk_size</td><td>2 parity per RAID6 group</td><td>Most resilient</td><td>Good parallel read</td><td>Mission-critical, archival</td></tr>
 </table></div>

 <div class="formula-box">
   <span class="tag">RAID capacity formulas</span>
   <div class="flist">
     <div class="f">RAID 0:  Usable = N × disk_size</div>
     <div class="f">RAID 1:  Usable = N/2 × disk_size  (mirrors in pairs)</div>
     <div class="f">RAID 5:  Usable = (N-1) × disk_size</div>
     <div class="f">RAID 6:  Usable = (N-2) × disk_size</div>
     <div class="f">RAID 10: Usable = N/2 × disk_size  (mirrors, then stripe)</div>
     <div class="f">RAID 50: Usable = (N - G) × disk_size  where G = number of RAID5 groups</div>
     <div class="f">RAID 60: Usable = (N - 2G) × disk_size  where G = number of RAID6 groups</div>
   </div>
 </div>

 <h4>RAID rebuilding — when a disk fails</h4>
 <p>When a disk fails in RAID 5/6, the array enters <strong>degraded mode</strong> and begins <strong>rebuilding</strong> — reading all remaining disks to reconstruct the missing data onto a hot spare (or new disk). During rebuild:</p>
 <ul>
   <li><strong>Read performance drops</strong> — every read must involve parity computation or reconstruction</li>
   <li><strong>Write performance drops</strong> — parity must be recalculated</li>
   <li><strong>Second disk failure during RAID 5 rebuild = total data loss</strong> — this is why RAID 6 (dual parity) is standard for large HPC arrays</li>
   <li>Rebuild time scales with array size: a 20TB drive in a large RAID 6 array can take 12–48+ hours to rebuild</li>
 </ul>

 <div class="note warn"><span class="tag">RAID 5 is risky for large modern drives</span><p>With multi-terabyte drives, RAID 5 rebuild times have become dangerously long. A single uncorrectable bit error during a multi-day rebuild causes total array failure. For arrays larger than ~8 drives or drives larger than 2TB, use RAID 6 or RAID 60. Most HPC storage vendors (DDN, NetApp, VAST Data) default to RAID 6 or erasure coding for this reason.</p></div>

 <h3>Other Storage Terminologies</h3>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Term</th><th>Definition</th></tr>
   <tr><td class="mono">JBOD</td><td>"Just a Bunch of Disks" — no RAID, disks presented individually (software RAID or filesystem handles redundancy)</td></tr>
   <tr><td class="mono">Hot spare</td><td>A standby disk that automatically replaces a failed disk in a RAID array — reduces rebuild window</td></tr>
   <tr><td class="mono">Hot swap</td><td>Replacing a failed disk without powering down the storage server</td></tr>
   <tr><td class="mono">Disk scrub</td><td>Background read of all disks to detect and correct bit-rot (silent data corruption) before it causes rebuild failure</td></tr>
   <tr><td class="mono">Write-back cache</td><td> Writes acknowledged to cache before hitting disk — faster, but risky without battery/flash backup</td></tr>
   <tr><td class="mono">Write-through cache</td><td>Writes acknowledged only after reaching persistent storage — slower but safer</td></tr>
   <tr><td class="mono">NVMe</td><td>Non-Volatile Memory Express — flash protocol over PCIe; ~6× lower latency than SATA SSDs</td></tr>
   <tr><td class="mono">NVMe-oF</td><td>NVMe over Fabrics — NVMe远程访问 over InfiniBand/RoCE; enables shared NVMe pools across a cluster</td></tr>
   <tr><td class="mono">SAS</td><td>Serial Attached SCSI — enterprise disk interface; dual-path for redundancy</td></tr>
   <tr><td class="mono">SATA</td><td>Serial ATA — consumer/low-end disk interface; no dual-path</td></tr>
   <tr><td class="mono">SSD</td><td>Solid State Drive — no moving parts; 10–100× lower latency than HDD</td></tr>
   <tr><td class="mono">HDD</td><td>Hard Disk Drive — spinning platters; higher capacity/GB, higher latency</td></tr>
   <tr><td class="mono">Storage class memory</td><td>Persistent memory (Intel Optane, etc.) — byte-addressable, faster than NAND flash</td></tr>
   <tr><td class="mono">Erasure coding</td><td>Software-defined RAID-like redundancy (Reed-Solomon); more flexible than hardware RAID; used in parallel filesystems (Lustre, Ceph, DAOS)</td></tr>
   <tr><td class="mono">I/O scheduler</td><td>OS component that orders disk requests (noop/mq-deadline/bfq/kyber); NVMe usually uses none (noop)</td></tr>
   <tr><td class="mono">Queue depth (per device)</td><td>Number of outstanding I/O commands a device can handle simultaneously; NVMe supports 64K queues × 64K depth</td></tr>
 </table></div>

 <h3>Storage Performance Hierarchy</h3>
 <p>Storage devices span several orders of magnitude in performance — choosing the right tier for the right workload is critical:</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Device Type</th><th>Latency</th><th>Bandwidth (seq. read)</th><th>IOPS (random 4K)</th><th>Typical HPC Use</th></tr>
   <tr><td class="mono">NVMe SSD (PCIe 4.0)</td><td>~10–20 µs</td><td>~5–7 GB/s</td><td>~800K–1M</td><td>Burst buffer, scratch, metadata</td></tr>
   <tr><td class="mono">NVMe SSD (PCIe 5.0)</td><td>~8–15 µs</td><td>~10–14 GB/s</td><td>~1.5M+</td><td>High-perf scratch, DAOS targets</td></tr>
   <tr><td class="mono">SAS SSD</td><td>~50–100 µs</td><td>~2 GB/s</td><td>~100K–200K</td><td>Metadata servers, read-heavy tiers</td></tr>
   <tr><td class="mono">SATA SSD</td><td>~50–100 µs</td><td>~0.5 GB/s</td><td>~80K–100K</td><td>Boot, light I/O, caching</td></tr>
   <tr><td class="mono">HDD (10K SAS)</td><td>~3–5 ms</td><td>~0.2–0.3 GB/s</td><td>~150–200</td><td>Archive, warm storage</td></tr>
   <tr><td class="mono">HDD (7.2K SATA)</td><td>~5–10 ms</td><td>~0.15–0.25 GB/s</td><td>~80–120</td><td>Cold archive, bulk storage</td></tr>
 </table></div>

 <div class="note tip"><span class="tag">Why NVMe changed everything</span><p>NVMe SSDs don't just add bandwidth — they reduce latency by ~6× compared to SATA/SAS SSDs and support massive parallelism (64K command queues × 64K depth vs. SATA's single queue × 32 depth). This parallelism matches HPC's concurrent I/O pattern perfectly, making NVMe the default for any performance-sensitive storage tier.</p></div>

 <h3>Formulas — Relating IOPS, Bandwidth, and Block Size</h3>
 <div class="formula-box">
   <span class="tag">Storage throughput relationships</span>
   <div class="flist">
     <div class="f">Bandwidth = IOPS × block_size</div>
     <div class="f">IOPS = Bandwidth / block_size</div>
     <div class="f">Effective IOPS (RAID 5) ≈ N × IOPS_disk / (4 × write_ratio + 1)</div>
     <div class="f small">Write ratio = fraction of I/O that is writes; RAID 5 write penalty = 4× (read-modify-write)</div>
   </div>
 </div>

 <div class="example-box">
   <span class="tag">Worked example — RAID 5 write penalty</span>
   <p>A RAID 5 array with 8 × 200 IOPS SAS disks. For a pure random-write workload (100% writes):</p>
   <p>Raw IOPS = 8 × 200 = 1,600 IOPS. RAID 5 write penalty = 4× (each write requires: read old data, read old parity, write new data, write new parity).</p>
   <div class="res">Effective write IOPS = 1,600 / 4 = 400 IOPS</div>
   <p>For a 70% read / 30% write mix: Effective IOPS = (1,600 × 0.7) + (1,600 × 0.3 / 4) = 1,120 + 120 = <strong>1,240 IOPS</strong>. This is why RAID 10 is preferred for write-heavy workloads — no write penalty.</p>
 </div>

 <p>The single most important distinction in storage performance is <strong>sequential vs. random access</strong>. A storage system's headline "GB/s" spec almost always describes large sequential transfers — the best case. Small, scattered ("random") I/O — common in metadata-heavy workloads, checkpoint/restart with many small files, or databases — is governed far more by <strong>latency and IOPS</strong> than by raw bandwidth, and can be an order of magnitude or more slower than the sequential number would suggest.</p>
 <p><strong>Queue depth</strong> matters because modern storage (especially NVMe SSDs and parallel filesystems) achieves its best throughput by having many I/O operations in flight simultaneously, hiding the latency of any single operation behind the others. A workload issuing I/O one operation at a time, waiting for each to complete before issuing the next (queue depth 1), will see a small fraction of the device's rated throughput — even on extremely fast hardware.</p>
 <div class="note warn"><span class="tag">Where the real bottleneck usually hides</span><p>In a parallel HPC filesystem, the bottleneck is very often <em>not</em> the raw disk/SSD bandwidth — it's the network path to the storage servers, the filesystem's metadata server (especially for workloads touching huge numbers of small files), or contention from many compute nodes hitting the same storage target simultaneously. This is exactly why §10.6's storage benchmarks separate throughput testing (IOR) from metadata testing (mdtest) — they diagnose genuinely different bottlenecks, and a system can be excellent at one while struggling at the other.</p></div>
 <div class="example-box">
   <span class="tag">Worked example</span>
   <p>A job checkpoints its state by writing one file per MPI rank across 1,000 ranks, each file small (a few MB). Even if the underlying storage can sustain 20 GB/s of sequential bandwidth, the checkpoint can take far longer than "(total data)/20 GB/s" would suggest — because 1,000 simultaneous small-file creates hammer the metadata server, not the bulk data path. The fix is usually architectural (fewer, larger shared files with parallel I/O libraries like HDF5/MPI-IO) rather than "faster storage."</p>
 </div>
  `},

{id:'s-9-2', part:'p9', num:'9.2', title:'HPC Parallel Filesystems',
 dek:'Lustre, GPFS/Spectrum Scale, BeeGFS, and the architectural trade-offs that determine which one fits your workload.',
 tags:'nfs cifs smb afs glusterfs lustre gpfs spectrum scale beegfs parallel filesystem stripeObject storage target Metadata Server stripe size stripe count',
 body:`
 <p>HPC environments use a <strong>layered storage architecture</strong>: traditional network filesystems for home directories and shared software, parallel filesystems for high-performance data, and sometimes object storage for archival. Understanding which tier serves which purpose is critical — using NFS for bulk data I/O is like using a fire hose to fill a swimming pool through a drinking straw.</p>

 <h3>Traditional Network Filesystems</h3>
 <p>These filesystems are <strong>not parallel</strong> — all I/O flows through a single server (or small cluster). They're ubiquitous in HPC for home directories, shared software, and configuration, but are unsuitable for bulk data I/O from compute jobs.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Filesystem</th><th>Protocol</th><th>Architecture</th><th>Max. Throughput</th><th>Typical HPC Use</th></tr>
   <tr><td class="mono">NFS (v3)</td><td>RPC, UDP/TCP</td><td>Single server, stateless</td><td>~1–3 GB/s (single server)</td><td>Home dirs, shared software, /etc</td></tr>
   <tr><td class="mono">NFS (v4/pNFS)</td><td>RPC, TCP +pnfs</td><td>Metadata + data servers (parallel)</td><td>~5–15 GB/s (with pNFS)</td><td>Home dirs, some parallel data</td></tr>
   <tr><td class="mono">CIFS/SMB</td><td>SMB over TCP</td><td>Single server, stateful</td><td>~1–2 GB/s</td><td>Windows integration, mixed OS</td></tr>
   <tr><td class="mono">AFS</td><td>Custom RPC</td><td>Cell-based, caches locally</td><td>~0.5–2 GB/s</td><td>Multi-site, large orgs (legacy)</td></tr>
   <tr><td class="mono">GlusterFS</td><td>FUSE + RPC</td><td>Decentralized, elastic</td><td>~2–10 GB/s</td><td>Cloud, object-like workloads</td></tr>
 </table></div>

 <h4>NFS — Network File System</h4>
 <p>NFS is the <strong>most common network filesystem in HPC</strong>, almost universally used for <code>/home</code> directories and shared software trees (<code>/opt</code>, <code>/apps</code>). Its critical limitation is that all I/O from all clients flows through a <strong>single NFS server</strong> — making it a bottleneck for bulk data access.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>NFS Version</th><th>Key Features</th><th>Parallel?</th><th>HPC Use</th></tr>
   <tr><td class="mono">NFSv3</td><td>Stateless, simple, mature</td><td>No — single server</td><td>Home dirs, software (most common)</td></tr>
   <tr><td class="mono">NFSv4</td><td>Stateful, Kerberos auth, ACLs, compound ops</td><td>No — single server</td><td>Home dirs with security requirements</td></tr>
   <tr><td class="mono">pNFS (NFSv4.1)</td><td>Parallel data path via layout referrals</td><td>Yes — metadata + data separation</td><td>Parallel data (Lustre-backed pNFS, GPFS pNFS)</td></tr>
   <tr><td class="mono">NFSv4.2</td><td>Server-side copy, sparse files, labels</td><td>No</td><td>Specialized (tape, archival)</td></tr>
 </table></div>

 <div class="formula-box">
   <span class="tag">NFS performance limits</span>
   <div class="flist">
     <div class="f">Single NFS server: ~1–3 GB/s (NFSv3), ~2–5 GB/s (NFSv4)</div>
     <div class="f">pNFS (parallel NFS): ~5–15 GB/s (across multiple data servers)</div>
     <div class="f">NFS over InfiniBand (RDMA): ~10–20 GB/s (bypasses TCP overhead)</div>
     <div class="f small">NFS bandwidth is per-mount; 1000 nodes mounting the same server = shared bandwidth</div>
   </div>
 </div>

 <div class="note warn"><span class="tag">NFS is not for bulk data</span><p>If your compute job reads/writes terabytes of data through <code>/home</code> or an NFS mount, you're bottlenecked by a single server — and you're also starving other users who share that server. Bulk data belongs on a parallel filesystem (Lustre, GPFS, BeeGFS). NFS is for configuration, source code, and small shared files — not simulation I/O.</p></div>

 <div class="example-box">
   <span class="tag">Worked example — NFS bottleneck</span>
   <p>A cluster has 500 nodes, each mounting <code>/home</code> from a single NFS server rated at 2 GB/s. If 100 nodes simultaneously read software libraries (100 MB each = 10 GB total), the NFS server's 2 GB/s bandwidth means the operation takes ~5 seconds — acceptable. If those same 100 nodes write 1 GB checkpoint files simultaneously (100 GB total), the NFS server takes ~50 seconds — and every other user's <code>/home</code> access is also slow.</p>
   <div class="res">Solution: move checkpoint I/O to Lustre/GPFS; keep NFS for home directories only</div>
 </div>

 <h4>CIFS/SMB — Common Internet File System</h4>
 <p>CIFS (the predecessor) and SMB (the current protocol, versions 2.0/3.0) are Windows-origin network filesystem protocols. In HPC, they're used for <strong>Windows integration</strong> — providing file access to Windows workstations or mixed-OS environments. Like NFS, all I/O flows through a single server.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Feature</th><th>CIFS/SMB</th></tr>
   <tr><td>Protocol</td><td>TCP-based, stateful</td></tr>
   <tr><td>Performance</td><td>~1–2 GB/s per server (slower than NFS for large sequential I/O)</td></tr>
   <tr><td>Features</td><td>Locking, authentication (Kerberos), ACLs, opportunistic locks</td></tr>
   <tr><td>HPC use</td><td>Windows integration, mixed-OS environments; rarely used for compute I/O</td></tr>
 </table></div>

 <h4>AFS — Andrew File System</h4>
 <p>AFS is a distributed filesystem designed for <strong>large organizations with multiple sites</strong>. It caches files locally on each client, reducing server load. AFS was popular in universities but has been largely superseded by NFS and parallel filesystems in HPC.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Feature</th><th>AFS</th></tr>
   <tr><td>Architecture</td><td>Cell-based; files cached locally, propagated on write</td></tr>
   <tr><td>Performance</td><td>~0.5–2 GB/s (limited by cache consistency protocol)</td></tr>
   <tr><td>HPC use</td><td>Legacy multi-site deployments; rarely used for new HPC systems</td></tr>
 </table></div>

 <h4>GlusterFS — Distributed/Replicated</h4>
 <p>GlusterFS is a decentralized, POSIX-compliant filesystem that aggregates storage across commodity servers without metadata servers. It's more common in cloud and object-storage-like workloads than in traditional HPC, but appears in HPC environments for shared storage and container backends.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Feature</th><th>GlusterFS</th></tr>
   <tr><td>Architecture</td><td>No metadata server; files distributed via hashing or custom translators</td></tr>
   <tr><td>Replication</td><td>Volume-level replication or erasure coding</td></tr>
   <tr><td>Performance</td><td>~2–10 GB/s (depends on brick count and network)</td></tr>
   <tr><td>HPC use</td><td>Container storage, shared config, not suitable for parallel compute I/O</td></tr>
 </table></div>

 <h3>Parallel Filesystems for High-Performance Data</h3>
 <p>When compute jobs need to read/write terabytes at high bandwidth, parallel filesystems distribute data across many storage targets, giving every client access to the aggregate bandwidth of the entire storage pool. The three dominant parallel filesystems in HPC are <strong>Lustre</strong>, <strong>IBM Spectrum Scale (GPFS)</strong>, and <strong>BeeGFS (ThinkParQ)</strong>.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Filesystem</th><th>Developer</th><th>Metadata model</th><th>Data distribution</th><th>Typical use</th></tr>
   <tr><td class="mono">Lustre</td><td>Open-source (Whamcloud/Intel)</td><td>Metadata Servers (MDS) with Metadata Targets (MDT)</td><td>Object Storage Targets (OST) with configurable striping</td><td>Most TOP500 systems, large-scale scientific HPC</td></tr>
   <tr><td class="mono">IBM Spectrum Scale (GPFS)</td><td>IBM</td><td> Distributed metadata across NSD servers</td><td>Block-level striping across storage pools</td><td>Enterprise HPC, mixed workloads, AI training</td></tr>
   <tr><td class="mono">BeeGFS</td><td>ThinkParQ (open-source)</td><td>Metadata servers with automatic balancing</td><td>Object-based with automatic file distribution</td><td>Research clusters, HPC, AI/ML workloads</td></tr>
   <tr><td class="mono">OrangeFS</td><td>Clemson/open-source</td><td>Parallel metadata with PVFS2 roots</td><td>Object-based striping</td><td>Research systems, specialized HPC</td></tr>
   <tr><td class="mono">DAOS</td><td>Intel/open-source</td><td>Object-based (no POSIX layer, libfabric)</td><td>Object storage with erasure coding</td><td>Next-gen HPC, DAOS-focused workloads</td></tr>
 </table></div>

 <h3>Lustre — The De Facto HPC Filesystem</h3>
 <p>Lustre is the most widely deployed parallel filesystem in HPC, running on the majority of TOP500 systems. Its architecture separates <strong>metadata</strong> (file names, directories, permissions, striping info) from <strong>data</strong> (actual file contents), allowing each to scale independently.</p>

 <div class="formula-box">
   <span class="tag">Lustre architecture components</span>
   <div class="flist">
     <div class="f">MDS (Metadata Server) — manages namespace, stores metadata on MDT</div>
     <div class="f">MDT (Metadata Target) — stores file metadata (inode, striping layout)</div>
     <div class="f">OST (Object Storage Target) — stores file data objects</div>
     <div class="f">OSS (Object Storage Server) — serves one or more OSTs</div>
     <div class="f">Client — kernel module or user-space client mount</div>
   </div>
 </div>

 <h4>Striping — how files are distributed across OSTs</h4>
 <p>Lustre distributes each file across one or more OSTs in <strong>stripes</strong>. The stripe size (chunk per OST) and stripe count (number of OSTs per file) determine how parallel I/O to a single file can be.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Parameter</th><th>Default</th><th>Effect of increasing</th></tr>
   <tr><td class="mono">stripe_size</td><td>1 MB</td><td>Larger files get bigger chunks per OST — good for sequential large I/O; bad for small files (wastes space)</td></tr>
   <tr><td class="mono">stripe_count</td><td>1 (single OST)</td><td>More OSTs per file = higher aggregate bandwidth; but more metadata overhead and more network connections</td></tr>
   <tr><td class="mono">stripe_offset</td><td>-1 (auto)</td><td>Starting OST — usually left to the MDS for load balancing</td></tr>
 </table></div>

 <div class="note tip"><span class="tag">Tuning striping for your workload</span><p>For large sequential I/O (checkpoint files, simulation output), use a wide stripe count (e.g., stripe_count = 4–16) and larger stripe_size (2–4 MB). For workloads with many small files, use stripe_count = 1 to avoid spreading tiny files across multiple OSTs. The <code>lfs setstripe</code> command sets striping per file or directory.</p></div>

 <div class="example-box">
   <span class="tag">Worked example — Lustre aggregate bandwidth</span>
   <p>A Lustre filesystem has 10 OSTs, each capable of 2 GB/s sustained. A single file striped across all 10 OSTs can theoretically achieve 20 GB/s read/write bandwidth (limited by stripe alignment and network). A job writing 1,000 small files (1 MB each) to a single OST will see only that OST's bandwidth — no matter how many OSTs exist. The metadata server handles the file creates; 1,000 simultaneous creates on a single MDT will be metadata-bound.</p>
   <div class="res">Aggregate BW = num_OSTs × BW_per_OST (for well-striped large files)</div>
 </div>

 <h3>IBM Spectrum Scale (GPFS)</h3>
 <p>GPFS (now Spectrum Scale) takes a different approach: it distributes data at the <strong>block level</strong> across all storage devices, similar to RAID across the network. Unlike Lustre's object-based model, GPFS stripes file blocks across all available NSD (Network Shared Disk) servers, giving every file access to the aggregate bandwidth of the entire storage pool automatically.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Feature</th><th>Spectrum Scale / GPFS</th></tr>
   <tr><td>Data placement</td><td>Automatic block-level striping across all storage — no manual stripe configuration</td></tr>
   <tr><td>Metadata</td><td>Distributed across NSD servers; can scale metadata independently</td></tr>
   <tr><td>Storage pools</td><td>Tiered storage (SSD + HDD pools) with policy-driven data placement</td></tr>
   <tr><td>Erasure coding</td><td>Built-in file-level RAID (Replicated or Erasure Coded)</td></tr>
   <tr><td>POSIX compliance</td><td>Full POSIX; also supports NFS, SMB, HDFS, S3 interfaces</td></tr>
   <tr><td>Snapshot / clone</td><td>Native point-in-time snapshots, space-efficient clones</td></tr>
 </table></div>

 <p>GPFS's strength is its <strong>automatic data distribution</strong> — no stripe tuning required — and its tight integration with IBM storage hardware (ESS, Storage Scale appliances). It's common in mixed HPC/AI environments where both large-file and small-file workloads coexist.</p>

 <h3>BeeGFS — The Lightweight Contender</h3>
 <p>BeeGFS (formerly FhGFS) is a parallel filesystem designed for <strong>simplicity of deployment and automatic balancing</strong>. It requires no manual stripe configuration — files are automatically distributed across available storage targets.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Feature</th><th>BeeGFS</th></tr>
   <tr><td>Data distribution</td><td>Automatic round-robin or balanced across targets — no stripe tuning</td></tr>
   <tr><td>Metadata</td><td>Multiple metadata servers with automatic load balancing</td></tr>
   <tr><td>Setup</td><td>GUI-based management (BeeGFS Management GUI) or CLI</td></tr>
   <tr><td>Integration</td><td>HDFS adapter, POSIX, optional RDMA transport</td></tr>
   <tr><td>Use case</td><td>Research clusters, AI/ML training (NVMe-oF backends), rapid deployment</td></tr>
 </table></div>

 <p>BeeGFS is popular for clusters where Lustre's tuning complexity is undesirable and GPFS licensing costs are prohibitive. It's particularly common in academic and research environments.</p>

 <h3>Choosing a Filesystem — Decision Framework</h3>

 <h4>Traditional vs. Parallel — which tier for what</h4>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Workload</th><th>Right Filesystem</th><th>Why</th></tr>
   <tr><td>Home directories, shared software (<code>/home</code>, <code>/opt</code>)</td><td>NFS (v3/v4)</td><td>Small files, low bandwidth, multi-user access, simple</td></tr>
   <tr><td>Bulk simulation I/O (terabytes)</td><td>Lustre / GPFS / BeeGFS</td><td>Parallel data path, aggregate bandwidth scales with OSTs/NSDs</td></tr>
   <tr><td>Checkpoint/restart (large shared files)</td><td>Lustre (wide stripe) / GPFS</td><td>High sequential BW, single-file parallelism</td></tr>
   <tr><td>Many small files (per-rank output)</td><td>Lustre (stripe_count=1) or local scratch</td><td>Metadata-bound, not bandwidth-bound</td></tr>
   <tr><td>AI/ML training (mixed I/O)</td><td>GPFS / BeeGFS / NVMe-oF</td><td>Automatic balancing, high metadata throughput</td></tr>
   <tr><td>Archival / compliance</td><td>Tape (LTFS) + object storage</td><td>Cold data, not accessed by compute</td></tr>
   <tr><td>Windows integration</td><td>CIFS/SMB</td><td>Windows clients, mixed-OS environments</td></tr>
 </table></div>

 <h4>Parallel filesystem comparison</h4>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Criterion</th><th>Lustre</th><th>Spectrum Scale (GPFS)</th><th>BeeGFS</th></tr>
   <tr><td>Scale (nodes)</td><td>10,000+</td><td>10,000+</td><td>1,000+</td></tr>
   <tr><td>Tuning complexity</td><td>High (striping, MDT/OSS layout)</td><td>Moderate (policies, storage pools)</td><td>Low (automatic)</td></tr>
   <tr><td>Metadata performance</td><td>Good (with multiple MDTs)</td><td>Very good (distributed metadata)</td><td>Good (auto-balanced)</td></tr>
   <tr><td>Cost</td><td>Free (open-source)</td><td>Licensed (per-node)</td><td>Free (open-source) or licensed</td></tr>
   <tr><td>Mixed workload handling</td><td>Requires careful stripe tuning</td><td>Excellent (policy-based tiering)</td><td>Good (automatic)</td></tr>
   <tr><td>Vendor ecosystem</td><td>Intel/Whamcloud, DDN, HPE</td><td>IBM, DDN</td><td>ThinkParQ, various integrators</td></tr>
 </table></div>

 <h4>Traditional filesystem comparison</h4>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Criterion</th><th>NFS (v3/v4)</th><td>CIFS/SMB</td><th>AFS</th><th>GlusterFS</th></tr>
   <tr><td>Max. throughput</td><td>~1–3 GB/s (single server)</td><td>~1–2 GB/s</td><td>~0.5–2 GB/s</td><td>~2–10 GB/s</td></tr>
   <tr><td>Parallel capable?</td><td>No (pNFS yes)</td><td>No</td><td>No</td><td>No (volume replication)</td></tr>
   <tr><td>POSIX compliant</td><td>Yes</td><td>No (CIFS/SMB semantics)</td><td>Yes</td><td>Yes (FUSE)</td></tr>
   <tr><td>Best for</td><td>Home dirs, shared software</td><td>Windows integration</td><td>Multi-site (legacy)</td><td>Cloud, container storage</td></tr>
   <tr><td>HPC use</td><td>Essential (home/software tier)</td><td>Rare (Windows clients)</td><td>Legacy only</td><td>Container backends</td></tr>
 </table></div>

 <div class="note warn"><span class="tag">The metadata server is often the bottleneck</span><p>Every parallel filesystem shares a common weakness: the metadata server (MDS/MDS/MDT in Lustre, NSD servers in GPFS). When thousands of compute nodes create, stat, or delete millions of small files simultaneously, the metadata server saturates long before the data path does. This is why mdtest (§10.6) is the critical diagnostic — it isolates metadata performance from bulk throughput. The fix is usually application-side: use fewer, larger files (HDF5, MPI-IO aggregators) rather than per-rank or per-timestep files.</p></div>

 <h3>Emerging Filesystem: DAOS</h3>
 <p>DAOS (Distributed Asynchronous Object Storage) is a newer, Intel-developed filesystem that bypasses the POSIX layer entirely, using <strong>libfabric</strong> for direct user-space I/O. It's designed for next-generation HPC systems (Frontier, Aurora) where POSIX semantics are a performance bottleneck for specific workloads (AI training, checkpoint/restart). DAOS uses object-level access (not file-level), supports erasure coding natively, and provides near-zero-copy I/O via RDMA.</p>

 <div class="note tip"><span class="tag">When to consider DAOS</span><p>DAOS is appropriate when: (1) your workload is checkpoint/restart or AI training with large, structured data, (2) you need sub-millisecond metadata operations, (3) you can adapt applications to use DAOS APIs (libdfs or native DAOS objects) rather than POSIX <code>open/read/write</code>. For general-purpose HPC where POSIX compliance is mandatory, Lustre/GPFS/BeeGFS remain the standard choices.</p></div>

 <div class="formula-box">
   <span class="tag">Filesystem performance comparison — representative numbers</span>
   <div class="flist">
     <div class="f">NFS (single server): ~1–3 GB/s (NFSv3), ~2–5 GB/s (NFSv4)</div>
     <div class="f">pNFS (parallel NFS): ~5–15 GB/s (across multiple data servers)</div>
     <div class="f">Lustre (10 OSTs): ~20 GB/s aggregate sequential BW (well-striped)</div>
     <div class="f">GPFS/SS (10 NSDs): ~18–25 GB/s aggregate sequential BW</div>
     <div class="f">BeeGFS (10 targets): ~15–20 GB/s aggregate sequential BW</div>
     <div class="f">Metadata (all): ~10k–100k ops/s per MDS (varies enormously)</div>
     <div class="f small">Numbers are illustrative, not specifications — actual performance depends on hardware, network, and configuration.</div>
    </div>
  </div>
  `},

{id:'s-9-3', part:'p9', num:'9.3', title:'Interface &amp; Connector Generations — Complete Reference',
 dek:'From PATA/Parallel SCSI/Token Ring to SATA/SAS/PCIe/InfiniBand — every interface generation, legacy and modern, side-by-side.',
 tags:'pata ide ata scsi parallel pci pcix token ring fddi atm sata sas pcie pci express ethernet infiniband connector interface bandwidth generation sfp qsfp ddr qdr fdr edr hdr ndr',
 body:`
 <p>HPC systems connect storage, networking, and accelerators through a hierarchy of interfaces. Each generation doubles (or more) the previous bandwidth, but the <strong>connector, cable, and physical layer</strong> change with each generation — backward compatibility is not guaranteed. This section puts every generation of every major interface in one place, including the legacy parallel interfaces that each serial standard replaced.</p>

 <h3>ATA — Parallel ATA (PATA) to Serial ATA (SATA)</h3>
 <p>ATA evolved from a <strong>parallel bus (PATA)</strong> to a <strong>serial bus (SATA)</strong>. The parallel bus had wide ribbon cables, shared signaling, and reached its physical limits around 133 MB/s. SATA replaced it with point-to-point serial links, thinner cables, and native command queuing.</p>

 <h4>PATA — Parallel ATA (IDE/EIDE/UDMA)</h4>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Standard</th><th>Year</th><th>Bandwidth</th><th>Cable</th><th>Max. Devices</th><th>Status</th></tr>
   <tr><td class="mono">ATA (IDE)</td><td>1986</td><td class="mono">8.3 MB/s (PIO Mode 0)</td><td>40-pin ribbon (40-conductor)</td><td>2 (master/slave)</td><td>Obsolete</td></tr>
   <tr><td class="mono">ATA-2 (EIDE)</td><td>1996</td><td class="mono">16.7 MB/s (PIO Mode 4)</td><td>40-pin ribbon</td><td>4 (2 channels)</td><td>Obsolete</td></tr>
   <tr><td class="mono">ATA-3</td><td>1997</td><td class="mono">16.7 MB/s</td><td>40-pin ribbon</td><td>4</td><td>Obsolete</td></tr>
   <tr><td class="mono">ATA-4 (Ultra ATA/33)</td><td>1998</td><td class="mono">33 MB/s (DMA Mode 2)</td><td>40-pin, 80-conductor</td><td>4</td><td>Obsolete</td></tr>
   <tr><td class="mono">ATA-5 (Ultra ATA/66)</td><td>2000</td><td class="mono">66 MB/s</td><td>40-pin, 80-conductor</td><td>4</td><td>Obsolete</td></tr>
   <tr><td class="mono">ATA-6 (Ultra ATA/100)</td><td>2001</td><td class="mono">100 MB/s</td><td>40-pin, 80-conductor</td><td>4</td><td>Obsolete</td></tr>
   <tr><td class="mono">ATA-7 (Ultra ATA/133)</td><td>2002</td><td class="mono">133 MB/s</td><td>40-pin, 80-conductor</td><td>4</td><td>Obsolete</td></tr>
 </table></div>

 <div class="note warn"><span class="tag">Why PATA died</span><p>PATA's 80-conductor ribbon cable was wide (2 inches), blocked airflow, limited cable length to ~46 cm, and shared a parallel bus across devices (master/slave). SATA's thin 7-pin cable, point-to-point connection, and higher clock rates made it strictly superior — PATA was abandoned by 2007.</p></div>

 <h4>SATA — Serial ATA</h4>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Version</th><th>Year</th><th>Bandwidth</th><th>Connector</th><th>Max. Cable Length</th><th>Queue Depth</th><th>Status</th></tr>
   <tr><td class="mono">SATA I</td><td>2003</td><td class="mono">1.5 Gb/s (150 MB/s)</td><td>7-pin data + 15-pin power</td><td>1 m</td><td>32</td><td>Legacy</td></tr>
   <tr><td class="mono">SATA II</td><td>2004</td><td class="mono">3.0 Gb/s (300 MB/s)</td><td>Same as SATA I</td><td>1 m</td><td>32</td><td>Legacy</td></tr>
   <tr><td class="mono">SATA III</td><td>2009</td><td class="mono">6.0 Gb/s (600 MB/s)</td><td>Same as SATA I</td><td>1 m</td><td>32</td><td>Current</td></tr>
 </table></div>

 <div class="note warn"><span class="tag">SATA's real-world limit</span><p>SATA III's 6 Gb/s (600 MB/s) is shared across the entire bus. A SATA SSD typically achieves ~550 MB/s sequential — nearly saturating the interface. For higher performance, move to SAS or NVMe.</p></div>

 <h3>SCSI — Parallel SCSI to Serial Attached SCSI (SAS)</h3>
 <p>SCSI (Small Computer System Interface) evolved from a <strong>parallel bus</strong> to <strong>serial point-to-point links</strong>. Parallel SCSI was the dominant enterprise storage interface from the 1980s through the early 2000s, used for RAID arrays, tape drives, and high-performance disks.</p>

 <h4>Parallel SCSI</h4>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Standard</th><th>Year</th><th>Bandwidth</th><th>Cable</th><th>Max. Devices</th><th>Status</th></tr>
   <tr><td class="mono">SCSI-1</td><td>1982</td><td class="mono">5 MB/s</td><td>50-pin ribbon</td><td>8</td><td>Obsolete</td></tr>
   <tr><td class="mono">SCSI-2 (Fast SCSI)</td><td>1994</td><td class="mono">10 MB/s</td><td>50-pin</td><td>8</td><td>Obsolete</td></tr>
   <tr><td class="mono">SCSI-3 (Fast-20 / Ultra)</td><td>1996</td><td class="mono">20 MB/s</td><td>50-pin</td><td>8</td><td>Obsolete</td></tr>
   <tr><td class="mono">Ultra2 SCSI</td><td>1997</td><td class="mono">40 MB/s</td><td>68-pin (LVD)</td><td>16</td><td>Obsolete</td></tr>
   <tr><td class="mono">Ultra3 SCSI (Ultra160)</td><td>2001</td><td class="mono">160 MB/s</td><td>68-pin</td><td>16</td><td>Obsolete</td></tr>
   <tr><td class="mono">Ultra320 SCSI</td><td>2003</td><td class="mono">320 MB/s</td><td>68-pin</td><td>16</td><td>Obsolete</td></tr>
   <tr><td class="mono">Ultra640 SCSI</td><td>2005</td><td class="mono">640 MB/s</td><td>68-pin</td><td>16</td><td>Obsolete</td></tr>
 </table></div>

 <div class="note warn"><span class="tag">Why parallel SCSI died</span><p>Parallel SCSI used a shared bus with multiple devices (up to 16) on the same ribbon cable. Signal reflections, cable length limits (~12 m max), bus arbitration overhead, and the physical bulk of 68-pin cables made scaling painful. Ultra640's 640 MB/s was its practical ceiling — serial point-to-point (SAS) surpassed it with simpler cabling and better signal integrity.</p></div>

 <h4>SAS — Serial Attached SCSI</h4>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Version</th><th>Year</th><th>Bandwidth</th><th>Connector</th><th>Max. Cable Length</th><th>Queue Depth</th><th>Status</th></tr>
   <tr><td class="mono">SATA I</td><td>2003</td><td class="mono">1.5 Gb/s (150 MB/s)</td><td>7-pin data + 15-pin power</td><td>1 m</td><td>32</td><td>Legacy</td></tr>
   <tr><td class="mono">SATA II</td><td>2004</td><td class="mono">3.0 Gb/s (300 MB/s)</td><td>Same as SATA I</td><td>1 m</td><td>32</td><td>Legacy</td></tr>
   <tr><td class="mono">SATA III</td><td>2009</td><td class="mono">6.0 Gb/s (600 MB/s)</td><td>Same as SATA I</td><td>1 m</td><td>32</td><td>Current</td></tr>
 </table></div>

 <div class="note warn"><span class="tag">SATA's real-world limit</span><p>SATA III's 6 Gb/s (600 MB/s) is shared across the entire bus. A SATA SSD typically achieves ~550 MB/s sequential — nearly saturating the interface. For higher performance, move to SAS or NVMe.</p></div>

 <h3>SAS — Serial Attached SCSI</h3>
 <p>SAS is the <strong>enterprise storage interface</strong> — dual-port for redundancy, higher bandwidth, and designed for multi-device topologies (expanders). It's the backbone of HPC storage servers connecting to HDDs and SATA/SAS SSDs.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Version</th><th>Year</th><th>Bandwidth</th><th>Connector</th><th>Max. Devices</th><th>Features</th></tr>
   <tr><td class="mono">SAS-1</td><td>2004</td><td class="mono">3.0 Gb/s</td><td>SFF-8482 (device), SFF-8087 (mini-multilane)</td><td>128</td><td>Full-duplex, dual-port</td></tr>
   <tr><td class="mono">SAS-2</td><td>2007</td><td class="mono">6.0 Gb/s</td><td>Same connectors</td><td>128</td><td>Expander support</td></tr>
   <tr><td class="mono">SAS-3</td><td>2013</td><td class="mono">12.0 Gb/s</td><td>SFF-8644 (mini-multilane), SFF-8643 (HD)</td><td>128</td><td>32-wide links</td></tr>
   <tr><td class="mono">SAS-4</td><td>2017</td><td class="mono">22.5 Gb/s</td><td>SFF-8644, SFF-8643</td><td>128</td><td>24 Gbaud signaling</td></tr>
 </table></div>

 <div class="formula-box">
   <span class="tag">SAS topology</span>
   <div class="flist">
     <div class="f">SAS host → expander → up to 128 end devices (expanders fan out)</div>
     <div class="f">Dual-path: each device has two independent paths for failover</div>
     <div class="f">Wide link: 4× lanes per connector (e.g., SAS-3 ×4 = 48 Gb/s)</div>
   </div>
 </div>

 <h3>PCI — Parallel PCI to PCI Express (PCIe)</h3>
 <p>PCI (Peripheral Component Interconnect) evolved from a <strong>shared parallel bus</strong> to <strong>serial point-to-point lanes</strong>. The original parallel PCI was the standard expansion bus from 1992 until PCIe replaced it around 2004.</p>

 <h4>Parallel PCI</h4>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Standard</th><th>Year</th><th>Bandwidth</th><th>Bus Width</th><th>Connector</th><th>Status</th></tr>
   <tr><td class="mono">PCI (Local Bus)</td><td>1992</td><td class="mono">133 MB/s</td><td>32-bit @ 33 MHz</td><td>124-pin (5V or 3.3V)</td><td>Obsolete</td></tr>
   <tr><td class="mono">PCI 2.1</td><td>1995</td><td class="mono">264 MB/s</td><td>32-bit @ 66 MHz</td><td>Same connector</td><td>Obsolete</td></tr>
   <tr><td class="mono">PCI 2.2 (64-bit)</td><td>1999</td><td class="mono">528 MB/s</td><td>64-bit @ 66 MHz</td><td>Extended 184-pin</td><td>Obsolete</td></tr>
   <tr><td class="mono">PCI-X</td><td>1999</td><td class="mono">1066 MB/s</td><td>64-bit @ 133 MHz</td><td>Extended 184-pin</td><td>Obsolete</td></tr>
   <tr><td class="mono">PCI-X 2.0</td><td>2003</td><td class="mono">2133 MB/s</td><td>64-bit @ 266 MHz</td><td>Extended 184-pin</td><td>Obsolete</td></tr>
 </table></div>

 <div class="note warn"><span class="tag">Why parallel PCI died</span><p>Parallel PCI shared a bus among all devices — each card competed for bus time. Clock speeds couldn't scale beyond ~133 MHz due to signal skew across the parallel traces on the motherboard. PCI-X tried to extend it with higher clocks but hit the same physical wall. PCIe's serial point-to-point lanes eliminated bus contention and could scale to much higher frequencies.</p></div>

 <h4>PCIe — PCI Express (serial)</h4>
 <p>PCIe is the <strong>universal high-speed bus</strong> connecting CPUs to everything: NVMe SSDs, GPUs, NICs, accelerators. Each generation doubles the per-lane bandwidth. NVMe storage and modern GPUs live on PCIe.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Version</th><th>Year</th><th>Per Lane</th><th>x16 (GPU/NVMe)</th><th>Encoding</th><th>Typical Use</th></tr>
   <tr><td class="mono">PCIe 1.0</td><td>2003</td><td class="mono">250 MB/s</td><td class="mono">4 GB/s</td><td>8b/10b</td><td>Legacy devices</td></tr>
   <tr><td class="mono">PCIe 2.0</td><td>2007</td><td class="mono">500 MB/s</td><td class="mono">8 GB/s</td><td>8b/10b</td><td>Legacy GPUs, early SSDs</td></tr>
   <tr><td class="mono">PCIe 3.0</td><td>2010</td><td class="mono">~985 MB/s</td><td class="mono">~15.75 GB/s</td><td>128b/130b</td><td>GPUs (Pascal), NVMe SSDs</td></tr>
   <tr><td class="mono">PCIe 4.0</td><td>2017</td><td class="mono">~1.97 GB/s</td><td class="mono">~31.5 GB/s</td><td>128b/130b</td><td>GPUs (Ampere), NVMe SSDs</td></tr>
   <tr><td class="mono">PCIe 5.0</td><td>2019</td><td class="mono">~3.94 GB/s</td><td class="mono">~63 GB/s</td><td>128b/130b</td><td>GPUs (Hopper), NVMe SSDs</td></tr>
   <tr><td class="mono">PCIe 6.0</td><td>2022</td><td class="mono">~7.56 GB/s</td><td class="mono">~121 GB/s</td><td>PAM4 + FLIT</td><td>Next-gen GPUs, CXL 3.0</td></tr>
 </table></div>

 <div class="note tip"><span class="tag">PCIe lane allocation matters</span><p>A "PCIe 4.0 x4" NVMe SSD gets ~8 GB/s; the same SSD in a x2 slot gets ~4 GB/s. GPUs typically use x16 — check motherboard/CPU lane count. Threadripper (64 lanes) vs. Xeon (48 lanes) vs. consumer (16–20 lanes) determines how many high-bandwidth devices you can connect simultaneously.</p></div>

 <h4>NVMe over PCIe — why it matters</h4>
 <p>NVMe is not a physical interface — it's a <strong>protocol</strong> that runs over PCIe. The same PCIe 4.0 x4 slot that could hold a SATA SSD (via adapter) instead connects an NVMe SSD with ~6× the bandwidth and ~6× lower latency because NVMe bypasses the legacy AHCI/SATA command queuing.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Interface</th><th>Protocol</th><th>Physical</th><th>Per-lane BW</th><th>Latency</th><th>Queue Depth</th></tr>
   <tr><td class="mono">SATA III</td><td>AHCI</td><td>SATA</td><td class="mono">600 MB/s</td><td>~50–100 µs</td><td>32</td></tr>
   <tr><td class="mono">SAS-3</td><td>SAS SCSI</td><td>SAS</td><td class="mono">1.5 GB/s</td><td>~50–100 µs</td><td>256</td></tr>
   <tr><td class="mono">NVMe (PCIe 4.0 x4)</td><td>NVMe</td><td>PCIe</td><td class="mono">8 GB/s</td><td>~10–20 µs</td><td>64K queues × 64K</td></tr>
    <tr><td class="mono">NVMe (PCIe 5.0 x4)</td><td>NVMe</td><td>PCIe</td><td class="mono">16 GB/s</td><td>~8–15 µs</td><td>64K queues × 64K</td></tr>
  </table></div>

 <h3>Networking — Legacy to Modern</h3>
 <p>Before Ethernet dominated, several networking technologies competed for HPC and enterprise LANs. None survived because Ethernet scaled from 10 Mbps to 800 Gbps while they hit physical limits earlier.</p>

 <h4>Legacy networking standards</h4>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Standard</th><th>Year</th><th>Bandwidth</th><th>Topology</th><th>Why it died</th></tr>
   <tr><td class="mono">ARCnet</td><td>1977</td><td class="mono">2.5 Mb/s</td><td>Star / bus</td><td>Too slow; never recovered after Ethernet's 10 Mb/s</td></tr>
   <tr><td class="mono">Token Ring</td><td>1985</td><td class="mono">4/16 Mb/s</td><td>Ring (MAU)</td><td>Complex, expensive NICs; Ethernet was simpler and cheaper</td></tr>
   <tr><td class="mono">FDDI</td><td>1987</td><td class="mono">100 Mb/s</td><td>Dual ring</td><td>Expensive fiber; Ethernet caught up at 100 Mb/s (Fast Ethernet)</td></tr>
   <tr><td class="mono">FDDI (CDDI)</td><td>1992</td><td class="mono">100 Mb/s</td><td>Dual ring (copper)</td><td>Same — Ethernet was simpler and had lower TCO</td></tr>
   <tr><td class="mono">ATM (LAN)</td><td>1990s</td><td class="mono">25/155/622 Mb/s</td><td>Star (switched cells)</td><td>Complex QoS; Ethernet added flow control and won</td></tr>
   <tr><td class="mono">100BASE-T4</td><td>1995</td><td class="mono">100 Mb/s</td><td>Star (Cat3)</td><td>Replaced by 100BASE-TX (Cat5); too many pairs needed</td></tr>
 </table></div>

 <div class="note warn"><span class="tag">Why Ethernet won</span><p>Ethernet's triumph was simplicity and economics: no token passing, no ring management, no complex switching. It scaled incrementally from 10 Mbps to 800 Gbps while competitors stalled. The same RJ-45/copper/fiber ecosystem adapted across generations — Token Ring's proprietary MAU and FDDI's dual-ring management never had a path to that kind of scale.</p></div>

 <h4>Common Ethernet cables through the generations</h4>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Cable</th><th>Standard</th><th>Max Speed</th><th>Max Length</th><th>Notes</th></tr>
   <tr><td class="mono">Cat3</td><td>10BASE-T</td><td>10 Mb/s</td><td>100 m</td><td>Telephone-grade; obsolete for data</td></tr>
   <tr><td class="mono">Cat5</td><td>100BASE-TX</td><td>100 Mb/s</td><td>100 m</td><td>Fast Ethernet era</td></tr>
   <tr><td class="mono">Cat5e</td><td>1000BASE-T</td><td>1 Gb/s</td><td>100 m</td><td>Enhanced; still in many offices</td></tr>
   <tr><td class="mono">Cat6</td><td>10GBASE-T (short)</td><td>10 Gb/s</td><td>55 m</td><td>10G Ethernet over copper</td></tr>
   <tr><td class="mono">Cat6a</td><td>10GBASE-T</td><td>10 Gb/s</td><td>100 m</td><td>Augmented; full 10G distance</td></tr>
   <tr><td class="mono">Cat7</td><td>10GBASE-T+</td><td>10 Gb/s</td><td>100 m</td><td>Shielded; better noise rejection</td></tr>
   <tr><td class="mono">Cat8</td><td>25/40GBASE-T</td><td>25–40 Gb/s</td><td>30 m</td><td>Short runs, data centers</td></tr>
 </table></div>

 <h3>Ethernet — IEEE 802.3</h3>
 <p>Ethernet is the <strong>dominant HPC cluster interconnect</strong> for most installations — cheaper than InfiniBand, universally supported, and increasingly competitive with RoCE (RDMA over Converged Ethernet).</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Standard</th><th>Year</th><th>Bandwidth</th><th>Connector / Transceiver</th><th>Cable Type</th><th>Latency (typ.)</th><th>Status</th></tr>
   <tr><td class="mono">1 GbE</td><td>1999</td><td class="mono">1 Gb/s</td><td>RJ-45</td><td>Cat5e/6 copper</td><td>~5–10 µs</td><td>Legacy (management)</td></tr>
   <tr><td class="mono">10 GbE</td><td>2002</td><td class="mono">10 Gb/s</td><td>SFP+, RJ-45</td><td>Cat6a, DAC, fiber</td><td>~3–5 µs</td><td>Common (storage, HCI)</td></tr>
   <tr><td class="mono">25 GbE</td><td>2016</td><td class="mono">25 Gb/s</td><td>SFP28</td><td>DAC, fiber</td><td>~2–4 µs</td><td>Current (server NIC)</td></tr>
   <tr><td class="mono">40 GbE</td><td>2010</td><td class="mono">40 Gb/s</td><td>QSFP+</td><td>MPO fiber, DAC</td><td>~3–5 µs</td><td>Current (uplinks)</td></tr>
   <tr><td class="mono">50 GbE</td><td>2018</td><td class="mono">50 Gb/s</td><td>SFP56</td><td>DAC, fiber</td><td>~2–4 µs</td><td>Current (HPC leaf)</td></tr>
   <tr><td class="mono">100 GbE</td><td>2010</td><td class="mono">100 Gb/s</td><td>QSFP28</td><td>MPO fiber, DAC</td><td>~2–4 µs</td><td>Current (spine, storage)</td></tr>
   <tr><td class="mono">200 GbE</td><td>2017</td><td class="mono">200 Gb/s</td><td>QSFP56</td><td>MPO fiber, DAC</td><td>~2–4 µs</td><td>Current (spine)</td></tr>
   <tr><td class="mono">400 GbE</td><td>2017</td><td class="mono">400 Gb/s</td><td>QSFP-DD, OSFP</td><td>MPO fiber, DAC</td><td>~2–4 µs</td><td>Current (spine, AI clusters)</td></tr>
   <tr><td class="mono">800 GbE</td><td>2022</td><td class="mono">800 Gb/s</td><td>OSFP, QSFP-DD800</td><td>MPO fiber</td><td>~2–4 µs</td><td>Emerging (AI/ML pods)</td></tr>
 </table></div>

 <h4>Ethernet transceiver form factors</h4>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Form Factor</th><th>Lanes</th><th>Max. Speed</th><th>Use</th></tr>
   <tr><td class="mono">SFP</td><td>1</td><td>1 Gb/s</td><td>1GbE</td></tr>
   <tr><td class="mono">SFP+</td><td>1</td><td>10 Gb/s</td><td>10GbE, storage</td></tr>
   <tr><td class="mono">SFP28</td><td>1</td><td>25 Gb/s</td><td>25GbE server NICs</td></tr>
   <tr><td class="mono">SFP56</td><td>1</td><td>50 Gb/s</td><td>50GbE, RDMA</td></tr>
   <tr><td class="mono">QSFP+</td><td>4</td><td>40 Gb/s</td><td>40GbE uplinks</td></tr>
   <tr><td class="mono">QSFP28</td><td>4</td><td>100 Gb/s</td><td>100GbE, RoCE</td></tr>
   <tr><td class="mono">QSFP56</td><td>4</td><td>200 Gb/s</td><td>200GbE, HDR IB alternative</td></tr>
   <tr><td class="mono">QSFP-DD</td><td>8</td><td>400 Gb/s</td><td>400GbE spine</td></tr>
   <tr><td class="mono">OSFP</td><td>8</td><td>800 Gb/s</td><td>800GbE, AI pods</td></tr>
 </table></div>

 <h3>InfiniBand</h3>
 <p>InfiniBand is the <strong>RDMA-native interconnect</strong> designed specifically for HPC — it provides kernel-bypass, zero-copy messaging with the lowest latency of any cluster network. Every TOP500 #1 system uses InfiniBand or a proprietary variant.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Generation</th><th>Year</th><th>Bandwidth</th><th>Signaling</th><th>Connector</th><th>Latency (typ.)</th><th>Status</th></tr>
   <tr><td class="mono">SDR</td><td>2001</td><td class="mono">2.5 Gb/s (1×)</td><td>NRZ</td><td>CX4 (24-pin)</td><td>~5 µs</td><td>Obsolete</td></tr>
   <tr><td class="mono">DDR</td><td>2003</td><td class="mono">5 Gb/s (1×)</td><td>NRZ</td><td>CX4, QSFP</td><td>~3 µs</td><td>Obsolete</td></tr>
   <tr><td class="mono">QDR</td><td>2006</td><td class="mono">10 Gb/s (1×)</td><td>NRZ</td><td>QSFP (20-pin)</td><td>~2 µs</td><td>Legacy</td></tr>
   <tr><td class="mono">FDR</td><td>2011</td><td class="mono">14.0625 Gb/s (1×)</td><td>NRZ, 64b/66b</td><td>QSFP (20-pin)</td><td>~1.5 µs</td><td>Legacy</td></tr>
   <tr><td class="mono">EDR</td><td>2014</td><td class="mono">25.78125 Gb/s (1×)</td><td>NRZ, 64b/66b</td><td>QSFP28</td><td>~1 µs</td><td>Legacy</td></tr>
   <tr><td class="mono">HDR</td><td>2018</td><td class="mono">50 Gb/s (1×)</td><td>PAM4</td><td>QSFP56</td><td>~0.6 µs</td><td>Current</td></tr>
   <tr><td class="mono">NDR</td><td>2020</td><td class="mono">100 Gb/s (1×)</td><td>PAM4</td><td>QSFP112</td><td>~0.6 µs</td><td>Current</td></tr>
   <tr><td class="mono">NDR 400</td><td>2022</td><td class="mono">400 Gb/s (4×)</td><td>PAM4</td><td>OSFP, QSFP-DD</td><td>~0.6 µs</td><td>Current (AI/ML)</td></tr>
   <tr><td class="mono">XDR</td><td>2023</td><td class="mono">200 Gb/s (1×)</td><td>PAM4</td><td>OSFP, QSFP-DD</td><td>~0.6 µs</td><td>Emerging</td></tr>
 </table></div>

 <h4>InfiniBand widths — 1×, 4×, 12×</h4>
 <p>InfiniBand links can be <strong>1×, 4×, or 12×</strong> wide — multiplying the per-lane bandwidth:</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Width</th><th>HDR (50 Gb/s/lane)</th><th>NDR (100 Gb/s/lane)</th><th>XDR (200 Gb/s/lane)</th></tr>
   <tr><td class="mono">1×</td><td class="mono">50 Gb/s</td><td class="mono">100 Gb/s</td><td class="mono">200 Gb/s</td></tr>
   <tr><td class="mono">4×</td><td class="mono">200 Gb/s</td><td class="mono">400 Gb/s</td><td class="mono">800 Gb/s</td></tr>
   <tr><td class="mono">12×</td><td class="mono">600 Gb/s</td><td class="mono">1200 Gb/s</td><td class="mono">2400 Gb/s</td></tr>
 </table></div>

 <div class="note tip"><span class="tag">Why InfiniBand beats Ethernet for HPC</span><p>InfiniBand's advantage is <strong>RDMA by design</strong> — every IB port does kernel-bypass, zero-copy messaging natively. Ethernet requires RoCE (RDMA over Converged Ethernet) to match, which adds overhead and requires careful network configuration (PFC, ECN, DCQCN). In practice, IB delivers ~0.6 µs latency vs. ~2–4 µs for RoCE — a 3–6× difference that compounds across millions of MPI messages.</p></div>

 <h3>All Interfaces Side-by-Side — Bandwidth Comparison</h3>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Interface</th><th>Gen / Version</th><th>Bandwidth (1×)</th><th>Bandwidth (4×)</th><th>Latency</th><th>Primary HPC Use</th></tr>
   <tr><td class="mono">SATA III</td><td>SATA 3.0</td><td class="mono">6 Gb/s</td><td>—</td><td>~50–100 µs</td><td>HDD/SSD to host</td></tr>
   <tr><td class="mono">SAS-3</td><td>SAS 12G</td><td class="mono">12 Gb/s</td><td class="mono">48 Gb/s</td><td>~50–100 µs</td><td>Storage servers, JBODs</td></tr>
   <tr><td class="mono">SAS-4</td><td>SAS 24G</td><td class="mono">24 Gb/s</td><td class="mono">96 Gb/s</td><td>~30–80 µs</td><td>High-perf storage</td></tr>
   <tr><td class="mono">PCIe 4.0</td><td>—</td><td class="mono">~16 Gb/s</td><td class="mono">~64 Gb/s</td><td>~1 µs</td><td>NVMe, GPU, NIC</td></tr>
   <tr><td class="mono">PCIe 5.0</td><td>—</td><td class="mono">~32 Gb/s</td><td class="mono">~128 Gb/s</td><td>~1 µs</td><td>NVMe, GPU, NIC</td></tr>
   <tr><td class="mono">Ethernet 100GbE</td><td>802.3bs</td><td class="mono">—</td><td class="mono">100 Gb/s</td><td>~2–4 µs</td><td>Cluster fabric</td></tr>
   <tr><td class="mono">Ethernet 400GbE</td><td>802.3bs</td><td class="mono">—</td><td class="mono">400 Gb/s</td><td>~2–4 µs</td><td>Spine, AI pods</td></tr>
   <tr><td class="mono">InfiniBand HDR</td><td>HDR</td><td class="mono">50 Gb/s</td><td class="mono">200 Gb/s</td><td>~0.6 µs</td><td>HPC cluster fabric</td></tr>
   <tr><td class="mono">InfiniBand NDR</td><td>NDR</td><td class="mono">100 Gb/s</td><td class="mono">400 Gb/s</td><td>~0.6 µs</td><td>HPC/AI cluster fabric</td></tr>
   <tr><td class="mono">InfiniBand XDR</td><td>XDR</td><td class="mono">200 Gb/s</td><td class="mono">800 Gb/s</td><td>~0.6 µs</td><td>Next-gen AI/ML pods</td></tr>
 </table></div>

 <div class="note warn"><span class="tag">Bandwidth ≠ throughput</span><p>Raw link bandwidth is the <strong>theoretical maximum</strong>. Actual throughput is lower due to protocol overhead (PCIe 8b/10b or 128b/130b, Ethernet framing, IB 64b/66b), kernel/driver processing, and congestion. Expect ~85–95% efficiency for well-tuned RDMA, ~70–85% for TCP/IP over Ethernet.</p></div>

 <h3>Cable &amp; Connector Quick Reference</h3>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Cable Type</th><th>Interface</th><th>Speed</th><th>Max Length</th><th>Notes</th></tr>
   <tr><td class="mono">Cat5e</td><td>1 GbE</td><td>1 Gb/s</td><td>100 m</td><td>Legacy</td></tr>
   <tr><td class="mono">Cat6a</td><td>10 GbE</td><td>10 Gb/s</td><td>100 m</td><td>Short runs, ToR</td></tr>
   <tr><td class="mono">Cat8</td><td>25/40 GbE</td><td>25–40 Gb/s</td><td>30 m</td><td>Short copper runs</td></tr>
   <tr><td class="mono">DAC (Direct Attach Copper)</td><td>SFP+, QSFP, QSFP28</td><td>10–100 Gb/s</td><td>3–7 m</td><td>Lowest latency, shortest reach</td></tr>
   <tr><td class="mono">AOC (Active Optical Cable)</td><td>SFP+, QSFP</td><td>10–100 Gb/s</td><td>10–30 m</td><td>Lighter, longer than DAC</td></tr>
   <tr><td class="mono">MPO/MTP fiber</td><td>40G–800G Ethernet, IB</td><td>40–800 Gb/s</td><td>100–500 m</td><td>Parallel fiber, multi-lane</td></tr>
   <tr><td class="mono">LC duplex fiber</td><td>1G–25G Ethernet</td><td>1–25 Gb/s</td><td>10 km (single-mode)</td><td>Single-lane fiber</td></tr>
 </table></div>

 <h3>Decision Framework — Which Interface When</h3>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Use Case</th><th>Recommended Interface</th><th>Why</th></tr>
   <tr><td>Bulk storage (HDD/SSD to server)</td><td>SAS-3/4</td><td>Dual-path, expander support, enterprise reliability</td></tr>
   <tr><td>Boot / OS drive</td><td>SATA III</td><td>Cheap, sufficient for OS</td></tr>
   <tr><td>High-perf local NVMe</td><td>PCIe 4.0/5.0 NVMe</td><td>Lowest latency, highest BW to CPU</td></tr>
   <tr><td>GPU interconnect (within node)</td><td>PCIe 5.0/6.0, NVLink</td><td>Highest per-lane BW, lowest latency to CPU</td></tr>
   <tr><td>Cluster network (budget)</td><td>Ethernet 100/400GbE + RoCE</td><td>Cheaper NICs, standard TCP/IP support</td></tr>
   <tr><td>Cluster network (performance)</td><td>InfiniBand NDR/HDR</td><td>RDMA-native, lowest latency, best MPI performance</td></tr>
   <tr><td>AI/ML training fabric</td><td>InfiniBand NDR 400 / XDR</td><td>Ultra-high BW, RDMA for all-reduce</td></tr>
   <tr><td>Storage server backplane</td><td>SAS-4, PCIe backplane</td><td>Multi-device, redundancy</td></tr>
 </table></div>

 <div class="example-box">
   <span class="tag">Worked example — choosing storage interfaces</span>
   <p>A 200-node HPC cluster needs: (1) home directories on NFS, (2) 500 TB parallel scratch for compute I/O, (3) GPU nodes with NVMe local storage.</p>
   <p><strong>Home directories:</strong> 1 GbE or 10 GbE NFS is sufficient — small files, low bandwidth.</p>
   <p><strong>Parallel scratch:</strong> Lustre on SAS-4 storage servers with NVMe SSDs via PCIe 4.0 x4 (~8 GB/s per drive). Network: InfiniBand NDR 4× (400 Gb/s) from compute to storage servers.</p>
   <p><strong>GPU local NVMe:</strong> PCIe 5.0 x4 NVMe (~16 GB/s per drive) for checkpoint/local scratch.</p>
   <div class="res">Layered: NFS (10GbE) + Lustre (IB NDR + SAS-4 + PCIe 4.0 NVMe) + local NVMe (PCIe 5.0)</div>
 </div>
  `},
);
