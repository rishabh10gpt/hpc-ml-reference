{id:'s-10-1', part:'p10', num:'10.1', title:'Benchmark Categories — There Is No Single "HPC Score"',
 dek:'Seven different kinds of benchmark, each stressing a genuinely different part of the system.',
 tags:'benchmark categories overview hpl stream osu hpcg graph500 ior application',
 body:`
 <p>No single benchmark represents "HPC performance" — a system that dominates one category can be entirely unremarkable at another, because each stresses a different subsystem. This is the organizing idea for all of Part X.</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Category</th><th>Examples</th><th>Main bottleneck</th><th>Typical metric</th></tr>
   <tr><td>Compute throughput</td><td>HPL, DGEMM, LINPACK</td><td>FP execution</td><td>GFLOP/s, TFLOP/s, PFLOP/s</td></tr>
   <tr><td>Memory bandwidth</td><td>STREAM</td><td>DRAM/HBM</td><td>GB/s, TB/s</td></tr>
   <tr><td>Communication</td><td>OSU, IMB, perftest</td><td>Latency / network BW</td><td>µs, GB/s, Gb/s</td></tr>
   <tr><td>Sparse HPC</td><td>HPCG</td><td>Memory + communication</td><td>GFLOP/s</td></tr>
   <tr><td>Graph analytics</td><td>Graph500</td><td>Memory + network</td><td>TEPS</td></tr>
   <tr><td>I/O</td><td>IOR, mdtest, fio</td><td>Storage</td><td>GB/s, IOPS, ops/s</td></tr>
   <tr><td>Application</td><td>LAMMPS, GROMACS, WRF, OpenFOAM</td><td>Application-specific</td><td>steps/s, ns/day, cells/s</td></tr>
 </table></div>
 <p>HPL emphasizes dense FP64 computation and distributed communication; HPCG emphasizes sparse memory access and communication; STREAM measures pure memory bandwidth; MPI benchmarks measure network behavior in isolation; I/O benchmarks measure storage; application benchmarks measure actual scientific time-to-solution — the number that, ultimately, is what a real user cares about.</p>
 <div class="note tip"><span class="tag">How to use this table</span><p>Before running any benchmark, ask what question you're actually trying to answer — "is this system fast?" is not a well-formed question. "Is this system's FP64 dense compute competitive?" (HPL), "does this system have the memory bandwidth my sparse solver needs?" (HPCG/STREAM), and "will my actual application run faster here?" (application benchmark) are three different, all legitimate, questions with three different right benchmarks.</p></div>
 `},

{id:'s-10-2', part:'p10', num:'10.2', title:'HPL — High Performance Linpack, In Depth',
 dek:'The TOP500 benchmark: dense LU factorization, its tuning knobs, and how to compute a realistic peak.',
 tags:'hpl linpack top500 lu factorization dgemm blas process grid tuning',
 calc:'hpl',
 body:`
 <p>HPL solves a dense linear system A·x = b via LU factorization with partial pivoting, distributed across MPI ranks using a 2D block-cyclic data distribution. It's the benchmark that has determined TOP500 rankings since the list's inception, which makes it simultaneously the most famous and most narrowly-scoped HPC benchmark in common use.</p>
 <div class="formula-box">
   <span class="tag">Core HPL quantities</span>
   <div class="flist">
     <div class="f">Problem: solve A·x = b for dense N×N A</div>
     <div class="f">Dominant work ≈ (2/3)N³ FLOPs</div>
     <div class="f">Rmax = achieved operations / elapsed time</div>
     <div class="f">Rpeak = theoretical machine peak</div>
     <div class="f">HPL efficiency: η = Rmax/Rpeak × 100%</div>
     <div class="f">Matrix memory: 8N² bytes (FP64, 8 bytes/element)</div>
   </div>
 </div>
 <h4>Problem sizing — memory grows as N²</h4>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>N</th><th>Matrix A memory</th></tr>
   <tr><td class="mono">10,000</td><td class="mono">~0.8 GB</td></tr>
   <tr><td class="mono">50,000</td><td class="mono">~20 GB</td></tr>
   <tr><td class="mono">100,000</td><td class="mono">~80 GB</td></tr>
   <tr><td class="mono">200,000</td><td class="mono">~320 GB</td></tr>
 </table></div>
 <p>Actual HPL memory use runs higher than the raw A-matrix estimate due to additional workspace arrays — for a distributed run, N should be large enough to exercise the aggregate memory system meaningfully without exhausting it (too small and you're measuring cache effects, not the real system).</p>
 <h4>Tuning parameters</h4>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Parameter</th><th>Role</th><th>Trade-off</th></tr>
   <tr><td class="mono">N</td><td>Global matrix dimension</td><td>Larger N increases work as N³ and memory as N²</td></tr>
   <tr><td class="mono">NB</td><td>Block size</td><td>Too small increases overhead; too large reduces flexibility</td></tr>
   <tr><td class="mono">P×Q</td><td>MPI process grid</td><td>Affects communication pattern and rank-to-node mapping</td></tr>
   <tr><td class="mono">BCAST</td><td>Panel broadcast algorithm</td><td>Changes communication behavior</td></tr>
   <tr><td class="mono">SWAP</td><td>Row swapping strategy</td><td>Changes communication pattern</td></tr>
   <tr><td class="mono">PFACT</td><td>Panel factorization</td><td>Changes synchronization/overlap behavior</td></tr>
   <tr><td class="mono">Look-ahead</td><td>Overlap communication with factorization</td><td>Can hide communication latency behind compute</td></tr>
 </table></div>
 <p>A near-square P×Q process grid (R = P×Q ranks total) is a reasonable starting point, but the truly best grid depends on your specific network topology, node placement, and communication behavior — there's no universally correct P×Q.</p>
 <div class="formula-box">
   <span class="tag">Simplified Rpeak estimate</span>
   <div class="f">Rpeak ≈ nodes × sockets/node × cores/socket × clock × FP64 FLOPs/cycle</div>
   <div class="f small">The exact value needs to account for vector width, FP execution unit count, FMA (2 FLOPs), frequency limits, and architecture-specific behavior — see §2.3 for the full calculation.</div>
 </div>
 <div class="calc-mount" data-calc="hpl"></div>
 <h4>What actually limits HPL scaling</h4>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Component</th><th>Effect</th></tr>
   <tr><td>DGEMM/BLAS</td><td>The large dense matrix operations that drive most arithmetic throughput — library quality matters enormously</td></tr>
   <tr><td>Panel factorization</td><td>Synchronization and memory/communication sensitivity</td></tr>
   <tr><td>Panel broadcast</td><td>Network latency and bandwidth</td></tr>
   <tr><td>Row swaps</td><td>Data movement and communication overhead</td></tr>
   <tr><td>MPI collectives</td><td>Synchronization and fabric utilization</td></tr>
   <tr><td>NUMA placement</td><td>Can reduce local memory performance if mismanaged</td></tr>
   <tr><td>BLAS library</td><td>Critical for node-level compute efficiency — a vendor-tuned BLAS vs. a generic one can be the difference between 60% and 90%+ efficiency</td></tr>
 </table></div>
 `},

{id:'s-10-3', part:'p10', num:'10.3', title:'HPL vs. HPCG',
 dek:'Why a system can rank #1 on one list and far lower on the other — and why that\'s the point.',
 tags:'hpl hpcg dense sparse conjugate gradient comparison',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Property</th><th>HPL</th><th>HPCG</th></tr>
   <tr><td>Algorithm</td><td>Dense LU factorization</td><td>Sparse Conjugate Gradient</td></tr>
   <tr><td>Arithmetic intensity</td><td>High</td><td>Low/moderate</td></tr>
   <tr><td>Memory access</td><td>Dense/regular</td><td>Sparse/irregular</td></tr>
   <tr><td>Communication</td><td>Important at scale</td><td>Very important</td></tr>
   <tr><td>Primary metric</td><td>Rmax</td><td>HPCG performance (GFLOP/s)</td></tr>
   <tr><td>Typical relation to peak</td><td>Can approach peak</td><td>Usually much farther below peak</td></tr>
   <tr><td>Main stress</td><td>Compute + network</td><td>Memory + network</td></tr>
 </table></div>
 <p>This table is really the Roofline Model (§1.5) wearing benchmark clothing. HPL's dense LU factorization has high arithmetic intensity — lots of FLOPs per byte moved — so it sits comfortably in a system's compute-bound region and can approach a large fraction of theoretical peak. HPCG's sparse conjugate-gradient solver has low-to-moderate arithmetic intensity and highly irregular memory access, putting it firmly in memory- and communication-bound territory, where it commonly achieves only a small single-digit percentage of the same system's Rpeak.</p>
 <div class="note tip"><span class="tag">Why HPCG exists at all, given HPL already tops the charts</span><p>Most real scientific applications — especially anything based on sparse linear algebra, finite-element/finite-volume discretizations, or iterative solvers — look far more like HPCG's memory- and communication-bound access pattern than HPL's dense, regular one. A system that ranks brilliantly on HPL but poorly on HPCG is telling you it has strong peak arithmetic capability but comparatively weaker memory subsystem and network balance for the kind of workload most users actually run. Reporting both numbers together (as TOP500 now does) gives a far more honest picture than either alone.</p></div>
 `},

{id:'s-10-4', part:'p10', num:'10.4', title:'STREAM — Memory Bandwidth Benchmark',
 dek:'Four simple vector operations that measure the number underlying every memory-bound roofline calculation.',
 tags:'stream memory bandwidth copy scale add triad benchmark',
 calc:'stream',
 body:`
 <p>STREAM estimates sustainable memory bandwidth using four deliberately simple vector operations — simple enough that the benchmark itself is never compute-bound, which is exactly the point: it isolates the memory subsystem's achievable bandwidth, uncontaminated by arithmetic throughput limits.</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Kernel</th><th>Operation</th><th>Bytes/iteration (FP64)</th></tr>
   <tr><td class="mono">Copy</td><td class="mono">a[i] = b[i]</td><td class="mono">16 bytes</td></tr>
   <tr><td class="mono">Scale</td><td class="mono">a[i] = q×b[i]</td><td class="mono">16 bytes</td></tr>
   <tr><td class="mono">Add</td><td class="mono">a[i] = b[i]+c[i]</td><td class="mono">24 bytes</td></tr>
   <tr><td class="mono">Triad</td><td class="mono">a[i] = b[i]+q×c[i]</td><td class="mono">24 bytes</td></tr>
 </table></div>
 <div class="formula-box">
   <span class="tag">Bandwidth</span>
   <div class="f">Bandwidth ≈ bytes transferred / elapsed time</div>
 </div>
 <div class="calc-mount" data-calc="stream"></div>
 <div class="note warn"><span class="tag">The rule that makes STREAM results meaningful</span><p>Use arrays substantially larger than the last-level cache when measuring DRAM bandwidth. If the array fits (even partially) in cache, you're measuring cache bandwidth — often several times higher than real DRAM bandwidth — and will get a badly optimistic number that doesn't reflect what memory-bound production code will actually see.</p></div>
 <p><strong>Triad</strong> is the number most commonly quoted as "the STREAM result" because it combines a read of two arrays with a write to a third and includes a multiply — the closest of the four kernels to a realistic mixed memory-access pattern, and the kernel used in the arithmetic-intensity worked example back in §1.2.</p>
 `},

{id:'s-10-5', part:'p10', num:'10.5', title:'MPI &amp; Network Microbenchmarks',
 dek:'The tools that measure a fabric\'s actual delivered latency and bandwidth, independent of any application.',
 tags:'osu imb iperf3 ib_write_bw ib_write_lat perftest mpi network benchmark',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Benchmark</th><th>Measures</th><th>Typical output</th></tr>
   <tr><td>OSU Micro-Benchmarks</td><td>MPI point-to-point/collectives</td><td>Latency, bandwidth</td></tr>
   <tr><td>Intel MPI Benchmarks (IMB)</td><td>MPI operations</td><td>µs, MB/s</td></tr>
   <tr><td>iperf3</td><td>TCP/UDP IP networking</td><td>Gb/s</td></tr>
   <tr><td>ib_write_bw / ib_read_bw</td><td>RDMA bandwidth</td><td>Gb/s</td></tr>
   <tr><td>ib_write_lat / ib_read_lat</td><td>RDMA latency</td><td>µs</td></tr>
   <tr><td>perftest</td><td>RDMA verbs (the toolkit ib_write_bw etc. belong to)</td><td>Bandwidth / latency</td></tr>
 </table></div>
 <p>These tools directly measure the α and β parameters of the communication model in §5.6 — OSU/IMB latency tests with tiny messages isolate α (startup latency); their large-message bandwidth tests isolate 1/β (achievable bandwidth). Running both message-size regimes is essential: a fabric can look excellent at large-message bandwidth while having comparatively poor small-message latency (or vice versa), and which one matters more depends entirely on your application's message-size distribution.</p>
 <div class="note tip"><span class="tag">Test collectives, not just point-to-point</span><p>OSU and IMB both include collective-operation benchmarks (broadcast, all-reduce, all-to-all) in addition to simple point-to-point tests. For workloads dominated by collective communication (most distributed training, many iterative solvers), the collective benchmark numbers are far more representative of real application behavior than point-to-point latency/bandwidth alone — see §5.6's discussion of why naïve all-to-all scaling (O(P²)) makes collective algorithm choice matter so much.</p></div>
 `},

{id:'s-10-6', part:'p10', num:'10.6', title:'Storage / I/O Benchmarks',
 dek:'IOR for bulk throughput, mdtest for metadata, fio for block-level detail — three tools for three different storage questions.',
 tags:'ior mdtest fio iozone storage benchmark parallel filesystem',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Benchmark</th><th>Primary purpose</th><th>Metric</th></tr>
   <tr><td>IOR</td><td>Parallel filesystem/storage throughput</td><td>GB/s</td></tr>
   <tr><td>mdtest</td><td>Filesystem metadata performance</td><td>operations/s</td></tr>
   <tr><td>fio</td><td>Block I/O / NVMe-level testing</td><td>IOPS, MB/s, latency</td></tr>
   <tr><td>iozone</td><td>Filesystem access-pattern testing</td><td>MB/s, latency</td></tr>
 </table></div>
 <p>These map directly onto the sequential-vs-random and bandwidth-vs-IOPS distinctions from §9.1. IOR is the standard tool for characterizing a parallel filesystem's <em>aggregate bulk throughput</em> — many nodes writing/reading large, typically sequential, data simultaneously. mdtest instead hammers the filesystem with pure metadata operations (file create/stat/delete) at high concurrency, specifically to characterize the metadata server(s) — the bottleneck that IOR's bulk-throughput numbers won't reveal at all. fio operates a level lower, at individual block-device granularity, useful for characterizing local NVMe/SSD performance independent of any parallel filesystem layer sitting on top.</p>
 <div class="note warn"><span class="tag">Why you need both IOR and mdtest</span><p>A parallel filesystem can post excellent IOR bandwidth numbers (GB/s of large sequential I/O) while performing poorly on mdtest (metadata operations/s) — or vice versa. A checkpoint/restart workload writing one large shared file per checkpoint cares almost entirely about the IOR-style number; a workload creating millions of small per-timestep or per-rank files cares almost entirely about the mdtest-style number. Testing only one gives an incomplete, potentially misleading picture of real workload performance.</p></div>
 `},

{id:'s-10-7', part:'p10', num:'10.7', title:'Application-Level HPC Benchmarks',
 dek:'The benchmarks that measure what you actually asked the system to do, not a synthetic proxy for it.',
 tags:'lammps gromacs wrf openfoam nekrs spec cpu graph500 application benchmark',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Application</th><th>Workload</th><th>Typical metric</th></tr>
   <tr><td>LAMMPS</td><td>Molecular dynamics</td><td>timesteps/s, atom-steps/s</td></tr>
   <tr><td>GROMACS</td><td>Molecular dynamics</td><td>ns/day (simulated nanoseconds per wall-clock day)</td></tr>
   <tr><td>WRF</td><td>Weather / climate modeling</td><td>simulated time/day</td></tr>
   <tr><td>OpenFOAM</td><td>Computational fluid dynamics</td><td>iterations/s, runtime</td></tr>
   <tr><td>NekRS</td><td>High-order CFD</td><td>degrees-of-freedom/s, runtime</td></tr>
   <tr><td>SPEC CPU</td><td>General CPU applications</td><td>score / runtime</td></tr>
   <tr><td>Graph500</td><td>Graph analytics (BFS-style traversal)</td><td>TEPS (Traversed Edges Per Second)</td></tr>
 </table></div>
 <p>Every benchmark elsewhere in Part X — HPL, HPCG, STREAM, the network and storage microbenchmarks — exists to help you <em>predict and diagnose</em> performance. Application benchmarks are the ground truth they're all trying to predict. The most rigorous procurement or capacity-planning process ultimately validates candidate hardware against the actual applications that will run on it, not just synthetic proxies — because no single synthetic benchmark (not even the combination of HPL + HPCG + STREAM) perfectly captures every real application's specific mix of compute, memory, and communication demands.</p>
 <div class="note tip"><span class="tag">Reading unit-specific metrics correctly</span><p>GROMACS's "ns/day" and WRF's "simulated time/day" look like throughput metrics but are really <em>time-to-solution</em> metrics in disguise — they answer "how much real-world simulated phenomenon can this system compute per day of wall-clock time," which is usually the number that actually matters to the scientist waiting on results, more directly than any FLOP/s figure.</p></div>
 `},

{id:'s-10-8', part:'p10', num:'10.8', title:'Benchmarking Metrics — the Common Vocabulary',
 dek:'The handful of formulas that every benchmark in this Part ultimately reports results through.',
 tags:'runtime throughput speedup efficiency bandwidth efficiency energy joules per flop metrics',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Metric</th><th>Formula</th><th>Use</th></tr>
   <tr><td>Runtime</td><td class="mono">T = t_end − t_start</td><td>Execution time</td></tr>
   <tr><td>Throughput</td><td class="mono">Work / T</td><td>Work completed per second</td></tr>
   <tr><td>Speedup</td><td class="mono">S = T₁/T_P</td><td>Scaling behavior (§1.2, §1.3)</td></tr>
   <tr><td>Parallel efficiency</td><td class="mono">E = S/P</td><td>Scaling quality</td></tr>
   <tr><td>HPL efficiency</td><td class="mono">Rmax/Rpeak</td><td>Peak compute utilization (§10.2)</td></tr>
   <tr><td>Bandwidth efficiency</td><td class="mono">Achieved BW / theoretical BW</td><td>Memory/network efficiency</td></tr>
   <tr><td>Energy to solution</td><td class="mono">E = ∫P(t)dt</td><td>Total energy consumed by a run</td></tr>
   <tr><td>Performance/Watt</td><td class="mono">Performance / Power</td><td>Energy efficiency (§8.4)</td></tr>
   <tr><td>Joules/FLOP</td><td class="mono">Energy / FLOPs</td><td>Energy cost per unit of computation</td></tr>
 </table></div>
 <p>This table is deliberately a cross-reference index as much as a glossary — nearly every formula here has already appeared, with full explanation and a worked example, earlier in this reference. Its purpose here is to gather them in one place as the shared vocabulary that lets you compare results across HPL, HPCG, STREAM, and application benchmarks on equal footing.</p>
 `},

{id:'s-10-9', part:'p10', num:'10.9', title:'Recommended HPC Benchmark Sequence',
 dek:'The order that catches problems before they masquerade as something else — from hardware sanity check to full application run.',
 tags:'benchmark sequence order sanity check recommended workflow',
 body:`
 <p>Running benchmarks in a deliberate order matters: a network problem discovered only after tuning HPL for days can waste enormous effort chasing the wrong culprit. This sequence — moving from the simplest, most isolated checks toward the most complex, integrated ones — is designed to surface problems at the layer where they actually originate.</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>#</th><th>Step</th><th>What it catches</th></tr>
   <tr><td class="mono">1</td><td>Hardware sanity: CPU/GPU clocks, NUMA, memory, PCIe, NIC, firmware, power limits</td><td>Misconfiguration before it contaminates every later result</td></tr>
   <tr><td class="mono">2</td><td>CPU compute: optimized DGEMM/BLAS</td><td>Whether node-level compute reaches expected peak (§2.3)</td></tr>
   <tr><td class="mono">3</td><td>Memory: STREAM with arrays larger than cache</td><td>Real DRAM/HBM bandwidth (§10.4)</td></tr>
   <tr><td class="mono">4</td><td>GPU: FP64/FP32/tensor kernels and device-memory bandwidth</td><td>Accelerator compute and memory subsystem</td></tr>
   <tr><td class="mono">5</td><td>PCIe/NVLink: host-device and GPU-GPU transfer tests</td><td>Intra-node interconnect bottlenecks (§5.5)</td></tr>
   <tr><td class="mono">6</td><td>Network: OSU/IMB/perftest — both small and large messages</td><td>Fabric latency and bandwidth (§10.5)</td></tr>
   <tr><td class="mono">7</td><td>Storage: IOR/mdtest/fio as appropriate</td><td>Bulk throughput and metadata performance (§10.6)</td></tr>
   <tr><td class="mono">8</td><td>HPL: tune N, NB, P×Q, BLAS and MPI</td><td>Integrated dense-compute + network at scale (§10.2)</td></tr>
   <tr><td class="mono">9</td><td>HPCG: evaluate memory/communication-heavy behavior</td><td>How the system handles sparse, irregular access at scale (§10.3)</td></tr>
   <tr><td class="mono">10</td><td>Application benchmark: actual scientific workload, time-to-solution</td><td>What actually matters to the end user (§10.7)</td></tr>
   <tr><td class="mono">11</td><td>Power: record average power and energy-to-solution throughout</td><td>Efficiency metrics for every step above (§8.4)</td></tr>
 </table></div>
 <div class="note tip"><span class="tag">Why this order specifically</span><p>Each step isolates one subsystem before the next step layers on another. If HPL (step 8) underperforms, having already validated compute (step 2), memory (step 3), and network (step 6) independently lets you rule those out quickly and focus on HPL-specific tuning (process grid, block size, look-ahead) rather than re-diagnosing the whole system from scratch. Skipping straight to HPL and finding disappointing Rmax leaves you guessing between a dozen possible causes.</p></div>
 `},

{id:'s-10-10', part:'p10', num:'10.10', title:'HPL Worked Example, End to End',
 dek:'One complete, realistic HPL sizing and efficiency calculation, straight from the source reference.',
 tags:'hpl worked example efficiency rmax rpeak calculation',
 body:`
 <p>Pulling together §2.3 (peak FLOPs), §10.2 (HPL formulas), and §10.8 (efficiency metrics) into one concrete, complete calculation:</p>
 <div class="formula-box">
   <span class="tag">Step 1 — theoretical peak</span>
   <div class="f">16 nodes × 2 CPUs/node × 2.0 TFLOP/s per CPU = Rpeak = 64 TFLOP/s</div>
 </div>
 <div class="formula-box">
   <span class="tag">Step 2 — measured efficiency</span>
   <div class="f">HPL reports Rmax = 55 TFLOP/s</div>
   <div class="f">Efficiency = 55/64 × 100 ≈ <strong>85.9%</strong></div>
 </div>
 <div class="formula-box">
   <span class="tag">Step 3 — problem size &amp; implied throughput cross-check</span>
   <div class="f">N = 100,000 → raw FP64 matrix A storage = 8N² ≈ 80 GB</div>
   <div class="f">Dominant HPL work ≈ (2/3)N³ ≈ 6.67×10¹⁴ FLOPs</div>
   <div class="f">At an idealized 12.5 s runtime → 6.67×10¹⁴ / 12.5 ≈ <strong>53.3 TFLOP/s</strong></div>
 </div>
 <p>Notice that the two efficiency-related numbers in steps 2 and 3 (55 TFLOP/s reported Rmax vs. 53.3 TFLOP/s implied by the dominant-term estimate) are close but not identical — expected, because the (2/3)N³ formula only captures the <em>dominant</em> arithmetic term. Real HPL execution also includes panel factorization, pivoting, communication, and synchronization overhead beyond that dominant term, which the simplified formula doesn't account for.</p>
 <div class="note tip"><span class="tag">How to use this worked example as a template</span><p>This exact three-step structure — compute Rpeak from hardware specs, compare against reported Rmax for efficiency, then independently cross-check using the N-and-runtime-based FLOPs estimate — is the standard way to sanity-check any HPL result you're handed, whether from your own runs or a vendor's benchmark report. The full interactive version of this calculation is in §10.2.</p></div>
 `},

{id:'s-10-11', part:'p10', num:'10.11', title:'Benchmark Selection Cheat Sheet',
 dek:'One table mapping the question you\'re actually asking to the right tool.',
 tags:'benchmark selection cheat sheet which benchmark question guide',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Question</th><th>Benchmark</th><th>Metric</th></tr>
   <tr><td>FP64 compute?</td><td>HPL / DGEMM</td><td class="mono">TFLOP/s</td></tr>
   <tr><td>Memory bandwidth?</td><td>STREAM</td><td class="mono">GB/s or TB/s</td></tr>
   <tr><td>MPI network?</td><td>OSU / IMB</td><td>Latency + bandwidth</td></tr>
   <tr><td>RDMA fabric?</td><td>perftest</td><td class="mono">Gb/s + µs</td></tr>
   <tr><td>Sparse HPC?</td><td>HPCG</td><td>GFLOP/s + scaling</td></tr>
   <tr><td>Parallel storage?</td><td>IOR</td><td class="mono">GB/s</td></tr>
   <tr><td>Metadata?</td><td>mdtest</td><td>operations/s</td></tr>
   <tr><td>Real application?</td><td>Application benchmark</td><td>Time-to-solution</td></tr>
   <tr><td>Energy efficiency?</td><td>Power + benchmark</td><td class="mono">J/op, FLOP/W</td></tr>
 </table></div>
 <p>Keep this table as the fast-reference version of everything in Part X — when you need to decide which benchmark answers a specific question under time pressure, this is the table to reach for. For the full reasoning behind each row, its neighboring sections in this Part cover the tool in depth.</p>
 <div class="note tip"><span class="tag">One benchmark is rarely enough</span><p>Most real evaluation efforts need several rows from this table together — a full node/cluster acceptance test commonly runs the entire §10.9 sequence, not just one row of this cheat sheet in isolation. Use this table to identify which tools you need, then §10.9 for the order to run them in.</p></div>
 `}
);

{id:'s-11-1', part:'p11', num:'11.1', title:'MPI Fundamentals — Message Passing Interface',
 dek:'The core concepts every HPC programmer needs: ranks, communicators, point-to-point, collectives, and one-sided operations.',
 tags:'mpi rank communicator send recv broadcast reduce scatter gather allreduce barrier collective',
 body:`
 <p>MPI (Message Passing Interface) is the <strong>dominant programming model for distributed-memory HPC</strong>. Every node has its own private memory; nodes communicate by explicitly sending and receiving messages. MPI is not a library — it's a <strong>standard</strong> (maintained by the MPI Forum) with multiple implementations: OpenMPI, Intel MPI, MPICH, Cray MPICH, etc.</p>

 <h3>MPI Execution Model</h3>
 <div class="formula-box">
   <span class="tag">Core concepts</span>
   <div class="flist">
     <div class="f">Rank: a unique integer ID (0 to N-1) for each MPI process</div>
     <div class="f">Communicator: a group of ranks that can communicate with each other</div>
     <div class="f">MPI_COMM_WORLD: the default communicator containing all ranks</div>
     <div class="f">MPI_Init / MPI_Finalize: bookend every MPI program</div>
     <div class="f">MPI_Comm_size: how many ranks in this communicator</div>
     <div class="f">MPI_Comm_rank: what is my rank in this communicator</div>
   </div>
 </div>

 <div class="example-box">
   <span class="tag">Minimal MPI program</span>
   <p><code>int rank, size;<br>MPI_Init(&argc, &argv);<br>MPI_Comm_rank(MPI_COMM_WORLD, &rank);<br>MPI_Comm_size(MPI_COMM_WORLD, &size);<br>// ... each rank does work ...<br>MPI_Finalize();</code></p>
 </div>

 <h3>Point-to-Point Communication</h3>
 <p>Two ranks communicate directly — one sends, one receives.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Operation</th><th>Function</th><th>Description</th></tr>
   <tr><td class="mono">Blocking send</td><td class="mono">MPI_Send</td><td>Send doesn't return until the send buffer is safe to reuse</td></tr>
   <tr><td class="mono">Blocking receive</td><td class="mono">MPI_Recv</td><td>Receive doesn't return until the data is in the receive buffer</td></tr>
   <tr><td class="mono">Non-blocking send</td><td class="mono">MPI_Isend</td><td>Returns immediately; use MPI_Wait or MPI_Test to check completion</td></tr>
   <tr><td class="mono">Non-blocking receive</td><td class="mono">MPI_Irecv</td><td>Returns immediately; data available after completion</td></tr>
   <tr><td class="mono">Synchronous send</td><td class="mono">MPI_Ssend</td><td>Blocks until the receiver has started receiving</td></tr>
   <tr><td class="mono">Ready send</td><td class="mono">MPI_Rsend</td><td>Send that assumes receiver is already posting — undefined if not</td></tr>
 </table></div>

 <div class="note tip"><span class="tag">Blocking vs. non-blocking</span><p>Non-blocking operations (MPI_Isend/Irecv) allow <strong>communication-computation overlap</strong> — post the message, do computation, then check completion. This is critical for performance: blocking sends can deadlock if both ranks send to each other simultaneously without matching receives.</p></div>

 <h3>Collective Operations</h3>
 <p>Communications involving <strong>all ranks</strong> in a communicator. These are heavily optimized by MPI implementations — never implement your own broadcast or reduce if the MPI library can do it.</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Collective</th><th>Description</th><th>Scale</th></tr>
   <tr><td class="mono">MPI_Bcast</td><td>One rank sends data to all others</td><td>O(log P) with tree algorithm</td></tr>
   <tr><td class="mono">MPI_Reduce</td><td>All ranks contribute data; one rank gets the result (sum, max, min, etc.)</td><td>O(log P)</td></tr>
   <tr><td class="mono">MPI_Allreduce</td><td>Like Reduce, but all ranks get the result</td><td>O(log P) — critical for distributed training</td></tr>
   <tr><td class="mono">MPI_Gather</td><td>All ranks send to one rank</td><td>O(log P)</td></tr>
   <tr><td class="mono">MPI_Allgather</td><td>All ranks send; all ranks receive all data</td><td>O(log P)</td></tr>
   <tr><td class="mono">MPI_Scatter</td><td>One rank distributes data chunks to all ranks</td><td>O(log P)</td></tr>
   <tr><td class="mono">MPI_Alltoall</td><td>Every rank sends different data to every other rank</td><td>O(P) — expensive!</td></tr>
   <tr><td class="mono">MPI_Barrier</td><td>Synchronize all ranks — no data transfer</td><td>O(log P) latency</td></tr>
 </table></div>

 <div class="note warn"><span class="tag">MPI_Alltoall is O(P²)</span><p>All-to-all is the most expensive collective: every rank sends distinct data to every other rank. As the number of ranks P grows, the total data moved grows as P². For large P, this dominates runtime. Minimize all-to-all usage; use allreduce or allgather where possible.</p></div>

 <h3>Derived Datatypes</h3>
 <p>MPI supports <strong>non-contiguous data layouts</strong> via derived datatypes — avoid manual packing/unpacking:</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Datatype</th><th>Purpose</th></tr>
   <tr><td class="mono">MPI_Type_contiguous</td><td>N copies of a basic type</td></tr>
   <tr><td class="mono">MPI_Type_vector</td><td>Block stride (every N-th element)</td></tr>
   <tr><td class="mono">MPI_Type_indexed</td><td>Arbitrary list of offsets</td></tr>
   <tr><td class="mono">MPI_Type_struct</td><td>Mixed types at mixed offsets</td></tr>
   <tr><td class="mono">MPI_Type_create_subarray</td><td>Subarray of a multi-dimensional array</td></tr>
 </table></div>

 <h3>One-Sided (RMA) Communication</h3>
 <p>MPI-2 introduced <strong>Remote Memory Access (RMA)</strong> — one rank directly reads/writes another rank's memory without the remote rank explicitly participating:</p>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Operation</th><th>Description</th></tr>
   <tr><td class="mono">MPI_Put</td><td>Write data into remote rank's window</td></tr>
   <tr><td class="mono">MPI_Get</td><td>Read data from remote rank's window</td></tr>
   <tr><td class="mono">MPI_Accumulate</td><td>Atomic update (e.g., add) to remote rank's window</td></tr>
   <tr><td class="mono">MPI_Win_fence</td><td>Synchronization for RMA operations</td></tr>
 </table></div>

 <p>RMA is useful for irregular access patterns and asynchronous data movement, but is harder to debug and less widely used than point-to-point and collectives.</p>

 <h3>MPI Implementations — What to Use</h3>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Implementation</th><th>Strengths</th><th>Typical Use</th></tr>
   <tr><td class="mono">Open MPI</td><td>Broad hardware support, open-source, community</td><td>Academic clusters, general HPC</td></tr>
   <tr><td class="mono">Intel MPI</td><td>Optimized for Intel CPUs/IB, MPI profiling tools</td><td>Intel-based clusters, Intel oneAPI</td></tr>
   <tr><td class="mono">MPICH</td><td>Reference implementation, minimal, stable</td><td>Base for vendor-specific builds</td></tr>
   <tr><td class="mono">Cray MPICH</td><td>Optimized for Cray interconnect (Slingshot)</td><td>Frontier, Perlmutter, other Cray systems</td></tr>
   <tr><td class="mono">MVAPICH2</td><td>RDMA-optimized for InfiniBand</td><td>IB clusters, MPI+OpenMP hybrid</td></tr>
 </table></div>

 <div class="formula-box">
   <span class="tag">MPI performance rules of thumb</span>
   <div class="flist">
     <div class="f">Prefer non-blocking over blocking to overlap communication with computation</div>
     <div class="f">Avoid MPI_Alltoall at large P — use MPI_Allreduce or MPI_Allgather instead</div>
     <div class="f">Use MPI-IO (§10.6) for parallel file I/O, not individual fopen/fwrite per rank</div>
     <div class="f">Profile with MPIProf, TAU, Scalasca, or Intel Trace Analyzer before optimizing</div>
   </div>
 </div>
 `},

{id:'s-11-2', part:'p11', num:'11.2', title:'GPU &amp; CUDA Terminology',
 dek:'CUDA cores, warps, blocks, grids, streams, shared memory, and the vocabulary of GPU computing.',
 tags:'gpu cuda core warp block grid stream shared memory global memory tensor core sm multiprocessor nvlink cuda cores',
 body:`
 <p>GPU computing (GPGPU) uses <strong>thousands of simple cores</strong> operating on data in parallel. NVIDIA's CUDA is the dominant GPU programming model. Understanding the terminology is essential for performance tuning — the hardware hierarchy directly maps to software constructs.</p>

 <h3>CUDA Execution Hierarchy</h3>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Software (CUDA)</th><th>Hardware</th><th>Description</th></tr>
   <tr><td class="mono">Thread</td><td>CUDA core</td><td>Smallest execution unit — one instruction per thread</td></tr>
   <tr><td class="mono">Warp</td><td>Warp scheduler</td><td>32 threads executing in lockstep (SIMT)</td></tr>
   <tr><td class="mono">Block (CTA)</td><td>Streaming Multiprocessor (SM)</td><td>Up to 1024 threads; shares shared memory</td></tr>
   <tr><td class="mono">Grid</td><td>Entire GPU</td><td>Collection of blocks; launched by kernel</td></tr>
 </table></div>

 <div class="formula-box">
   <span class="tag">Key relationships</span>
   <div class="flist">
     <div class="f">1 warp = 32 threads (fixed, hardware-level)</div>
     <div class="f">1 block = up to 1024 threads (software-configurable)</div>
     <div class="f">1 SM = up to 2048 resident threads (across all blocks on that SM)</div>
     <div class="f">1 GPU = up to 168 SMs (H100)</div>
     <div class="f">Occupancy = (active warps) / (max warps per SM) × 100%</div>
   </div>
 </div>

 <h3>Memory Hierarchy</h3>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Memory</th><th>Scope</th><th>Size</th><th>Bandwidth</th><th>Use</th></tr>
   <tr><td class="mono">Registers</td><td>Per thread</td><td>~256 bytes/thread</td><td>~∞ (same cycle)</td><td>Local variables</td></tr>
   <tr><td class="mono">Shared memory</td><td>Per block (SM)</td><td>~48–164 KB per SM</td><td>~20 TB/s (on-chip)</td><td>Thread cooperation, caching</td></tr>
   <tr><td class="mono">L1 cache</td><td>Per SM</td><td>~128 KB per SM</td><td>~20 TB/s</td><td>Global memory cache</td></tr>
   <tr><td class="mono">L2 cache</td><td>Per GPU</td><td>~50 MB (H100)</td><td>~12 TB/s</td><td>Coherent cache across SMs</td></tr>
   <tr><td class="mono">HBM</td><td>Per GPU</td><td>80 GB (H100)</td><td>~3.35 TB/s</td><td>Global device memory</td></tr>
   <tr><td class="mono">NVLink</td><td>GPU-to-GPU</td><td>900 GB/s (H100)</td><td>~900 GB/s</td><td>Multi-GPU transfer</td></tr>
   <tr><td class="mono">Host (DRAM)</td><td>CPU memory</td><td>Terabytes</td><td>~200 GB/s</td><td>Data staging, CPU work</td></tr>
 </table></div>

 <div class="note warn"><span class="tag">Global memory latency is ~200–400 cycles</span><p>If a warp accesses global memory (HBM) and has to wait for the data, the warp is stalled and another warp can execute — this is how GPUs hide latency. The more warps in flight (higher occupancy), the better the GPU can hide memory latency. Low occupancy = exposed latency = poor performance.</p></div>

 <h3>CUDA Programming Concepts</h3>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Concept</th><th>Description</th></tr>
   <tr><td class="mono">Kernel</td><td>A function launched on the GPU, executed by many threads in parallel</td></tr>
   <tr><td class="mono"><<<blocks, threads>>></td><td>Kernel launch configuration: grid of blocks, threads per block</td></tr>
   <tr><td class="mono">threadIdx, blockIdx</td><td>Built-in variables identifying each thread's position</td></tr>
   <tr><td class="mono">__shared__</td><td>Qualifies a variable as residing in shared memory (per-block)</td></tr>
   <tr><td class="mono">__device__</td><td>Variable/function resides on the GPU</td></tr>
   <tr><td class="mono">__host__</td><td>Variable/function resides on the CPU (default)</td></tr>
   <tr><td class="mono">__global__</td><td>Kernel function callable from CPU, runs on GPU</td></tr>
   <tr><td class="mono">Stream</td><td>A queue of GPU operations that execute in order; different streams can overlap</td></tr>
   <tr><td class="mono">cudaMemcpy</td><td>Transfer data between host and device (synchronous)</td></tr>
   <tr><td class="mono">cudaMemcpyAsync</td><td>Asynchronous transfer — can overlap with kernel execution</td></tr>
 </table></div>

 <h3>GPU Generations &amp; Key Specs</h3>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Architecture</th><th>Year</th><th>Key GPU</th><th>CUDA Cores</th><th>Tensor Cores</th><th>HBM</th><th>BW</th></tr>
   <tr><td class="mono">Volta</td><td>2017</td><td>V100</td><td>5120</td><td>640 (gen 1)</td><td>16 GB HBM2</td><td>900 GB/s</td></tr>
   <tr><td class="mono">Ampere</td><td>2020</td><td>A100</td><td>6912</td><td>432 (gen 3)</td><td>80 GB HBM2e</td><td>2.0 TB/s</td></tr>
   <tr><td class="mono">Hopper</td><td>2022</td><td>H100</td><td>16896</td><td>528 (gen 4)</td><td>80 GB HBM3</td><td>3.35 TB/s</td></tr>
   <tr><td class="mono">Blackwell</td><td>2024</td><td>B200</td><td>18432</td><td>688 (gen 5)</td><td>192 GB HBM3e</td><td>8.0 TB/s</td></tr>
 </table></div>

 <div class="note tip"><span class="tag">Tensor Cores are the real story</span><p>CUDA core counts are misleading for AI/ML workloads. Tensor Cores perform matrix multiply-accumulate (D = A×B + C) in a single clock cycle on FP16/BF16/FP8/FP4 data. An H100's 528 Tensor Cores can do ~4 PetaFLOPS of FP8 — far more than its ~67 TFLOPS of FP32 from CUDA cores alone. Always check Tensor Core FLOPS for AI workloads, not CUDA core FLOPS.</p></div>

 <h3>Key GPU Performance Metrics</h3>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Metric</th><th>What It Tells You</th><th>Target (H100)</th></tr>
   <tr><td class="mono">SM occupancy</td><td>Fraction of SM capacity in use — higher = better latency hiding</td><td>>70%</td></tr>
   <tr><td class="mono">Warp execution efficiency</td><td>Fraction of active threads per warp — divergence kills this</td><td>>90%</td></tr>
   <tr><td class="mono">Memory throughput</td><td>Actual GB/s achieved vs. peak — shows if memory-bound</td><td>>80% of peak</td></tr>
   <tr><td class="mono">Compute throughput</td><td>Actual TFLOPS vs. peak — shows if compute-bound</td><td>>70% of peak</td></tr>
   <tr><td class="mono">DRAM utilization</td><td>How much of HBM bandwidth is being used</td><td>>80%</td></tr>
 </table></div>

 <div class="formula-box">
   <span class="tag">Occupancy formula</span>
   <div class="flist">
     <div class="f">Occupancy = (blocks per SM × threads per block) / (max threads per SM)</div>
     <div class="f">Max threads per SM: 2048 (Hopper, Ampere)</div>
     <div class="f">Example: 32 blocks × 256 threads = 8192 / 2048 = 100% occupancy</div>
     <div class="f small">But more blocks ≠ always better — register pressure and shared memory limits can reduce occupancy.</div>
   </div>
 </div>
 `},

{id:'s-11-3', part:'p11', num:'11.3', title:'Essential HPC Vocabulary',
 dek:'The terms that come up in every HPC conversation — NUMA, affinity, threading, parallelism, and the rest.',
 tags:'numa affinity openmp pthread simd avx fma roofline amdahl gustafson strong weak scaling',
 body:`
 <p>These terms appear in every HPC discussion, benchmark report, and vendor datasheet. Understanding them is prerequisite to reading anything else in this reference.</p>

 <h3>Parallelism Models</h3>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Term</th><th>Meaning</th><th>When to Use</th></tr>
   <tr><td class="mono">MPI (distributed memory)</td><td>Separate processes, explicit message passing</td><td>Across nodes (inter-node)</td></tr>
   <tr><td class="mono">OpenMP (shared memory)</td><td>Threads sharing memory; compiler directives</td><td>Within a node (intra-node)</td></tr>
   <tr><td class="mono">pthreads</td><td>POSIX threads; explicit thread management</td><td>Fine-grained control, legacy code</td></tr>
   <tr><td class="mono">MPI + OpenMP (hybrid)</td><td>MPI across nodes, OpenMP within nodes</td><td>Best of both: communication + shared memory</td></tr>
   <tr><td class="mono">CUDA / ROCm</td><td>GPU programming models</td><td>Accelerator workloads</td></tr>
   <tr><td class="mono">SIMD</td><td>Single Instruction, Multiple Data — vector instructions</td><td>Within a CPU core (AVX, SVE)</td></tr>
 </table></div>

 <h3>Scaling Concepts</h3>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Term</th><th>Meaning</th><th>Formula</th></tr>
   <tr><td class="mono">Strong scaling</td><td>Fixed total problem size; add more processors → time decreases</td><td>Speedup = T₁ / Tₚ</td></tr>
   <tr><td class="mono">Weak scaling</td><td>Fixed problem size per processor; add more processors → problem grows</td><td>Efficiency = T₁ / Tₚ (where each rank has same work)</td></tr>
   <tr><td class="mono">Amdahl's Law</td><td>Max speedup limited by serial fraction</td><td>S = 1 / (f + (1-f)/P)</td></tr>
   <tr><td class="mono">Gustafson's Law</td><td>Serial fraction shrinks as problem grows</td><td>S = P - f×(P-1)</td></tr>
   <tr><td class="mono">Roofline model</td><td>Performance ceiling from compute or memory bound</td><td>Min(peak_FLOPS, peak_BW × intensity)</td></tr>
 </table></div>

 <div class="note warn"><span class="tag">Strong vs. weak scaling — which matters?</span><p>Strong scaling answers "how fast can I solve this specific problem?" — the answer always degrades as P grows because communication overhead increases while per-rank work decreases. Weak scaling answers "how big a problem can I solve in the same time?" — more relevant for capacity computing (larger simulations, finer resolution). Always specify which scaling you mean.</p></div>

 <h3>Memory &amp; Threading Terms</h3>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Term</th><th>Meaning</th></tr>
   <tr><td class="mono">NUMA (Non-Uniform Memory Access)</td><td>Each CPU socket has its own local memory; remote memory (other socket) is slower. Correct placement matters.</td></tr>
   <tr><td class="mono">NUMA affinity</td><td>Binding a process/thread to the CPU socket that owns its memory — avoids remote access penalty</td></tr>
   <tr><td class="mono">CPU affinity</td><td>Binding a process/thread to specific CPU cores — avoids OS migration</td></tr>
   <tr><td class="mono">Memory affinity</td><td>Ensuring memory is allocated on the local NUMA node — use numactl, likwid</td></tr>
   <tr><td class="mono">Topology-aware placement</td><td>Placing MPI ranks considering socket, NUMA, and cache hierarchy</td></tr>
   <tr><td class="mono">Pin (thread pinning)</td><td>Synonym for CPU affinity — prevents OS from moving the thread</td></tr>
   <tr><td class="mono">Hyper-threading (SMT)</td><td>Two logical threads per physical core — helps throughput, can hurt latency-sensitive HPC</td></tr>
   <tr><td class="mono">FMA (Fused Multiply-Add)</td><td>a = b × c + d in one instruction — 2 FLOPs per cycle</td></tr>
   <tr><td class="mono">AVX / AVX-512 / SVE</td><td>Vector instruction sets — 256-bit, 512-bit, scalable vector extensions</td></tr>
   <tr><td class="mono">SIMD lanes</td><td>Number of elements processed per vector instruction (e.g., 8× FP64 in AVX-512)</td></tr>
 </table></div>

 <h3>Performance Analysis Terms</h3>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Term</th><th>Meaning</th></tr>
   <tr><td class="mono">Arithmetic intensity</td><td>FLOPs per byte of memory traffic — determines compute vs. memory bound</td></tr>
   <tr><td class="mono">Roofline ceiling</td><td>Maximum achievable performance given the machine's peak FLOPS and memory BW</td></tr>
   <tr><td class="mono">Operational intensity</td><td>Synonym for arithmetic intensity</td></tr>
   <tr><td class="mono">Memory bandwidth wall</td><td>When adding more cores doesn't help because memory bandwidth is saturated</td></tr>
   <tr><td class="mono">Communication overhead</td><td>Time spent on MPI calls, synchronization, collective operations</td></tr>
   <tr><td class="mono">Load imbalance</td><td>Some ranks have more work than others — idle ranks wait at barriers</td></tr>
   <tr><td class="mono">Sync overhead</td><td>Time lost to MPI_Barrier, MPI_Wait, and other synchronization points</td></tr>
   <tr><td class="mono">FLOP/s efficiency</td><td>Achieved FLOPS / theoretical peak FLOPS — measures how well you use the hardware</td></tr>
   <tr><td class="mono">Bandwidth efficiency</td><td>Achieved BW / theoretical peak BW — measures memory system utilization</td></tr>
 </table></div>

 <h3>Cluster &amp; Infrastructure Terms</h3>

 <div class="tbl-wrap"><table class="dt">
   <tr><th>Term</th><th>Meaning</th></tr>
   <tr><td class="mono">Job scheduler</td><td>Software that allocates nodes to jobs (Slurm, PBS, LSF, Grid Engine)</td></tr>
   <tr><td class="mono">Slurm</td><td>Most common HPC scheduler; srun, sbatch, sinfo, squeue</td></tr>
   <tr><td class="mono">Allocation</td><td>Reserved compute resources (nodes, GPUs, time) for a job</td></tr>
   <tr><td class="mono">Burst buffer</td><td>Fast local SSD tier between compute and parallel filesystem — absorbs checkpoint storms</td></tr>
   <tr><td class="mono">Job step</td><td>A sub-allocation within a job (e.g., MPI run on allocated nodes)</td></tr>
   <tr><td class="mono">Module system</td><td>Environment module (Lmod, Environment Modules) for loading software paths</td></tr>
   <tr><td class="mono">OSU benchmarks</td><td>Ohio State University MPI/network microbenchmarks — latency, bandwidth, collectives</td></tr>
   <tr><td class="mono">LIKWID</td><td>Performance monitoring tool for CPU cache, memory, FLOPS</td></tr>
   <tr><td class="mono">nvprof / Nsight</td><td>NVIDIA GPU profiling tools — kernels, memory, occupancy</td></tr>
   <tr><td class="mono">Score-P / TAU</td><td>Profiling frameworks for MPI + OpenMP + CUDA applications</td></tr>
 </table></div>

 <div class="formula-box">
   <span class="tag">The three questions every HPC engineer asks</span>
   <div class="flist">
     <div class="f">1. Is the code compute-bound or memory-bound? (Roofline model, §1.5)</div>
     <div class="f">2. Is the code communication-bound? (MPI profiling, collectives, §5.6)</div>
     <div class="f">3. Is the code I/O-bound? (IOR/mdtest, §10.6)</div>
     <div class="f small">Answer these three before optimizing anything. The answer tells you where to look.</div>
   </div>
 </div>
 `},
);
</script>

{id:'s-12-1', part:'p12', num:'12.1', title:'Practical Bottleneck Diagnosis',
 dek:'What a symptom actually tells you — and what to go measure next, before you guess.',
 tags:'bottleneck diagnosis symptom troubleshoot performance debugging',
 calc:'bottleneck',
 body:`
 <p>This section exists because performance problems almost never announce their own cause. "The job is slow" or "GPU utilization looks high but throughput is low" are symptoms, not diagnoses — and guessing wrong wastes far more engineering time than a systematic first pass through the likely suspects.</p>
 <div class="calc-mount" data-calc="bottleneck"></div>
 <h4>The full reference table</h4>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Observed symptom</th><th>Likely bottleneck</th><th>What to measure</th></tr>
   <tr><td>Low CPU utilization + high memory traffic</td><td>Memory bandwidth</td><td>STREAM, cache misses, memory BW counters</td></tr>
   <tr><td>High CPU utilization but low FLOP/s</td><td>Instruction/memory/branch bound</td><td>IPC, stalls, vectorization</td></tr>
   <tr><td>GPU utilization low</td><td>Launch overhead, CPU feeding, synchronization, I/O</td><td>Kernel timeline, GPU utilization, PCIe/NVLink</td></tr>
   <tr><td>GPU busy but performance low</td><td>Memory-bound or inefficient kernel</td><td>Roofline, DRAM BW, occupancy, instruction metrics</td></tr>
   <tr><td>MPI time dominates</td><td>Network/communication</td><td>MPI profiling, latency, bandwidth, collectives</td></tr>
   <tr><td>Scaling collapses after N nodes</td><td>Network/serial work/load imbalance</td><td>Strong scaling curve, communication breakdown</td></tr>
   <tr><td>Temperature rises and clocks fall</td><td>Thermal/power limit</td><td>Power, temperature, frequency, throttling counters</td></tr>
   <tr><td>Cooling plant power very high</td><td>Low COP / airflow / ΔT / plant inefficiency</td><td>PUE, COP, supply/return temperatures</td></tr>
   <tr><td>High facility power despite low IT load</td><td>Cooling/UPS/distribution overhead</td><td>PUE and subsystem power breakdown</td></tr>
 </table></div>
 <div class="note tip"><span class="tag">The pattern across every row</span><p>Every symptom in this table maps to a specific measurement, not a guess. "GPU utilization is high" is a monitoring-tool artifact as often as it's a real signal (§3.2) — the fix is always to measure the more specific counter (occupancy, achieved bandwidth, roofline position) that actually distinguishes between the candidate causes, rather than acting on the ambiguous top-level symptom alone.</p></div>
 `},

{id:'s-12-2', part:'p12', num:'12.2', title:'Important Caveats',
 dek:'Every "peak" and "nominal" number in this reference comes with an asterisk — here they all are in one place.',
 tags:'caveats disclaimer peak nominal theoretical assumptions limitations',
 body:`
 <p>Every formula in this reference computes a <em>theoretical or nominal</em> number. Real systems fall short of these numbers for specific, understandable reasons — and knowing why is at least as important as knowing the formula itself.</p>
 <ul>
   <li><strong>Advertised peak FLOPS, network line rate, memory bandwidth and cooling capacity are theoretical/nominal values; real application performance is usually lower.</strong> Nothing in this reference should be read as a promise of delivered performance — every "peak" number is a ceiling, not a typical result.</li>
   <li><strong>FLOP counts depend on precision, instruction type, FMA usage, vector width, clock frequency, and whether specialized matrix/tensor units are included.</strong> The same chip can report wildly different "TFLOPS" figures depending on which of these are assumed — see Part IV in full for why.</li>
   <li><strong>Network throughput depends on encoding, protocol headers, MTU, transport, congestion, topology, NIC injection rate, and application message size.</strong> A NIC's line-rate spec is the starting point for capacity planning, never the achieved number.</li>
   <li><strong>CPU architecture names are not enough to determine performance:</strong> core count, clock, memory channels, NUMA topology, cache, vector ISA, power limits, and software all matter. "It's a Xeon" or "it's an EPYC" tells you almost nothing about actual delivered performance without the specific SKU and configuration.</li>
   <li><strong>GPU architecture names cover many different SKUs.</strong> A100, H100, and B200-class devices are not interchangeable merely because they belong to successive architectures — memory capacity, power limits, and even which precision modes are enabled can vary substantially within a single architecture generation.</li>
   <li><strong>Cooling design must account for redundancy, pump/fan power, water temperature, humidity/condensation constraints, heat exchanger approach temperatures, and facility operating conditions</strong> — not just the headline Q̇ = ṁcpΔT calculation from Part VII.</li>
 </ul>
 <div class="note warn"><span class="tag">The one habit this whole reference is trying to build</span><p>Whenever you see a single headline number — TFLOPS, Gb/s, PUE, COP, whatever — ask what precision, configuration, measurement conditions, and assumptions produced it, before comparing it to another number that might have been produced under entirely different conditions. §4.11's precision-comparison rule is the sharpest specific instance of this general habit, but it applies everywhere in this document.</p></div>
 `}
);
</script>
<script>
/* =====================================================================
   CONTENT — PART XIII: QUICK REFERENCE (GLOSSARY)
   ===================================================================== */

const GLOSSARY = [
["FLOP","One floating-point arithmetic operation; used to express compute throughput."],
["FLOP/s","Floating-point operations per second; a compute-performance rate."],
["FMA","Fused multiply-add; computes a×b+c with one final rounding step and counts as two FLOPs."],
["FLOPS","Common shorthand for FLOP/s, although FLOP/s is the more precise notation."],
["Arithmetic intensity","FLOPs performed per byte moved from a specified memory level."],
["Roofline model","Performance model comparing compute peak with memory-bandwidth limits using arithmetic intensity."],
["Rpeak","Theoretical peak floating-point performance of a system."],
["Rmax","Measured HPL/LINPACK performance achieved by the system."],
["NUMA","Non-Uniform Memory Access; memory latency/bandwidth depends on which CPU/socket owns the memory."],
["SMP","Symmetric Multiprocessing; multiple processors/cores share a common memory system."],
["SIMD","Single Instruction, Multiple Data; one instruction operates on multiple data elements."],
["ISA","Instruction Set Architecture; the programmer-visible CPU instruction interface."],
["AVX-512","Intel x86 512-bit vector ISA extension used for wide SIMD operations."],
["SVE","ARM Scalable Vector Extension with implementation-dependent vector length."],
["SM","NVIDIA Streaming Multiprocessor; the primary programmable GPU execution unit."],
["Warp","NVIDIA group of 32 CUDA threads scheduled together."],
["GPC","Graphics Processing Cluster; a higher-level grouping of NVIDIA GPU resources."],
["Tensor Core","Specialized accelerator unit for matrix/tensor operations, especially low precision."],
["HBM","High Bandwidth Memory; stacked memory technology providing very high bandwidth near accelerators."],
["GDDR","Graphics Double Data Rate memory commonly used as high-bandwidth GPU memory."],
["NVLink","NVIDIA high-bandwidth interconnect technology for GPU-GPU and system communication."],
["PCIe","Peripheral Component Interconnect Express; standard high-speed host/device I/O interconnect."],
["CXL","Compute Express Link; cache/memory/device interconnect built on PCIe physical infrastructure."],
["GPUDirect RDMA","Allows supported NICs to transfer data directly between network and GPU memory, reducing CPU copies."],
["RDMA","Remote Direct Memory Access; direct memory transfer between systems with low CPU involvement."],
["RoCE","RDMA over Converged Ethernet; RDMA transport carried over Ethernet."],
["InfiniBand","Low-latency, high-bandwidth HPC interconnect with hardware-oriented transport and congestion mechanisms."],
["Ethernet","General-purpose LAN/datacenter networking technology; modern versions reach hundreds of Gb/s per link."],
["ECN","Explicit Congestion Notification; marks congestion without requiring packet drops."],
["PFC","Priority Flow Control; Ethernet mechanism that can pause selected traffic classes to reduce loss."],
["ECMP","Equal-Cost Multi-Path; distributes flows across multiple equal-cost routes."],
["Fat-tree","Hierarchical network designed with increasing aggregate bandwidth toward the core; can provide high bisection bandwidth."],
["Clos","Multi-stage switching fabric using multiple paths between endpoint groups; basis of many leaf-spine networks."],
["Leaf-spine","Two-level Clos-style datacenter topology where every leaf connects to every spine."],
["Dragonfly","HPC topology grouping routers locally while using global links between groups to keep diameter low."],
["Torus","Network where each dimension wraps around, giving every router neighbors in both directions."],
["Mesh","Regular grid network without wrap-around links; simpler but path lengths grow with system dimensions."],
["Hypercube","Topology connecting nodes according to binary-address differences; diameter grows logarithmically with node count."],
["Bisection bandwidth","Total link bandwidth crossing the minimum balanced cut dividing the network into two equal endpoint sets."],
["Network diameter","Maximum shortest-path hop count between any two endpoints."],
["Oversubscription","Ratio of aggregate downstream/endpoint bandwidth to available upstream bandwidth; 1:1 is non-oversubscribed."],
["Blocking","Network condition where competing traffic cannot simultaneously receive full endpoint bandwidth."],
["Radix","Number of physical ports available on a switch/router."],
["Hop","One traversal from one network switch/router to the next."],
["Latency","Time required to initiate and/or complete a communication operation."],
["Bandwidth","Data transfer rate, normally expressed in bit/s or byte/s."],
["Bandwidth-delay product","Bandwidth × latency; approximate amount of data needed in flight to fill a link."],
["α–β model","Communication model T≈α+nβ, separating startup latency from per-byte transfer cost."],
["MPI","Message Passing Interface; standard programming API for distributed-memory HPC communication."],
["AllReduce","MPI collective that combines values across ranks and returns the result to all ranks."],
["All-to-all","Collective communication in which every rank exchanges data with every other rank."],
["HPL","High Performance Linpack; dense LU benchmark used for TOP500-style performance measurements."],
["HPCG","High Performance Conjugate Gradients; sparse benchmark designed to stress memory and communication."],
["STREAM","Memory-bandwidth benchmark using simple vector kernels such as Copy and Triad."],
["DGEMM","Double-precision general matrix-matrix multiplication; a compute-intensive BLAS kernel."],
["OSU Micro-Benchmarks","Suite commonly used to measure MPI point-to-point and collective communication performance."],
["IMB","Intel MPI Benchmarks; suite for measuring MPI communication and collective performance."],
["IOR","Parallel I/O benchmark commonly used to measure filesystem/storage throughput."],
["mdtest","Parallel metadata benchmark measuring operations such as file create/stat/delete."],
["TEPS","Traversed Edges Per Second; common Graph500 graph-performance metric."],
["IOPS","Input/output operations per second; useful for characterizing random I/O workloads."],
["PUE","Power Usage Effectiveness = total facility energy / IT equipment energy."],
["WUE","Water Usage Effectiveness; water consumption normalized to IT energy."],
["CUE","Carbon Usage Effectiveness; carbon emissions normalized to IT energy."],
["COP","Coefficient of Performance; useful cooling/heating output divided by input power."],
["CRAC","Computer Room Air Conditioner; cooling unit commonly used in datacenters."],
["CRAH","Computer Room Air Handler; air-handling unit using chilled water or another cooling source."],
["CDU","Coolant Distribution Unit; transfers/controls liquid cooling between facility and IT loops."],
["LMTD","Log Mean Temperature Difference; heat-exchanger temperature-driving-force metric."],
["BTU","British Thermal Unit; traditional heat-energy unit."],
["RT / ton of refrigeration","Cooling-capacity unit; 1 refrigeration ton ≈ 3.517 kW of cooling."],
["TDP","Thermal Design Power; design/thermal reference power, not necessarily the instantaneous maximum."],
["TGP","Total Graphics Power; GPU board/system power metric used by some vendors."],
["FP64","64-bit IEEE binary floating-point format, commonly used for scientific HPC."],
["FP32","32-bit IEEE binary floating-point format, widely used for general numerical computation."],
["FP16","16-bit IEEE binary16 floating-point format with 5 exponent and 10 fraction bits."],
["BF16","16-bit AI format with FP32-like exponent range and reduced significand precision."],
["TF32","NVIDIA tensor arithmetic format designed to accelerate many FP32-class tensor operations."],
["FP8","8-bit floating-point family; E4M3 favors precision while E5M2 favors dynamic range."],
["FP6","Emerging 6-bit floating-point family used in some low-precision AI schemes."],
["FP4","4-bit floating-point family for ultra-low-precision AI; normally requires companion scaling."],
["Quantization","Mapping real values to a lower-bit representation, typically with scaling and/or zero points."],
["Scale (quantization)","Multiplier used to map a quantized integer or low-bit value back to an approximate real value."],
["Zero point","Integer offset used in asymmetric affine quantization."],
["Mixed precision","Using multiple numerical precisions in one algorithm to improve speed/memory while maintaining accuracy."],
["Amdahl's Law","Strong-scaling limit determined by the fraction of a workload that cannot be parallelized."],
["Gustafson's Law","Scaling model emphasizing that problem size can grow with processor count."],
["HPL efficiency","Rmax/Rpeak; fraction of theoretical peak achieved by HPL."],
["Strong scaling","Keeping problem size fixed while increasing resources and measuring runtime reduction."],
["Weak scaling","Increasing problem size with resources while attempting to keep runtime approximately constant."],
["Time-to-solution","Elapsed time required to obtain the required scientific result; often more meaningful than peak FLOP/s."],
["AMAT","Average Memory Access Time; hit time + miss rate × miss penalty."],
["Occupancy (GPU)","Active warps divided by the maximum number of warps a GPU's SM can hold resident."],
["Karp–Flatt metric","An experimentally-determined serial/overhead fraction computed from measured speedup at a given P."],
["Goodput","Application-payload data delivered per unit time, excluding protocol overhead."],
["Serialization time","Message size divided by link rate — the time to push a message onto the wire."],
["Line rate","A link's nominal signaling speed, typically quoted in bits/s, not bytes/s."],
["Non-blocking fabric","A network designed so full simultaneous endpoint traffic can be carried under its intended traffic model."],
["Effectiveness (heat exchanger)","Actual heat transfer divided by the theoretical maximum possible heat transfer."],
["Power factor","Real power divided by apparent power; captures the effect of phase difference between voltage and current."],
["DCiE","Datacenter infrastructure Efficiency = 1/PUE, expressed as a percentage."],
["Energy-Delay Product (EDP)","Energy × Time; a metric that penalizes designs that save energy by running proportionally slower."],
["Subnormal number","A floating-point value below the smallest normal number, providing gradual underflow instead of a jump to zero."],
["Microscaling (MX)","Block/shared-scale-factor approach that gives ultra-low-bit formats (FP8/FP4) usable dynamic range."]
];

/* =====================================================================
   CONTENT — PART XIII: QUICK REFERENCE
   ===================================================================== */
SECTIONS.push(

{id:'s-13-1', part:'p13', num:'13.1', title:'Units &amp; Conversions',
 dek:'The conversions that come up constantly in HPC engineering — plus a live converter for the ones you\'ll need mid-calculation.',
 tags:'units conversions bits bytes watts flops pib gib decimal binary',
 calc:'unitconv',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Conversion</th><th>Relationship</th></tr>
   <tr><td>1 byte</td><td class="mono">8 bits</td></tr>
   <tr><td>1 Gb/s</td><td class="mono">0.125 GB/s (decimal)</td></tr>
   <tr><td>100 Gb/s</td><td class="mono">12.5 GB/s decimal, before overhead</td></tr>
   <tr><td>400 Gb/s</td><td class="mono">50 GB/s decimal, before overhead</td></tr>
   <tr><td>800 Gb/s</td><td class="mono">100 GB/s decimal, before overhead</td></tr>
   <tr><td>1 kW</td><td class="mono">1,000 W</td></tr>
   <tr><td>1 MW</td><td class="mono">1,000 kW</td></tr>
   <tr><td>1 kWh</td><td class="mono">3.6 MJ</td></tr>
   <tr><td>1 TR (ton of refrigeration)</td><td class="mono">≈ 3.517 kW cooling</td></tr>
   <tr><td>1 PFLOP/s</td><td class="mono">10¹⁵ FLOP/s</td></tr>
   <tr><td>1 PB</td><td class="mono">10¹⁵ bytes (decimal)</td></tr>
   <tr><td>1 PiB</td><td class="mono">2⁵⁰ bytes (binary)</td></tr>
   <tr><td>1 GB</td><td class="mono">10⁹ bytes (decimal)</td></tr>
   <tr><td>1 GiB</td><td class="mono">2³⁰ bytes (binary)</td></tr>
 </table></div>
 <div class="calc-mount" data-calc="unitconv"></div>
 <div class="note warn"><span class="tag">Decimal vs. binary prefixes — the second most common unit mistake in HPC</span><p>1 GB (decimal, 10⁹ bytes, used by storage vendors and network specs) and 1 GiB (binary, 2³⁰ bytes, used by operating systems reporting memory) differ by about 7.4% — enough to matter when reconciling a "10 TB" drive spec against what the OS reports, or when precisely sizing an HPL problem's memory footprint (§10.2). Always check which convention a number is using before treating two "GB" figures from different sources as directly comparable.</p></div>
 `},

{id:'s-13-2', part:'p13', num:'13.2', title:'Quick Formula Sheet — Memorize These',
 dek:'If you only remember one section of this entire reference, make it this one.',
 tags:'quick formula sheet memorize cheat sheet all formulas summary',
 body:`
 <p>Every formula below has a full explanation, worked example, and (where applicable) an interactive calculator elsewhere in this reference — cross-references are included. This page exists purely as the fast-recall version.</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Area</th><th>Formula</th><th>§</th></tr>
   <tr><td>Compute</td><td class="mono">Performance = Work / Time</td><td>1.1</td></tr>
   <tr><td>Peak FLOPS</td><td class="mono">Cores × Clock × FLOPs/cycle</td><td>2.3</td></tr>
   <tr><td>Speedup</td><td class="mono">S = T₁/T_P</td><td>1.2</td></tr>
   <tr><td>Efficiency</td><td class="mono">E = S/P</td><td>1.2</td></tr>
   <tr><td>Amdahl</td><td class="mono">S = 1/[(1−f)+f/P]</td><td>1.3</td></tr>
   <tr><td>Roofline</td><td class="mono">P ≤ min(Ppeak, BW×AI)</td><td>1.5</td></tr>
   <tr><td>Arithmetic intensity</td><td class="mono">AI = FLOPs/Bytes</td><td>1.2</td></tr>
   <tr><td>Memory bandwidth</td><td class="mono">BW = Bytes/s</td><td>2.4</td></tr>
   <tr><td>Network serialization</td><td class="mono">T = message size / bandwidth</td><td>5.1</td></tr>
   <tr><td>α–β communication</td><td class="mono">T ≈ α + nβ</td><td>5.6</td></tr>
   <tr><td>Heat</td><td class="mono">Q = mcΔT</td><td>7.1</td></tr>
   <tr><td>Heat rate</td><td class="mono">Q̇ = ṁcpΔT</td><td>7.2, 7.3</td></tr>
   <tr><td>Conduction</td><td class="mono">Q̇ = kAΔT/L</td><td>7.1</td></tr>
   <tr><td>Convection</td><td class="mono">Q̇ = hAΔT</td><td>7.1</td></tr>
   <tr><td>Thermal resistance</td><td class="mono">R_th = ΔT/Q̇</td><td>7.1</td></tr>
   <tr><td>Heat exchanger</td><td class="mono">Q̇ = UAΔT_lm</td><td>7.4</td></tr>
   <tr><td>Cooling COP</td><td class="mono">COP = Q̇_cooling/W_input</td><td>7.5</td></tr>
   <tr><td>Electrical power</td><td class="mono">P = VI</td><td>8.1</td></tr>
   <tr><td>3-phase power</td><td class="mono">P = √3·V_L·I_L·PF</td><td>8.1</td></tr>
   <tr><td>Energy</td><td class="mono">E = Pt</td><td>8.2</td></tr>
   <tr><td>PUE</td><td class="mono">PUE = Facility Energy / IT Energy</td><td>8.3</td></tr>
   <tr><td>Performance/W</td><td class="mono">Performance / Power</td><td>8.4</td></tr>
   <tr><td>EDP</td><td class="mono">Energy × Time</td><td>8.4</td></tr>
 </table></div>
 `},

/* Glossary mount logic (used by §12.3) */
function mountGlossaryIfPresent(){
  const grid = document.getElementById('glossGrid');
  if(!grid) return;
  function render(filter){
    const f = (filter||'').toLowerCase();
    const items = GLOSSARY.filter(([t,d]) => !f || t.toLowerCase().includes(f) || d.toLowerCase().includes(f));
    document.getElementById('glossCount').textContent = items.length + ' of ' + GLOSSARY.length + ' terms';
    grid.innerHTML = items.map(([t,d])=>`<div class="gloss-item"><div class="gloss-term">${t}</div><div class="gloss-def">${d}</div></div>`).join('');
  }
  render('');
  document.getElementById('glossSearch').addEventListener('input', e=>render(e.target.value));
}
</script>
