<h3>FID — distance between real and fake distributions</h3><div class="formula-box"><span class="tag">Fréchet Inception Distance</span><div class="f">\\(\\mathrm{FID}=\\|\\mu_r-\\mu_g\\|^2+\\mathrm{Tr}\\big(\\Sigma_r+\\Sigma_g-2(\\Sigma_r\\Sigma_g)^{1/2}\\big)\\)</div><small>Fit a Gaussian to Inception-v3 pool3 features of real (\\(r\\)) and generated (\\(g\\)) images; FID is their Fréchet (2-Wasserstein) distance. Lower is better; compares against reality, unlike IS. Standard protocol: 50k generated vs the full training split, same preprocessing — mismatched sample counts or resizers shift FID by points.</small></div>
<div class="example-box"><span class="tag">Worked example — reading FID numbers</span><p>CIFAR-10 class-conditional: FID ~3–5 is excellent, ~10 is decent, &gt;30 visibly broken. FFHQ 256px: StyleGAN-class models sit ~2–4. A "better" FID of 2.1 vs 2.4 on different sample counts is meaningless — regenerating the <em>same</em> model with 10k vs 50k samples moves FID more than that. Always compare at matched \\(N\\) and identical resize pipelines.</p><p class="res">FID 3 vs 8: real gap · FID 2.1 vs 2.4 across protocols: noise — match N and preprocessing first</p></div>
<h3>LPIPS — perceptual distance for pairs</h3><div class="formula-box"><span class="tag">LPIPS</span><div class="f">\\(\\mathrm{LPIPS}(x,y)=\\sum_l w_l\\,\\|\\phi_l(x)-\\phi_l(y)\\|_2^2\\)</div><small>Weighted squared distance between deep features \\(\\phi_l\\) (VGG/AlexNet/SqueezeNet) across layers. Lower = more similar <em>to humans</em> — correlates with judgment far better than PSNR/SSIM on blur, compression, and super-resolution artifacts. Use for pairwise tasks (restoration, translation); use FID for distribution quality.</small></div>
<div class="note warn"><span class="tag">Feature-space dependence</span><p>IS, FID, and LPIPS all see through one backbone's eyes (usually ImageNet-trained Inception). On satellite imagery, medical scans, or SAR (§8.x), those features are off-distribution — prefer domain-tuned backbones or task metrics (downstream detection/segmentation mAP) over a raw ImageNet-FID number that flatters textures and ignores semantics.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p10-2',part:'p10',num:'9.3',title:'Evaluation Protocol — Splits, Leakage, Significance',dek:'Stratified k-fold, leakage discipline, seeds and tests — making numbers mean something',tags:'evaluation protocol cross-validation stratification leakage significance seeds train test split',body:`<p>Sections §10.4–§10.5 (Part X) preach protocol; this section teaches it. Most "model improvements" that vanish on re-evaluation die here — in the split, not the architecture.</p>
<h3>Splits that survive contact with reality</h3><dl class="varkey"><dt>Train / validation / locked test</dt><dd>Fit on train, decide everything (early stopping §3.10, thresholds §4.2, NMS §4.4, hyperparameters) on validation, report test once. A test set consulted twice is a validation set (§3.12).</dd><dt>Stratified k-fold (k = 5–10)</dt><dd>Partition into \\(k\\) folds preserving class ratios; train on \\(k-1\\), test on the held-out fold, rotate, average. Mandatory below ~10k samples or with rare classes — a single random split can put all 10 positives in train.</dd><dt>Group-aware splits</dt><dd>Split by patient, device, satellite tile, or time period — never by row when rows share a source. Row-wise splitting on grouped data is leakage with a respectable name.</dd><dt>Time-series discipline</dt><dd>Train on the past, test on the future (rolling/expanding windows). Shuffled k-fold on temporal data lets the model peek at tomorrow.</dd></dl>
<h3>Leakage — the usual suspects</h3><div class="tbl-wrap"><table class="dt">
<tr><th>Leak</th><th>Symptom</th><th>Fix</th></tr>
<tr><td>Target-derived features</td><td>Near-perfect validation, absurd feature importance on one column</td><td>Rebuild features using only information available at prediction time</td></tr>
<tr><td>Pre-split imputation/scaling/PCA</td><td>Small but consistent optimism (1–3 points)</td><td>Fit every preprocessing step inside each fold (§3.6 PCA included)</td></tr>
<tr><td>Duplicate rows across splits</td><td>Near-perfect on "held-out" data</td><td>Deduplicate before splitting; split by group id</td></tr>
<tr><td>Test-set tuning</td><td>Improvements that never replicate</td><td>Lock the test set; tune on validation only</td></tr>
</table></div>
<div class="example-box"><span class="tag">Worked example — the null-model test</span><p>Suspicious 0.99 AUC on a hard task? Shuffle the labels and retrain end to end. A healthy pipeline collapses to chance (≈0.50 AUC, majority-class accuracy). If shuffled labels still score 0.85, the features contain the answer — stop tuning models and audit the pipeline (§10.5 leakage caveat).</p><p class="res">Shuffled-label score ≈ chance: pipeline clean · still high: leakage — no metric rescues a leaked split</p></div>
<h3>Seeds and significance — is +0.8 real?</h3><div class="formula-box"><span class="tag">Reporting rule of thumb</span><div class="f">\\(\\text{report: mean} \\pm \\text{std over } \\geq 3 \\text{ seeds; claim wins only past } \\approx 2\\sigma\\)</div><small>Single-run gaps under ~1 point (BLEU, mAP, AUC) are usually seed noise. For paired comparisons on the same folds, a paired t-test or bootstrap CI beats eyeballing means; for small test sets, any ranking without CIs is storytelling.</small></div>
<div class="note tip"><span class="tag">Minimum viable protocol (checklist)</span><p>Stratified (or grouped) splits · preprocessing inside folds · one locked test set · 3+ seeds with spread · thresholds/NMS/settings reported beside every number (§10.4) · slice metrics for rare classes and small objects. Miss any one and the finest metric in this reference measures your methodology, not your model.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p6-0',part:'p6',num:'10.1',title:'Other common metrics',dek:'MAPE, R-squared, explained variance, and more',tags:'mape r2 explained variance regression metrics',body:`<p>Beyond the core metrics, several other measures are commonly used.</p>
<h3>MAPE — Mean Absolute Percentage Error</h3><div class="formula-box"><span class="tag">MAPE</span><div class="f">\\(\\mathrm{MAPE}=\\frac{100}{N}\\sum_{i=1}^{N}\\left|\\frac{y_i-\\hat{y}_i}{y_i}\\right|\\)</div><small>Average percentage error. Easy to interpret.</small></div>
<div class="note warn"><span class="tag">Warning</span><p>MAPE behaves badly when true values are near zero (division by near-zero). It also penalizes over-predictions asymmetrically.</p></div>
<h3>R-squared — Coefficient of Determination</h3><div class="formula-box"><span class="tag">R-squared</span><div class="f">\\(R^2=1-\\frac{\\sum_i(y_i-\\hat{y}_i)^2}{\\sum_i(y_i-\\bar{y})^2}\\)</div><small>How much better the model is than predicting the mean every time.</small></div>
<dl class="varkey"><dt>R2 = 1.0</dt><dd>Perfect fit</dd><dt>R2 = 0</dt><dd>No better than mean</dd><dt>R2 < 0</dt><dd>Worse than mean</dd></dl>
<div class="example-box"><span class="tag">Worked Example</span><p>True: [3, -0.5, 2, 7], Mean = 2.875. Predicted: [2.5, 0.0, 2.1, 7.8].</p><p>SSE = 1.15, SST = 29.875</p><p class="res">R2 = 1 - 1.15/29.875 = 0.962</p></div>
<h3>Explained Variance</h3><div class="formula-box"><span class="tag">Explained Variance</span><div class="f">\\(\\mathrm{EV}=1-\\frac{\\mathrm{Var}(y-\\hat{y})}{\\mathrm{Var}(y)}\\)</div><small>Measures variance captured by the model. Does not account for systematic bias.</small></div>
<div class="note tip"><span class="tag">R2 vs Explained Variance</span><p>R2 penalizes systematic bias. Explained Variance only measures spread capture. Use R2 for regression.</p></div>`,calc:'regressionCalc',diagrams:[]});
SECTIONS.push({id:'p6-1',part:'p6',num:'10.2',title:'Quick metric-by-task guide',dek:'Which metric for which task',tags:'metric selection guide task',body:`<p>Choose the metric based on the task, not on habit.</p>
<div class="tbl-wrap"><table class="dt">
<thead><tr><th>Task</th><th>Recommended Metrics</th><th>Why</th></tr></thead>
<tbody>
<tr><td>Binary classification</td><td>Accuracy, Precision, Recall, F1, ROC-AUC, PR-AUC</td><td>Standard for balanced or mildly imbalanced problems</td></tr>
<tr><td>Imbalanced classification</td><td>Precision, Recall, F1, PR-AUC, MCC</td><td>Accuracy is misleading; these focus on minority class</td></tr>
<tr><td>Multi-class</td><td>Accuracy, Macro-F1, Weighted-F1, Cross Entropy</td><td>Macro averages treat all classes equally</td></tr>
<tr><td>Object detection</td><td>IoU, AP, mAP@0.5, mAP@[0.5:0.95]</td><td>IoU measures localization; AP/mAP combine detection + classification</td></tr>
<tr><td>Segmentation</td><td>IoU / mIoU, Dice, Pixel Accuracy</td><td>Pixel-level overlap metrics</td></tr>
<tr><td>Regression</td><td>MAE, MSE, RMSE, R2, MAPE</td><td>MAE for robustness, MSE for sensitivity to large errors</td></tr>
<tr><td>Translation</td><td>BLEU, chrF, COMET</td><td>COMET better correlates with human judgment</td></tr>
<tr><td>Language modeling</td><td>Cross Entropy, Perplexity</td><td>Perplexity = e^(CE) — more interpretable</td></tr>
<tr><td>Generative models</td><td>FID, IS, CLIP Score</td><td>FID measures quality + diversity</td></tr>
<tr><td>Retrieval / RAG</td><td>Recall@K, Precision@K, MRR, NDCG</td><td>Ranking metrics for retrieval quality</td></tr>
</tbody></table></div>
<div class="note tip"><span class="tag">Decision rule</span><p>Classification -> precision, recall, F1, AUC. Imbalance -> PR-AUC, F1, MCC. Detection -> IoU, mAP. Segmentation -> Dice, IoU. Regression -> MAE, RMSE, R2.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p6-2',part:'p6',num:'10.3',title:'Beginner-friendly examples',dek:'Concrete worked examples for every major concept',tags:'examples beginners worked examples',body:`<p>These examples walk through calculations step by step.</p>
<h3>Example 1: Precision vs Recall tradeoff</h3><div class="example-box"><span class="tag">Spam Filter Scenario</span><p>Model flags 10 emails as spam. 8 are actually spam, 2 are not.</p><p class="res">Precision = 8/10 = 80%</p><p>If there were 20 spam emails total and the model found 8:</p><p class="res">Recall = 8/20 = 40%</p><p>The model is careful but misses many spam emails.</p></div>
<h3>Example 2: Why accuracy fails on imbalanced data</h3><div class="example-box"><span class="tag">Fraud Detection</span><p>9,900 legitimate, 100 fraudulent. Model predicts "legitimate" always.</p><p class="res">Accuracy = 9,900/10,000 = 99%</p><p>But recall on fraud = 0%. Use F1, MCC, or PR-AUC instead.</p></div>
<h3>Example 3: MAE vs MSE</h3><div class="example-box"><span class="tag">Prediction Errors: 1, 1, 10</span><p class="res">MAE = 4.0, MSE = 34.0, RMSE = 5.83</p><p>MSE punishes the large error much more strongly.</p></div>
<h3>Example 4: Dice to IoU</h3><div class="example-box"><span class="tag">Segmentation Metrics</span><p>If Dice = 0.8:</p><p class="res">IoU = 0.8 / 1.2 = 0.667</p></div>
<h3>Example 5: Perplexity</h3><div class="example-box"><span class="tag">Language Model</span><p>CE = 2.0:</p><p class="res">Perplexity = e^2 = 7.39</p></div>
<h3>Example 6: Focal Loss</h3><div class="example-box"><span class="tag">Focal Loss with g=2</span><p>Easy (p_t=0.9): weight = 0.01. Hard (p_t=0.1): weight = 0.81.</p><p class="res">Easy examples down-weighted by 100x</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p6-3',part:'p6',num:'10.4',title:'What to use in practice',dek:'Practical decision rules for metric selection',tags:'practical guide metric selection',body:`<p>Metric choice is a decision about <strong>which mistakes you can afford</strong>. Work it out in this order — task first, error costs second, data balance third:</p>
<div class="tbl-wrap"><table class="dt">
<tr><th>Task</th><th>Default metric</th><th>If data is imbalanced</th><th>Never report alone</th></tr>
<tr><td>Balanced classification</td><td>Accuracy + F1</td><td>—</td><td>Accuracy without the confusion matrix</td></tr>
<tr><td>Imbalanced classification</td><td>PR-AUC + F1</td><td>MCC, balanced accuracy, per-class recall</td><td>ROC-AUC (§4.2: 0.99 AUC with 0.47 precision)</td></tr>
<tr><td>Detection</td><td>mAP@0.5 during development</td><td>COCO mAP@[0.5:0.95] for final numbers</td><td>mAP without NMS + score thresholds</td></tr>
<tr><td>Segmentation</td><td>mIoU or Dice — match your field (§5.1)</td><td>Per-class IoU + FWIoU</td><td>Any average without the per-class breakdown</td></tr>
<tr><td>Regression</td><td>RMSE (same units as the target)</td><td>MAE / Huber when outliers dominate</td><td>R² on a narrow target range (inflates trivially)</td></tr>
<tr><td>Translation / language modeling</td><td>BLEU + human spot-checks</td><td>chrF for morphologically rich languages</td><td>BLEU gains under ~1 point (noise-level)</td></tr>
</table></div>
<div class="example-box"><span class="tag">Worked example — pricing the errors</span><p>Fraud review: each missed fraud costs 500 dollars, each false alarm costs 5 dollars of analyst time — a 100:1 ratio. Threshold A (precision 0.47, recall 0.90) on 100 frauds with 100 false alarms costs 10×500 + 100×5 = 5,500. Stricter threshold B (precision 0.80, recall 0.60) costs 40×500 + 15×5 = 20,075 — <em>worse</em>, despite "better" precision. The cost ratio picks the threshold; the metric just reports it.</p><p class="res">Set the threshold from error prices, not from F1 habit — then report the metric at that threshold</p></div>
<div class="note tip"><span class="tag">Golden rule</span><p>Always ask: (1) What task? (2) What mistakes are expensive — and at what price ratio? (3) Balanced or imbalanced? (4) Ranking, overlap, or exact values? Then report a <strong>pair</strong> (precision + recall, mAP + NMS settings, RMSE + MAE) — one metric never tells the whole story (§10.5).</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p6-4',part:'p6',num:'10.5',title:'Important caveats',dek:'Common pitfalls and things that trip people up',tags:'caveats pitfalls warnings',body:`<p>These traps catch even experienced practitioners. Each one below has a concrete mechanism — and a concrete defense:</p>
<div class="note warn"><span class="tag">Loss != metric</span><p>Cross-entropy is hard to interpret (a 0.05 drop means nothing to a stakeholder) and accuracy is not differentiable (useless for gradient descent). Train with the smooth surrogate, evaluate with the interpretable metric — and expect them to disagree on <em>which</em> checkpoint is best. Always select the final model on the evaluation metric, never on the training loss.</p></div>
<div class="note warn"><span class="tag">Threshold sensitivity</span><p>Precision, recall, and F1 are properties of a (model, threshold) pair, not of a model. Moving the threshold from 0.5 to 0.3 can double recall while halving precision — so a bare "F1 = 0.82" is meaningless. Report the threshold, or better, the full curve (ROC/PR, §4.2) plus the operating point.</p></div>
<div class="note warn"><span class="tag">Accuracy on imbalanced data</span><p>A model that always predicts the majority class scores 99% on 99:1 data while learning nothing (§10.3, Example 2). The defense is structural: default to PR-AUC, F1, or MCC on any dataset more skewed than about 4:1, and always look at per-class recall before celebrating.</p></div>
<div class="note warn"><span class="tag">MAPE near zero</span><p>MAPE divides each error by its true value, so a single near-zero target (actual 0.01, predicted 0.02) contributes a 100% error and dominates the mean. Use MAE, RMSE, or symmetric MAPE (sMAPE) when targets can approach zero — common in demand forecasting and count regression.</p></div>
<div class="note warn"><span class="tag">Different benchmarks, different winners</span><p>mAP@0.5 and COCO mAP@[0.5:0.95] routinely rank models differently: a loose localizer wins the first and loses the second (§4.3). Same for BLEU variants (tokenizer, n-gram order) and R² (in-sample vs held-out). Never compare numbers across papers without matching the exact definition, split, and post-processing.</p></div>
<div class="note warn"><span class="tag">Single metric blindness</span><p>Goodhart's law applies: once a metric becomes the target, models overfit to it — higher BLEU with worse human judgments, higher mAP from NMS tuning with worse boxes. Report a dashboard (metric pair + qualitative inspection, §10.4) rather than optimizing one number into meaninglessness.</p></div>
<div class="note warn"><span class="tag">Leakage inflates everything at once</span><p>If every metric looks suspiciously good — 0.99 AUC <em>and</em> 0.95 F1 on a hard problem — suspect target leakage (a feature containing the answer), duplicate train/test rows, or time-travel splits before suspecting genius. Check with a null model: if shuffled labels still score well, the pipeline is broken, not brilliant.</p></div>
<div class="note warn"><span class="tag">Seed variance and aggregate paradoxes</span><p>Single-run metric differences under ~1 point (BLEU, mAP, AUC) are usually seed noise — average 3+ seeds and report spread. And a model can win on every subgroup yet lose overall (Simpson's paradox) when subgroup sizes differ: always check slice metrics for key subpopulations (rare classes, small objects, low-resource languages) before concluding.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p7-0',part:'p7',num:'11.1',title:'Formula cheat sheet',dek:'All key formulas on one page',tags:'formula cheat sheet reference',body:`<p>Fast recall for every formula with a full explanation elsewhere — section cross-references in brackets. New here: the ranking metric (ROC-AUC), the detection metric (AP/mAP), and the Dice–IoU bridge, since those are the three most-looked-up items missing from a bare list.</p>
<div class="formula-box"><span class="tag">Accuracy</span><div class="f">\\(\\mathrm{Accuracy}=\\frac{TP+TN}{\\text{Total}}\\)</div></div>
<div class="formula-box"><span class="tag">Precision</span><div class="f">\\(\\mathrm{Precision}=\\frac{TP}{TP+FP}\\)</div></div>
<div class="formula-box"><span class="tag">Recall</span><div class="f">\\(\\mathrm{Recall}=\\frac{TP}{TP+FN}\\)</div></div>
<div class="formula-box"><span class="tag">F1 Score</span><div class="f">\\(F_1=\\frac{2PR}{P+R}\\)</div></div>
<div class="formula-box"><span class="tag">MCC</span><div class="f">\\(\\mathrm{MCC}=\\frac{TP\\cdot TN-FP\\cdot FN}{\\sqrt{(TP+FP)(TP+FN)(TN+FP)(TN+FN)}}\\)</div></div>
<div class="formula-box"><span class="tag">IoU</span><div class="f">\\(\\mathrm{IoU}=\\frac{TP}{TP+FP+FN}\\)</div></div>
<div class="formula-box"><span class="tag">Dice</span><div class="f">\\(\\mathrm{Dice}=\\frac{2TP}{2TP+FP+FN}\\)</div></div>
<div class="formula-box"><span class="tag">MAE</span><div class="f">\\(\\mathrm{MAE}=\\frac{1}{N}\\sum_{i=1}^{N}\\left|y_i-\\hat{y}_i\\right|\\)</div></div>
<div class="formula-box"><span class="tag">MSE</span><div class="f">\\(\\mathrm{MSE}=\\frac{1}{N}\\sum_{i=1}^{N}(y_i-\\hat{y}_i)^2\\)</div></div>
<div class="formula-box"><span class="tag">R2</span><div class="f">\\(R^2=1-\\frac{\\mathrm{SSE}}{\\mathrm{SST}}\\)</div></div>
<div class="formula-box"><span class="tag">BCE</span><div class="f">\\(\\mathcal{L}_{\\mathrm{BCE}}=-\\frac{1}{N}\\sum_{i}\\left[y_i\\log p_i+(1-y_i)\\log(1-p_i)\\right]\\)</div></div>
<div class="formula-box"><span class="tag">Perplexity [§7.2]</span><div class="f">\(\mathrm{PPL}=\exp(\mathrm{CE})\)</div></div>
<div class="formula-box"><span class="tag">ROC-AUC — ranking quality [§4.2]</span><div class="f">\\(\\mathrm{ROC\\!AUC}=P(\\mathrm{score}(x^+)&gt;\\mathrm{score}(x^-))\\)</div><small>Probability a random positive outranks a random negative. Pair with PR-AUC under imbalance.</small></div>
<div class="formula-box"><span class="tag">Detection AP / mAP [§4.3]</span><div class="f">\\(\\mathrm{AP}=\\sum_n (R_n - R_{n-1})\\,P_{\\mathrm{interp}}(R_n),\\quad \\mathrm{mAP}=\\frac{1}{C}\\sum_c \\mathrm{AP}_c\\)</div><small>Area under the ranked-matching PR curve, averaged over classes (and over IoU thresholds for COCO).</small></div>
<div class="formula-box"><span class="tag">Dice–IoU bridge [§2.2, §5.1]</span><div class="f">\\(\\mathrm{Dice}=\\frac{2\\,\\mathrm{IoU}}{1+\\mathrm{IoU}},\\quad \\mathrm{IoU}=\\frac{\\mathrm{Dice}}{2-\\mathrm{Dice}}\\)</div><small>Convert freely — but train with the loss matching your reported metric.</small></div>
<div class="note tip"><span class="tag">How to use this sheet</span><p>Memorize the <em>shapes</em> (ratios for rates, areas for curves, means for aggregates), not the symbols. When a number surprises you, jump to its section: §4.2 for threshold-free curves, §4.3–§4.4 for detection scoring and NMS, §5.1 for segmentation averages, §10.4 for which metric to trust, §10.5 for how each one lies.</p></div>`,calc:'',diagrams:[]});
SECTIONS.push({id:'p7-1',part:'p7',num:'11.2',title:'Final rule',dek:'The decision framework for metric selection',tags:'final rule decision framework',body:`<p>Before choosing any metric, always ask — and this time, answer each question with a concrete commitment:</p>
<div class="note tip"><span class="tag">Decision framework</span>
<p><strong>1. What task am I solving?</strong> Classification, regression, detection, segmentation, or generation? This fixes the metric family (§10.4 table) — no family, no number.</p>
<p><strong>2. What mistakes are expensive?</strong> Name the price ratio, not just "FP vs FN". A 100:1 ratio (fraud) and a 1:2 ratio (spam triage) lead to opposite thresholds on the same model.</p>
<p><strong>3. Balanced or imbalanced?</strong> More skewed than ~4:1 means accuracy is decorative — switch the default to PR-AUC / F1 / MCC and per-class recall (§4.2, §10.3 Example 2).</p>
<p><strong>4. Ranking, overlap, or exact values?</strong> Ranking → AUC curves. Overlap → IoU/Dice/mAP with thresholds stated. Exact values → RMSE/MAE in target units.</p></div>
<div class="example-box"><span class="tag">Worked example — the framework end to end</span><p>Task: segment pedestrians in dashcam video. Mistakes: missing a pedestrian (FN) far outweighs a false blob (FP) — roughly 10:1. Data: pedestrians are ~5% of pixels — imbalanced. Type: overlap, boundary-critical. Decision: train Dice + CE, report per-class pedestrian IoU <em>plus</em> mIoU and FWIoU (§5.1), add a boundary check, and pick the threshold at the 10:1 cost ratio rather than max-F1.</p><p class="res">Four answers → loss, metrics, threshold, and report format, all before training starts</p></div>
<p>If you answer those four questions first, the metric choice stops being taste and starts being engineering. Print this reference (§-header button), keep the §11.1 sheet on your desk, and distrust any single number that arrives without its threshold, split, and post-processing settings (§10.5).</p>`,calc:'',diagrams:[]});</script>

DIAGRAMS={};
DIAGRAMS.confusionMatrix=function(){var s='<svg viewBox="0 0 500 340" xmlns="'+NS+'">';s+='<text class="sch-title" x="250" y="20" text-anchor="middle">CONFUSION MATRIX</text>';s+='<text class="sch-label strong" x="250" y="50" text-anchor="middle" font-size="12">Predicted</text>';s+='<text class="sch-label strong" x="110" y="120" text-anchor="middle" font-size="12" transform="rotate(-90,110,120)">Actual</text>';var cells=[{x:140,y:60,w:120,h:80,l:'TN',v:'True Negative',c:'var(--flow-soft)'},{x:270,y:60,w:120,h:80,l:'FP',v:'False Positive',c:'var(--thermal-soft)'},{x:140,y:150,w:120,h:80,l:'FN',v:'False Negative',c:'var(--thermal-soft)'},{x:270,y:150,w:120,h:80,l:'TP',v:'True Positive',c:'var(--flow-soft)'}];for(var i=0;i<cells.length;i++){var c=cells[i];s+='<rect x="'+c.x+'" y="'+c.y+'" width="'+c.w+'" height="'+c.h+'" fill="'+c.c+'" stroke="var(--navy)" stroke-width="1.5"/>';s+='<text class="sch-label strong" x="'+(c.x+c.w/2)+'" y="'+(c.y+c.h/2-6)+'" text-anchor="middle" font-size="16">'+c.l+'</text>';s+='<text class="sch-label" x="'+(c.x+c.w/2)+'" y="'+(c.y+c.h/2+12)+'" text-anchor="middle" font-size="9">'+c.v+'</text>';}s+='<text class="sch-label" x="190" y="260" text-anchor="middle" font-size="11">Negative</text>';s+='<text class="sch-label" x="320" y="260" text-anchor="middle" font-size="11">Positive</text>';s+='<text class="sch-label" x="250" y="290" text-anchor="middle" font-size="10" fill="var(--flow)">Accuracy = (TP+TN) / Total</text>';s+='<text class="sch-label" x="250" y="306" text-anchor="middle" font-size="10" fill="var(--thermal)">Precision = TP/(TP+FP)  Recall = TP/(TP+FN)</text>';s+='</svg>';return s;};
DIAGRAMS.rocCurve=function(){var s='<svg viewBox="0 0 500 360" xmlns="'+NS+'">';s+='<text class="sch-title" x="250" y="18" text-anchor="middle">ROC CURVE</text>';var pL=60,pB=50,pT=40,pR=30,W=500,H=360,xw=W-pL-pR,yh=H-pT-pB;s+='<line class="sch-axis" x1="'+pL+'" y1="'+pT+'" x2="'+pL+'" y2="'+(H-pB)+'"/>';s+='<line class="sch-axis" x1="'+pL+'" y1="'+(H-pB)+'" x2="'+(W-pR)+'" y2="'+(H-pB)+'"/>';s+='<text class="sch-label" x="'+(pL+xw/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11">FPR</text>';s+='<text class="sch-label" x="16" y="'+(pT+yh/2)+'" text-anchor="middle" font-size="11" transform="rotate(-90,16,'+(pT+yh/2)+')">TPR</text>';s+='<line class="sch-line dash" x1="'+pL+'" y1="'+(H-pB)+'" x2="'+(W-pR)+'" y2="'+pT+'" stroke-dasharray="6 4"/>';var pts=[[0,0],[.02,.4],[.05,.65],[.1,.8],[.2,.88],[.4,.94],[.6,.97],[1,1]];var d='';for(var i=0;i<pts.length;i++){d+=(i===0?'M':'L')+(pL+pts[i][0]*xw).toFixed(1)+','+((H-pB)-pts[i][1]*yh).toFixed(1);}s+='<path class="sch-line hot" stroke-width="2.5" d="'+d+'"/>';s+='<path d="'+d+' L'+(W-pR)+','+(H-pB)+' L'+pL+','+(H-pB)+' Z" fill="var(--thermal-soft)" opacity="0.4"/>';s+='<text class="sch-label strong" x="'+(pL+xw*0.35)+'" y="'+((H-pB)-yh*0.45)+'" font-size="13" fill="var(--thermal)">AUC</text>';s+='</svg>';return s;};
DIAGRAMS.prCurve=function(){var s='<svg viewBox="0 0 500 360" xmlns="'+NS+'">';s+='<text class="sch-title" x="250" y="18" text-anchor="middle">PRECISION-RECALL CURVE</text>';var pL=60,pB=50,pT=40,pR=30,W=500,H=360,xw=W-pL-pR,yh=H-pT-pB;s+='<line class="sch-axis" x1="'+pL+'" y1="'+pT+'" x2="'+pL+'" y2="'+(H-pB)+'"/>';s+='<line class="sch-axis" x1="'+pL+'" y1="'+(H-pB)+'" x2="'+(W-pR)+'" y2="'+(H-pB)+'"/>';s+='<text class="sch-label" x="'+(pL+xw/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11">Recall</text>';s+='<text class="sch-label" x="16" y="'+(pT+yh/2)+'" text-anchor="middle" font-size="11" transform="rotate(-90,16,'+(pT+yh/2)+')">Precision</text>';var pts=[[0,1],[.05,.98],[.15,.95],[.3,.9],[.5,.82],[.7,.7],[.85,.55],[.95,.35],[1,.1]];var d='';for(var i=0;i<pts.length;i++){d+=(i===0?'M':'L')+(pL+pts[i][0]*xw).toFixed(1)+','+((H-pB)-pts[i][1]*yh).toFixed(1);}s+='<path class="sch-line cold" stroke-width="2.5" d="'+d+'"/>';s+='<path d="'+d+' L'+(W-pR)+','+(H-pB)+' L'+pL+','+(H-pB)+' Z" fill="var(--flow-soft)" opacity="0.4"/>';s+='<text class="sch-label strong" x="'+(pL+xw*0.3)+'" y="'+((H-pB)-yh*0.5)+'" font-size="13" fill="var(--flow)">PR-AUC</text>';s+='</svg>';return s;};
DIAGRAMS.precisionRecallTradeoff=function(){var s='<svg viewBox="0 0 500 300" xmlns="'+NS+'">';s+='<text class="sch-title" x="250" y="18" text-anchor="middle">PRECISION-RECALL TRADEOFF</text>';var pL=60,pB=50,pT=40,pR=30,W=500,H=300,xw=W-pL-pR,yh=H-pT-pB;s+='<line class="sch-axis" x1="'+pL+'" y1="'+pT+'" x2="'+pL+'" y2="'+(H-pB)+'"/>';s+='<line class="sch-axis" x1="'+pL+'" y1="'+(H-pB)+'" x2="'+(W-pR)+'" y2="'+(H-pB)+'"/>';s+='<text class="sch-label" x="'+(pL+xw/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11">Threshold</text>';s+='<text class="sch-label" x="16" y="'+(pT+yh/2)+'" text-anchor="middle" font-size="11" transform="rotate(-90,16,'+(pT+yh/2)+')">Score</text>';var pts1=[[0,.95],[.2,.9],[.4,.8],[.6,.65],[.8,.45],[1,.3]];var d1='';for(var i=0;i<pts1.length;i++){d1+=(i===0?'M':'L')+(pL+pts1[i][0]*xw).toFixed(1)+','+((H-pB)-pts1[i][1]*yh).toFixed(1);}s+='<path class="sch-line cold" stroke-width="2.5" d="'+d1+'"/>';var pts2=[[0,.3],[.2,.5],[.4,.7],[.6,.85],[.8,.93],[1,.98]];var d2='';for(var i=0;i<pts2.length;i++){d2+=(i===0?'M':'L')+(pL+pts2[i][0]*xw).toFixed(1)+','+((H-pB)-pts2[i][1]*yh).toFixed(1);}s+='<path class="sch-line hot" stroke-width="2.5" d="'+d2+'"/>';s+='<text class="sch-label" x="'+(pL+xw*0.85)+'" y="'+((H-pB)-yh*0.9)+'" font-size="11" fill="var(--flow)">Precision</text>';s+='<text class="sch-label" x="'+(pL+xw*0.85)+'" y="'+((H-pB)-yh*0.35)+'" font-size="11" fill="var(--thermal)">Recall</text>';s+='</svg>';return s;};
DIAGRAMS.iouDice=function(){var s='<svg viewBox="0 0 500 300" xmlns="'+NS+'">';s+='<text class="sch-title" x="250" y="20" text-anchor="middle">IoU vs DICE COEFFICIENT</text>';s+='<rect x="80" y="50" width="160" height="120" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="2" rx="4"/>';s+='<text class="sch-label" x="160" y="115" text-anchor="middle" font-size="12" fill="var(--flow)">Ground Truth</text>';s+='<rect x="140" y="80" width="160" height="120" fill="var(--thermal-soft)" stroke="var(--thermal)" stroke-width="2" rx="4"/>';s+='<text class="sch-label" x="220" y="145" text-anchor="middle" font-size="12" fill="var(--thermal)">Prediction</text>';s+='<rect x="140" y="80" width="100" height="90" fill="var(--ink)" opacity="0.15"/>';s+='<text class="sch-label strong" x="190" y="130" text-anchor="middle" font-size="11">Intersection</text>';s+='<text class="sch-label" x="250" y="220" text-anchor="middle" font-size="11">IoU = Intersection / Union</text>';s+='<text class="sch-label" x="250" y="240" text-anchor="middle" font-size="11">Dice = 2 * Intersection / (GT + Pred)</text>';s+='<text class="sch-label" x="250" y="270" text-anchor="middle" font-size="10" fill="var(--flow)">Dice = 2IoU / (1 + IoU)</text>';s+='</svg>';return s;};
DIAGRAMS.objectDetection=function(){var s='<svg viewBox="0 0 500 350" xmlns="'+NS+'">';s+='<text class="sch-title" x="250" y="20" text-anchor="middle">OBJECT DETECTION mAP</text>';s+='<rect x="60" y="40" width="380" height="200" fill="none" stroke="var(--line-strong)" stroke-width="1"/>';s+='<rect x="100" y="70" width="120" height="100" fill="none" stroke="var(--flow)" stroke-width="2" stroke-dasharray="6 3"/>';s+='<text class="sch-label" x="160" y="65" text-anchor="middle" font-size="10" fill="var(--flow)">Ground Truth</text>';s+='<rect x="130" y="85" width="110" height="90" fill="var(--thermal-soft)" stroke="var(--thermal)" stroke-width="2"/>';s+='<text class="sch-label" x="185" y="80" text-anchor="middle" font-size="10" fill="var(--thermal)">Prediction</text>';s+='<text class="sch-label strong" x="155" y="135" text-anchor="middle" font-size="11">IoU</text>';s+='<rect x="280" y="60" width="100" height="80" fill="none" stroke="var(--flow)" stroke-width="2" stroke-dasharray="6 3"/>';s+='<text class="sch-label" x="330" y="55" text-anchor="middle" font-size="10" fill="var(--flow)">Ground Truth</text>';s+='<rect x="260" y="100" width="90" height="70" fill="var(--thermal-soft)" stroke="var(--thermal)" stroke-width="2"/>';s+='<text class="sch-label" x="305" y="95" text-anchor="middle" font-size="10" fill="var(--thermal)">Prediction</text>';s+='<text class="sch-label" x="250" y="270" text-anchor="middle" font-size="11">mAP = mean Average Precision across classes</text>';s+='<text class="sch-label" x="250" y="290" text-anchor="middle" font-size="10" fill="var(--flow)">mAP@0.5: IoU threshold = 0.5</text>';s+='<text class="sch-label" x="250" y="306" text-anchor="middle" font-size="10" fill="var(--thermal)">COCO mAP@[0.5:0.95]: average over 10 thresholds</text>';s+='</svg>';return s;};
DIAGRAMS.classimbalance=function(){var s='<svg viewBox="0 0 500 250" xmlns="'+NS+'">';s+='<text class="sch-title" x="250" y="18" text-anchor="middle">CLASS IMBALANCE PROBLEM</text>';s+='<rect x="60" y="40" width="180" height="150" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.5"/>';s+='<text class="sch-label" x="150" y="120" text-anchor="middle" font-size="12" fill="var(--flow)">Negative (990)</text>';s+='<rect x="260" y="120" width="60" height="70" fill="var(--thermal-soft)" stroke="var(--thermal)" stroke-width="1.5"/>';s+='<text class="sch-label" x="290" y="160" text-anchor="middle" font-size="11" fill="var(--thermal)">Positive (10)</text>';s+='<text class="sch-label" x="250" y="220" text-anchor="middle" font-size="11">Always predict "Negative" -> 99% accuracy, 0% recall on positive class</text>';s+='<text class="sch-label" x="250" y="240" text-anchor="middle" font-size="10" fill="var(--thermal)">Use F1, MCC, or balanced accuracy instead</text>';s+='</svg>';return s;};
DIAGRAMS.lossLandscape=function(){var s='<svg viewBox="0 0 500 300" xmlns="'+NS+'">';s+='<text class="sch-title" x="250" y="18" text-anchor="middle">LOSS LANDSCAPE</text>';var pL=60,pB=50,pT=40,pR=30,W=500,H=300,xw=W-pL-pR,yh=H-pT-pB;s+='<line class="sch-axis" x1="'+pL+'" y1="'+pT+'" x2="'+pL+'" y2="'+(H-pB)+'"/>';s+='<line class="sch-axis" x1="'+pL+'" y1="'+(H-pB)+'" x2="'+(W-pR)+'" y2="'+(H-pB)+'"/>';s+='<text class="sch-label" x="'+(pL+xw/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11">Parameter space</text>';s+='<text class="sch-label" x="16" y="'+(pT+yh/2)+'" text-anchor="middle" font-size="11" transform="rotate(-90,16,'+(pT+yh/2)+')">Loss</text>';var pts=[[0,.9],[.1,.7],[.2,.5],[.3,.35],[.4,.25],[.5,.2],[.6,.25],[.7,.35],[.8,.5],[.9,.7],[1,.9]];var d='';for(var i=0;i<pts.length;i++){d+=(i===0?'M':'L')+(pL+pts[i][0]*xw).toFixed(1)+','+((H-pB)-pts[i][1]*yh).toFixed(1);}s+='<path class="sch-line hot" stroke-width="2.5" d="'+d+'"/>';s+='<circle cx="'+(pL+0.5*xw)+'" cy="'+((H-pB)-0.2*yh)+'" r="6" fill="var(--thermal)" stroke="var(--paper)" stroke-width="2"/>';s+='<text class="sch-label strong" x="'+(pL+0.5*xw+15)+'" y="'+((H-pB)-0.2*yh+5)+'" font-size="11" fill="var(--thermal)">Global minimum</text>';s+='</svg>';return s;};
DIAGRAMS.huberComparison=function(){var s='<svg viewBox="0 0 500 300" xmlns="'+NS+'">';s+='<text class="sch-title" x="250" y="18" text-anchor="middle">HUBER vs MAE vs MSE</text>';var pL=60,pB=50,pT=40,pR=30,W=500,H=300,xw=W-pL-pR,yh=H-pT-pB;s+='<line class="sch-axis" x1="'+pL+'" y1="'+pT+'" x2="'+pL+'" y2="'+(H-pB)+'"/>';s+='<line class="sch-axis" x1="'+pL+'" y1="'+(H-pB)+'" x2="'+(W-pR)+'" y2="'+(H-pB)+'"/>';s+='<text class="sch-label" x="'+(pL+xw/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11">Error e</text>';s+='<text class="sch-label" x="16" y="'+(pT+yh/2)+'" text-anchor="middle" font-size="11" transform="rotate(-90,16,'+(pT+yh/2)+')">Loss</text>';var midX=pL+0.5*xw;for(var i=0;i<=10;i++){var x=pL+(i/10)*xw;var e=(i-5)/5;var mse=0.5*e*e;var mae=Math.abs(e);var hub=Math.abs(e)<=1?0.5*e*e:Math.abs(e)-0.5;var maxV=2.5;s+='<circle cx="'+x+'" cy="'+((H-pB)-(mse/maxV)*yh)+'" r="3" fill="var(--thermal)"/>';s+='<circle cx="'+x+'" cy="'+((H-pB)-(mae/maxV)*yh)+'" r="3" fill="var(--flow)"/>';s+='<circle cx="'+x+'" cy="'+((H-pB)-(hub/maxV)*yh)+'" r="3" fill="var(--amber-draft)"/>';}s+='<text class="sch-label" x="'+(W-pR-60)+'" y="'+(pT+20)+'" font-size="10" fill="var(--thermal)">MSE (quadratic)</text>';s+='<text class="sch-label" x="'+(W-pR-60)+'" y="'+(pT+34)+'" font-size="10" fill="var(--flow)">MAE (linear)</text>';s+='<text class="sch-label" x="'+(W-pR-60)+'" y="'+(pT+48)+'" font-size="10" fill="var(--amber-draft)">Huber (hybrid)</text>';s+='</svg>';return s;};
window.DIAGRAMS=DIAGRAMS;
</script>

<script>
var CALCS={};
CALCS.confusionMatrixCalc=function(el){el.innerHTML='<div class="calc-head">Calculator - Confusion Matrix</div><div class="calc-body"><div class="calc-grid"><div class="field"><label>True Positives (TP)</label><input type="number" id="cm_tp" value="85" min="0"></div><div class="field"><label>True Negatives (TN)</label><input type="number" id="cm_tn" value="900" min="0"></div><div class="field"><label>False Positives (FP)</label><input type="number" id="cm_fp" value="15" min="0"></div><div class="field"><label>False Negatives (FN)</label><input type="number" id="cm_fn" value="10" min="0"></div></div><div class="calc-out" id="cm_out"></div><div class="calc-verdict" id="cm_note"></div></div>';function calc(){var tp=parseFloat($('cm_tp').value)||0,tn=parseFloat($('cm_tn').value)||0,fp=parseFloat($('cm_fp').value)||0,fn=parseFloat($('cm_fn').value)||0;var tot=tp+tn+fp+fn,acc=tot>0?(tp+tn)/tot:0,prec=tp+fp>0?tp/(tp+fp):0,rec=tp+fn>0?tp/(tp+fn):0;var spec=tn+fp>0?tn/(tn+fp):0,f1=prec+rec>0?2*prec*rec/(prec+rec):0;var mccD=Math.sqrt((tp+fp)*(tp+fn)*(tn+fp)*(tn+fn)),mcc=mccD>0?(tp*tn-fp*fn)/mccD:0;$('cm_out').innerHTML='<div class="readout"><div class="rl">Accuracy</div><div class="rv">'+fmt(acc*100,1)+'%</div></div><div class="readout"><div class="rl">Precision</div><div class="rv">'+fmt(prec*100,1)+'%</div></div><div class="readout"><div class="rl">Recall</div><div class="rv">'+fmt(rec*100,1)+'%</div></div><div class="readout hot"><div class="rl">F1 Score</div><div class="rv">'+fmt(f1*100,1)+'%</div></div><div class="readout"><div class="rl">MCC</div><div class="rv">'+fmt(mcc,3)+'</div></div>';$('cm_note').innerHTML='FPR='+fmt((1-spec)*100,1)+'%  FNR='+fmt((1-rec)*100,1)+'%  MCC ranges -1 to +1.';}var inputs=el.querySelectorAll('input');for(var i=0;i<inputs.length;i++)inputs[i].addEventListener('input',calc);calc();};
CALCS.iouDiceCalc=function(el){el.innerHTML='<div class="calc-head">Calculator - IoU &amp; Dice</div><div class="calc-body"><div class="calc-grid"><div class="field"><label>TP</label><input type="number" id="id_tp" value="180" min="0"></div><div class="field"><label>FP</label><input type="number" id="id_fp" value="20" min="0"></div><div class="field"><label>FN</label><input type="number" id="id_fn" value="30" min="0"></div></div><div class="calc-out" id="id_out"></div><div class="calc-verdict" id="id_note"></div></div>';function calc(){var tp=parseFloat($('id_tp').value)||0,fp=parseFloat($('id_fp').value)||0,fn=parseFloat($('id_fn').value)||0;var iou=tp+fp+fn>0?tp/(tp+fp+fn):0,dice=2*tp+fp+fn>0?2*tp/(2*tp+fp+fn):0;$('id_out').innerHTML='<div class="readout hot"><div class="rl">IoU</div><div class="rv">'+fmt(iou*100,1)+'%</div></div><div class="readout"><div class="rl">Dice</div><div class="rv">'+fmt(dice*100,1)+'%</div></div>';$('id_note').innerHTML='Dice=2IoU/(1+IoU). Both [0,1]; higher is better.';}var inputs=el.querySelectorAll('input');for(var i=0;i<inputs.length;i++)inputs[i].addEventListener('input',calc);calc();};
CALCS.huberCalc=function(el){el.innerHTML='<div class="calc-head">Calculator - Huber vs MAE vs MSE</div><div class="calc-body"><div class="calc-grid"><div class="field"><label>Error e</label><input type="number" id="hb_e" value="2.5" step="0.1"></div><div class="field"><label>delta - <span class="rangeval" id="hb_dv">1.0</span></label><input type="range" id="hb_d" min="0.1" max="5" step="0.1" value="1.0"></div></div><div class="calc-out" id="hb_out"></div></div>';function calc(){var e=parseFloat($('hb_e').value)||0,d=parseFloat($('hb_d').value)||1;$('hb_dv').textContent=d.toFixed(1);var mse=0.5*e*e,mae=Math.abs(e),hub=Math.abs(e)<=d?0.5*e*e:d*(Math.abs(e)-0.5*d);$('hb_out').innerHTML='<div class="readout hot"><div class="rl">Huber</div><div class="rv">'+fmt(hub,4)+'</div></div><div class="readout"><div class="rl">MSE</div><div class="rv">'+fmt(mse,4)+'</div></div><div class="readout"><div class="rl">MAE</div><div class="rv">'+fmt(mae,4)+'</div></div>';}var inputs=el.querySelectorAll('input');for(var i=0;i<inputs.length;i++)inputs[i].addEventListener('input',calc);calc();};
CALCS.focalLossCalc=function(el){el.innerHTML='<div class="calc-head">Calculator - Focal Loss</div><div class="calc-body"><div class="calc-grid"><div class="field"><label>p_t</label><input type="number" id="fl_pt" value="0.9" step="0.01" min="0.001" max="0.999"></div><div class="field"><label>gamma - <span class="rangeval" id="fl_gv">2.0</span></label><input type="range" id="fl_g" min="0" max="5" step="0.1" value="2.0"></div><div class="field"><label>alpha</label><input type="number" id="fl_a" value="0.25" step="0.01" min="0" max="1"></div></div><div class="calc-out" id="fl_out"></div></div>';function calc(){var pt=clamp(parseFloat($('fl_pt').value)||0.5,.001,.999),g=parseFloat($('fl_g').value)||0,a=parseFloat($('fl_a').value)||.5;$('fl_gv').textContent=g.toFixed(1);var fl=-a*Math.pow(1-pt,g)*Math.log(pt),bce=-Math.log(pt);$('fl_out').innerHTML='<div class="readout hot"><div class="rl">Focal Loss</div><div class="rv">'+fmt(fl,4)+'</div></div><div class="readout"><div class="rl">BCE</div><div class="rv">'+fmt(bce,4)+'</div></div><div class="readout"><div class="rl">Down-weight</div><div class="rv">'+fmt(Math.pow(1-pt,g),4)+'</div></div>';}var inputs=el.querySelectorAll('input');for(var i=0;i<inputs.length;i++)inputs[i].addEventListener('input',calc);calc();};
CALCS.klDivCalc=function(el){el.innerHTML='<div class="calc-head">Calculator - KL Divergence</div><div class="calc-body"><div class="calc-grid"><div class="field"><label>P (comma-sep)</label><input type="text" id="kl_p" value="0.5, 0.3, 0.2"></div><div class="field"><label>Q (comma-sep)</label><input type="text" id="kl_q" value="0.4, 0.4, 0.2"></div></div><div class="calc-out" id="kl_out"></div></div>';function calc(){var pV=$('kl_p').value.split(',').map(function(s){return parseFloat(s.trim());}).filter(function(v){return!isNaN(v)&&v>0;}),qV=$('kl_q').value.split(',').map(function(s){return parseFloat(s.trim());}).filter(function(v){return!isNaN(v)&&v>0;});var n=Math.min(pV.length,qV.length);if(!n)return;var kl1=0,kl2=0;for(var i=0;i<n;i++){var p=Math.max(1e-15,pV[i]),q=Math.max(1e-15,qV[i]);kl1+=p*Math.log(p/q);kl2+=q*Math.log(q/p);}$('kl_out').innerHTML='<div class="readout hot"><div class="rl">KL(P||Q)</div><div class="rv">'+fmt(kl1,4)+'</div></div><div class="readout"><div class="rl">KL(Q||P)</div><div class="rv">'+fmt(kl2,4)+'</div></div>';}var inputs=el.querySelectorAll('input');for(var i=0;i<inputs.length;i++)inputs[i].addEventListener('input',calc);calc();};
CALCS.bleuCalc=function(el){el.innerHTML='<div class="calc-head">Calculator - BLEU Score</div><div class="calc-body"><div class="calc-grid"><div class="field"><label>n-gram precisions (comma-sep)</label><input type="text" id="bl_p" value="0.95, 0.80, 0.65, 0.50"></div><div class="field"><label>Candidate length</label><input type="number" id="bl_c" value="12" min="1"></div><div class="field"><label>Reference length</label><input type="number" id="bl_r" value="14" min="1"></div></div><div class="calc-out" id="bl_out"></div></div>';function calc(){var pV=$('bl_p').value.split(',').map(function(s){return parseFloat(s.trim());}).filter(function(v){return!isNaN(v)&&v>0;});var c=parseFloat($('bl_c').value)||1,r=parseFloat($('bl_r').value)||1;var N=pV.length,bp=c>=r?1:Math.exp(1-r/c),la=0;for(var i=0;i<N;i++)la+=Math.log(pV[i]);la/=N;$('bl_out').innerHTML='<div class="readout hot"><div class="rl">BLEU-'+N+'</div><div class="rv">'+fmt(bp*Math.exp(la)*100,1)+'%</div></div><div class="readout"><div class="rl">BP</div><div class="rv">'+fmt(bp,4)+'</div></div>';}var inputs=el.querySelectorAll('input');for(var i=0;i<inputs.length;i++)inputs[i].addEventListener('input',calc);calc();};
CALCS.regressionCalc=function(el){el.innerHTML='<div class="calc-head">Calculator - Regression Errors</div><div class="calc-body"><div class="calc-grid"><div class="field"><label>True values (comma-sep)</label><input type="text" id="reg_y" value="3, -0.5, 2, 7"></div><div class="field"><label>Predicted values (comma-sep)</label><input type="text" id="reg_p" value="2.5, 0.0, 2.1, 7.8"></div></div><div class="calc-out" id="reg_out"></div><div class="calc-verdict" id="reg_note"></div></div>';function calc(){var yV=$('reg_y').value.split(',').map(function(s){return parseFloat(s.trim());}).filter(function(v){return!isNaN(v);}),pV=$('reg_p').value.split(',').map(function(s){return parseFloat(s.trim());}).filter(function(v){return!isNaN(v);});var n=Math.min(yV.length,pV.length);if(!n)return;var yM=0;for(var i=0;i<n;i++)yM+=yV[i];yM/=n;var se=0,ae=0,sst=0;for(var i=0;i<n;i++){var e=pV[i]-yV[i];se+=e*e;ae+=Math.abs(e);sst+=(yV[i]-yM)*(yV[i]-yM);}$('reg_out').innerHTML='<div class="readout"><div class="rl">MAE</div><div class="rv">'+fmt(ae/n,4)+'</div></div><div class="readout"><div class="rl">MSE</div><div class="rv">'+fmt(se/n,4)+'</div></div><div class="readout hot"><div class="rl">RMSE</div><div class="rv">'+fmt(Math.sqrt(se/n),4)+'</div></div><div class="readout"><div class="rl">R-squared</div><div class="rv">'+fmt(sst>0?1-se/sst:1,4)+'</div></div>';$('reg_note').innerHTML='N='+n+'  mean='+fmt(yM,3)+'  R2=1 is perfect.';}var inputs=el.querySelectorAll('input');for(var i=0;i<inputs.length;i++)inputs[i].addEventListener('input',calc);calc();};
CALCS.pcaCalc=function(el){el.innerHTML='<div class="calc-head">Calculator - PCA Explained Variance</div><div class="calc-body"><div class="calc-grid"><div class="field"><label>Eigenvalues (comma-sep)</label><input type="text" id="pca_l" value="3.0, 1.0, 0.5, 0.2"></div></div><div class="calc-out" id="pca_out"></div><div class="calc-verdict" id="pca_note"></div></div>';function calc(){var lV=$('pca_l').value.split(',').map(function(s){return parseFloat(s.trim());}).filter(function(v){return!isNaN(v)&&v>=0;});if(!lV.length)return;lV.sort(function(a,b){return b-a;});var tot=0;for(var i=0;i<lV.length;i++)tot+=lV[i];if(tot<=0)return;var cum=0,k90=-1,k95=-1,h='';for(var i=0;i<lV.length;i++){cum+=lV[i];var ratio=cum/tot;if(k90===-1&&ratio>=0.9)k90=i+1;if(k95===-1&&ratio>=0.95)k95=i+1;h+='<div class="readout'+(i===0?' hot':'')+'"><div class="rl">PC'+(i+1)+'</div><div class="rv">'+fmt((lV[i]/tot)*100,1)+'% <small>cum '+fmt(ratio*100,1)+'%</small></div></div>';}$('pca_out').innerHTML=h;$('pca_note').innerHTML='Components for 90% variance: '+(k90>0?k90:'all')+'  |  for 95%: '+(k95>0?k95:'all')+'.';}var inputs=el.querySelectorAll('input');for(var i=0;i<inputs.length;i++)inputs[i].addEventListener('input',calc);calc();};
CALCS.macroMicroCalc=function(el){el.innerHTML='<div class="calc-head">Calculator - Macro vs Micro vs Weighted F1</div><div class="calc-body"><div class="calc-grid"><div class="field"><label>Per-class TP (comma-sep)</label><input type="text" id="mm_tp" value="90, 63, 0"></div><div class="field"><label>Per-class FP (comma-sep)</label><input type="text" id="mm_fp" value="10, 27, 5"></div><div class="field"><label>Per-class FN (comma-sep)</label><input type="text" id="mm_fn" value="5, 27, 10"></div></div><div class="calc-out" id="mm_out"></div><div class="calc-verdict" id="mm_note"></div></div>';function nums(id){return $(id).value.split(',').map(function(s){return parseFloat(s.trim());}).filter(function(v){return !isNaN(v)&&v>=0;});}function calc(){var tp=nums('mm_tp'),fp=nums('mm_fp'),fn=nums('mm_fn'),n=Math.min(tp.length,fp.length,fn.length);if(!n)return;var sF1=0,sW=0,sSup=0,tTP=0,tFP=0,tFN=0,per=[];for(var i=0;i<n;i++){var p=tp[i]+fp[i]>0?tp[i]/(tp[i]+fp[i]):0,r=tp[i]+fn[i]>0?tp[i]/(tp[i]+fn[i]):0,f=p+r>0?2*p*r/(p+r):0,sup=tp[i]+fn[i];per.push('C'+(i+1)+':'+fmt(f*100,1)+'%');sF1+=f;sW+=f*sup;sSup+=sup;tTP+=tp[i];tFP+=fp[i];tFN+=fn[i];}var macro=sF1/n,mp=tTP+tFP>0?tTP/(tTP+tFP):0,mr=tTP+tFN>0?tTP/(tTP+tFN):0,micro=mp+mr>0?2*mp*mr/(mp+mr):0,wt=sSup>0?sW/sSup:0;$('mm_out').innerHTML='<div class="readout hot"><div class="rl">Macro F1</div><div class="rv">'+fmt(macro*100,1)+'%</div></div><div class="readout"><div class="rl">Micro F1</div><div class="rv">'+fmt(micro*100,1)+'%</div></div><div class="readout"><div class="rl">Weighted F1</div><div class="rv">'+fmt(wt*100,1)+'%</div></div>';$('mm_note').innerHTML='Per-class F1 — '+per.join('  ')+'. Gap between micro and macro means the majority hides weak rare classes.';}var inputs=el.querySelectorAll('input');for(var i=0;i<inputs.length;i++)inputs[i].addEventListener('input',calc);calc();};
CALCS.ndcgCalc=function(el){el.innerHTML='<div class="calc-head">Calculator - DCG / NDCG</div><div class="calc-body"><div class="calc-grid"><div class="field"><label>Relevance grades, ranked order (comma-sep)</label><input type="text" id="nd_rel" value="3, 2, 3, 0, 1"></div><div class="field"><label>K (cutoff)</label><input type="number" id="nd_k" value="5" min="1"></div></div><div class="calc-out" id="nd_out"></div><div class="calc-verdict" id="nd_note"></div></div>';function calc(){var rel=$('nd_rel').value.split(',').map(function(s){return parseFloat(s.trim());}).filter(function(v){return !isNaN(v)&&v>=0;});var k=Math.max(1,Math.min(rel.length,parseInt($('nd_k').value)||rel.length));var dcg=0;for(var i=0;i<k;i++)dcg+=(Math.pow(2,rel[i])-1)/(Math.log(i+2)/Math.log(2));var srt=rel.slice(0).sort(function(a,b){return b-a;}),idcg=0;for(var j=0;j<k;j++)idcg+=(Math.pow(2,srt[j])-1)/(Math.log(j+2)/Math.log(2));var ndcg=idcg>0?dcg/idcg:1,rel1=0;for(var m=0;m<k;m++)if(rel[m]>=1)rel1++;$('nd_out').innerHTML='<div class="readout hot"><div class="rl">NDCG@'+k+'</div><div class="rv">'+fmt(ndcg,4)+'</div></div><div class="readout"><div class="rl">DCG</div><div class="rv">'+fmt(dcg,3)+'</div></div><div class="readout"><div class="rl">IDCG</div><div class="rv">'+fmt(idcg,3)+'</div></div>';$('nd_note').innerHTML='Precision@'+k+' = '+fmt(rel1/k*100,1)+'% (grades >= 1 count relevant). NDCG=1 means perfect ranking.';}var inputs=el.querySelectorAll('input');for(var i=0;i<inputs.length;i++)inputs[i].addEventListener('input',calc);calc();};
CALCS.eceCalc=function(el){el.innerHTML='<div class="calc-head">Calculator - Expected Calibration Error</div><div class="calc-body"><div class="calc-grid"><div class="field"><label>Bin accuracies (comma-sep)</label><input type="text" id="ec_acc" value="0.857, 0.90"></div><div class="field"><label>Bin confidences (comma-sep)</label><input type="text" id="ec_cf" value="0.95, 0.78"></div><div class="field"><label>Bin counts (comma-sep)</label><input type="text" id="ec_n" value="70, 30"></div></div><div class="calc-out" id="ec_out"></div><div class="calc-verdict" id="ec_note"></div></div>';function nums(id){return $(id).value.split(',').map(function(s){return parseFloat(s.trim());}).filter(function(v){return !isNaN(v)&&v>=0;});}function calc(){var acc=nums('ec_acc'),cf=nums('ec_cf'),nn=nums('ec_n'),n=Math.min(acc.length,cf.length,nn.length);if(!n)return;var tot=0;for(var i=0;i<n;i++)tot+=nn[i];if(!tot)return;var ece=0,mce=0;for(var j=0;j<n;j++){var g=Math.abs(acc[j]-cf[j]);ece+=(nn[j]/tot)*g;if(g>mce)mce=g;}$('ec_out').innerHTML='<div class="readout hot"><div class="rl">ECE</div><div class="rv">'+fmt(ece,4)+'</div></div><div class="readout"><div class="rl">MCE (worst bin)</div><div class="rv">'+fmt(mce,4)+'</div></div>';$('ec_note').innerHTML='N='+tot+'. Good: 0.01-0.03. Uncalibrated nets often 0.05-0.15. MCE flags one catastrophic bin that ECE averages away.';}var inputs=el.querySelectorAll('input');for(var i=0;i<inputs.length;i++)inputs[i].addEventListener('input',calc);calc();};
window.CALCS=CALCS;

var currentId=null;
function sectionIndex(id){for(var i=0;i<SECTIONS.length;i++)if(SECTIONS[i].id===id)return i;return-1;}
function renderHome(){currentId=null;document.title='ML/DL Metrics & Losses — Interactive Reference';$('mobileTitle').textContent='Home';var calcCount=0;for(var k in CALCS)if(CALCS.hasOwnProperty(k))calcCount++;var h='<div class="section-eyebrow">FIELD REFERENCE · OVERVIEW</div><h1 class="section-title">ML/DL Metrics &amp; Losses</h1><p class="home-lede">An annotated reference covering the mathematics foundations (linear algebra, probability, optimization, regularization, eigenvalues, SVD, PCA, generalization), classification metrics, ranking and calibration, detection evaluation, segmentation, losses, NLP evaluation, remote-sensing applications, specialized evaluation (clustering, generative, protocol), and practical guidance. Every section explains what a metric measures, why it matters, and when to use it — with worked numbers and '+calcCount+' live calculators.</p><div class="part-grid">';for(var i=0;i<PARTS.length;i++){var p=PARTS[i],secs=[];for(var j=0;j<SECTIONS.length;j++)if(SECTIONS[j].part===p.id)secs.push(SECTIONS[j]);h+='<div class="part-card" onclick="showSection(\''+(secs[0]?secs[0].id:'')+'\')"><div class="pn">PART '+p.num+' · '+String(secs.length).padStart(2,'0')+' SECTIONS</div><h3>'+p.title+'</h3><p>'+p.blurb+'</p><div class="pc">'+secs.map(function(s){return s.num;}).join(' · ')+'</div></div>';}h+='</div><div class="note tip"><span class="tag">How this reference is organized</span><p>Every section explains the metric or loss, shows the formula, and provides a worked example. Sections marked <span class="badge interactive">Interactive</span> include a calculator you can drive with your own numbers. Sections marked <span class="badge diagram">Diagram</span> include an original SVG schematic.</p><p>Use the sidebar to navigate between parts, or use the search bar to find specific metrics, losses, or formulas.</p></div>';$('content').innerHTML=h;window.scrollTo(0,0);setActiveNav(null);closeMobileSidebar();}
function showSection(id){var idx=sectionIndex(id);if(idx===-1){renderHome();return;}var s=SECTIONS[idx];currentId=id;var part=null;for(var i=0;i<PARTS.length;i++)if(PARTS[i].id===s.part){part=PARTS[i];break;}document.title=s.num+' '+s.title+' — ML/DL Reference';$('mobileTitle').textContent=s.num+' '+s.title;var prev=idx>0?SECTIONS[idx-1]:null,next=idx<SECTIONS.length-1?SECTIONS[idx+1]:null;var badges='';if(s.calc)badges+='<span class="badge interactive">Interactive</span>';if(s.diagrams&&s.diagrams.length)badges+='<span class="badge diagram">Diagram</span>';var h='<div class="section-eyebrow kicker-row">PART '+part.num+' · '+part.title+'<span class="sep">&nbsp;/ §'+s.num+'&nbsp;</span>'+badges+'</div><h1 class="section-title">'+s.title+'</h1>';if(s.dek)h+='<p class="section-dek">'+s.dek+'</p>';h+='<div class="prose">'+s.body+'</div><div class="pagenav">';if(prev)h+='<a onclick="showSection(\''+prev.id+'\')"><span class="pl">← §'+prev.num+'</span><span class="pt">'+prev.title+'</span></a>';else h+='<span></span>';if(next)h+='<a class="next" onclick="showSection(\''+next.id+'\')"><span class="pl">§'+next.num+' →</span><span class="pt">'+next.title+'</span></a>';else h+='<span></span>';h+='</div>';$('content').innerHTML=h;if(window.renderMathInElement)renderMathInElement($('content'),{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}]});mountWidgets(s);setActiveNav(id);if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);closeMobileSidebar();}
function goHome(){history.replaceState(null,'','#home');renderHome();}
function mountWidgets(s){if(s&&s.calc&&!document.querySelector('#content .calc-mount[data-calc="'+s.calc+'"]')){var md=document.createElement('div');md.className='calc-mount';md.setAttribute('data-calc',s.calc);var prose=document.querySelector('#content .prose');if(prose)prose.appendChild(md);}var els=document.querySelectorAll('#content .calc-mount');for(var i=0;i<els.length;i++){var el=els[i],key=el.getAttribute('data-calc');if(CALCS[key])try{CALCS[key](el);}catch(e){}}var dls=document.querySelectorAll('#content .diagram-mount');for(var i=0;i<dls.length;i++){var el=dls[i],key=el.getAttribute('data-diagram');if(DIAGRAMS[key])try{el.innerHTML=DIAGRAMS[key]();}catch(e){}}}
function buildNav(){var tree=$('navTree'),h='';for(var i=0;i<PARTS.length;i++){var p=PARTS[i],secs=[];for(var j=0;j<SECTIONS.length;j++)if(SECTIONS[j].part===p.id)secs.push(SECTIONS[j]);h+='<div class="nav-part" data-part="'+p.id+'"><button class="nav-part-btn" onclick="togglePart(\''+p.id+'\')"><span class="nav-part-num">'+p.num+'</span><span>'+p.title+'</span><span class="nav-part-caret">\u25B8</span></button><ul class="nav-topics">';for(var j=0;j<secs.length;j++){var s=secs[j];h+='<li class="nav-topic" data-id="'+s.id+'" data-search="'+(s.title+' '+(s.tags||'')+' '+s.num).toLowerCase()+'"><button class="nav-topic-btn" onclick="showSection(\''+s.id+'\')" data-id="'+s.id+'"><span class="nav-topic-num">'+s.num+'</span>'+s.title+'</button></li>';}h+='</ul></div>';}tree.innerHTML=h;}
function togglePart(id,force){var el=document.querySelector('.nav-part[data-part="'+id+'"]');if(!el)return;if(force==='open')el.classList.add('open');else if(force==='close')el.classList.remove('open');else el.classList.toggle('open');}
function setActiveNav(id){var btns=document.querySelectorAll('.nav-topic-btn');for(var i=0;i<btns.length;i++)btns[i].classList.toggle('active',btns[i].dataset.id===id);$('navHome').classList.toggle('active',id===null);if(id){for(var i=0;i<SECTIONS.length;i++)if(SECTIONS[i].id===id){togglePart(SECTIONS[i].part,'open');break;}}}
function initSearch(){$('searchInput').addEventListener('input',function(e){var q=e.target.value.trim().toLowerCase(),topics=document.querySelectorAll('.nav-topic');if(!q){for(var i=0;i<topics.length;i++)topics[i].classList.remove('nav-hidden');var parts=document.querySelectorAll('.nav-part');for(var i=0;i<parts.length;i++)parts[i].classList.remove('nav-hidden');return;}var parts=document.querySelectorAll('.nav-part');for(var i=0;i<parts.length;i++){var any=false,topics=parts[i].querySelectorAll('.nav-topic');for(var j=0;j<topics.length;j++){var hit=topics[j].getAttribute('data-search').indexOf(q)!==-1;topics[j].classList.toggle('nav-hidden',!hit);if(hit)any=true;}parts[i].classList.toggle('nav-hidden',!any);if(any)togglePart(parts[i].getAttribute('data-part'),'open');}});}
function openMobileSidebar(){$('sidebar').classList.add('open');$('sidebarOverlay').classList.add('show');}
function closeMobileSidebar(){if(window.innerWidth<=900){$('sidebar').classList.remove('open');$('sidebarOverlay').classList.remove('show');}}
function initMobileNav(){document.getElementById('mobileNavBtn').addEventListener('click',openMobileSidebar);document.getElementById('sidebarOverlay').addEventListener('click',closeMobileSidebar);}
/* ---------------------------------------------------------------------
   Print — full reference (all sections) via #print-root.
   Screen shows ONE section in #content, so Ctrl+P alone only prints that.
   This builds a static snapshot of EVERY section for @media print.
   --------------------------------------------------------------------- */
var printBuilt=false, printBuilding=false;
function printUniquifyIds(html,suffix){return html.replace(/\sid="([^"]+)"/g,' id="$1-'+suffix+'"');}
function printFreezeInputs(root){var i,el,inputs=root.querySelectorAll('input');for(i=0;i<inputs.length;i++){el=inputs[i];if(el.type==='checkbox'||el.type==='radio'){if(el.checked)el.setAttribute('checked','');else el.removeAttribute('checked');}else el.setAttribute('value',el.value);}var sels=root.querySelectorAll('select');for(i=0;i<sels.length;i++){var opts=sels[i].options;for(var j=0;j<opts.length;j++){if(opts[j].selected)opts[j].setAttribute('selected','');else opts[j].removeAttribute('selected');}}var tas=root.querySelectorAll('textarea');for(i=0;i<tas.length;i++)tas[i].textContent=tas[i].value;}
function printRenderMath(root){try{if(window.renderMathInElement)renderMathInElement(root,{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}]});}catch(e){}}
function buildPrintDocument(){
  if(printBuilding)return;
  var contentEl=$('content'),printRoot=$('print-root');
  if(!contentEl||!printRoot||typeof SECTIONS==='undefined'||!SECTIONS.length)return;
  printBuilding=true;
  try{
    var savedId=currentId,savedHash=location.hash,savedHtml=contentEl.innerHTML,savedY=window.scrollY;
    var today=new Date().toISOString().slice(0,10);
    var out='<div class="print-cover"><h1>ML/DL Metrics &amp; Losses — Full Print</h1>'
      +'<p class="sub">Complete reference &middot; '+SECTIONS.length+' sections &middot; '+PARTS.length+' parts &middot; printed '+today+'.</p><div class="print-toc">';
    for(var pi=0;pi<PARTS.length;pi++){var p=PARTS[pi],names=[];for(var sj=0;sj<SECTIONS.length;sj++)if(SECTIONS[sj].part===p.id)names.push(SECTIONS[sj]);out+='<div class="toc-part"><b>Part '+p.num+' — '+p.title+'</b>';for(var sk=0;sk<names.length;sk++)out+='<span>§'+names[sk].num+' '+names[sk].title+'</span>';out+='</div>';}
    out+='</div></div>';
    var lastPart=null;
    for(var idx=0;idx<SECTIONS.length;idx++){
      var s=SECTIONS[idx],part=null;
      for(var qi=0;qi<PARTS.length;qi++)if(PARTS[qi].id===s.part){part=PARTS[qi];break;}
      if(part&&part.id!==lastPart){lastPart=part.id;out+='<div class="print-part"><div class="print-part-kicker">PART '+part.num+'</div><h1 class="print-part-title">'+part.title+'</h1><p class="print-part-blurb">'+part.blurb+'</p></div>';}
      // Render in the live #content sandbox so existing CALCS/DIAGRAMS/KaTeX
      // mount code runs unchanged (it uses global IDs — one section at a time).
      var htm='<div class="section-eyebrow">PART '+part.num+' · '+part.title+'<span class="sep">&nbsp;/ §'+s.num+'</span></div><h1 class="section-title">'+s.title+'</h1>';
      if(s.dek)htm+='<p class="section-dek">'+s.dek+'</p>';
      htm+='<div class="prose">'+s.body+'</div>';
      contentEl.innerHTML=htm;
      printRenderMath(contentEl);
      mountWidgets(s);
      printFreezeInputs(contentEl);
      out+='<section class="print-section">'+printUniquifyIds(contentEl.innerHTML,'p'+idx)+'</section>';
    }
    printRoot.innerHTML=out;
    contentEl.innerHTML=savedHtml;
    if(savedId&&sectionIndex(savedId)!==-1)showSection(savedId);else renderHome();
    if(savedHash)history.replaceState(null,'',savedHash);
    window.scrollTo(0,savedY);
    printBuilt=true;
  }finally{printBuilding=false;}
}
function printFullReference(){try{buildPrintDocument();}catch(e){}setTimeout(function(){window.print();},60);}
window.addEventListener('beforeprint',function(){if(!printBuilt){try{buildPrintDocument();}catch(e){}}});
function boot(){buildNav();initSearch();initMobileNav();window.addEventListener('hashchange',route);route();var idle=function(){try{if(!printBuilt)buildPrintDocument();}catch(e){}};if('requestIdleCallback' in window)requestIdleCallback(idle,{timeout:8000});else setTimeout(idle,2500);}
function route(){var h=location.hash.replace('#','');if(!h||h==='home'){renderHome();return;}if(sectionIndex(h)!==-1){showSection(h);}else{renderHome();}}
document.addEventListener('DOMContentLoaded',boot);
</script>
</body>
</html>
