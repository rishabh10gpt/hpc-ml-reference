{id:'s-4-1', part:'p4', num:'4.1', title:'IEEE 754 Fundamentals',
 dek:'The vocabulary of floating point: sign, exponent, significand, subnormals, and why FMA gets its own name.',
 tags:'ieee754 sign exponent significand subnormal rounding fma nan infinity',
 body:`
 <p>IEEE 754-2019 is the standard nearly all floating-point hardware and software conforms to (formally mirrored by ISO/IEC/IEEE 60559:2020). Every format discussed in this Part — from FP64 down to the newest 4-bit AI formats — is either defined by this standard or deliberately modeled on its conventions.</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Term</th><th>Meaning</th></tr>
   <tr><td>Binary formats</td><td>Standard sizes such as binary16, binary32, binary64 (FP16/FP32/FP64)</td></tr>
   <tr><td>Sign</td><td>1 bit — determines positive or negative</td></tr>
   <tr><td>Exponent</td><td>Controls the scale/range of the number</td></tr>
   <tr><td>Significand / fraction</td><td>Controls the precision — how many significant digits are stored</td></tr>
   <tr><td>Subnormal</td><td>Represents values below the smallest "normal" number, giving gradual underflow instead of an abrupt jump to zero</td></tr>
   <tr><td>±0, ±∞</td><td>IEEE supports signed zero and signed infinity as distinct, well-defined values</td></tr>
   <tr><td>NaN</td><td>"Not a Number" — represents invalid or unrepresentable results (0/0, ∞−∞, etc.)</td></tr>
   <tr><td>Rounding</td><td>Defined rounding-direction attributes, including round-to-nearest-even (the default) and directed rounding</td></tr>
   <tr><td>FMA</td><td>Fused multiply-add: computes a×b+c with a single final rounding step instead of two, improving both accuracy and throughput</td></tr>
 </table></div>
 <div class="formula-box">
   <span class="tag">Normalized value reconstruction</span>
   <div class="f">x = (−1)^sign × (1.fraction) × 2^(exponent − bias)</div>
   <div class="f small">Every normal floating-point number decodes this way. The implicit leading "1." before the fraction bits is why an n-bit fraction field gives you n+1 bits of effective precision.</div>
 </div>
 <div class="note tip"><span class="tag">Why FMA matters more than it sounds like it should</span><p>Computing a×b+c as two separate rounded operations (multiply, then add) accumulates two rounding errors. A hardware FMA computes the full-precision product internally and rounds only once at the end — meaningfully better numerical accuracy for the extremely common "multiply-accumulate" pattern at the heart of nearly every dense linear algebra kernel, and the reason FMA throughput (not plain multiply/add) is what peak-FLOPs specs are usually built around (§2.3).</p></div>
 `},

{id:'s-4-2', part:'p4', num:'4.2', title:'Standard Binary Formats — FP16 through FP128',
 dek:'The IEEE interchange formats, bit by bit — with a live visualizer you can drive with your own numbers.',
 tags:'fp16 fp32 fp64 fp128 binary16 binary32 binary64 bit layout visualizer',
 calc:'bitviz',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Format</th><th>Total bits</th><th>Sign</th><th>Exponent</th><th>Fraction</th><th>≈ decimal digits</th><th>Typical use</th></tr>
   <tr><td class="mono">FP16 / binary16</td><td class="mono">16</td><td class="mono">1</td><td class="mono">5</td><td class="mono">10</td><td>~3</td><td>AI / mixed precision</td></tr>
   <tr><td class="mono">FP32 / binary32</td><td class="mono">32</td><td class="mono">1</td><td class="mono">8</td><td class="mono">23</td><td>~7</td><td>General numerical computing</td></tr>
   <tr><td class="mono">FP64 / binary64</td><td class="mono">64</td><td class="mono">1</td><td class="mono">11</td><td class="mono">52</td><td>~15–16</td><td>Scientific / HPC computing</td></tr>
   <tr><td class="mono">FP128 / binary128</td><td class="mono">128</td><td class="mono">1</td><td class="mono">15</td><td class="mono">112</td><td>~34</td><td>High-precision numerical work</td></tr>
 </table></div>
 <p>Notice the pattern: every step up roughly doubles the bit count, and the exponent field grows more slowly than the fraction field — because range needs are more modest than precision needs for most workloads once you're past FP16's cramped 5-bit exponent.</p>
 <p>Type a decimal number below and switch formats to see exactly how it gets carved into sign/exponent/fraction bits, what value the format actually rounds it to, and how much relative error that introduces.</p>
 <div class="calc-mount" data-calc="bitviz"></div>
 <div class="example-box">
   <span class="tag">Worked example — why FP64 is the HPC default</span>
   <p>FP32's ~7 significant decimal digits sounds like a lot, but in an iterative solver that accumulates rounding error over thousands of timesteps, that error compounds. FP64's ~15–16 digits gives enough headroom that accumulated rounding error usually stays far below the physical/discretization error already inherent in the simulation — which is why FP64 remains the default for most classical scientific computing despite being 2× the memory traffic of FP32.</p>
 </div>
 `},

{id:'s-4-3', part:'p4', num:'4.3', title:'FP16 vs. BF16 vs. FP32 vs. FP64',
 dek:'Same bit budget (FP16 and BF16 are both 16 bits), completely different trade-off between range and precision.',
 tags:'fp16 bf16 comparison range precision exponent fraction',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Format</th><th>Bits</th><th>Exponent</th><th>Fraction</th><th>Character</th></tr>
   <tr><td class="mono">FP64</td><td class="mono">64</td><td class="mono">11</td><td class="mono">52</td><td>High precision <strong>and</strong> large range — scientific simulation</td></tr>
   <tr><td class="mono">FP32</td><td class="mono">32</td><td class="mono">8</td><td class="mono">23</td><td>Good general-purpose precision/range balance</td></tr>
   <tr><td class="mono">FP16</td><td class="mono">16</td><td class="mono">5</td><td class="mono">10</td><td>More precision than BF16, but a much smaller representable range</td></tr>
   <tr><td class="mono">BF16</td><td class="mono">16</td><td class="mono">8</td><td class="mono">7</td><td>FP32-like range, with much coarser precision</td></tr>
 </table></div>
 <p>The FP16-vs-BF16 comparison is the one worth internalizing: <strong>both are 16 bits, but they spend that budget completely differently.</strong> FP16 keeps 10 fraction bits (better precision) but only 5 exponent bits, so it overflows past ±65,504 — a real problem for deep-learning gradients, which can span many orders of magnitude during training. BF16 borrows FP32's full 8-bit exponent (same dynamic range as FP32) but keeps only 7 fraction bits — coarser precision, but numerically far more forgiving during training because values simply don't overflow the way FP16 can.</p>
 <div class="note warn"><span class="tag">BF16 is not an IEEE interchange format</span><p>Despite being 16 bits like FP16, BF16 ("Brain Float") is not part of the IEEE 754 binary interchange family. It's an industry-standard convention (effectively "truncated FP32") that hardware vendors converged on for AI workloads because it needs no exponent conversion when moving data between BF16 and FP32 — you can just drop or extend by the fraction bits.</p></div>
 <div class="example-box">
   <span class="tag">Worked example — try it in the visualizer above (§4.2)</span>
   <p>Enter a large value like 70000 in the bit visualizer and switch between FP16 and BF16. FP16 will clamp to its maximum representable value (65504) since 70000 overflows its 5-bit exponent range. BF16, sharing FP32's exponent range, represents 70000 without overflow — just with less precision in the mantissa (it rounds to the nearest multiple of a fairly coarse step near that magnitude).</p>
 </div>
 `},

{id:'s-4-4', part:'p4', num:'4.4', title:'TF32 — Tensor-Core Arithmetic, Not a Storage Format',
 dek:'NVIDIA\'s TensorFloat-32: a computation mode disguised as a precision name.',
 tags:'tf32 tensorfloat nvidia tensor core arithmetic',
 body:`
 <p>TF32 (TensorFloat-32) is an NVIDIA Tensor Core arithmetic mode intended to accelerate workloads that are conceptually written in FP32. Critically, <strong>it is not an IEEE storage format and not the same thing as FP16</strong> — you don't allocate arrays of "TF32 values" the way you would FP16 or FP32.</p>
 <div class="formula-box">
   <span class="tag">TF32's conceptual bit layout (19 bits used inside a 32-bit container)</span>
   <div class="f">1 sign + 8 exponent (same range as FP32) + 10 fraction (same precision as FP16)</div>
 </div>
 <p>The practical effect: TF32 keeps FP32's full dynamic range (so existing FP32 code doesn't suddenly overflow) while truncating the mantissa to FP16-like precision for the actual multiply-accumulate happening inside the Tensor Core. Values are read from and written to memory as ordinary 32-bit FP32 — the precision reduction happens transparently inside the tensor-core math unit itself, which is why many FP32-labeled ML training runs can be "TF32-accelerated" with minimal code changes.</p>
 <div class="note tip"><span class="tag">Why this distinction matters</span><p>Because TF32 isn't a storage format, you won't see "TF32 GB" memory-footprint figures the way you would for FP16/BF16/FP8 (§4.8) — a TF32-accelerated matrix multiply still reads/writes FP32-sized data from memory. The speedup comes purely from faster tensor-core math, not reduced memory traffic — an important distinction when reasoning about whether a kernel is compute- or memory-bound (§1.5).</p></div>
 `},

{id:'s-4-5', part:'p4', num:'4.5', title:'FP8 — E4M3 and E5M2',
 dek:'8-bit floating point, and the fundamental trade-off between the two standard variants.',
 tags:'fp8 e4m3 e5m2 ocp precision range',
 calc:null,
 body:`
 <p>FP8 is an 8-bit floating-point family used heavily in modern AI accelerators for both training and inference. It is <strong>not</strong> an IEEE 754-2019 binary interchange format — its practical encodings are defined by industry efforts like the Open Compute Project (OCP) and individual vendor implementations, which is why you'll sometimes see slightly different conventions between hardware generations.</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Format</th><th>Bits</th><th>Sign</th><th>Exponent</th><th>Fraction</th><th>Trade-off</th><th>Typical use</th></tr>
   <tr><td class="mono">FP8 E4M3</td><td class="mono">8</td><td class="mono">1</td><td class="mono">4</td><td class="mono">3</td><td>More precision, smaller range</td><td>Weights / activations</td></tr>
   <tr><td class="mono">FP8 E5M2</td><td class="mono">8</td><td class="mono">1</td><td class="mono">5</td><td class="mono">2</td><td>Less precision, larger range</td><td>Gradients / dynamic-range-heavy values</td></tr>
 </table></div>
 <p>This is the FP16-vs-BF16 trade-off (§4.3) playing out again at half the bit budget, and it explains the naming convention itself: "E4M3" reads as <strong>4 Exponent bits, 3 Mantissa (fraction) bits</strong>. More exponent bits buys dynamic range at the cost of mantissa precision, and vice versa — a pattern that recurs at every precision level in this Part.</p>
 <p>Use the bit visualizer in §4.2 (switch the format dropdown to FP8 E4M3 or E5M2) to see how the same decimal value rounds very differently between the two — E4M3 will typically preserve more of the value's precise digits for numbers in its range, while E5M2 tolerates far larger or smaller magnitudes before over/underflowing.</p>
 <div class="note warn"><span class="tag">Why gradients specifically want E5M2</span><p>During training, gradient values can span many orders of magnitude across different layers and training steps — exactly the scenario where a format needs generous dynamic range even at the cost of mantissa precision, which is why E5M2 is the common choice for gradients while E4M3's extra precision is preferred for weights and activations, whose values tend to stay in a tighter range.</p></div>
 `},

{id:'s-4-6', part:'p4', num:'4.6', title:'FP6, FP4 &amp; Microscaling Formats (MXFP8, MXFP4, NVFP4)',
 dek:'When 8 bits is still too many: ultra-low-precision formats and the block-scaling trick that makes them usable.',
 tags:'fp6 fp4 microscaling mxfp8 mxfp4 nvfp4 block scaling',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Format</th><th>Bits/value</th><th>Description</th><th>Ecosystem</th></tr>
   <tr><td class="mono">FP6</td><td class="mono">6</td><td>Emerging low-precision float family; variants such as E2M3/E3M2 exist</td><td>Accelerator/AI ecosystem</td></tr>
   <tr><td class="mono">FP4</td><td class="mono">4</td><td>Ultra-low-precision float; usually requires companion scaling to be usable</td><td>AI accelerator ecosystem</td></tr>
   <tr><td class="mono">MXFP8</td><td class="mono">8</td><td>FP8 values with block/shared scaling to reduce dynamic-range problems</td><td>OCP Microscaling</td></tr>
   <tr><td class="mono">MXFP4</td><td class="mono">4</td><td>FP4 values with block/shared scaling</td><td>OCP Microscaling</td></tr>
   <tr><td class="mono">NVFP4</td><td class="mono">4</td><td>NVIDIA Blackwell-oriented FP4 scheme with additional scaling machinery</td><td>NVIDIA ecosystem</td></tr>
 </table></div>
 <p>At 4 bits, a plain floating-point format has almost nothing left to represent a useful dynamic range on its own — the fix the industry converged on is <strong>microscaling (block scaling)</strong>: group a small block of values (commonly 16 or 32 elements) and store one shared scale factor for the whole block alongside the individual low-bit values. Each value is then interpreted as <code>value × block_scale</code>, letting the tiny per-element format handle only the local variation within the block while the shared scale handles the block's overall magnitude.</p>
 <div class="note warn"><span class="tag">There is no single universal FP4</span><p>Unlike FP64/FP32 (rigidly standardized by IEEE 754), FP4 implementations differ meaningfully between MXFP4, NVFP4 and other vendor schemes — not just in bit layout, but in block size and scale-factor precision/format. Always treat "FP4" as a family name, and check the specific scheme's documentation before assuming compatibility between hardware generations or software stacks.</p></div>
 <div class="example-box">
   <span class="tag">Why this is worth the complexity</span>
   <p>Moving a large language model's weights from FP16 (2 bytes/parameter) to a well-tuned MXFP4/NVFP4 scheme (≈0.5 bytes/parameter plus a small amortized scale-factor overhead) can shrink memory footprint by roughly 4× and proportionally reduce the memory-bandwidth traffic needed to run inference — often the dominant bottleneck for large-model inference (§4.8) — while microscaling keeps accuracy far closer to the higher-precision baseline than a naive 4-bit format would.</p>
 </div>
 `},

{id:'s-4-7', part:'p4', num:'4.7', title:'Integer Quantization — INT8, INT5, INT4, INT2',
 dek:'Not floating point at all: fixed-width integers standing in for real numbers via a scale factor.',
 tags:'int8 int5 int4 int2 quantization affine symmetric zero point',
 body:`
 <p>Integer formats are governed by entirely different rules than everything else in this Part — they're not covered by IEEE 754 at all. Instead of a floating exponent, a quantized integer format represents a real number as a fixed-point integer plus a separately-stored scale (and sometimes an offset).</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Format</th><th>Bits</th><th>Typical signed range*</th><th>Typical use</th></tr>
   <tr><td class="mono">INT8</td><td class="mono">8</td><td class="mono">−128…127</td><td>Widely supported inference/quantization</td></tr>
   <tr><td class="mono">INT5</td><td class="mono">5</td><td class="mono">−16…15</td><td>Custom quantization — usually packed, implementation-dependent</td></tr>
   <tr><td class="mono">INT4</td><td class="mono">4</td><td class="mono">−8…7</td><td>Common in LLM inference — very compact weight/activation quantization</td></tr>
   <tr><td class="mono">INT2</td><td class="mono">2</td><td class="mono">−2…1</td><td>Extreme quantization; accuracy-sensitive</td></tr>
 </table></div>
 <p style="font-size:13px; color:var(--ink-soft);">*Exact ranges depend on the signed/unsigned encoding and the specific quantization scheme in use.</p>
 <div class="formula-box">
   <span class="tag">Quantization models</span>
   <div class="flist">
     <div class="f">Affine: x ≈ scale × (q − zero_point)</div>
     <div class="f">Symmetric: x ≈ scale × q</div>
   </div>
 </div>
 <p>INT8 is the most broadly hardware-supported low-precision inference format today. INT4 has become the practical sweet spot for large language model inference — compact enough to meaningfully shrink memory footprint and bandwidth demand, while (with careful calibration) usually retaining acceptable output quality. INT5 is worth flagging specifically as <em>not</em> a broadly standardized native arithmetic type — where it appears, it's typically a packed/custom representation rather than something with consistent hardware support across vendors.</p>
 <div class="note tip"><span class="tag">Affine vs. symmetric, in one sentence</span><p>Symmetric quantization is simpler (no zero-point offset to track) and works well when your data is roughly centered around zero; affine quantization adds a zero-point term and handles asymmetric distributions (like activations after a ReLU, which are never negative) more accurately at a small extra bookkeeping cost.</p></div>
 `},

{id:'s-4-8', part:'p4', num:'4.8', title:'Storage Size &amp; Memory Traffic by Format',
 dek:'Precision choice is a memory-bandwidth decision as much as a numerics one — here\'s the multiplier, live.',
 tags:'storage size memory traffic bytes precision footprint model weights',
 calc:'precmem',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Format</th><th>Bytes/value</th><th>Relative to FP32</th><th>Implication</th></tr>
   <tr><td class="mono">FP64</td><td class="mono">8</td><td class="mono">2×</td><td>High-precision scientific data</td></tr>
   <tr><td class="mono">FP32</td><td class="mono">4</td><td class="mono">1× (baseline)</td><td>—</td></tr>
   <tr><td class="mono">FP16 / BF16</td><td class="mono">2</td><td class="mono">0.5×</td><td>Half the storage <em>and</em> memory traffic for the same value count</td></tr>
   <tr><td class="mono">FP8 / INT8</td><td class="mono">1</td><td class="mono">0.25×</td><td>Quarter of FP32 storage</td></tr>
   <tr><td class="mono">FP4 / INT4</td><td class="mono">0.5</td><td class="mono">0.125×</td><td>Very compact — necessarily a packed representation (2 values/byte)</td></tr>
 </table></div>
 <p>This table connects directly back to the Roofline Model (§1.5): for a memory-bandwidth-bound kernel, halving the bytes per value roughly doubles the achievable performance at the same arithmetic intensity, because you're moving half the bytes to do the same amount of work. This is <em>the</em> core reason low-precision AI formats exist — it's rarely just about faster individual multiply-accumulate operations, it's about proportionally reducing the memory traffic that so often gates real performance.</p>
 <div class="calc-mount" data-calc="precmem"></div>
 <div class="example-box">
   <span class="tag">Worked example</span>
   <p>A 70-billion-parameter language model in FP16 (2 bytes/param) needs 140 GB just for weights — already beyond a single GPU's HBM capacity on most current hardware, forcing multi-GPU deployment. The same model in a well-calibrated INT4/MXFP4 scheme (~0.5 bytes/param plus scale-factor overhead) needs roughly 35–40 GB — fitting on a single high-memory GPU, which is precisely why quantized inference deployment has become standard practice rather than a niche optimization.</p>
 </div>
 `},

{id:'s-4-9', part:'p4', num:'4.9', title:'Input Precision vs. Accumulation Precision',
 dek:'Why "FP8" alone is an incomplete description of a matrix multiply — you need the accumulation precision too.',
 tags:'input accumulation precision mixed fp8 int8 accumulator',
 body:`
 <p>Accelerators very often use <em>different</em> precisions for the multiply inputs versus the running-sum accumulator. Describing a matrix operation by input precision alone is genuinely incomplete — always document it as <strong>INPUT × INPUT → ACCUMULATION</strong>.</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Expression</th><th>Meaning</th></tr>
   <tr><td class="mono">FP64 × FP64 → FP64</td><td>Traditional double-precision arithmetic throughout</td></tr>
   <tr><td class="mono">FP16 × FP16 → FP32</td><td>Mixed precision — low-precision multiply, higher-precision accumulation</td></tr>
   <tr><td class="mono">BF16 × BF16 → FP32</td><td>The common AI-training pattern</td></tr>
   <tr><td class="mono">FP8 × FP8 → FP16/FP32</td><td>Modern low-precision tensor computation</td></tr>
   <tr><td class="mono">INT8 × INT8 → INT32</td><td>Common integer-inference accumulation</td></tr>
   <tr><td class="mono">INT4 × INT4 → INT32</td><td>Common low-bit LLM inference pattern</td></tr>
 </table></div>
 <p>Why accumulate at higher precision than the inputs? A matrix multiply sums potentially thousands of products together (the "K dimension" of a matrix multiply). Even if each individual product has a small rounding error, summing thousands of them at the <em>input's</em> low precision would compound that error rapidly. Accumulating at FP32 (or INT32 for integer paths) keeps the running sum's own rounding error negligible, while still getting the speed and memory-traffic benefit of low-precision inputs for the actual multiply.</p>
 <div class="note tip"><span class="tag">Why this matters when reading a spec sheet</span><p>Two accelerators both advertising "FP8 TFLOPS" could be accumulating at FP16 versus FP32 — a real difference in numerical stability for large reductions, even though the headline throughput number and the input format look identical. When precision genuinely matters for your workload's accuracy, ask about the accumulator, not just the input type.</p></div>
 `},

{id:'s-4-10', part:'p4', num:'4.10', title:'Precision ≠ Accuracy',
 dek:'The single most important caveat in this whole numerical-formats discussion.',
 tags:'precision accuracy numerical stability calibration dynamic range quantization error',
 body:`
 <p>It's tempting to treat "lower precision" and "lower accuracy" as synonyms. They aren't — and conflating them leads to bad decisions in both directions.</p>
 <p>A lower-bit format <strong>can</strong> run dramatically faster while producing perfectly acceptable application accuracy — <em>when</em> scaling, calibration, and accumulation precision (§4.9) are designed correctly for that specific workload. Mixed-precision training with BF16/FP16 inputs and FP32 accumulation, for instance, routinely matches full-FP32 training accuracy on modern deep learning workloads, while running substantially faster and using less memory bandwidth.</p>
 <p>Conversely, simply swapping FP32 for FP8 or FP4 in a kernel <strong>does not automatically produce a usable result.</strong> Whether it works depends on:</p>
 <ul>
   <li><strong>Numerical stability</strong> — does the algorithm amplify small input errors (ill-conditioned problems are especially precision-sensitive)?</li>
   <li><strong>Dynamic range</strong> — do the actual values in this workload fit the format's representable range without over/underflowing, or does it need per-block scaling (§4.6)?</li>
   <li><strong>Quantization error</strong> — is the rounding error introduced by the coarser format small relative to the result's required accuracy?</li>
   <li><strong>The application's sensitivity</strong> — some outputs (a rendered image, an LLM's next-token probabilities) tolerate meaningful numerical noise; others (a structural-engineering FEM solve, a financial risk calculation) do not.</li>
 </ul>
 <div class="note warn"><span class="tag">The rule this leads to</span><p>Never assume a lower-precision format is "close enough" without evaluating it against your specific workload's actual sensitivity. And never assume a lower-precision format is automatically unusable — for the right workload (especially AI inference, and increasingly AI-accelerated portions of scientific computing), well-designed low precision can be both faster <em>and</em> effectively just as accurate where it counts.</p></div>
 `},

{id:'s-4-11', part:'p4', num:'4.11', title:'Comparing Precision Numbers Correctly',
 dek:'The rule that prevents almost every misleading "N× faster" hardware comparison you\'ll encounter.',
 tags:'comparing precision numbers rule tops flops fair comparison marketing',
 body:`
 <p>This closes the loop opened in §3.3 with a single, explicit rule — arguably the most practically useful sentence in this entire Part:</p>
 <div class="note warn" style="border-color:var(--thermal); background:var(--thermal-soft);">
   <span class="tag" style="color:var(--thermal);">The rule</span>
   <p style="font-size:15.5px; font-weight:600; color:var(--thermal);">Only compare performance figures measured at the same precision, with the same accumulation type, and ideally the same sparsity assumptions. Never compare a headline "AI TOPS" figure directly against a classical FP64 FLOPS figure — they measure different kinds of arithmetic on different data.</p>
 </div>
 <p>Vendor marketing materials routinely place a new generation's best-case low-precision (often sparse FP8 or FP4) figure next to a previous generation's FP16 or FP32 dense figure to produce an eye-catching "10×" or "20× faster" headline. That comparison isn't necessarily <em>wrong</em> as a statement about peak AI-inference throughput — but it says nothing about how much faster (if at all) your specific FP64 simulation code, or your FP32 training run, will actually go.</p>
 <h4>A checklist before trusting any cross-generation performance claim</h4>
 <ul>
   <li>Is the precision identical on both sides of the comparison (FP8 vs. FP8, not FP8 vs. FP16)?</li>
   <li>Is the accumulation precision identical (§4.9)?</li>
   <li>Does one figure assume structured sparsity (commonly a further 2× multiplier) while the other doesn't?</li>
   <li>Is one figure a "peak theoretical" number and the other an "achieved/measured" number?</li>
   <li>Does either figure include Tensor Core acceleration (TF32-style) that the other configuration can't actually use for your workload?</li>
 </ul>
 <div class="example-box">
   <span class="tag">Worked example</span>
   <p>A procurement comparison shows "New GPU: 20 PFLOPS AI performance vs. Old GPU: 1 PFLOPS FP64 performance — 20× faster!" This is comparing sparse FP8 Tensor Core throughput against dense FP64 CUDA-core throughput — two numbers that are both true and almost entirely uninformative about each other. The correct comparison for an FP64 scientific workload is the two chips' FP64 figures, likely a much smaller (though possibly still meaningful) ratio.</p>
 </div>
 `}
);

{id:'s-5-1', part:'p5', num:'5.1', title:'Networking Fundamentals — Bandwidth, Latency &amp; Throughput',
 dek:'The vocabulary you need before any of the topology or fabric-design material makes sense.',
 tags:'bandwidth latency throughput goodput serialization bdp utilization networking',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Quantity</th><th>Formula</th></tr>
   <tr><td>Bandwidth</td><td class="mono">Data / time</td></tr>
   <tr><td>Throughput</td><td class="mono">Successfully delivered useful data / time</td></tr>
   <tr><td>Goodput</td><td class="mono">Application payload / time</td></tr>
   <tr><td>Latency</td><td class="mono">Time from send/request to corresponding receive/response</td></tr>
   <tr><td>Serialization time</td><td class="mono">Message size / link rate</td></tr>
   <tr><td>Message rate</td><td class="mono">Messages / second</td></tr>
   <tr><td>Bandwidth-delay product</td><td class="mono">BDP = Bandwidth × RTT</td></tr>
   <tr><td>Network utilization</td><td class="mono">Achieved throughput / theoretical link throughput</td></tr>
 </table></div>
 <p>Bandwidth, throughput and goodput look similar but answer progressively narrower questions: bandwidth is what the wire/optics can physically carry; throughput is what's actually delivered once protocol overhead and contention are accounted for; goodput narrows further to just the useful application payload, excluding headers, retransmissions, and protocol framing.</p>
 <p><strong>Bandwidth-delay product</strong> deserves special attention — it tells you how much data can be "in flight" on a link at once, which sets the minimum TCP/RDMA window size needed to keep a long, fast link fully utilized. A high-bandwidth, high-latency link (e.g., a long-haul WAN) needs a much larger in-flight window than a high-bandwidth, low-latency link (e.g., an in-rack InfiniBand connection) to reach the same utilization.</p>
 <div class="note warn"><span class="tag">The single most common unit mistake in networking</span><p><strong>400 Gb/s is a line rate, not 400 GB/s.</strong> Divide bits/s by 8 to get bytes/s — and even then, that's before accounting for protocol/encoding overhead (e.g., 64b/66b encoding, packet headers). This confusion between bits and bytes is responsible for more misread spec sheets and miscalculated cluster designs than any other unit error in HPC networking. The unit converter in §12.1 handles this conversion for you.</p></div>
 <div class="example-box">
   <span class="tag">Worked example</span>
   <p>Serialization time for a 1 MB message on a 100 Gb/s link:</p>
   <p>T = (1×10⁶ bytes × 8 bits/byte) / 100×10⁹ bits/s = <span class="res">80 microseconds</span> — and that's before adding any per-message startup latency (α in the communication model, §5.6).</p>
 </div>
 `},

{id:'s-5-2', part:'p5', num:'5.2', title:'Ethernet Options — 1GbE to 800GbE',
 dek:'The dominant datacenter fabric family, and where RDMA (RoCE) fits into it.',
 tags:'ethernet 1gbe 10gbe 25gbe 100gbe 200gbe 400gbe 800gbe roce rdma',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Ethernet</th><th>Nominal rate</th><th>Typical HPC/datacenter use</th></tr>
   <tr><td class="mono">1GbE</td><td class="mono">1 Gb/s</td><td>Management, legacy/storage</td></tr>
   <tr><td class="mono">10GbE</td><td class="mono">10 Gb/s</td><td>General server networking</td></tr>
   <tr><td class="mono">25GbE</td><td class="mono">25 Gb/s</td><td>Modern server/rack connectivity</td></tr>
   <tr><td class="mono">40GbE</td><td class="mono">40 Gb/s</td><td>Older high-speed datacenter networks</td></tr>
   <tr><td class="mono">50GbE</td><td class="mono">50 Gb/s</td><td>Server connectivity</td></tr>
   <tr><td class="mono">100GbE</td><td class="mono">100 Gb/s</td><td>Common HPC/datacenter fabric backbone</td></tr>
   <tr><td class="mono">200GbE</td><td class="mono">200 Gb/s</td><td>High-performance Ethernet</td></tr>
   <tr><td class="mono">400GbE</td><td class="mono">400 Gb/s</td><td>Modern high-end fabric</td></tr>
   <tr><td class="mono">800GbE</td><td class="mono">800 Gb/s</td><td>Current high-end Ethernet generation</td></tr>
 </table></div>
 <p>"Ethernet" is really a broad family, not one transport. HPC deployments over Ethernet may run plain TCP/IP, UDP, or — increasingly for performance-sensitive workloads — <strong>RDMA over Converged Ethernet (RoCE)</strong>, which layers RDMA's low-overhead direct memory-to-memory semantics on top of the Ethernet physical/link layer.</p>
 <ul>
   <li><strong>RoCE</strong> gets you InfiniBand-like low-overhead transfers while staying on Ethernet infrastructure — but it typically requires careful congestion and loss management (Priority Flow Control, ECN — see §6.8) since RDMA is far less tolerant of packet loss than TCP.</li>
   <li>Ethernet's core appeal is ecosystem scale: broad vendor/switch choice, mature optics availability, and continually advancing line rates that increasingly close the performance gap with purpose-built HPC fabrics.</li>
 </ul>
 <div class="note tip"><span class="tag">Reading line-rate tables</span><p>These are <em>nominal</em> per-port rates. Real achievable throughput is always somewhat lower once encoding overhead, protocol headers, and switch/NIC processing are accounted for — treat the table as a starting point for capacity planning, not a promise of delivered bandwidth.</p></div>
 `},

{id:'s-5-3', part:'p5', num:'5.3', title:'InfiniBand Options — QDR to XDR',
 dek:'The purpose-built HPC interconnect family, and how its odd-looking naming maps to real link speeds.',
 tags:'infiniband qdr fdr edr hdr ndr xdr rdma',
 body:`
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Generation</th><th>4× port effective rate</th><th>Approx. line-rate naming</th></tr>
   <tr><td class="mono">QDR</td><td class="mono">40 Gb/s class</td><td>4 × ~10 Gb/s</td></tr>
   <tr><td class="mono">FDR</td><td class="mono">56 Gb/s class</td><td>4 × 14.0625 Gb/s</td></tr>
   <tr><td class="mono">EDR</td><td class="mono">100 Gb/s</td><td>4 × 25 Gb/s</td></tr>
   <tr><td class="mono">HDR</td><td class="mono">200 Gb/s</td><td>4 × 50 Gb/s</td></tr>
   <tr><td class="mono">NDR</td><td class="mono">400 Gb/s</td><td>4 × 100 Gb/s</td></tr>
   <tr><td class="mono">XDR</td><td class="mono">800 Gb/s</td><td>4 × 200 Gb/s</td></tr>
 </table></div>
 <p>InfiniBand is purpose-built for high-performance interconnects, providing native RDMA, low latency, high message rates, and fabric-management features (subnet management, adaptive routing) that Ethernet has historically had to add on. The "4×" figure reflects that a standard InfiniBand port bundles 4 physical lanes — the generation names (QDR/FDR/EDR/etc.) describe the combined effective rate across those lanes, accounting for the encoding scheme in use (64b/66b for the more recent generations).</p>
 <div class="note tip"><span class="tag">Where the naming gets confusing</span><p>QDR through XDR is the modern (post-SDR/DDR) generation naming used in current NVIDIA/Mellanox documentation. Per-lane raw signaling rates and encoding overhead differ by generation, so the "4× port effective data rate" column above — not a naive per-lane multiplication — is the number to use for capacity planning.</p></div>
 `},

{id:'s-5-4', part:'p5', num:'5.4', title:'Ethernet vs. InfiniBand',
 dek:'The perennial HPC fabric debate, reduced to what actually differs.',
 tags:'ethernet infiniband comparison roce rdma latency cost ecosystem',
 body:`
 <p>Both families have converged substantially over the past decade — Ethernet gained RDMA via RoCE, InfiniBand line rates track Ethernet's generational cadence closely — but real differences remain:</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Dimension</th><th>InfiniBand</th><th>Ethernet (with RoCE)</th></tr>
   <tr><td>Native RDMA</td><td>Yes, by design from the start</td><td>Added via RoCE — requires careful lossless-network tuning</td></tr>
   <tr><td>Fabric management</td><td>Centralized subnet manager, mature adaptive routing</td><td>More varied; depends on switch vendor and control-plane choice</td></tr>
   <tr><td>Latency / message rate</td><td>Typically class-leading for tightly-coupled MPI workloads</td><td>Competitive, especially at 400G/800G with modern NICs</td></tr>
   <tr><td>Ecosystem &amp; vendor choice</td><td>Narrower vendor base</td><td>Very broad — the entire Ethernet switch/optics/NIC industry</td></tr>
   <tr><td>Operational familiarity</td><td>Specialized HPC networking skill set</td><td>Widely known by general datacenter/network engineering teams</td></tr>
 </table></div>
 <p>Neither choice is universally correct. Tightly-coupled MPI simulation codes with heavy collective communication (large HPL/HPCG-style clusters) have historically favored InfiniBand for its message-rate and adaptive-routing maturity. Large-scale AI training clusters have increasingly adopted high-speed RoCE Ethernet fabrics, partly for ecosystem/cost reasons and partly because the industry has invested heavily in tuning RoCE specifically for AI collective patterns (large all-reduce operations).</p>
 <div class="note tip"><span class="tag">The practical decision driver</span><p>In practice, the choice is driven less by a fundamental technical ceiling and more by: existing operational expertise, vendor/software ecosystem lock-in already present in the stack, procurement cost at the scale you're buying, and how well-tuned the specific fabric generation's congestion control is for your dominant traffic pattern (many small messages vs. few huge collectives).</p></div>
 `},

{id:'s-5-5', part:'p5', num:'5.5', title:'PCIe, NVLink &amp; CXL — Accelerator I/O',
 dek:'How a GPU actually talks to its host CPU and to other GPUs — three very different answers.',
 tags:'pcie nvlink cxl accelerator io lanes bandwidth',
 body:`
 <p>Beyond the node-to-node network (§5.2–5.4), a huge amount of HPC/AI performance depends on the links <em>inside</em> a node — between CPU and accelerator, and between accelerators.</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Interconnect</th><th>Role</th><th>Character</th></tr>
   <tr><td class="mono">PCIe</td><td>General-purpose CPU↔device link</td><td>Universal, moderate bandwidth, doubles roughly every generation (Gen4→Gen5→Gen6)</td></tr>
   <tr><td class="mono">NVLink</td><td>GPU↔GPU (and GPU↔CPU on some platforms) high-bandwidth link</td><td>NVIDIA-specific; far higher bandwidth than PCIe, purpose-built for tightly-coupled multi-GPU work</td></tr>
   <tr><td class="mono">CXL</td><td>Cache-coherent CPU↔device/memory link, built on the PCIe physical layer</td><td>Enables memory pooling/expansion and coherent accelerator attachment</td></tr>
 </table></div>
 <p>The reason these three coexist rather than one replacing the others: they solve different problems. PCIe is the universal, vendor-neutral baseline every device supports. NVLink exists because PCIe's bandwidth became the bottleneck for multi-GPU training/inference workloads that constantly exchange large tensors between GPUs — an 8-GPU NVLink-connected node can move data between GPUs at rates a PCIe-only topology can't approach. CXL is newer and solves a different problem entirely: <em>cache-coherent</em> access to pooled or expanded memory, letting an accelerator (or even a remote memory module) participate in the same coherent memory space as the CPU — something PCIe's traditional model doesn't provide.</p>
 <div class="note tip"><span class="tag">Why this matters for the roofline model</span><p>A multi-GPU training job's effective arithmetic intensity (§1.5) has to account for inter-GPU traffic, not just device-memory traffic. A kernel that looks compute-bound in isolation on a single GPU can become bandwidth-bound at the multi-GPU scale if the interconnect (PCIe vs. NVLink) can't keep up with the all-reduce/all-gather traffic the training step requires — which is exactly why high-end AI training platforms invest so heavily in NVLink-class interconnects.</p></div>
 `},

{id:'s-5-6', part:'p5', num:'5.6', title:'Communication Models — the α–β Model &amp; Collectives',
 dek:'A two-parameter model that predicts message transfer time surprisingly well, and its extension to collective operations like all-reduce.',
 tags:'alpha beta model communication mpi latency bandwidth allreduce collective ring',
 calc:'ab',
 body:`
 <p>The α–β model is the standard simplified cost model for point-to-point message-passing performance — simple enough to reason about by hand, accurate enough to guide real design decisions.</p>
 <div class="formula-box">
   <span class="tag">α–β model</span>
   <div class="flist">
     <div class="f">T_msg ≈ α + n·β</div>
     <div class="f">β ≈ 1 / Bandwidth &nbsp;&nbsp;<small>idealized per-byte transmission time</small></div>
     <div class="f">Small message (α dominates): T ≈ α</div>
     <div class="f">Large message (β dominates): T ≈ n/BW</div>
   </div>
 </div>
 <p><code>α</code> is the fixed startup/latency cost paid on every message regardless of size (software overhead, network hop latency, NIC processing). <code>β</code> is the per-byte cost, essentially the inverse of bandwidth. For small messages, α dominates and bandwidth barely matters; for large messages, β dominates and latency barely matters. The crossover point between these two regimes is a genuinely useful number for tuning message-batching strategies.</p>
 <div class="calc-mount" data-calc="ab"></div>
 <h4>Extending to collectives</h4>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Metric / model</th><th>Formula</th><th>Interpretation</th></tr>
   <tr><td>MPI effective bandwidth</td><td class="mono">Payload bytes / elapsed communication time</td><td>Application-visible throughput, not link peak</td></tr>
   <tr><td>Communication fraction</td><td class="mono">T_comm / T_total</td><td>Share of runtime spent communicating, not computing</td></tr>
   <tr><td>Parallel efficiency w/ comm.</td><td class="mono">E = T₁/(P·T_P)</td><td>Communication overhead erodes E as P grows</td></tr>
   <tr><td>All-to-all pressure</td><td class="mono">O(P²) pairwise traffic (naïve)</td><td>Can stress bisection and injection bandwidth badly at scale</td></tr>
   <tr><td>AllReduce</td><td>Reduction + distribution</td><td>The critical-path operation for distributed ML/HPC iterative algorithms</td></tr>
 </table></div>
 <p>The calculator above also estimates a <strong>ring all-reduce</strong> — one of the most common collective algorithms for combining gradients/results across P ranks: each rank sends and receives roughly <code>2(P−1)/P</code> of the total message volume, with <code>2(P−1)</code> total α-latency steps around the ring. This is why all-reduce cost grows with P even though the algorithm is designed to be bandwidth-efficient — the α term still accumulates linearly with the number of ranks.</p>
  <div class="note warn"><span class="tag">Why naïve all-to-all doesn't scale</span><p>A naïve all-to-all exchange among P ranks generates O(P²) pairwise messages. Double the rank count and the message count roughly quadruples — which is precisely why production collective libraries (NCCL, MPI implementations) use tree, ring, or hierarchical algorithms instead of naïve pairwise exchange once P gets large, trading a bit of latency for dramatically better bandwidth scaling.</p></div>
  `},

{id:'s-5-7', part:'p5', num:'5.7', title:'TCP vs. InfiniBand vs. RoCE — Packet Format Comparison',
 dek:'Why InfiniBand is fundamentally lighter than TCP/IP at the wire level, and where RoCE fits in.',
 tags:'tcp ib roce packet format header overhead latency comparison ethernet infiniband rdma',
 body:`
 <p>Understanding the packet format difference between TCP/IP over Ethernet and InfiniBand explains <em>why</em> IB achieves lower latency and higher message rates — it's not magic, it's less work per packet at every level of the stack.</p>

 <h3>TCP/IP over Ethernet — the layered overhead</h3>
 <p>Every TCP/IP packet carries multiple layers of headers, each added by a different protocol layer. For a typical 1500-byte MTU Ethernet frame carrying a TCP payload:</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Layer</th><th>Header size</th><th>Purpose</th></tr>
   <tr><td>Ethernet frame</td><td>14 bytes (+ 4 FCS)</td><td>MAC addressing, EtherType, frame check</td></tr>
   <tr><td>IP header</td><td>20 bytes (no options)</td><td>Source/destination IP, TTL, protocol, checksum</td></tr>
   <tr><td>TCP header</td><td>20 bytes (no options)</td><td>Port numbers, sequence/ack numbers, flags, checksum</td></tr>
   <tr><td colspan="3" style="font-weight:600;">Total header overhead: ~54 bytes per packet</td></tr>
 </table></div>
 <p>With a 1500-byte MTU, that's 54 bytes of headers for 1446 bytes of payload — roughly <strong>3.6% overhead</strong>. But the real cost isn't the bytes; it's what the NIC and CPU must do with them:</p>
 <ul>
   <li><strong>Per-packet processing:</strong> Each layer is parsed/validated in software (or offloaded to the NIC), adding cycles per packet.</li>
   <li><strong>Checksum computation:</strong> TCP and IP checksums must be computed/verified per packet.</li>
   <li><strong>Flow control:</strong> TCP's sliding window, congestion control (slow start, AIMD), and retransmission logic run in the kernel's TCP stack.</li>
   <li><strong>Context switches:</strong> Data moves from application buffer → kernel socket buffer → NIC DMA — multiple copies and context transitions.</li>
 </ul>

 <h3>InfiniBand — purpose-built for low overhead</h3>
 <p>InfiniBand uses a single, flat packet format designed for hardware-level processing. A basic IB message (including the Local Routing Header, Base Transport Header, and payload) has far less overhead:</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Component</th><th>Size</th><th>Purpose</th></tr>
   <tr><td>Local Routing Header (LRH)</td><td>8 bytes</td><td>Source/destination LIDs, path bits, length</td></tr>
   <tr><td>Base Transport Header (BTH)</td><td>12 bytes</td><td>OpCode, partition key, destination QP, acknowledgment request</td></tr>
   <tr><td>Destination QP / PSN</td><td>In BTH</td><td>Queue pair number (end-to-end channel), packet sequence number</td></tr>
   <tr><td>Payload</td><td>Up to 4096 bytes (MTU)</td><td>Application data</td></tr>
   <tr><td>CRC (Invariant/CRC)</td><td>4 bytes</td><td>End-to-end data integrity</td></tr>
   <tr><td colspan="3" style="font-weight:600;">Total header overhead: ~24 bytes per packet (no per-layer nesting)</td></tr>
 </table></div>

 <h3>RoCE (RDMA over Converged Ethernet) — the middle ground</h3>
 <p>RoCE carries RDMA's transport semantics over Ethernet's physical/link layer. It uses IB's transport header (BTH) but wraps it in an Ethernet frame with a GRH (Global Routing Header) instead of an LRH, and runs over UDP/IP for routing:</p>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Layer</th><th>Header size</th><th>Purpose</th></tr>
   <tr><td>Ethernet frame</td><td>14 bytes (+ 4 FCS)</td><td>MAC addressing, EtherType, frame check</td></tr>
   <tr><td>UDP header</td><td>8 bytes</td><td>Source/destination ports (RoCE uses port 4791)</td></tr>
   <tr><td>IP header</td><td>20 bytes (no options)</td><td>Source/destination IP, TTL, protocol, checksum</td></tr>
   <tr><td>RoCE BTH</td><td>12 bytes</td><td>OpCode, partition key, destination QP, PSN — same as IB</td></tr>
   <tr><td>Payload</td><td>Up to 4096 bytes</td><td>Application data</td></tr>
   <tr><td>CRC (Invariant CRC)</td><td>4 bytes</td><td>End-to-end data integrity</td></tr>
   <tr><td colspan="3" style="font-weight:600;">Total header overhead: ~58–62 bytes per packet</td></tr>
 </table></div>
 <p>RoCE v2 (the current standard) encapsulates IB transport in UDP/IPv4 or UDP/IPv6. The extra headers (UDP + IP) add ~28 bytes compared to native IB, but the RDMA transport semantics (zero-copy, kernel bypass, hardware offload) are preserved. The key trade-off: you get IB-class performance on Ethernet infrastructure, but you <strong>must</strong> provide a lossless Ethernet fabric (via PFC/ECN) because RDMA is far less tolerant of packet loss than TCP.</p>
 <div class="note warn"><span class="tag">RoCE's hidden cost: lossless Ethernet</span><p>RoCE requires Priority Flow Control (PFC) and ECN to prevent packet loss — RDMA has no software retransmit mechanism like TCP. If a RoCE packet is lost, the RDMA connection typically stalls or fails. This means the entire Ethernet fabric must be tuned for lossless operation: PFC enabled on all switches, ECN marking configured, buffer sizing carefully planned. This tuning is non-trivial and is the main operational difference between "just works" TCP and "needs careful setup" RoCE.</p></div>

 <h3>Side-by-side comparison</h3>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Aspect</th><th>TCP/IP (Ethernet)</th><th>RoCE v2 (Ethernet)</th><th>InfiniBand</th></tr>
   <tr><td>Header overhead</td><td>~54 bytes (3+ layers)</td><td>~58–62 bytes (Ethernet + UDP/IP + BTH)</td><td>~24 bytes (flat)</td></tr>
   <tr><td>MTU</td><td>1500 bytes (jumbo: 9000)</td><td>1500 bytes (jumbo: 9000)</td><td>4096 bytes (standard)</td></tr>
   <tr><td>Protocol processing</td><td>Software stack (kernel)</td><td>Hardware offload (NIC)</td><td>Hardware offload (NIC)</td></tr>
   <tr><td>Checksum</td><td>TCP + IP checksums</td><td>UDP + IP checksums</td><td>CRC (end-to-end)</td></tr>
   <tr><td>Flow control</td><td>TCP sliding window (software)</td><td>PFC (Ethernet link-level) + credit-based (RDMA)</td><td>Credit-based (hardware)</td></tr>
   <tr><td>Congestion control</td><td>TCP AIMD/CUBIC (software)</td><td>ECN-based (requires lossless tuning)</td><td>ECN-based or adaptive routing (hardware)</td></tr>
   <tr><td>Loss tolerance</td><td>High — TCP retransmits</td><td>Very low — RDMA stalls on loss</td><td>Very low — RDMA stalls on loss (reliable)</td></tr>
   <tr><td>Memory copies</td><td>App → kernel socket buf → NIC (2+ copies)</td><td>Zero-copy RDMA (same as IB)</td><td>Zero-copy RDMA (1 copy or 0 with GPUDirect)</td></tr>
   <tr><td>Typical latency (intranode)</td><td>~3–10 µs (TCP loopback)</td><td>~2–4 µs (RoCE loopback)</td><td>~1–2 µs (IB verbs)</td></tr>
   <tr><td>Fabric requirements</td><td>Standard Ethernet (any)</td><td>Lossless Ethernet (PFC/ECN tuned)</td><td>Managed IB subnet (SM required)</td></tr>
   <tr><td>Ecosystem / vendor</td><td>Universal</td><td>Ethernet NICs + switches (broad)</td><td>NVIDIA/Mellanox (narrower)</td></tr>
 </table></div>

 <div class="note tip"><span class="tag">Why this matters at scale</span><p>At 10 million messages/second, TCP's ~54-byte header overhead costs ~540 MB/s just in headers. IB's ~24-byte headers cost ~240 MB/s — a 300 MB/s savings that goes directly to useful bandwidth. More importantly, IB's hardware-level protocol processing means the CPU spends virtually zero cycles per message on network stack work, freeing it entirely for application computation.</p></div>

 <h3>The copy problem — illustrated</h3>
 <div class="formula-box">
   <span class="tag">TCP/IP data path (typical)</span>
   <div class="flist">
     <div class="f">App buffer → <span style="color:var(--thermal)">memcpy()</span> → kernel socket buffer → <span style="color:var(--thermal)">DMA</span> → NIC</div>
     <div class="f">Receive: NIC → <span style="color:var(--thermal)">DMA</span> → kernel buffer → <span style="color:var(--thermal)">copy_to_user()</span> → app buffer</div>
     <div class="f small">Each copy costs memory bandwidth and adds latency. With small messages, copies dominate.</div>
   </div>
 </div>
 <div class="formula-box">
   <span class="tag">RDMA data path (IB verbs)</span>
   <div class="flist">
     <div class="f">App registers buffer → NIC reads/writes <span style="color:var(--flow)">directly</span> via DMA</div>
     <div class="f">Zero copies, zero kernel involvement, zero CPU cycles on data movement</div>
     <div class="f small">The NIC does all protocol processing in hardware and places data directly in the application's memory.</div>
   </div>
 </div>
 <div class="note warn"><span class="tag">The trade-off</span><p>TCP's complexity exists for good reasons — it handles any network (lossy, out-of-order, variable latency), provides end-to-end reliability, and runs on any hardware. InfiniBand trades that generality for performance: it assumes a clean, managed fabric (no packet loss in reliable mode, no out-of-order delivery) and requires specialized hardware. The performance difference is real, but so is the operational cost difference.</p></div>
 `},

{id:'s-5-8', part:'p5', num:'5.8', title:'How RDMA Works — Zero-Copy, Kernel Bypass &amp; Hardware Offload',
 dek:'The three mechanisms that make RDMA fundamentally faster than TCP/IP, and how they interact.',
 tags:'rdma zero copy kernel bypass verbs queue pair completion queue send receive write read',
 body:`
 <p>RDMA (Remote Direct Memory Access) is not just "fast networking" — it's a fundamentally different architecture that eliminates three major bottlenecks present in traditional TCP/IP networking. Understanding these three mechanisms is key to understanding why RDMA achieves microsecond-level latencies.</p>

 <h3>Mechanism 1: Kernel bypass</h3>
 <p>In TCP/IP, every message passes through the kernel's networking stack — socket calls, buffer management, protocol processing, scheduling. This means:</p>
 <ul>
   <li><strong>System call overhead:</strong> Each send/recv involves a context switch to kernel mode (~100–500 ns per call).</li>
   <li><strong>Kernel lock contention:</strong> Multiple threads sharing a socket serialize on kernel locks.</li>
   <li><strong>CPU overhead:</strong> Protocol processing (TCP/IP header parsing, checksum, flow control) consumes kernel CPU cycles.</li>
 </ul>
 <p>RDMA bypasses the kernel entirely. The application registers memory buffers with the NIC (via "Memory Regions") and posts work requests directly to hardware queues. The NIC reads/writes application memory via DMA without any kernel involvement:</p>
 <div class="formula-box">
   <span class="tag">Kernel bypass — the queue pair model</span>
   <div class="flist">
     <div class="f">Application → <span style="color:var(--flow)">Work Queue (SQ)</span> → NIC hardware</div>
     <div class="f">NIC hardware → <span style="color:var(--flow)">Completion Queue (CQ)</span> → Application</div>
     <div class="f small">No system calls, no context switches, no kernel involvement after initial setup.</div>
   </div>
 </div>
 <p>The <strong>Queue Pair (QP)</strong> is the core abstraction: a send queue and receive queue pair that the NIC processes directly from application memory. The application posts "Work Queue Elements" (WQEs) describing what to do (send, receive, RDMA write, RDMA read), and the NIC places completion notifications in a Completion Queue (CQ) that the application polls — no interrupts, no system calls.</p>

 <h3>Mechanism 2: Zero-copy transfers</h3>
 <p>In TCP/IP, data must be copied multiple times between the application and the network:</p>
 <ul>
   <li><strong>Send path:</strong> Application buffer → kernel socket buffer (memcpy) → NIC DMA</li>
   <li><strong>Receive path:</strong> NIC DMA → kernel buffer → application buffer (copy_to_user)</li>
 </ul>
 <p>Each copy consumes memory bandwidth (~25–50 GB/s on modern DDR5) and adds latency. With RDMA, the NIC reads from / writes to the application's registered memory region directly — zero copies in the data path:</p>
 <div class="formula-box">
   <span class="tag">Zero-copy comparison</span>
   <div class="flist">
     <div class="f">TCP send: <span style="color:var(--thermal)">App → kernel → NIC</span> (2 copies)</div>
     <div class="f">RDMA write: App registers buffer → NIC writes directly (0 copies)</div>
     <div class="f small">For a 4 KB message: 2 copies × 4 KB = 8 KB of memory traffic eliminated per message.</div>
   </div>
 </div>

 <h3>Mechanism 3: Hardware protocol offload</h3>
 <p>In TCP/IP, the kernel NIC driver handles protocol processing. With RDMA, the NIC itself handles:</p>
 <ul>
   <li><strong>Reliable delivery:</strong> Sequence numbers, ACKs, and retransmission (for Reliable Connected QPs).</li>
   <li><strong>Framing and routing:</strong> IB header construction, LID/QPN lookup, partition checks.</li>
   <li><strong>CRC computation:</strong> End-to-end data integrity verification.</li>
   <li><strong>Congestion control:</strong> ECN marking, adaptive routing decisions.</li>
 </ul>
 <p>The CPU touches <em>zero bytes</em> of network data in the fast path. This is why RDMA message rates can reach tens of millions of messages per second — the NIC is a dedicated protocol processor that never stalls for kernel scheduling.</p>

 <h3>RDMA operations — the verbs</h3>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Operation</th><th>Semantics</th><th>Initiator needs</th><th>Remote needs</th></tr>
   <tr><td class="mono">RDMA Write</td><td>Write data into remote memory</td><td>Remote virtual address + rkey</td><td>Pre-registered memory region</td></tr>
   <tr><td class="mono">RDMA Read</td><td>Read data from remote memory</td><td>Remote virtual address + rkey</td><td>Pre-registered memory region</td></tr>
   <tr><td class="mono">Send</td><td>Traditional send (like TCP send)</td><td>Message data</td><td>Posted receive WQE</td></tr>
   <tr><td class="mono">Receive</td><td>Consume a sent message</td><td>Posted receive WQE</td><td>—</td></tr>
 </table></div>
 <p><strong>RDMA Write/Read</strong> are the signature RDMA operations — the initiator directly accesses remote memory without the remote CPU's involvement. The remote NIC places data into pre-registered memory regions identified by a "remote key" (rkey). This is what enables true zero-copy, kernel-bypass networking.</p>

 <div class="note tip"><span class="tag">GPUDirect RDMA — the ultimate zero-copy</span><p>GPUDirect RDMA extends RDMA's zero-copy principle to GPU memory: the NIC writes directly into GPU memory via PCIe, bypassing CPU memory entirely. Without GPUDirect RDMA, RDMA writes land in host DRAM and then must be copied to GPU memory (via PCIe, ~64 GB/s Gen5 x16). With GPUDirect RDMA, the NIC and GPU share the PCIe bus directly, and the full network bandwidth reaches GPU memory in one hop.</p></div>

 <h3>Why RDMA is faster — summary</h3>
 <div class="tbl-wrap"><table class="dt">
   <tr><th>Bottleneck</th><th>TCP/IP</th><th>RDMA</th><th>Impact</th></tr>
   <tr><td>Kernel involvement</td><td>Every send/recv</td><td>Only at setup</td><td>Eliminates ~100–500 ns per message</td></tr>
   <tr><td>Data copies</td><td>2+ per message</td><td>0 (zero-copy)</td><td>Saves memory bandwidth, reduces latency</td></tr>
   <tr><td>Protocol processing</td><td>CPU (kernel)</td><td>NIC hardware</td><td>Frees CPU for application work</td></tr>
   <tr><td>Latency (small msg)</td><td>~3–10 µs</td><td>~1–2 µs</td><td>3–5× improvement</td></tr>
   <tr><td>Message rate</td><td>~1–5 Mmsg/s</td><td>~30–100 Mmsg/s</td><td>10–20× improvement</td></tr>
 </table></div>
 `},

{id:'s-5-9', part:'p5', num:'5.9', title:'InfiniBand Subnet Manager — How the Fabric Is Born',
 dek:'The centralized intelligence that discovers, configures, and routes an InfiniBand fabric — and why it matters.',
 tags:'infiniband subnet manager sm sa saq lid routing adaptive qos partition',
 body:`
 <p>InfiniBand has a fundamentally different approach to fabric management compared to Ethernet. Where Ethernet uses distributed protocols (LLDP, spanning tree, BGP/OSPF for routing), InfiniBand uses a <strong>centralized Subnet Manager (SM)</strong> that has global knowledge of the entire fabric and makes all routing decisions. This is both InfiniBand's greatest strength and its most important operational consideration.</p>

 <h3>What the Subnet Manager does</h3>
 <p>The SM is a software process (typically running on a dedicated host or switch) that performs four critical functions:</p>
 <ol>
   <li><strong>Topology discovery:</strong> The SM queries every switch and channel adapter in the subnet using SMP (Subnet Management Packets) to build a complete graph of the fabric — every port, link, speed, and connectivity.</li>
   <li><strong>LID assignment:</strong> Each port in the subnet is assigned a 16-bit Local Identifier (LID) — a short, flat address used for routing within the subnet. LIDs are analogous to MAC addresses in Ethernet but are assigned centrally, not burned in.</li>
   <li><strong>Path computation &amp; forwarding tables:</strong> The SM computes routing tables (forwarding databases) for every switch in the fabric. It installs these via SMPs, telling each switch which LID ranges to forward on which ports. This is where adaptive routing decisions are made.</li>
   <li><strong>Reconfiguration:</strong> When links fail, are added, or congestion patterns change, the SM re-discovers the topology and recomputes routing — all transparent to endpoints.</li>
 </ol>

 <h3>The Subnet Manager protocol</h3>
 <div class="formula-box">
   <span class="tag">SM communication flow</span>
   <div class="flist">
     <div class="f">SM → Switch: <span style="color:var(--flow)">SMP (Get)</span> — query port info, link state, neighbors</div>
     <div class="f">SM → Switch: <span style="color:var(--flow)">SMP (Set)</span> — install LID, forwarding table, partition config</div>
     <div class="f">SM → CA (NIC): <span style="color:var(--flow)">SMP (Set)</span> — configure QPs, set port LID, partition keys</div>
     <div class="f small">SMPs use a well-known multicast address (LID 0xC000) and are processed in hardware by every switch.</div>
   </div>
 </div>
 <p>SM communication uses <strong>Subnet Management Packets (SMPs)</strong> — special IB packets with a well-known format that all switches and channel adapters process in hardware. SMPs use a reserved multicast GID and are routed hop-by-hop, so the SM can reach every port even before the fabric is fully configured.</p>

 <h3>Redundancy and failover</h3>
 <p>Production IB fabrics run <strong>redundant SMs</strong> (typically one per subnet, with a standby):</p>
 <ul>
   <li><strong>Standby SM:</strong> Monitors the active SM via "SM Info" attributes. If the active SM disappears (host failure, process crash), the standby takes over within seconds.</li>
   <li><strong>SM election:</strong> Uses a priority-based election (lowest priority value wins). The active SM periodically sends "SM Info" MADs; if a standby sees none for a timeout, it assumes mastership.</li>
   <li><strong>Graceful handoff:</strong> The new SM re-discovers the topology and re-computes routing. During the transition (~1–5 seconds), existing QPs continue using old forwarding tables, so traffic is not interrupted unless the topology itself changed.</li>
 </ul>

 <h3>Adaptive routing — the SM's killer feature</h3>
 <p>InfiniBand's SM can implement <strong>adaptive routing</strong> — dynamically spreading traffic across multiple paths based on real-time congestion information. Unlike Ethernet's ECMP (which hashes flows to fixed paths), IB adaptive routing can:</p>
 <ol>
   <li><strong>Monitor link utilization</strong> via per-port counters reported to the SM.</li>
   <li><strong>Modify forwarding tables</strong> to shift traffic from congested paths to underutilized ones.</li>
   <li><strong>Respond to traffic pattern changes</strong> (e.g., a burst of all-reduce traffic) by recomputing routes in near-real-time.</li>
 </ol>
 <p>This is particularly valuable for MPI collectives and AI training workloads where traffic patterns shift rapidly and congestion can cascade across the fabric. Adaptive routing is one of the main reasons InfiniBand has historically outperformed Ethernet for tightly-coupled HPC workloads.</p>

 <h3>Partitioning — logical subnets within a physical fabric</h3>
 <p>IB supports <strong>partitioning</strong> — dividing a physical subnet into logical groups using 16-bit Partition Keys (PKeys):</p>
 <ul>
   <li><strong>Membership:</strong> Each port is assigned one or more PKeys. Two ports can only communicate if they share a PKey.</li>
   <li><strong>Use cases:</strong> Isolating tenant traffic in multi-tenant clusters, separating management from data traffic, enforcing security boundaries.</li>
   <li><strong>Default partition:</strong> All ports join PKey 0xFFFF by default (like Ethernet's native VLAN).</li>
 </ul>

 <div class="note warn"><span class="tag">SM as a single point of failure (sort of)</span><p>The SM is central, but the fabric itself is stateless — forwarding tables are installed in switches, not maintained by the SM in real-time. If the SM fails, traffic continues using existing forwarding tables. Only when topology changes occur (link failure, new equipment) does a functioning SM become necessary. This is why redundant SMs are strongly recommended but not strictly required for basic operation.</p></div>

  <div class="note tip"><span class="tag">SM vs. Ethernet control plane</span><p>Ethernet has no single equivalent to the IB SM. Spanning Tree Protocol (STP) handles loop prevention but not routing. BGP/OSPF handle routing but are distributed protocols without global topology knowledge. The IB SM combines topology discovery, address assignment, routing computation, and congestion management in one centralized, hardware-accelerated system — which is both its power and its operational challenge (you need to understand and monitor the SM, whereas Ethernet's distributed protocols "just work" without explicit management).</p></div>
  `}
);
</script>
